<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">First principles decomposition and reconstruction</title>
  <desc id="desc">First principles decomposition and reconstruction</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#101126"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d57e"/>
      <stop offset="100%" stop-color="#e88b31"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69e3ff"/>
      <stop offset="100%" stop-color="#2888ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d69cff"/>
      <stop offset="100%" stop-color="#7657ff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7bf7c7"/>
      <stop offset="100%" stop-color="#2fbf9f"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#5be4ff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#5be4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8eb3d9" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offsetBlur"/>
      <feFlood flood-color="#000814" flood-opacity=".45" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7bdfff"/>
    </marker>
    <style>
      .title { font-weight: 700; font-size: 58px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f6fbff; letter-spacing: -.8px; }
      .subtitle { font-weight: 400; font-size: 24px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #a8bfd6; }
      .h2 { font-weight: 700; font-size: 30px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f6fbff; }
      .h3 { font-weight: 650; font-size: 22px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #eaf4ff; }
      .body { font-weight: 400; font-size: 19px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #afc3d8; }
      .small { font-weight: 500; font-size: 16px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #91a9c2; }
      .tiny { font-weight: 600; font-size: 13px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #8da7c1; letter-spacing: 1px; }
      .label { font-weight: 700; font-size: 18px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #07111f; }
      .num { font-weight: 800; font-size: 22px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #07111f; }
      .card { fill: #111e31; stroke: #37506b; stroke-width: 1.4; }
      .soft { fill: #0d1a2d; stroke: #243c57; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="28" fill="url(#grid)"/>

  <text x="76" y="88" class="title">First Principles: Decompose and Reconstruct</text>
  <text x="76" y="130" class="subtitle">Break dependencies downward; build only from qualified foundations upward.</text>

  <g transform="translate(80,212)">
    <rect width="520" height="520" rx="32" class="card" filter="url(#shadow)"/>
    <text x="36" y="52" class="h2">DOWNWARD</text>
    <text x="36" y="84" class="body">What does this depend on?</text>
    <rect x="140" y="118" width="240" height="62" rx="18" fill="#1e2b42" stroke="#55708f"/>
    <text x="260" y="157" text-anchor="middle" class="h3">STATED PROBLEM</text>
    <line x1="260" y1="180" x2="260" y2="224" stroke="#7bdfff" stroke-width="3"/>
    <line x1="260" y1="224" x2="120" y2="270" stroke="#7bdfff" stroke-width="3"/>
    <line x1="260" y1="224" x2="260" y2="270" stroke="#7bdfff" stroke-width="3"/>
    <line x1="260" y1="224" x2="400" y2="270" stroke="#7bdfff" stroke-width="3"/>
    <rect x="45" y="270" width="150" height="60" rx="16" class="soft"/>
    <rect x="185" y="270" width="150" height="60" rx="16" class="soft"/>
    <rect x="325" y="270" width="150" height="60" rx="16" class="soft"/>
    <text x="120" y="307" text-anchor="middle" class="h3">CAUSES</text>
    <text x="260" y="307" text-anchor="middle" class="h3">FUNCTIONS</text>
    <text x="400" y="307" text-anchor="middle" class="h3">CONSTRAINTS</text>
    <line x1="120" y1="330" x2="120" y2="384" stroke="#7bdfff" stroke-width="2"/>
    <line x1="260" y1="330" x2="260" y2="384" stroke="#7bdfff" stroke-width="2"/>
    <line x1="400" y1="330" x2="400" y2="384" stroke="#7bdfff" stroke-width="2"/>
    <g transform="translate(34,384)">
      <rect width="452" height="90" rx="22" fill="#1a3040" stroke="#35b7d8"/>
      <text x="226" y="36" text-anchor="middle" class="h3">QUALIFIED FOUNDATIONS</text>
      <text x="226" y="66" text-anchor="middle" class="small">D · O · L · C · V · U</text>
    </g>
  </g>

  <g transform="translate(1000,212)">
    <rect width="520" height="520" rx="32" class="card" filter="url(#shadow)"/>
    <text x="36" y="52" class="h2">UPWARD</text>
    <text x="36" y="84" class="body">What is justified by these foundations?</text>
    <g transform="translate(34,118)">
      <rect width="452" height="76" rx="20" fill="#1a3040" stroke="#35b7d8"/>
      <text x="226" y="32" text-anchor="middle" class="h3">FOUNDATION SET</text>
      <text x="226" y="58" text-anchor="middle" class="small">hard · working · values · unknowns</text>
    </g>
    <line x1="260" y1="194" x2="260" y2="232" stroke="#e4a552" stroke-width="3"/>
    <rect x="102" y="232" width="316" height="62" rx="18" class="soft"/>
    <text x="260" y="270" text-anchor="middle" class="h3">MINIMUM SUFFICIENT MODEL</text>
    <line x1="260" y1="294" x2="260" y2="332" stroke="#e4a552" stroke-width="3"/>
    <rect x="54" y="332" width="132" height="62" rx="16" class="soft"/>
    <rect x="194" y="332" width="132" height="62" rx="16" class="soft"/>
    <rect x="334" y="332" width="132" height="62" rx="16" class="soft"/>
    <text x="120" y="370" text-anchor="middle" class="h3">MINIMAL</text>
    <text x="260" y="370" text-anchor="middle" class="h3">BALANCED</text>
    <text x="400" y="370" text-anchor="middle" class="h3">FRONTIER</text>
    <line x1="120" y1="394" x2="260" y2="430" stroke="#e4a552" stroke-width="2"/>
    <line x1="260" y1="394" x2="260" y2="430" stroke="#e4a552" stroke-width="2"/>
    <line x1="400" y1="394" x2="260" y2="430" stroke="#e4a552" stroke-width="2"/>
    <rect x="104" y="430" width="312" height="58" rx="18" fill="#30291c" stroke="#d39a43"/>
    <text x="260" y="467" text-anchor="middle" class="h3">TESTED DECISION</text>
  </g>

  <g>
    <path d="M 610 420 C 720 340, 880 340, 990 420" fill="none" stroke="#7bdfff" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M 990 560 C 880 640, 720 640, 610 560" fill="none" stroke="#e4a552" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
    <circle cx="800" cy="490" r="82" fill="#161a33" stroke="#8e7bff" stroke-width="2" filter="url(#shadow)"/>
    <text x="800" y="474" text-anchor="middle" class="h2">RIVAL</text>
    <text x="800" y="507" text-anchor="middle" class="h2">MODEL</text>
    <text x="800" y="536" text-anchor="middle" class="small">falsify · revise</text>
  </g>

</svg>
