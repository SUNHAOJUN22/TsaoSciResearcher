<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Proposition ledger</title>
  <desc id="desc">Proposition ledger</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#101126"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d57e"/>
      <stop offset="100%" stop-color="#e88b31"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69e3ff"/>
      <stop offset="100%" stop-color="#2888ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d69cff"/>
      <stop offset="100%" stop-color="#7657ff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7bf7c7"/>
      <stop offset="100%" stop-color="#2fbf9f"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#5be4ff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#5be4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8eb3d9" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offsetBlur"/>
      <feFlood flood-color="#000814" flood-opacity=".45" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7bdfff"/>
    </marker>
    <style>
      .title { font-weight: 700; font-size: 58px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f6fbff; letter-spacing: -.8px; }
      .subtitle { font-weight: 400; font-size: 24px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #a8bfd6; }
      .h2 { font-weight: 700; font-size: 30px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f6fbff; }
      .h3 { font-weight: 650; font-size: 22px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #eaf4ff; }
      .body { font-weight: 400; font-size: 19px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #afc3d8; }
      .small { font-weight: 500; font-size: 16px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #91a9c2; }
      .tiny { font-weight: 600; font-size: 13px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #8da7c1; letter-spacing: 1px; }
      .label { font-weight: 700; font-size: 18px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #07111f; }
      .num { font-weight: 800; font-size: 22px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #07111f; }
      .card { fill: #111e31; stroke: #37506b; stroke-width: 1.4; }
      .soft { fill: #0d1a2d; stroke: #243c57; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="28" fill="url(#grid)"/>
  <text x="76" y="88" class="title">The Proposition Ledger</text><text x="76" y="130" class="subtitle">Do not let unlike claims borrow one another’s authority.</text>
    <g transform="translate(78,212)" filter="url(#shadow)">
      <rect width="330" height="196" rx="28" class="card"/>
      <circle cx="58" cy="58" r="34" fill="url(#gold)"/>
      <text x="58" y="66" text-anchor="middle" class="num">D</text>
      <text x="108" y="54" class="h3">DEFINITION</text>
      <text x="108" y="82" class="small">Meaning and test</text>
      <line x1="28" y1="108" x2="302" y2="108" stroke="#38516d"/>
      <text x="28" y="139" class="tiny">STATUS · SCOPE · SOURCE</text>
      <text x="28" y="166" class="tiny">DEPENDENCE · FALSIFIER</text>
    </g>
    <g transform="translate(454,212)" filter="url(#shadow)">
      <rect width="330" height="196" rx="28" class="card"/>
      <circle cx="58" cy="58" r="34" fill="url(#cyan)"/>
      <text x="58" y="66" text-anchor="middle" class="num">O</text>
      <text x="108" y="54" class="h3">OBSERVATION</text>
      <text x="108" y="82" class="small">Measured or sourced</text>
      <line x1="28" y1="108" x2="302" y2="108" stroke="#38516d"/>
      <text x="28" y="139" class="tiny">STATUS · SCOPE · SOURCE</text>
      <text x="28" y="166" class="tiny">DEPENDENCE · FALSIFIER</text>
    </g>
    <g transform="translate(830,212)" filter="url(#shadow)">
      <rect width="330" height="196" rx="28" class="card"/>
      <circle cx="58" cy="58" r="34" fill="url(#violet)"/>
      <text x="58" y="66" text-anchor="middle" class="num">L</text>
      <text x="108" y="54" class="h3">LAW</text>
      <text x="108" y="82" class="small">Supported invariant</text>
      <line x1="28" y1="108" x2="302" y2="108" stroke="#38516d"/>
      <text x="28" y="139" class="tiny">STATUS · SCOPE · SOURCE</text>
      <text x="28" y="166" class="tiny">DEPENDENCE · FALSIFIER</text>
    </g>
    <g transform="translate(1206,212)" filter="url(#shadow)">
      <rect width="330" height="196" rx="28" class="card"/>
      <circle cx="58" cy="58" r="34" fill="url(#mint)"/>
      <text x="58" y="66" text-anchor="middle" class="num">C</text>
      <text x="108" y="54" class="h3">CONSTRAINT</text>
      <text x="108" y="82" class="small">Feasibility boundary</text>
      <line x1="28" y1="108" x2="302" y2="108" stroke="#38516d"/>
      <text x="28" y="139" class="tiny">STATUS · SCOPE · SOURCE</text>
      <text x="28" y="166" class="tiny">DEPENDENCE · FALSIFIER</text>
    </g>
    <g transform="translate(78,456)" filter="url(#shadow)">
      <rect width="330" height="196" rx="28" class="card"/>
      <circle cx="58" cy="58" r="34" fill="url(#gold)"/>
      <text x="58" y="66" text-anchor="middle" class="num">A</text>
      <text x="108" y="54" class="h3">ASSUMPTION</text>
      <text x="108" y="82" class="small">Adopted premise</text>
      <line x1="28" y1="108" x2="302" y2="108" stroke="#38516d"/>
      <text x="28" y="139" class="tiny">STATUS · SCOPE · SOURCE</text>
      <text x="28" y="166" class="tiny">DEPENDENCE · FALSIFIER</text>
    </g>
    <g transform="translate(454,456)" filter="url(#shadow)">
      <rect width="330" height="196" rx="28" class="card"/>
      <circle cx="58" cy="58" r="34" fill="url(#cyan)"/>
      <text x="58" y="66" text-anchor="middle" class="num">E</text>
      <text x="108" y="54" class="h3">EMPIRICAL</text>
      <text x="108" y="82" class="small">Fit, closure, proxy</text>
      <line x1="28" y1="108" x2="302" y2="108" stroke="#38516d"/>
      <text x="28" y="139" class="tiny">STATUS · SCOPE · SOURCE</text>
      <text x="28" y="166" class="tiny">DEPENDENCE · FALSIFIER</text>
    </g>
    <g transform="translate(830,456)" filter="url(#shadow)">
      <rect width="330" height="196" rx="28" class="card"/>
      <circle cx="58" cy="58" r="34" fill="url(#violet)"/>
      <text x="58" y="66" text-anchor="middle" class="num">V</text>
      <text x="108" y="54" class="h3">VALUE</text>
      <text x="108" y="82" class="small">Goal, duty, utility</text>
      <line x1="28" y1="108" x2="302" y2="108" stroke="#38516d"/>
      <text x="28" y="139" class="tiny">STATUS · SCOPE · SOURCE</text>
      <text x="28" y="166" class="tiny">DEPENDENCE · FALSIFIER</text>
    </g>
    <g transform="translate(1206,456)" filter="url(#shadow)">
      <rect width="330" height="196" rx="28" class="card"/>
      <circle cx="58" cy="58" r="34" fill="url(#mint)"/>
      <text x="58" y="66" text-anchor="middle" class="num">U</text>
      <text x="108" y="54" class="h3">UNKNOWN</text>
      <text x="108" y="82" class="small">Decision-relevant gap</text>
      <line x1="28" y1="108" x2="302" y2="108" stroke="#38516d"/>
      <text x="28" y="139" class="tiny">STATUS · SCOPE · SOURCE</text>
      <text x="28" y="166" class="tiny">DEPENDENCE · FALSIFIER</text>
    </g>
  <g transform="translate(246,720)">
    <rect width="1108" height="74" rx="24" class="soft"/>
    <text x="554" y="31" text-anchor="middle" class="h3">Claims may interact; their types must not collapse.</text>
    <text x="554" y="58" text-anchor="middle" class="small">A fitted estimate is not a law. A value is not an observation. An unknown is not zero.</text>
  </g>

</svg>
