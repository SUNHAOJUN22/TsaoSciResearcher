<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Dual-engine architecture</title>
  <desc id="desc">Dual-engine architecture</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#101126"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d57e"/>
      <stop offset="100%" stop-color="#e88b31"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69e3ff"/>
      <stop offset="100%" stop-color="#2888ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d69cff"/>
      <stop offset="100%" stop-color="#7657ff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7bf7c7"/>
      <stop offset="100%" stop-color="#2fbf9f"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#5be4ff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#5be4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8eb3d9" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offsetBlur"/>
      <feFlood flood-color="#000814" flood-opacity=".45" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7bdfff"/>
    </marker>
    <style>
      .title { font-weight: 700; font-size: 58px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f6fbff; letter-spacing: -.8px; }
      .subtitle { font-weight: 400; font-size: 24px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #a8bfd6; }
      .h2 { font-weight: 700; font-size: 30px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f6fbff; }
      .h3 { font-weight: 650; font-size: 22px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #eaf4ff; }
      .body { font-weight: 400; font-size: 19px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #afc3d8; }
      .small { font-weight: 500; font-size: 16px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #91a9c2; }
      .tiny { font-weight: 600; font-size: 13px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #8da7c1; letter-spacing: 1px; }
      .label { font-weight: 700; font-size: 18px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #07111f; }
      .num { font-weight: 800; font-size: 22px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #07111f; }
      .card { fill: #111e31; stroke: #37506b; stroke-width: 1.4; }
      .soft { fill: #0d1a2d; stroke: #243c57; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="28" fill="url(#grid)"/>

  <text x="80" y="90" class="title">The Dual-Engine Architecture</text>
  <text x="80" y="132" class="subtitle">The construction engine may proceed only through a qualified foundation gate.</text>

  <g transform="translate(90,210)" filter="url(#shadow)">
    <rect width="610" height="540" rx="34" class="card"/>
    <rect x="0" y="0" width="610" height="78" rx="34" fill="#1f2436"/>
    <circle cx="62" cy="39" r="24" fill="url(#gold)"/>
    <text x="62" y="47" text-anchor="middle" class="num">Φ</text>
    <text x="106" y="49" class="h2">FOUNDATION QUALIFICATION</text>
    <g transform="translate(52,122)">
      <rect x="0" y="0" width="224" height="80" rx="18" class="soft"/>
      <text x="22" y="34" class="h3">1 · FRAME</text><text x="22" y="61" class="small">question and alternatives</text>
      <rect x="278" y="0" width="224" height="80" rx="18" class="soft"/>
      <text x="300" y="34" class="h3">2 · DEFINE</text><text x="300" y="61" class="small">meaning and categories</text>
      <rect x="0" y="112" width="224" height="80" rx="18" class="soft"/>
      <text x="22" y="146" class="h3">3 · KNOW</text><text x="22" y="173" class="small">evidence and uncertainty</text>
      <rect x="278" y="112" width="224" height="80" rx="18" class="soft"/>
      <text x="300" y="146" class="h3">4 · EXPLAIN</text><text x="300" y="173" class="small">logic and causality</text>
      <rect x="0" y="224" width="224" height="80" rx="18" class="soft"/>
      <text x="22" y="258" class="h3">5 · BOUND</text><text x="22" y="285" class="small">scale, time, system</text>
      <rect x="278" y="224" width="224" height="80" rx="18" class="soft"/>
      <text x="300" y="258" class="h3">6 · VALUE</text><text x="300" y="285" class="small">duties and stakeholders</text>
      <rect x="84" y="352" width="334" height="72" rx="22" fill="#30291c" stroke="#d39a43"/>
      <text x="251" y="382" text-anchor="middle" class="h3">FOUNDATION CHARTER</text>
      <text x="251" y="409" text-anchor="middle" class="small">accepted · conditional · blocking</text>
    </g>
  </g>

  <g transform="translate(900,210)" filter="url(#shadow)">
    <rect width="610" height="540" rx="34" class="card"/>
    <rect x="0" y="0" width="610" height="78" rx="34" fill="#16283d"/>
    <circle cx="62" cy="39" r="24" fill="url(#cyan)"/>
    <text x="62" y="47" text-anchor="middle" class="num">P</text>
    <text x="106" y="49" class="h2">DERIVATION AND DESIGN</text>
    <g transform="translate(52,122)">
      <rect x="0" y="0" width="224" height="80" rx="18" class="soft"/>
      <text x="22" y="34" class="h3">1 · DELETE</text><text x="22" y="61" class="small">test requirements</text>
      <rect x="278" y="0" width="224" height="80" rx="18" class="soft"/>
      <text x="300" y="34" class="h3">2 · DECOMPOSE</text><text x="300" y="61" class="small">dependency graph</text>
      <rect x="0" y="112" width="224" height="80" rx="18" class="soft"/>
      <text x="22" y="146" class="h3">3 · MODEL</text><text x="22" y="173" class="small">mechanism and constraints</text>
      <rect x="278" y="112" width="224" height="80" rx="18" class="soft"/>
      <text x="300" y="146" class="h3">4 · SYNTHESIZE</text><text x="300" y="173" class="small">structural alternatives</text>
      <rect x="0" y="224" width="224" height="80" rx="18" class="soft"/>
      <text x="22" y="258" class="h3">5 · FALSIFY</text><text x="22" y="285" class="small">rivals and boundary tests</text>
      <rect x="278" y="224" width="224" height="80" rx="18" class="soft"/>
      <text x="300" y="258" class="h3">6 · DECIDE</text><text x="300" y="285" class="small">act, monitor, revise</text>
      <rect x="84" y="352" width="334" height="72" rx="22" fill="#132e3f" stroke="#3baee9"/>
      <text x="251" y="382" text-anchor="middle" class="h3">TRACEABLE DECISION</text>
      <text x="251" y="409" text-anchor="middle" class="small">foundations · uncertainty · trigger</text>
    </g>
  </g>

  <g>
    <path d="M 704 440 C 770 385, 830 385, 896 440" fill="none" stroke="#7bdfff" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M 896 550 C 830 605, 770 605, 704 550" fill="none" stroke="#e4a552" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
    <rect x="720" y="451" width="160" height="80" rx="22" fill="#171a32" stroke="#8e7bff" stroke-width="2"/>
    <text x="800" y="483" text-anchor="middle" class="h3">QUALITY</text>
    <text x="800" y="511" text-anchor="middle" class="small">GATE + REPAIR</text>
  </g>

</svg>
