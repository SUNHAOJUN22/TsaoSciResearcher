<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
    <title id="title">双引擎：基础资格审查 × 拆解—重构</title><desc id="desc">先判断什么有资格成为基础，再从通过审查的基础向上构造并主动寻找反例。</desc>
    <defs>
      <linearGradient id="dual-zh-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b14"/><stop offset=".55" stop-color="#0a1930"/><stop offset="1" stop-color="#10112a"/></linearGradient>
      <linearGradient id="dual-zh-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5de4ff"/><stop offset="1" stop-color="#3c8dff"/></linearGradient>
      <linearGradient id="dual-zh-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#f7bf5a"/></linearGradient>
      <linearGradient id="dual-zh-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7c8ff"/><stop offset="1" stop-color="#b68cff"/></linearGradient>
      <linearGradient id="dual-zh-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b5ffe7"/><stop offset="1" stop-color="#55e3b2"/></linearGradient>
      <radialGradient id="dual-zh-halo"><stop offset="0" stop-color="#5de4ff" stop-opacity=".32"/><stop offset="1" stop-color="#5de4ff" stop-opacity="0"/></radialGradient>
      <pattern id="dual-zh-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#7aa2cc" stroke-opacity=".08" stroke-width="1"/></pattern>
      <filter id="dual-zh-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="dual-zh-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000814" flood-opacity=".25"/></filter>
      <marker id="dual-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5de4ff"/></marker>
      <clipPath id="dual-zh-sceneclip"><rect x="870" y="0" width="730" height="480" rx="28"/></clipPath>
      <linearGradient id="dual-zh-fade" x1="0" x2="1"><stop offset="0" stop-color="#050b14" stop-opacity="1"/><stop offset=".35" stop-color="#050b14" stop-opacity=".55"/><stop offset="1" stop-color="#050b14" stop-opacity="0"/></linearGradient>
      
      <style>
        .title{font:700 50px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#f5fbff;letter-spacing:-.5px}
        .subtitle{font:400 21px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#a8bfd3}
        .h2{font:700 29px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#f5fbff}
        .h3{font:700 21px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#f5fbff}
        .body{font:400 18px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#a8bfd3}
        .small{font:500 15px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#a8bfd3}
        .tiny{font:700 12px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#6f8aa5;letter-spacing:.8px}
        .formula{font:500 18px Noto Sans CJK SC,DejaVu Sans Mono,monospace;fill:#f5fbff}
        .formula2{font:600 21px Noto Sans CJK SC,DejaVu Sans,serif;fill:#f5fbff}
        .card{fill:#0e1c2e;fill-opacity:.84;stroke:#314a66;stroke-width:1.2}
        .card2{fill:#101f34;fill-opacity:.84;stroke:#314a66;stroke-width:1.1}
