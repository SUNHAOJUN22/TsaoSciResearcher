    <circle cx="1320" cy="120" r="330" fill="url(#dual-zh-halo)"/>
    <circle cx="210" cy="760" r="330" fill="url(#dual-zh-halo)" opacity=".35"/>
    <text x="84" y="62" class="tiny">Φ × P · DUAL ENGINE</text><text x="84" y="118" class="title">双引擎：基础资格审查 × 拆解—重构</text>
    <text x="84" y="158" class="subtitle">先判断什么有资格成为基础，再从通过审查的基础向上构造并主动寻找反例。</text><rect x="90" y="220" width="660" height="460" rx="28" class="card" filter="url(#dual-zh-shadow)"/><text x="420" y="270" text-anchor="middle" class="h2">Φ 引擎 · 第一哲学</text><circle cx="420" cy="450" r="126" fill="none" stroke="#f7bf5a" stroke-width="2" opacity=".45"/><circle cx="420" cy="450" r="92" fill="url(#dual-zh-gold)" opacity=".09" stroke="#f7bf5a" stroke-width="3"/><circle cx="420" cy="450" r="42" fill="#f7bf5a" opacity=".18" filter="url(#dual-zh-glow)"/><text x="420" y="463" text-anchor="middle" style="font:800 34px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#f7bf5a">Φ</text><circle cx="420.0" cy="295.0" r="28" fill="#101f34" stroke="#f7bf5a" stroke-width="2"/><text x="420.0" y="300.0" text-anchor="middle" class="tiny">语义</text><circle cx="529.6" cy="340.4" r="28" fill="#101f34" stroke="#f7bf5a" stroke-width="2"/><text x="529.6" y="345.4" text-anchor="middle" class="tiny">本体</text><circle cx="575.0" cy="450.0" r="28" fill="#101f34" stroke="#f7bf5a" stroke-width="2"/><text x="575.0" y="455.0" text-anchor="middle" class="tiny">认识</text><circle cx="529.6" cy="559.6" r="28" fill="#101f34" stroke="#f7bf5a" stroke-width="2"/><text x="529.6" y="564.6" text-anchor="middle" class="tiny">逻辑</text><circle cx="420.0" cy="605.0" r="28" fill="#101f34" stroke="#f7bf5a" stroke-width="2"/><text x="420.0" y="610.0" text-anchor="middle" class="tiny">尺度</text><circle cx="310.4" cy="559.6" r="28" fill="#101f34" stroke="#f7bf5a" stroke-width="2"/><text x="310.4" y="564.6" text-anchor="middle" class="tiny">价值</text><circle cx="265.0" cy="450.0" r="28" fill="#101f34" stroke="#f7bf5a" stroke-width="2"/><text x="265.0" y="455.0" text-anchor="middle" class="tiny">伦理</text><circle cx="310.4" cy="340.4" r="28" fill="#101f34" stroke="#f7bf5a" stroke-width="2"/><text x="310.4" y="345.4" text-anchor="middle" class="tiny">实践</text><rect x="162" y="620" width="516" height="42" rx="15" fill="#f7bf5a" opacity=".09" stroke="#f7bf5a"/><text x="420" y="647" text-anchor="middle" class="formula">基础章程 = {意义, 存在, 知识, 逻辑, 尺度, 价值}</text><rect x="850" y="220" width="660" height="460" rx="28" class="card" filter="url(#dual-zh-shadow)"/><text x="1180" y="270" text-anchor="middle" class="h2">P 引擎 · 第一性原理</text><circle cx="1180" cy="450" r="126" fill="none" stroke="#5de4ff" stroke-width="2" opacity=".45"/><circle cx="1180" cy="450" r="92" fill="url(#dual-zh-cyan)" opacity=".09" stroke="#5de4ff" stroke-width="3"/><circle cx="1180" cy="450" r="42" fill="#5de4ff" opacity=".18" filter="url(#dual-zh-glow)"/><text x="1180" y="463" text-anchor="middle" style="font:800 34px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#5de4ff">P</text><circle cx="1180.0" cy="295.0" r="28" fill="#101f34" stroke="#5de4ff" stroke-width="2"/><text x="1180.0" y="300.0" text-anchor="middle" class="tiny">删除</text><circle cx="1279.6" cy="331.3" r="28" fill="#101f34" stroke="#5de4ff" stroke-width="2"/><text x="1279.6" y="336.3" text-anchor="middle" class="tiny">边界</text><circle cx="1332.6" cy="423.1" r="28" fill="#101f34" stroke="#5de4ff" stroke-width="2"/><text x="1332.6" y="428.1" text-anchor="middle" class="tiny">假设</text><circle cx="1314.2" cy="527.5" r="28" fill="#101f34" stroke="#5de4ff" stroke-width="2"/><text x="1314.2" y="532.5" text-anchor="middle" class="tiny">拆解</text><circle cx="1233.0" cy="595.7" r="28" fill="#101f34" stroke="#5de4ff" stroke-width="2"/><text x="1233.0" y="600.7" text-anchor="middle" class="tiny">基底</text><circle cx="1127.0" cy="595.7" r="28" fill="#101f34" stroke="#5de4ff" stroke-width="2"/><text x="1127.0" y="600.7" text-anchor="middle" class="tiny">建模</text><circle cx="1045.8" cy="527.5" r="28" fill="#101f34" stroke="#5de4ff" stroke-width="2"/><text x="1045.8" y="532.5" text-anchor="middle" class="tiny">竞争</text><circle cx="1027.4" cy="423.1" r="28" fill="#101f34" stroke="#5de4ff" stroke-width="2"/><text x="1027.4" y="428.1" text-anchor="middle" class="tiny">证伪</text><circle cx="1080.4" cy="331.3" r="28" fill="#101f34" stroke="#5de4ff" stroke-width="2"/><text x="1080.4" y="336.3" text-anchor="middle" class="tiny">迭代</text><rect x="922" y="620" width="516" height="42" rx="15" fill="#5de4ff" opacity=".09" stroke="#5de4ff"/><text x="1180" y="647" text-anchor="middle" class="formula">模型集合 ℳ = {M₁, M₂, …, Mₙ}；以证据与证伪竞争</text><path d="M750 398 C790 350 810 350 850 398" fill="none" stroke="#5de4ff" stroke-width="4" marker-end="url(#dual-zh-arrow)"/><path d="M850 540 C810 590 790 590 750 540" fill="none" stroke="#f7bf5a" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#dual-zh-arrow)"/><rect x="290" y="716" width="1020" height="58" rx="20" class="card"/><text x="800" y="751" text-anchor="middle" class="small">新证据、失败与反例返回基础层，修正概念、边界与价值承诺</text></svg>