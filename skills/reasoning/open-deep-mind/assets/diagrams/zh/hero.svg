<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">开放深度思维技能库总览</title><desc id="desc">第一哲学、第一性原理、系统思维、竞争模型、质量门、跨尺度建模与行动迭代的中文 AI 设计总图。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040914"/><stop offset=".52" stop-color="#071527"/><stop offset="1" stop-color="#0b1022"/></linearGradient><radialGradient id="halo"><stop offset="0" stop-color="#4edcff" stop-opacity=".35"/><stop offset=".52" stop-color="#447cff" stop-opacity=".12"/><stop offset="1" stop-color="#447cff" stop-opacity="0"/></radialGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#70ecff"/><stop offset="1" stop-color="#2788ff"/></linearGradient><linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ff6d1"/><stop offset="1" stop-color="#1bc695"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe59a"/><stop offset="1" stop-color="#f39c35"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e1b4ff"/><stop offset="1" stop-color="#8758ff"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9c8b"/><stop offset="1" stop-color="#f04d4d"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8fb8dd" stroke-opacity=".055"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00050d" flood-opacity=".55"/></filter><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fe8ff"/></marker><style>.t{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#f4f8ff}.title{font-size:48px;font-weight:800;letter-spacing:.5px}.sub{font-size:21px;font-weight:500;fill:#b9cbe0}.h2{font-size:26px;font-weight:800}.h3{font-size:19px;font-weight:750}.body{font-size:16px;font-weight:450;fill:#b7c8da}.small{font-size:14px;font-weight:500;fill:#94abc2}.tiny{font-size:12px;font-weight:700;fill:#7f98b3;letter-spacing:.7px}.formula{font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;font-size:15px;font-weight:600;fill:#eaf5ff}.card{fill:#0b1727;fill-opacity:.93;stroke:#314962;stroke-width:1.25}.soft{fill:#0d1b2e;stroke:#263e59;stroke-width:1.1}</style></defs><rect width="1600" height="1080" rx="28" fill="url(#bg)"/><rect width="1600" height="1080" rx="28" fill="url(#grid)"/><circle cx="1320" cy="100" r="330" fill="url(#halo)"/><circle cx="245" cy="980" r="360" fill="url(#halo)" opacity=".35"/><g transform="translate(48,46)"><text class="t title" x="0" y="45">开放深度思维技能库 · OpenDeepMind_skill</text><text class="t h2" x="0" y="88">第一哲学 × 第一性原理 × 系统思维 × 创造实践</text><g transform="translate(0,112)"><rect width="104" height="30" rx="15" fill="#b7832f"/><text class="t tiny" x="52" y="20" text-anchor="middle" fill="#08111d">第一哲学</text><rect x="114" width="112" height="30" rx="15" fill="#218d72"/><text class="t tiny" x="170" y="20" text-anchor="middle" fill="#08111d">第一性原理</text><rect x="236" width="104" height="30" rx="15" fill="#2578b7"/><text class="t tiny" x="288" y="20" text-anchor="middle" fill="#08111d">系统思维</text><rect x="350" width="104" height="30" rx="15" fill="#7b4ba8"/><text class="t tiny" x="402" y="20" text-anchor="middle" fill="#08111d">数理建模</text><rect x="464" width="104" height="30" rx="15" fill="#a65b35"/><text class="t tiny" x="516" y="20" text-anchor="middle" fill="#08111d">创造设计</text><rect x="578" width="92" height="30" rx="15" fill="#7650a8"/><text class="t tiny" x="624" y="20" text-anchor="middle" fill="#08111d">AI 增强</text></g><text class="t sub" x="0" y="178">一种可审计、可证伪、可迭代的深度思维操作系统，适用于复杂问题与重大决策。</text></g><g transform="translate(1120,18)"><ellipse cx="220" cy="105" rx="215" ry="118" fill="#06101f" stroke="#21476c"/><circle cx="220" cy="105" r="102" fill="none" stroke="#4ad8ff" stroke-opacity=".22" stroke-width="3"/><circle cx="220" cy="105" r="78" fill="none" stroke="#8c62ff" stroke-opacity=".30" stroke-width="3" stroke-dasharray="10 11"/><circle cx="220" cy="105" r="52" fill="none" stroke="#ffbd59" stroke-opacity=".35" stroke-width="3"/><circle cx="220" cy="105" r="20" fill="url(#gold)" filter="url(#glow)"/><path d="M55 188 Q150 122 220 145 Q295 118 390 185" fill="none" stroke="#496e94" stroke-width="3"/><path d="M55 188 L130 145 L175 170 L230 126 L286 168 L340 142 L390 188Z" fill="#0e2239" stroke="#305779"/><circle cx="220" cy="166" r="8" fill="#0b1018"/><path d="M220 174V209M205 188L220 178L236 189M220 209L209 226M220 209L231 226" stroke="#0b1018" stroke-width="7" stroke-linecap="round"/><g fill="#d8f6ff"><circle cx="62" cy="50" r="2"/><circle cx="105" cy="23" r="1.8"/><circle cx="351" cy="42" r="2"/><circle cx="320" cy="14" r="1.5"/><circle cx="390" cy="90" r="1.5"/></g></g><g transform="translate(48,245)" filter="url(#shadow)"><rect width="1504" height="176" rx="22" class="card"/><text class="t h2" x="24" y="36">核心思想总览</text><g transform="translate(38,57)"><rect width="250" height="92" rx="16" fill="#0b2037" stroke="#2788ff"/><text class="t h3" x="125" y="30" text-anchor="middle" fill="#70ecff">第一哲学</text><text class="t body" x="125" y="57" text-anchor="middle">审查基础资格</text><text class="t tiny" x="125" y="80" text-anchor="middle">Φ8 基础审计</text><line x1="256" y1="46" x2="286" y2="46" stroke="#8fe8ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" width="250" height="92" rx="16" fill="#0b2422" stroke="#1bc695"/><text class="t h3" x="425" y="30" text-anchor="middle" fill="#9ff6d1">第一性原理</text><text class="t body" x="425" y="57" text-anchor="middle">拆解与重构</text><text class="t tiny" x="425" y="80" text-anchor="middle">P9 推理循环</text><line x1="556" y1="46" x2="586" y2="46" stroke="#8fe8ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="600" width="250" height="92" rx="16" fill="#271d0d" stroke="#f39c35"/><text class="t h3" x="725" y="30" text-anchor="middle" fill="#ffe59a">竞争模型</text><text class="t body" x="725" y="57" text-anchor="middle">多方案共存</text><text class="t tiny" x="725" y="80" text-anchor="middle">M₁ … Mₙ</text><line x1="856" y1="46" x2="886" y2="46" stroke="#8fe8ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="900" width="250" height="92" rx="16" fill="#211632" stroke="#8758ff"/><text class="t h3" x="1025" y="30" text-anchor="middle" fill="#e1b4ff">质量门</text><text class="t body" x="1025" y="57" text-anchor="middle">证伪与评分</text><text class="t tiny" x="1025" y="80" text-anchor="middle">阻断项 + 100 分制</text><line x1="1156" y1="46" x2="1186" y2="46" stroke="#8fe8ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="1200" width="250" height="92" rx="16" fill="#2a1515" stroke="#f04d4d"/><text class="t h3" x="1325" y="30" text-anchor="middle" fill="#ff9c8b">行动与迭代</text><text class="t body" x="1325" y="57" text-anchor="middle">创造价值</text><text class="t tiny" x="1325" y="80" text-anchor="middle">决策 → 学习 → 修正</text></g></g><g transform="translate(48,443)"><g filter="url(#shadow)"><rect width="736" height="300" rx="22" class="card"/><text class="t h2" x="24" y="38" fill="#70ecff">第一哲学：Φ8 八重透镜</text><circle cx="220" cy="184" r="92" fill="url(#halo)"/><circle cx="220" cy="184" r="66" fill="none" stroke="#4b75a0"/><circle cx="220" cy="184" r="38" fill="#12243a" stroke="#70ecff"/><circle cx="220" cy="184" r="15" fill="#050b12"/><path d="M220 191V224M205 204L220 194L235 204M220 224L209 241M220 224L231 241" stroke="#050b12" stroke-width="7" stroke-linecap="round"/><g class="t small" text-anchor="middle"><circle cx="220" cy="76" r="18" fill="#2d6ca5"/><text x="220" y="81">1</text><text x="220" y="52">问题重构</text><circle cx="290" cy="104" r="18" fill="#2d6ca5"/><text x="290" y="109">2</text><text x="360" y="91">语义审计</text><circle cx="318" cy="175" r="18" fill="#2d6ca5"/><text x="318" y="180">3</text><text x="397" y="180">本体审计</text><circle cx="290" cy="246" r="18" fill="#2d6ca5"/><text x="290" y="251">4</text><text x="366" y="265">认识审计</text><circle cx="220" cy="274" r="18" fill="#2d6ca5"/><text x="220" y="279">5</text><text x="220" y="300">逻辑与解释</text><circle cx="150" cy="246" r="18" fill="#2d6ca5"/><text x="150" y="251">6</text><text x="72" y="265">边界与尺度</text><circle cx="122" cy="175" r="18" fill="#2d6ca5"/><text x="122" y="180">7</text><text x="47" y="180">价值与伦理</text><circle cx="150" cy="104" r="18" fill="#2d6ca5"/><text x="150" y="109">8</text><text x="72" y="91">基础资格</text></g><rect x="445" y="72" width="260" height="196" rx="16" class="soft"/><text class="t h3" x="575" y="104" text-anchor="middle">输出：《基础章程》</text><text class="t body" x="468" y="136">• 定义与本体图</text><text class="t body" x="468" y="164">• 证据与认识状态</text><text class="t body" x="468" y="192">• 因果、边界与尺度</text><text class="t body" x="468" y="220">• 价值、责任与阻断项</text><text class="t formula" x="468" y="252">FΦ={语义,本体,认识,逻辑,因果,边界,价值,实践}</text></g><g transform="translate(768,0)" filter="url(#shadow)"><rect width="736" height="300" rx="22" class="card"/><text class="t h2" x="24" y="38" fill="#9ff6d1">第一性原理：P9 拆解—重构循环</text><path d="M215 82 C110 95 95 224 202 250 C304 274 362 185 313 119 C275 69 197 83 179 131 C162 176 208 210 244 186 C272 167 264 126 235 121" fill="none" stroke="#1bc695" stroke-width="5"/><path d="M235 121l-16-3 8 14" fill="none" stroke="#9ff6d1" stroke-width="4"/><g class="t small"><text x="353" y="82">1. 删除 / 修改 / 证明需求</text><text x="353" y="108">2. 定义结果与边界</text><text x="353" y="134">3. 暴露假设</text><text x="353" y="160">4. 向下拆解</text><text x="353" y="186">5. 识别基底命题</text><text x="353" y="212">6. 建模与约束</text><text x="353" y="238">7. 构造竞争方案</text><text x="353" y="264">8. 推导、计算与证伪</text><text x="353" y="290">9. 决策、监测与迭代</text></g><text class="t formula" x="40" y="286">基础 → 模型 → 预测 → 证伪 → 行动 → 修正</text></g></g><g transform="translate(48,765)"><g filter="url(#shadow)"><rect width="470" height="218" rx="20" class="card"/><text class="t h2" x="22" y="36">命题账本：D/O/L/C/A/E/V/U</text><g class="t small"><text x="24" y="70" fill="#66cfff">D 定义</text><text x="24" y="94" fill="#e7eef7">O 观测</text><text x="24" y="118" fill="#77e6b3">L 规律</text><text x="24" y="142" fill="#ffcc62">C 约束</text><text x="164" y="70" fill="#d9a5ff">A 假设</text><text x="164" y="94" fill="#ff9e73">E 经验闭合</text><text x="164" y="118" fill="#ffd86c">V 价值</text><text x="164" y="142" fill="#aab9ca">U 未知</text></g><rect x="300" y="58" width="144" height="98" rx="12" class="soft"/><g stroke="#6686a8" stroke-width="1"><line x1="300" y1="82" x2="444" y2="82"/><line x1="300" y1="106" x2="444" y2="106"/><line x1="300" y1="130" x2="444" y2="130"/><line x1="336" y1="58" x2="336" y2="156"/><line x1="372" y1="58" x2="372" y2="156"/><line x1="408" y1="58" x2="408" y2="156"/></g><text class="t formula" x="24" y="181">Cᵢ=qₛ·qₑ·qₜ·qᵣ</text><text class="t tiny" x="24" y="204">未知 ≠ 0　模型输出 ≠ 直接观测</text></g><g transform="translate(492,0)" filter="url(#shadow)"><rect width="520" height="218" rx="20" class="card"/><text class="t h2" x="22" y="34" style="font-size:22px">跨尺度桥接</text><text class="t small" x="22" y="55">微观 → 介观 → 宏观 → 系统</text><g transform="translate(26,66)" stroke="#8fe8ff" fill="none" stroke-width="2"><circle cx="36" cy="34" r="28"/><circle cx="30" cy="28" r="5" fill="#f39c35"/><path d="M8 34h56M36 6v56M16 14l40 40M56 14L16 54"/><line x1="72" y1="34" x2="112" y2="34" marker-end="url(#arrow)"/><circle cx="142" cy="24" r="10"/><circle cx="166" cy="42" r="10"/><circle cx="132" cy="50" r="8"/><line x1="150" y1="28" x2="160" y2="38"/><line x1="138" y1="32" x2="134" y2="42"/><line x1="186" y1="34" x2="226" y2="34" marker-end="url(#arrow)"/><polygon points="256,8 282,22 282,50 256,64 230,50 230,22"/><path d="M230 22l26 14 26-14M256 36v28"/><line x1="292" y1="34" x2="332" y2="34" marker-end="url(#arrow)"/><circle cx="362" cy="36" r="28"/><path d="M334 36h56M362 8v56M342 16q20 20 40 0M342 56q20-20 40 0"/><line x1="398" y1="34" x2="438" y2="34" marker-end="url(#arrow)"/><rect x="448" y="10" width="44" height="52" rx="7"/><path d="M456 52h28M460 44l7-11 7 7 8-18"/></g><g class="t tiny" text-anchor="middle"><text x="62" y="148">电子/原子</text><text x="164" y="148">分子/链</text><text x="748" y="148" visibility="hidden">x</text><text x="750" y="148" visibility="hidden">x</text><text x="256" y="148">介观结构</text><text x="362" y="148">连续场</text><text x="470" y="148">系统决策</text></g><text class="t formula" x="24" y="183">H Psi=E Psi → m_i r_i''=−grad_i U → dphi/dt=−L dF/dphi → du/dt+div F=S</text><text class="t tiny" x="24" y="205">每个箭头必须给出映射、闭合、参数来源、不确定性与验证域</text></g><g transform="translate(1034,0)" filter="url(#shadow)"><rect width="470" height="218" rx="20" class="card"/><text class="t h2" x="22" y="34" style="font-size:22px">质量门与红色阻断项</text><text class="t tiny" x="22" y="54">科研 · 工程 · 数理 · 战略 · 创意 · AI</text><polygon points="112,68 152,90 152,134 112,156 72,134 72,90" fill="#163853" stroke="#70ecff"/><polygon points="112,80 140,96 140,128 112,144 84,128 84,96" fill="#235d82" opacity=".7"/><text class="t tiny" x="112" y="178" text-anchor="middle">12 维评分 / 100 分</text><g class="t small"><text x="188" y="74" fill="#ff8f80">✕ 核心术语未定义</text><text x="188" y="98" fill="#ff8f80">✕ 关键事实无可靠来源</text><text x="188" y="122" fill="#ff8f80">✕ 相关性冒充因果</text><text x="188" y="146" fill="#ff8f80">✕ 模型输出冒充观测</text><text x="188" y="170" fill="#ff8f80">✕ 无竞争模型或证伪条件</text></g><text class="t formula" x="22" y="204">Q=Σwᵢsᵢ−λB，B&gt;0 ⇒ 阻断交付</text></g></g><g transform="translate(48,1003)"><rect width="1504" height="52" rx="16" class="soft"/><text class="t h3" x="22" y="32" fill="#ffe59a">决策公式：</text><text class="t formula" x="150" y="32">a*=arg minₐ [Cost(a)+Risk(a)−Value(a)]　s.t. g(a)≤0, h(a)=0</text><text class="t small" x="1050" y="32">透明 &gt; 复杂　证据 &gt; 权威　迭代 &gt; 完美　创造 &gt; 复制</text></g></svg>