    <text x="84" y="158" class="subtitle">不是堆砌方法，而是让语义、证据、机制、模型、创造与行动形成闭环。</text><circle cx="800" cy="455" r="132" fill="url(#concept-zh-halo)"/><circle cx="800" cy="455" r="92" class="card" filter="url(#concept-zh-glow)"/><circle cx="800" cy="455" r="64" fill="url(#concept-zh-cyan)" opacity=".12" stroke="#5de4ff" stroke-width="2"/><text x="800" y="448" text-anchor="middle" class="h2">Open</text><text x="800" y="482" text-anchor="middle" class="h2">DeepMind</text><path d="M800.0,350.0 Q834.0,268.1 800.0,170.0" fill="none" stroke="#5de4ff" stroke-width="2.5" opacity=".72"/><rect x="678.0" y="118.0" width="244" height="104" rx="22" class="card"/><circle cx="722.0" cy="170.0" r="24" fill="#5de4ff" opacity=".18" stroke="#5de4ff"/><text x="760.0" y="177.0" class="h3">第一哲学</text><path d="M890.9,402.5 Q978.9,391.0 1046.8,312.5" fill="none" stroke="#55e3b2" stroke-width="2.5" opacity=".72"/><rect x="924.8" y="260.5" width="244" height="104" rx="22" class="card"/><circle cx="968.8" cy="312.5" r="24" fill="#55e3b2" opacity=".18" stroke="#55e3b2"/><text x="1006.8" y="319.5" class="h3">第一性原理</text><path d="M890.9,507.5 Q944.9,577.9 1046.8,597.5" fill="none" stroke="#f7bf5a" stroke-width="2.5" opacity=".72"/><rect x="924.8" y="545.5" width="244" height="104" rx="22" class="card"/><circle cx="968.8" cy="597.5" r="24" fill="#f7bf5a" opacity=".18" stroke="#f7bf5a"/><text x="1006.8" y="604.5" class="h3">系统思维</text><path d="M800.0,560.0 Q766.0,641.9 800.0,740.0" fill="none" stroke="#b68cff" stroke-width="2.5" opacity=".72"/><rect x="678.0" y="688.0" width="244" height="104" rx="22" class="card"/><circle cx="722.0" cy="740.0" r="24" fill="#b68cff" opacity=".18" stroke="#b68cff"/><text x="760.0" y="747.0" class="h3">证据与因果</text><path d="M709.1,507.5 Q621.1,519.0 553.2,597.5" fill="none" stroke="#ff6b72" stroke-width="2.5" opacity=".72"/><rect x="431.2" y="545.5" width="244" height="104" rx="22" class="card"/><circle cx="475.2" cy="597.5" r="24" fill="#ff6b72" opacity=".18" stroke="#ff6b72"/><text x="513.2" y="604.5" class="h3">数理建模</text><path d="M709.1,402.5 Q655.1,332.1 553.2,312.5" fill="none" stroke="#3c8dff" stroke-width="2.5" opacity=".72"/><rect x="431.2" y="260.5" width="244" height="104" rx="22" class="card"/><circle cx="475.2" cy="312.5" r="24" fill="#3c8dff" opacity=".18" stroke="#3c8dff"/><text x="513.2" y="319.5" class="h3">创造与 AI</text><rect x="170" y="718" width="1260" height="62" rx="22" class="card"/><text x="800" y="757" text-anchor="middle" class="formula2">深度思考 = 语义清晰 × 证据质量 × 机制完整 × 可证伪性 × 可修正性</text><ellipse cx="800" cy="455" rx="435" ry="265" fill="none" stroke="#b68cff" stroke-width="1.5" stroke-dasharray="8 12" opacity=".5"/></svg>