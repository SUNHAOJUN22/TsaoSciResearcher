    <text x="84" y="62" class="tiny">CLAIM PROVENANCE · AUDIT TRAIL</text><text x="84" y="118" class="title">命题账本：D/O/L/C/A/E/V/U</text>
    <text x="84" y="158" class="subtitle">每条关键命题必须有类型、来源、范围、依赖、置信度和证伪条件。</text><rect x="78" y="210" width="232" height="38" rx="12" class="card2"/><rect x="86" y="218" width="22" height="22" rx="7" fill="#5de4ff"/><text x="97" y="234" text-anchor="middle" style="font:800 13px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">D</text><text x="120" y="235" class="small">定义</text><rect x="328" y="210" width="232" height="38" rx="12" class="card2"/><rect x="336" y="218" width="22" height="22" rx="7" fill="#55e3b2"/><text x="347" y="234" text-anchor="middle" style="font:800 13px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">O</text><text x="370" y="235" class="small">观测</text><rect x="578" y="210" width="232" height="38" rx="12" class="card2"/><rect x="586" y="218" width="22" height="22" rx="7" fill="#f7bf5a"/><text x="597" y="234" text-anchor="middle" style="font:800 13px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">L</text><text x="620" y="235" class="small">规律/不变量</text><rect x="828" y="210" width="232" height="38" rx="12" class="card2"/><rect x="836" y="218" width="22" height="22" rx="7" fill="#b68cff"/><text x="847" y="234" text-anchor="middle" style="font:800 13px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">C</text><text x="870" y="235" class="small">约束</text><rect x="78" y="260" width="232" height="38" rx="12" class="card2"/><rect x="86" y="268" width="22" height="22" rx="7" fill="#ff6b72"/><text x="97" y="284" text-anchor="middle" style="font:800 13px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">A</text><text x="120" y="285" class="small">假设</text><rect x="328" y="260" width="232" height="38" rx="12" class="card2"/><rect x="336" y="268" width="22" height="22" rx="7" fill="#3c8dff"/><text x="347" y="284" text-anchor="middle" style="font:800 13px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">E</text><text x="370" y="285" class="small">经验闭合/代理</text><rect x="578" y="260" width="232" height="38" rx="12" class="card2"/><rect x="586" y="268" width="22" height="22" rx="7" fill="#5de4ff"/><text x="597" y="284" text-anchor="middle" style="font:800 13px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">V</text><text x="620" y="285" class="small">价值/目标</text><rect x="828" y="260" width="232" height="38" rx="12" class="card2"/><rect x="836" y="268" width="22" height="22" rx="7" fill="#55e3b2"/><text x="847" y="284" text-anchor="middle" style="font:800 13px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#050b14">U</text><text x="870" y="285" class="small">未知</text><rect x="70" y="330" width="1460" height="324" rx="24" class="card"/><rect x="70" y="330" width="290" height="54" fill="#5de4ff" opacity=".10"/><text x="215.0" y="364" text-anchor="middle" class="h3">命题</text><rect x="360" y="330" width="240" height="54" fill="#55e3b2" opacity=".10"/><text x="480.0" y="364" text-anchor="middle" class="h3">证据</text><rect x="600" y="330" width="190" height="54" fill="#f7bf5a" opacity=".10"/><text x="695.0" y="364" text-anchor="middle" class="h3">范围</text><rect x="790" y="330" width="190" height="54" fill="#b68cff" opacity=".10"/><text x="885.0" y="364" text-anchor="middle" class="h3">置信度</text><rect x="980" y="330" width="240" height="54" fill="#ff6b72" opacity=".10"/><text x="1100.0" y="364" text-anchor="middle" class="h3">依赖</text><rect x="1220" y="330" width="310" height="54" fill="#3c8dff" opacity=".10"/><text x="1375.0" y="364" text-anchor="middle" class="h3">证伪条件</text><rect x="70" y="384" width="1460" height="54" fill="#5de4ff" opacity=".025"/><text x="86" y="418" text-anchor="start" class="small">95 分位延迟观测值</text><text x="376" y="418" text-anchor="start" class="small">实验/日志</text><text x="695.0" y="418" text-anchor="middle" class="small">工况 A</text><text x="885.0" y="418" text-anchor="middle" class="small">0.93</text><text x="1100.0" y="418" text-anchor="middle" class="small">D-01</text><text x="1236" y="418" text-anchor="start" class="small">超出误差带</text><rect x="78" y="397" width="48" height="28" rx="9" fill="#5de4ff" opacity=".13" stroke="#5de4ff"/><text x="102" y="416" text-anchor="middle" class="tiny">O-03</text><text x="86" y="472" text-anchor="start" class="small">中试尺度假设完全混合</text><text x="376" y="472" text-anchor="start" class="small">设计文件</text><text x="695.0" y="472" text-anchor="middle" class="small">中试</text><text x="885.0" y="472" text-anchor="middle" class="small">0.61</text><text x="1100.0" y="472" text-anchor="middle" class="small">O-01</text><text x="1236" y="472" text-anchor="start" class="small">出现分层</text><rect x="78" y="451" width="48" height="28" rx="9" fill="#55e3b2" opacity=".13" stroke="#55e3b2"/><text x="102" y="470" text-anchor="middle" class="tiny">A-07</text><rect x="70" y="492" width="1460" height="54" fill="#5de4ff" opacity=".025"/><text x="86" y="526" text-anchor="start" class="small">边界内质量守恒</text><text x="376" y="526" text-anchor="start" class="small">守恒律</text><text x="695.0" y="526" text-anchor="middle" class="small">封闭边界</text><text x="885.0" y="526" text-anchor="middle" class="small">0.99</text><text x="1100.0" y="526" text-anchor="middle" class="small">D-04</text><text x="1236" y="526" text-anchor="start" class="small">质量残差&gt;ε</text><rect x="78" y="505" width="48" height="28" rx="9" fill="#f7bf5a" opacity=".13" stroke="#f7bf5a"/><text x="102" y="524" text-anchor="middle" class="tiny">L-02</text><text x="86" y="580" text-anchor="start" class="small">传热系数经验代理</text><text x="376" y="580" text-anchor="start" class="small">标定数据</text><text x="695.0" y="580" text-anchor="middle" class="small">设备族</text><text x="885.0" y="580" text-anchor="middle" class="small">0.72</text><text x="1100.0" y="580" text-anchor="middle" class="small">O-09</text><text x="1236" y="580" text-anchor="start" class="small">新标定失效</text><rect x="78" y="559" width="48" height="28" rx="9" fill="#b68cff" opacity=".13" stroke="#b68cff"/><text x="102" y="578" text-anchor="middle" class="tiny">E-11</text><rect x="70" y="600" width="1460" height="54" fill="#5de4ff" opacity=".025"/><text x="86" y="634" text-anchor="start" class="small">安全优先于速度</text><text x="376" y="634" text-anchor="start" class="small">价值章程</text><text x="695.0" y="634" text-anchor="middle" class="small">全局</text><text x="885.0" y="634" text-anchor="middle" class="small">1.00</text><text x="1100.0" y="634" text-anchor="middle" class="small">V-00</text><text x="1236" y="634" text-anchor="start" class="small">安全约束被取消</text><rect x="78" y="613" width="48" height="28" rx="9" fill="#ff6b72" opacity=".13" stroke="#ff6b72"/><text x="102" y="632" text-anchor="middle" class="tiny">V-01</text><rect x="145" y="718" width="1310" height="60" rx="20" class="card"/><text x="800" y="756" text-anchor="middle" class="formula2">C_i = q_s × q_e × q_t × q_r    ·    未知 U != 0    ·    模型输出 != 直接观测</text></svg>