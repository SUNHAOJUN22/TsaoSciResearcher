<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
    <title id="title">命题账本：D/O/L/C/A/E/V/U</title><desc id="desc">每条关键命题必须有类型、来源、范围、依赖、置信度和证伪条件。</desc>
    <defs>
      <linearGradient id="ledger-zh-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b14"/><stop offset=".55" stop-color="#0a1930"/><stop offset="1" stop-color="#10112a"/></linearGradient>
      <linearGradient id="ledger-zh-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5de4ff"/><stop offset="1" stop-color="#3c8dff"/></linearGradient>
      <linearGradient id="ledger-zh-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#f7bf5a"/></linearGradient>
      <linearGradient id="ledger-zh-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7c8ff"/><stop offset="1" stop-color="#b68cff"/></linearGradient>
      <linearGradient id="ledger-zh-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b5ffe7"/><stop offset="1" stop-color="#55e3b2"/></linearGradient>
      <radialGradient id="ledger-zh-halo"><stop offset="0" stop-color="#5de4ff" stop-opacity=".32"/><stop offset="1" stop-color="#5de4ff" stop-opacity="0"/></radialGradient>
      <pattern id="ledger-zh-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#7aa2cc" stroke-opacity=".08" stroke-width="1"/></pattern>
      <filter id="ledger-zh-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="ledger-zh-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000814" flood-opacity=".25"/></filter>
      <marker id="ledger-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5de4ff"/></marker>
      <clipPath id="ledger-zh-sceneclip"><rect x="870" y="0" width="730" height="480" rx="28"/></clipPath>
      <linearGradient id="ledger-zh-fade" x1="0" x2="1"><stop offset="0" stop-color="#050b14" stop-opacity="1"/><stop offset=".35" stop-color="#050b14" stop-opacity=".55"/><stop offset="1" stop-color="#050b14" stop-opacity="0"/></linearGradient>
      
      <style>
