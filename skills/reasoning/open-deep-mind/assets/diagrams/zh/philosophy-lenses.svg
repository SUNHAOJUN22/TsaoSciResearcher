    <text x="84" y="158" class="subtitle">“第一”不是时间最早，而是在当前问题、尺度与目的下具有基础优先性。</text><circle cx="600" cy="500" r="190" fill="none" stroke="#5de4ff" stroke-width="2" opacity="0.18"/><circle cx="600" cy="500" r="145" fill="none" stroke="#5de4ff" stroke-width="2" opacity="0.25"/><circle cx="600" cy="500" r="95" fill="none" stroke="#5de4ff" stroke-width="2" opacity="0.34"/><circle cx="600" cy="500" r="72" fill="url(#lenses-zh-violet)" opacity=".12" stroke="#b68cff" stroke-width="2"/><path d="M558.4,500 Q600,470.1 641.6,500 Q600,529.9 558.4,500Z" fill="none" stroke="#5de4ff" stroke-width="4"/><circle cx="600" cy="500" r="10.92" fill="#f7bf5a"/><circle cx="600" cy="500" r="3.9" fill="#050b14"/><line x1="600.0" y1="310.0" x2="600.0" y2="275.0" stroke="#5de4ff" stroke-width="2" opacity=".75"/><circle cx="600.0" cy="245.0" r="42" fill="#0e1c2e" stroke="#5de4ff" stroke-width="2.5"/><text x="600.0" y="240.0" text-anchor="middle" style="font:800 18px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#5de4ff">1</text><text x="658.0" y="253.0" text-anchor="start" class="h3">问题重构</text><line x1="734.4" y1="365.6" x2="759.1" y2="340.9" stroke="#55e3b2" stroke-width="2" opacity=".75"/><circle cx="780.3" cy="319.7" r="42" fill="#0e1c2e" stroke="#55e3b2" stroke-width="2.5"/><text x="780.3" y="314.7" text-anchor="middle" style="font:800 18px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#55e3b2">2</text><text x="838.3" y="327.7" text-anchor="start" class="h3">语义审计</text><line x1="790.0" y1="500.0" x2="825.0" y2="500.0" stroke="#f7bf5a" stroke-width="2" opacity=".75"/><circle cx="855.0" cy="500.0" r="42" fill="#0e1c2e" stroke="#f7bf5a" stroke-width="2.5"/><text x="855.0" y="495.0" text-anchor="middle" style="font:800 18px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#f7bf5a">3</text><text x="913.0" y="508.0" text-anchor="start" class="h3">本体审计</text><line x1="734.4" y1="634.4" x2="759.1" y2="659.1" stroke="#b68cff" stroke-width="2" opacity=".75"/><circle cx="780.3" cy="680.3" r="42" fill="#0e1c2e" stroke="#b68cff" stroke-width="2.5"/><text x="780.3" y="675.3" text-anchor="middle" style="font:800 18px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#b68cff">4</text><text x="838.3" y="688.3" text-anchor="start" class="h3">认识论审计</text><line x1="600.0" y1="690.0" x2="600.0" y2="725.0" stroke="#ff6b72" stroke-width="2" opacity=".75"/><circle cx="600.0" cy="755.0" r="42" fill="#0e1c2e" stroke="#ff6b72" stroke-width="2.5"/><text x="600.0" y="750.0" text-anchor="middle" style="font:800 18px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#ff6b72">5</text><text x="658.0" y="763.0" text-anchor="start" class="h3">逻辑与解释</text><line x1="465.6" y1="634.4" x2="440.9" y2="659.1" stroke="#3c8dff" stroke-width="2" opacity=".75"/><circle cx="419.7" cy="680.3" r="42" fill="#0e1c2e" stroke="#3c8dff" stroke-width="2.5"/><text x="419.7" y="675.3" text-anchor="middle" style="font:800 18px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#3c8dff">6</text><text x="361.7" y="688.3" text-anchor="end" class="h3">边界与尺度</text><line x1="410.0" y1="500.0" x2="375.0" y2="500.0" stroke="#5de4ff" stroke-width="2" opacity=".75"/><circle cx="345.0" cy="500.0" r="42" fill="#0e1c2e" stroke="#5de4ff" stroke-width="2.5"/><text x="345.0" y="495.0" text-anchor="middle" style="font:800 18px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#5de4ff">7</text><text x="287.0" y="508.0" text-anchor="end" class="h3">价值与伦理</text><line x1="465.6" y1="365.6" x2="440.9" y2="340.9" stroke="#55e3b2" stroke-width="2" opacity=".75"/><circle cx="419.7" cy="319.7" r="42" fill="#0e1c2e" stroke="#55e3b2" stroke-width="2.5"/><text x="419.7" y="314.7" text-anchor="middle" style="font:800 18px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#55e3b2">8</text><text x="361.7" y="327.7" text-anchor="end" class="h3">基础资格判定</text><rect x="1020" y="240" width="490" height="430" rx="28" class="card"/><text x="1265" y="292" text-anchor="middle" class="h2">Foundation Charter</text><rect x="1080" y="325" width="370" height="64" rx="18" fill="#b68cff" opacity=".10" stroke="#b68cff"/><text x="1265" y="365" text-anchor="middle" class="formula2">Φ(x) = [S, O, E, L, B, V, P, F]</text><rect x="1080" y="430" width="370" height="54" rx="16" fill="#55e3b2" opacity=".12" stroke="#55e3b2"/><circle cx="1112" cy="457" r="10" fill="#55e3b2"/><text x="1140" y="464" class="h3">可接受基础</text><rect x="1080" y="502" width="370" height="54" rx="16" fill="#f7bf5a" opacity=".12" stroke="#f7bf5a"/><circle cx="1112" cy="529" r="10" fill="#f7bf5a"/><text x="1140" y="536" class="h3">条件性基础</text><rect x="1080" y="574" width="370" height="54" rx="16" fill="#ff6b72" opacity=".12" stroke="#ff6b72"/><circle cx="1112" cy="601" r="10" fill="#ff6b72"/><text x="1140" y="608" class="h3">阻断性未知</text><text x="1265" y="645" text-anchor="middle" class="small">Meaning → Being → Knowing → Reasoning → Responsibility</text></svg>