<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
    <title id="title">跨尺度桥：从基本方程到系统决策</title><desc id="desc">每一次尺度跨越都必须声明映射变量、闭合关系、参数来源、误差传播与验证证据。</desc>
    <defs>
      <linearGradient id="scale-zh-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b14"/><stop offset=".55" stop-color="#0a1930"/><stop offset="1" stop-color="#10112a"/></linearGradient>
      <linearGradient id="scale-zh-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5de4ff"/><stop offset="1" stop-color="#3c8dff"/></linearGradient>
      <linearGradient id="scale-zh-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#f7bf5a"/></linearGradient>
      <linearGradient id="scale-zh-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7c8ff"/><stop offset="1" stop-color="#b68cff"/></linearGradient>
      <linearGradient id="scale-zh-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b5ffe7"/><stop offset="1" stop-color="#55e3b2"/></linearGradient>
      <radialGradient id="scale-zh-halo"><stop offset="0" stop-color="#5de4ff" stop-opacity=".32"/><stop offset="1" stop-color="#5de4ff" stop-opacity="0"/></radialGradient>
      <pattern id="scale-zh-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#7aa2cc" stroke-opacity=".08" stroke-width="1"/></pattern>
      <filter id="scale-zh-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="scale-zh-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000814" flood-opacity=".25"/></filter>
      <marker id="scale-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5de4ff"/></marker>
      <clipPath id="scale-zh-sceneclip"><rect x="870" y="0" width="730" height="480" rx="28"/></clipPath>
      <linearGradient id="scale-zh-fade" x1="0" x2="1"><stop offset="0" stop-color="#050b14" stop-opacity="1"/><stop offset=".35" stop-color="#050b14" stop-opacity=".55"/><stop offset="1" stop-color="#050b14" stop-opacity="0"/></linearGradient>
      
      <style>
        .title{font:700 50px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#f5fbff;letter-spacing:-.5px}
        .subtitle{font:400 21px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#a8bfd3}
        .h2{font:700 29px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#f5fbff}
        .h3{font:700 21px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#f5fbff}
        .body{font:400 18px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#a8bfd3}
        .small{font:500 15px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#a8bfd3}
        .tiny{font:700 12px Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif;fill:#6f8aa5;letter-spacing:.8px}
        .formula{font:500 18px Noto Sans CJK SC,DejaVu Sans Mono,monospace;fill:#f5fbff}
        .formula2{font:600 21px Noto Sans CJK SC,DejaVu Sans,serif;fill:#f5fbff}
        .card{fill:#0e1c2e;fill-opacity:.84;stroke:#314a66;stroke-width:1.2}
        .card2{fill:#101f34;fill-opacity:.84;stroke:#314a66;stroke-width:1.1}
      </style>
    </defs>
    <rect width="1600" height="820" rx="30" fill="url(#scale-zh-bg)"/>
    <rect width="1600" height="820" rx="30" fill="url(#scale-zh-grid)"/>
    
    <circle cx="1320" cy="120" r="330" fill="url(#scale-zh-halo)"/>
    <circle cx="210" cy="760" r="330" fill="url(#scale-zh-halo)" opacity=".35"/>
    <text x="84" y="62" class="tiny">MICRO → MESO → MACRO → SYSTEM</text><text x="84" y="118" class="title">跨尺度桥：从基本方程到系统决策</text>
    <text x="84" y="158" class="subtitle">每一次尺度跨越都必须声明映射变量、闭合关系、参数来源、误差传播与验证证据。</text><path d="M80,620 L80,540 L330,540 L330,620Z" fill="#5de4ff" fill-opacity=".08" stroke="#5de4ff" stroke-width="2"/><circle cx="205" cy="598" r="28" fill="none" stroke="#5de4ff" stroke-width="2"/><ellipse cx="205" cy="598" rx="46" ry="15" fill="none" stroke="#5de4ff"/><ellipse cx="205" cy="598" rx="15" ry="46" fill="none" stroke="#5de4ff" transform="rotate(35 205 598)"/><text x="205" y="652" text-anchor="middle" class="h3">电子/量子</text><text x="205" y="680" text-anchor="middle" class="small">量子力学</text><rect x="100" y="694" width="210" height="42" rx="13" fill="#0e1c2e" stroke="#5de4ff"/><text x="205" y="721" text-anchor="middle" class="formula">H Psi = E Psi</text><path d="M330,612 C350,585 360,585 380,530" fill="none" stroke="#5de4ff" stroke-width="3" marker-end="url(#scale-zh-arrow)"/><path d="M380,620 L380,458 L630,458 L630,620Z" fill="#55e3b2" fill-opacity=".08" stroke="#55e3b2" stroke-width="2"/><line x1="505" y1="492" x2="483.4" y2="531.6" stroke="#f7bf5a" stroke-width="3"/><line x1="483.4" y1="531.6" x2="526.6" y2="531.6" stroke="#f7bf5a" stroke-width="3"/><line x1="526.6" y1="531.6" x2="505" y2="492" stroke="#f7bf5a" stroke-width="3"/><circle cx="505" cy="492" r="10" fill="#0e1c2e" stroke="#f7bf5a" stroke-width="4"/><circle cx="483.4" cy="531.6" r="10" fill="#0e1c2e" stroke="#f7bf5a" stroke-width="4"/><circle cx="526.6" cy="531.6" r="10" fill="#0e1c2e" stroke="#f7bf5a" stroke-width="4"/><text x="505" y="570" text-anchor="middle" class="h3">分子/链</text><text x="505" y="598" text-anchor="middle" class="small">分子动力学</text><rect x="400" y="612" width="210" height="42" rx="13" fill="#0e1c2e" stroke="#55e3b2"/><text x="505" y="639" text-anchor="middle" class="formula">m_i d2r_i/dt2 = -grad_i U</text><path d="M630,530 C650,503 660,503 680,448" fill="none" stroke="#5de4ff" stroke-width="3" marker-end="url(#scale-zh-arrow)"/><path d="M680,620 L680,376 L930,376 L930,620Z" fill="#f7bf5a" fill-opacity=".08" stroke="#f7bf5a" stroke-width="2"/><polygon points="805,406 829.08,420.0 829.08,448.0 805,462 780.92,448.0 780.92,420.0" fill="none" stroke="#55e3b2" stroke-width="4"/><path d="M805,406V462M780.92,420.0L805,434L829.08,420.0" fill="none" stroke="#55e3b2" stroke-width="3"/><text x="805" y="488" text-anchor="middle" class="h3">介观结构</text><text x="805" y="516" text-anchor="middle" class="small">相场/统计</text><rect x="700" y="530" width="210" height="42" rx="13" fill="#0e1c2e" stroke="#f7bf5a"/><text x="805" y="557" text-anchor="middle" class="formula">dphi/dt = -L dF/dphi</text><path d="M930,448 C950,421 960,421 980,366" fill="none" stroke="#5de4ff" stroke-width="3" marker-end="url(#scale-zh-arrow)"/><path d="M980,620 L980,294 L1230,294 L1230,620Z" fill="#b68cff" fill-opacity=".08" stroke="#b68cff" stroke-width="2"/><circle cx="1105" cy="352" r="34" fill="none" stroke="#b68cff" stroke-width="3"/><path d="M1077,352 C1095,324 1115,380 1133,352M1105,320C1133,342 1077,362 1105,384" fill="none" stroke="#b68cff" stroke-width="2"/><text x="1105" y="406" text-anchor="middle" class="h3">连续体场</text><text x="1105" y="434" text-anchor="middle" class="small">守恒方程</text><rect x="1000" y="448" width="210" height="42" rx="13" fill="#0e1c2e" stroke="#b68cff"/><text x="1105" y="475" text-anchor="middle" class="formula">d_t u + div F(u) = S</text><path d="M1230,366 C1250,339 1260,339 1280,284" fill="none" stroke="#5de4ff" stroke-width="3" marker-end="url(#scale-zh-arrow)"/><path d="M1280,620 L1280,212 L1530,212 L1530,620Z" fill="#ff6b72" fill-opacity=".08" stroke="#ff6b72" stroke-width="2"/><path d="M1367,300V260h24v40m12 0V240h24v60m12 0V220h24v80" fill="none" stroke="#ff6b72" stroke-width="5"/><text x="1405" y="324" text-anchor="middle" class="h3">系统/组织</text><text x="1405" y="352" text-anchor="middle" class="small">优化与控制</text><rect x="1300" y="366" width="210" height="42" rx="13" fill="#0e1c2e" stroke="#ff6b72"/><text x="1405" y="393" text-anchor="middle" class="formula">x* = arg min J(x,u)</text><rect x="155" y="724" width="1290" height="56" rx="20" class="card"/><text x="800" y="759" text-anchor="middle" class="formula2">U_total^2 = sum(U_model,k^2) + sum(U_bridge,k^2) + U_measurement^2</text></svg>