<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Output architecture</title>
  <desc id="desc">Output architecture</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#101126"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d57e"/>
      <stop offset="100%" stop-color="#e88b31"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69e3ff"/>
      <stop offset="100%" stop-color="#2888ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d69cff"/>
      <stop offset="100%" stop-color="#7657ff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7bf7c7"/>
      <stop offset="100%" stop-color="#2fbf9f"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#5be4ff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#5be4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8eb3d9" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offsetBlur"/>
      <feFlood flood-color="#000814" flood-opacity=".45" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7bdfff"/>
    </marker>
    <style>
      .title { font-weight: 700; font-size: 58px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f6fbff; letter-spacing: -.8px; }
      .subtitle { font-weight: 400; font-size: 24px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #a8bfd6; }
      .h2 { font-weight: 700; font-size: 30px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f6fbff; }
      .h3 { font-weight: 650; font-size: 22px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #eaf4ff; }
      .body { font-weight: 400; font-size: 19px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #afc3d8; }
      .small { font-weight: 500; font-size: 16px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #91a9c2; }
      .tiny { font-weight: 600; font-size: 13px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #8da7c1; letter-spacing: 1px; }
      .label { font-weight: 700; font-size: 18px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #07111f; }
      .num { font-weight: 800; font-size: 22px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #07111f; }
      .card { fill: #111e31; stroke: #37506b; stroke-width: 1.4; }
      .soft { fill: #0d1a2d; stroke: #243c57; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="28" fill="url(#grid)"/>

  <text x="76" y="88" class="title">From Raw Question to Auditable Action</text>
  <text x="76" y="130" class="subtitle">Outputs are designed for decisions, research, and revision—not for rhetorical display.</text>

  <g transform="translate(76,215)" filter="url(#shadow)">
    <rect width="320" height="470" rx="30" class="card"/>
    <text x="34" y="54" class="h2">INPUTS</text>
    <rect x="30" y="92" width="260" height="58" rx="17" class="soft"/><text x="160" y="128" text-anchor="middle" class="h3">QUESTION</text>
    <rect x="30" y="172" width="260" height="58" rx="17" class="soft"/><text x="160" y="208" text-anchor="middle" class="h3">EVIDENCE</text>
    <rect x="30" y="252" width="260" height="58" rx="17" class="soft"/><text x="160" y="288" text-anchor="middle" class="h3">CONSTRAINTS</text>
    <rect x="30" y="332" width="260" height="58" rx="17" class="soft"/><text x="160" y="368" text-anchor="middle" class="h3">VALUES</text>
    <text x="160" y="435" text-anchor="middle" class="small">normalize · classify · date</text>
  </g>

  <g transform="translate(525,215)" filter="url(#shadow)">
    <rect width="550" height="470" rx="34" fill="#151a31" stroke="#8e7bff" stroke-width="2"/>
    <text x="275" y="58" text-anchor="middle" class="h2">OPENDEEPMIND CYCLE</text>
    <circle cx="170" cy="185" r="90" fill="#30291c" stroke="#d39a43" stroke-width="3"/>
    <text x="170" y="178" text-anchor="middle" class="h2">Φ</text>
    <text x="170" y="213" text-anchor="middle" class="small">qualify</text>
    <circle cx="380" cy="185" r="90" fill="#172d3e" stroke="#36b9df" stroke-width="3"/>
    <text x="380" y="178" text-anchor="middle" class="h2">P</text>
    <text x="380" y="213" text-anchor="middle" class="small">derive</text>
    <path d="M260 185 H286" stroke="#7bdfff" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M380 285 C 380 355, 170 355, 170 285" fill="none" stroke="#e4a552" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <rect x="80" y="338" width="390" height="78" rx="22" class="soft"/>
    <text x="275" y="370" text-anchor="middle" class="h3">RIVAL · FALSIFIER · QUALITY GATE</text>
    <text x="275" y="398" text-anchor="middle" class="small">repair the weakest decision-relevant link</text>
  </g>

  <g transform="translate(1204,215)" filter="url(#shadow)">
    <rect width="320" height="470" rx="30" class="card"/>
    <text x="34" y="54" class="h2">OUTPUTS</text>
    <rect x="30" y="92" width="260" height="58" rx="17" fill="#18322f" stroke="#43cda8"/><text x="160" y="128" text-anchor="middle" class="h3">FOUNDATION CHARTER</text>
    <rect x="30" y="172" width="260" height="58" rx="17" fill="#18322f" stroke="#43cda8"/><text x="160" y="208" text-anchor="middle" class="h3">CLAIM LEDGER</text>
    <rect x="30" y="252" width="260" height="58" rx="17" fill="#18322f" stroke="#43cda8"/><text x="160" y="288" text-anchor="middle" class="h3">MODEL + OPTIONS</text>
    <rect x="30" y="332" width="260" height="58" rx="17" fill="#18322f" stroke="#43cda8"/><text x="160" y="368" text-anchor="middle" class="h3">DECISION + TRIGGER</text>
    <text x="160" y="435" text-anchor="middle" class="small">traceable · revisable · actionable</text>
  </g>

  <path d="M402 450 H512" stroke="#7bdfff" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1088 450 H1190" stroke="#7bdfff" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(260,745)">
    <rect width="1080" height="70" rx="24" class="soft"/>
    <text x="540" y="31" text-anchor="middle" class="h3">Decision / conclusion · why · foundation trace · assumptions · uncertainty</text>
    <text x="540" y="57" text-anchor="middle" class="small">what would change the conclusion · next discriminating action · review trigger</text>
  </g>

</svg>
