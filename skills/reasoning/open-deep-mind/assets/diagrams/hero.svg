<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenDeepMind</title>
  <desc id="desc">Dual-engine reasoning system</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#101126"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d57e"/>
      <stop offset="100%" stop-color="#e88b31"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69e3ff"/>
      <stop offset="100%" stop-color="#2888ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d69cff"/>
      <stop offset="100%" stop-color="#7657ff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7bf7c7"/>
      <stop offset="100%" stop-color="#2fbf9f"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#5be4ff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#5be4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8eb3d9" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offsetBlur"/>
      <feFlood flood-color="#000814" flood-opacity=".45" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7bdfff"/>
    </marker>
    <style>
      .title { font: 700 58px Inter,Segoe UI,Arial,sans-serif; fill: #f6fbff; letter-spacing: -.8px; }
      .subtitle { font: 400 24px Inter,Segoe UI,Arial,sans-serif; fill: #a8bfd6; }
      .h2 { font: 700 30px Inter,Segoe UI,Arial,sans-serif; fill: #f6fbff; }
      .h3 { font: 650 22px Inter,Segoe UI,Arial,sans-serif; fill: #eaf4ff; }
      .body { font: 400 19px Inter,Segoe UI,Arial,sans-serif; fill: #afc3d8; }
      .small { font: 500 16px Inter,Segoe UI,Arial,sans-serif; fill: #91a9c2; }
      .tiny { font: 600 13px Inter,Segoe UI,Arial,sans-serif; fill: #8da7c1; letter-spacing: 1px; }
      .label { font: 700 18px Inter,Segoe UI,Arial,sans-serif; fill: #07111f; }
      .num { font: 800 22px Inter,Segoe UI,Arial,sans-serif; fill: #07111f; }
      .card { fill: #111e31; stroke: #37506b; stroke-width: 1.4; }
      .soft { fill: #0d1a2d; stroke: #243c57; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="28" fill="url(#grid)"/>

  <circle cx="1280" cy="120" r="300" fill="url(#halo)"/>
  <circle cx="230" cy="630" r="340" fill="url(#halo)" opacity=".45"/>
  <g transform="translate(92,84)">
    <rect x="0" y="0" width="176" height="40" rx="20" fill="#17263b" stroke="#37506b"/>
    <text x="88" y="26" text-anchor="middle" class="tiny">OPEN REASONING SYSTEM</text>
    <text x="0" y="112" class="title">OpenDeepMind</text>
    <text x="0" y="158" class="subtitle">Qualify foundations. Derive upward. Keep every claim auditable.</text>
    <text x="0" y="203" class="body">A portable dual-engine skill for philosophy, science, engineering, strategy,</text>
    <text x="0" y="233" class="body">policy, creativity, research, and consequential decisions.</text>
  </g>

  <g transform="translate(94,390)" filter="url(#shadow)">
    <rect width="584" height="224" rx="28" class="card"/>
    <circle cx="88" cy="78" r="44" fill="url(#gold)" filter="url(#glow)"/>
    <text x="88" y="86" text-anchor="middle" class="num">Φ</text>
    <text x="158" y="66" class="h2">FIRST PHILOSOPHY</text>
    <text x="158" y="101" class="body">What may count as a foundation?</text>
    <line x1="36" y1="135" x2="548" y2="135" stroke="#425b74"/>
    <text x="38" y="172" class="small">SEMANTICS · ONTOLOGY · EPISTEMOLOGY · VALUE</text>
    <text x="38" y="202" class="small">BOUNDARY · CAUSALITY · ETHICS · PRAXIS</text>
  </g>

  <g transform="translate(922,390)" filter="url(#shadow)">
    <rect width="584" height="224" rx="28" class="card"/>
    <circle cx="88" cy="78" r="44" fill="url(#cyan)" filter="url(#glow)"/>
    <text x="88" y="86" text-anchor="middle" class="num">P</text>
    <text x="158" y="66" class="h2">FIRST PRINCIPLES</text>
    <text x="158" y="101" class="body">What follows from accepted foundations?</text>
    <line x1="36" y1="135" x2="548" y2="135" stroke="#425b74"/>
    <text x="38" y="172" class="small">DECOMPOSE · CLASSIFY · MODEL · RECONSTRUCT</text>
    <text x="38" y="202" class="small">FALSIFY · CALIBRATE · DECIDE · UPDATE</text>
  </g>

  <g>
    <path d="M 682 500 C 770 430, 830 430, 918 500" fill="none" stroke="#7bdfff" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 918 550 C 830 620, 770 620, 682 550" fill="none" stroke="#e4a552" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
    <circle cx="800" cy="523" r="52" fill="#111e31" stroke="#8e7bff" stroke-width="2"/>
    <text x="800" y="516" text-anchor="middle" class="h3">DUAL</text>
    <text x="800" y="542" text-anchor="middle" class="small">ENGINE</text>
  </g>

  <g transform="translate(514,655)">
    <rect width="572" height="42" rx="21" fill="#0d1a2d" stroke="#314a65"/>
    <text x="286" y="27" text-anchor="middle" class="tiny">FOUNDATION → PRINCIPLE → MODEL → TEST → ACTION → REVISION</text>
  </g>

</svg>
