<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">First Philosophy eight lenses</title>
  <desc id="desc">First Philosophy eight lenses</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#101126"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d57e"/>
      <stop offset="100%" stop-color="#e88b31"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69e3ff"/>
      <stop offset="100%" stop-color="#2888ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d69cff"/>
      <stop offset="100%" stop-color="#7657ff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7bf7c7"/>
      <stop offset="100%" stop-color="#2fbf9f"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#5be4ff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#5be4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8eb3d9" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offsetBlur"/>
      <feFlood flood-color="#000814" flood-opacity=".45" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7bdfff"/>
    </marker>
    <style>
      .title { font-weight: 700; font-size: 58px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f6fbff; letter-spacing: -.8px; }
      .subtitle { font-weight: 400; font-size: 24px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #a8bfd6; }
      .h2 { font-weight: 700; font-size: 30px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f6fbff; }
      .h3 { font-weight: 650; font-size: 22px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #eaf4ff; }
      .body { font-weight: 400; font-size: 19px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #afc3d8; }
      .small { font-weight: 500; font-size: 16px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #91a9c2; }
      .tiny { font-weight: 600; font-size: 13px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #8da7c1; letter-spacing: 1px; }
      .label { font-weight: 700; font-size: 18px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #07111f; }
      .num { font-weight: 800; font-size: 22px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #07111f; }
      .card { fill: #111e31; stroke: #37506b; stroke-width: 1.4; }
      .soft { fill: #0d1a2d; stroke: #243c57; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="28" fill="url(#grid)"/>

  <text x="74" y="88" class="title">First Philosophy: Eight Lenses</text>
  <text x="74" y="130" class="subtitle">A foundation is qualified from multiple directions before it is used.</text>
  <g transform="translate(800,484)">
    <circle r="286" fill="#0d1a2d" stroke="#263f5b" stroke-width="2"/>
    <circle r="238" fill="none" stroke="#d99e49" stroke-opacity=".35" stroke-width="34"/>
    <circle r="186" fill="none" stroke="#5fcdf4" stroke-opacity=".30" stroke-width="34"/>
    <circle r="134" fill="none" stroke="#a47cff" stroke-opacity=".30" stroke-width="34"/>
    <circle r="83" fill="#151f35" stroke="#607da0" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-12" text-anchor="middle" class="h2">WORKING</text>
    <text x="0" y="24" text-anchor="middle" class="h2">FOUNDATION</text>
    <text x="0" y="52" text-anchor="middle" class="small">explicit · defeasible</text>

    <g transform="translate(0,-315)">
      <circle r="44" fill="url(#gold)"/><text x="0" y="7" text-anchor="middle" class="num">S</text>
      <text x="0" y="72" text-anchor="middle" class="h3">SEMANTICS</text>
    </g>
    <g transform="translate(225,-225)">
      <circle r="44" fill="url(#gold)"/><text x="0" y="7" text-anchor="middle" class="num">O</text>
      <text x="0" y="72" text-anchor="middle" class="h3">ONTOLOGY</text>
    </g>
    <g transform="translate(315,0)">
      <circle r="44" fill="url(#cyan)"/><text x="0" y="7" text-anchor="middle" class="num">K</text>
      <text x="0" y="72" text-anchor="middle" class="h3">KNOWLEDGE</text>
    </g>
    <g transform="translate(225,225)">
      <circle r="44" fill="url(#cyan)"/><text x="0" y="7" text-anchor="middle" class="num">L</text>
      <text x="0" y="72" text-anchor="middle" class="h3">LOGIC</text>
    </g>
    <g transform="translate(0,315)">
      <circle r="44" fill="url(#violet)"/><text x="0" y="7" text-anchor="middle" class="num">C</text>
      <text x="0" y="72" text-anchor="middle" class="h3">CAUSALITY</text>
    </g>
    <g transform="translate(-225,225)">
      <circle r="44" fill="url(#violet)"/><text x="0" y="7" text-anchor="middle" class="num">B</text>
      <text x="0" y="72" text-anchor="middle" class="h3">BOUNDARY</text>
    </g>
    <g transform="translate(-315,0)">
      <circle r="44" fill="url(#mint)"/><text x="0" y="7" text-anchor="middle" class="num">V</text>
      <text x="0" y="72" text-anchor="middle" class="h3">VALUE</text>
    </g>
    <g transform="translate(-225,-225)">
      <circle r="44" fill="url(#mint)"/><text x="0" y="7" text-anchor="middle" class="num">P</text>
      <text x="0" y="72" text-anchor="middle" class="h3">PRAXIS</text>
    </g>
  </g>
  <g transform="translate(82,730)">
    <rect width="1436" height="70" rx="24" class="soft"/>
    <text x="718" y="30" text-anchor="middle" class="h3">A lens may reveal a blocker, a conditional foundation, or a rival frame.</text>
    <text x="718" y="55" text-anchor="middle" class="small">No single lens is allowed to silently dominate every domain.</text>
  </g>

</svg>
