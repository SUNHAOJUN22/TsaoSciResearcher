<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Quality gates</title>
  <desc id="desc">Quality gates</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#101126"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d57e"/>
      <stop offset="100%" stop-color="#e88b31"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69e3ff"/>
      <stop offset="100%" stop-color="#2888ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d69cff"/>
      <stop offset="100%" stop-color="#7657ff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7bf7c7"/>
      <stop offset="100%" stop-color="#2fbf9f"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#5be4ff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#5be4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8eb3d9" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offsetBlur"/>
      <feFlood flood-color="#000814" flood-opacity=".45" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7bdfff"/>
    </marker>
    <style>
      .title { font-weight: 700; font-size: 58px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f6fbff; letter-spacing: -.8px; }
      .subtitle { font-weight: 400; font-size: 24px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #a8bfd6; }
      .h2 { font-weight: 700; font-size: 30px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f6fbff; }
      .h3 { font-weight: 650; font-size: 22px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #eaf4ff; }
      .body { font-weight: 400; font-size: 19px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #afc3d8; }
      .small { font-weight: 500; font-size: 16px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #91a9c2; }
      .tiny { font-weight: 600; font-size: 13px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #8da7c1; letter-spacing: 1px; }
      .label { font-weight: 700; font-size: 18px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #07111f; }
      .num { font-weight: 800; font-size: 22px; font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #07111f; }
      .card { fill: #111e31; stroke: #37506b; stroke-width: 1.4; }
      .soft { fill: #0d1a2d; stroke: #243c57; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="28" fill="url(#grid)"/>

  <text x="76" y="88" class="title">Quality Gates: No Rhetorical Completion</text>
  <text x="76" y="130" class="subtitle">A numerical score never overrides a red blocker.</text>
  <g transform="translate(90,210)">
    <g>
      <rect width="310" height="470" rx="30" fill="#2a1720" stroke="#d85865" stroke-width="2" filter="url(#shadow)"/>
      <text x="32" y="56" class="h2">RED BLOCKERS</text>
      <text x="32" y="100" class="body">Undefined core term</text>
      <text x="32" y="139" class="body">Unsupported key fact</text>
      <text x="32" y="178" class="body">Invalid inference</text>
      <text x="32" y="217" class="body">Causal overclaim</text>
      <text x="32" y="256" class="body">Hidden value function</text>
      <text x="32" y="295" class="body">Unbridged scale jump</text>
      <text x="32" y="334" class="body">No falsifier or rival</text>
      <text x="32" y="373" class="body">Unsafe deletion</text>
      <rect x="32" y="410" width="246" height="38" rx="19" fill="#d85865"/>
      <text x="155" y="435" text-anchor="middle" class="label">BLOCKED</text>
    </g>

    <g transform="translate(390,0)">
      <rect width="730" height="470" rx="30" class="card" filter="url(#shadow)"/>
      <text x="32" y="56" class="h2">REASONING QUALITY · 0–100</text>
      <g transform="translate(34,94)">
        <text x="0" y="20" class="small">FOUNDATIONS</text><rect x="190" y="4" width="450" height="22" rx="11" fill="#1c2a3d"/><rect x="190" y="4" width="390" height="22" rx="11" fill="url(#gold)"/>
        <text x="0" y="70" class="small">EVIDENCE</text><rect x="190" y="54" width="450" height="22" rx="11" fill="#1c2a3d"/><rect x="190" y="54" width="360" height="22" rx="11" fill="url(#cyan)"/>
        <text x="0" y="120" class="small">CAUSALITY</text><rect x="190" y="104" width="450" height="22" rx="11" fill="#1c2a3d"/><rect x="190" y="104" width="335" height="22" rx="11" fill="url(#violet)"/>
        <text x="0" y="170" class="small">MODEL</text><rect x="190" y="154" width="450" height="22" rx="11" fill="#1c2a3d"/><rect x="190" y="154" width="375" height="22" rx="11" fill="url(#cyan)"/>
        <text x="0" y="220" class="small">TRACEABILITY</text><rect x="190" y="204" width="450" height="22" rx="11" fill="#1c2a3d"/><rect x="190" y="204" width="400" height="22" rx="11" fill="url(#mint)"/>
        <text x="0" y="270" class="small">ALTERNATIVES</text><rect x="190" y="254" width="450" height="22" rx="11" fill="#1c2a3d"/><rect x="190" y="254" width="320" height="22" rx="11" fill="url(#violet)"/>
        <text x="0" y="320" class="small">UNCERTAINTY</text><rect x="190" y="304" width="450" height="22" rx="11" fill="#1c2a3d"/><rect x="190" y="304" width="350" height="22" rx="11" fill="url(#gold)"/>
      </g>
      <rect x="498" y="398" width="192" height="42" rx="21" fill="#18322f" stroke="#43cda8"/>
      <text x="594" y="425" text-anchor="middle" class="h3">THRESHOLD 80</text>
    </g>

    <g transform="translate(1200,0)">
      <rect width="310" height="470" rx="30" class="card" filter="url(#shadow)"/>
      <text x="155" y="56" text-anchor="middle" class="h2">VERDICT</text>
      <circle cx="155" cy="168" r="78" fill="#18322f" stroke="#43cda8" stroke-width="4"/>
      <text x="155" y="164" text-anchor="middle" class="title" font-size="52">86</text>
      <text x="155" y="197" text-anchor="middle" class="small">STANDARD PASS</text>
      <line x1="34" y1="275" x2="276" y2="275" stroke="#38516d"/>
      <text x="34" y="315" class="small">NO RED BLOCKER</text>
      <text x="34" y="350" class="small">ONE STRONG RIVAL</text>
      <text x="34" y="385" class="small">REVIEW TRIGGER SET</text>
      <text x="34" y="426" class="tiny">SCORE IS DIAGNOSTIC</text>
    </g>
  </g>
  <text x="800" y="752" text-anchor="middle" class="h3">The lowest decision-relevant dimension determines the next revision method.</text>

</svg>
