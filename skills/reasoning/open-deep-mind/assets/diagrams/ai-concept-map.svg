  <rect width="100%" height="100%" rx="28" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="28" fill="url(#grid)"/>
  <text x="70" y="78" class="title">OpenDeepMind — Concept Map</text><text x="70" y="120" class="subtitle">A universal route from philosophical qualification to tested, revisable action.</text><g transform="translate(70,160)"><rect width="1460" height="770" rx="34" class="card" filter="url(#shadow)"/>
