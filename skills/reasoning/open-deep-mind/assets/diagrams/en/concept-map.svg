<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
    <title id="title">The Deep-Reasoning Operating System</title><desc id="desc">Not a pile of methods: a closed loop connecting meaning, evidence, mechanisms, models, creativity, and action.</desc>
    <defs>
      <linearGradient id="concept-en-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset=".55" stop-color="#edf4ff"/><stop offset="1" stop-color="#e9f8f5"/></linearGradient>
      <linearGradient id="concept-en-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1178ff"/><stop offset="1" stop-color="#0b5ed7"/></linearGradient>
      <linearGradient id="concept-en-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#e9891a"/></linearGradient>
      <linearGradient id="concept-en-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7c8ff"/><stop offset="1" stop-color="#6f48cf"/></linearGradient>
      <linearGradient id="concept-en-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b5ffe7"/><stop offset="1" stop-color="#008e73"/></linearGradient>
      <radialGradient id="concept-en-halo"><stop offset="0" stop-color="#1178ff" stop-opacity=".32"/><stop offset="1" stop-color="#1178ff" stop-opacity="0"/></radialGradient>
      <pattern id="concept-en-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8ba7c7" stroke-opacity=".08" stroke-width="1"/></pattern>
      <filter id="concept-en-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="concept-en-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#31557d" flood-opacity=".25"/></filter>
      <marker id="concept-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1178ff"/></marker>
      <clipPath id="concept-en-sceneclip"><rect x="870" y="0" width="730" height="480" rx="28"/></clipPath>
      <linearGradient id="concept-en-fade" x1="0" x2="1"><stop offset="0" stop-color="#f8fbff" stop-opacity="1"/><stop offset=".35" stop-color="#f8fbff" stop-opacity=".55"/><stop offset="1" stop-color="#f8fbff" stop-opacity="0"/></linearGradient>
      
      <style>
        .title{font:700 50px Inter,Segoe UI,Arial,sans-serif;fill:#0c2b59;letter-spacing:-.5px}
        .subtitle{font:400 21px Inter,Segoe UI,Arial,sans-serif;fill:#526b8c}
        .h2{font:700 29px Inter,Segoe UI,Arial,sans-serif;fill:#0c2b59}
        .h3{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#0c2b59}
        .body{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#526b8c}
        .small{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#526b8c}
        .tiny{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#8295ad;letter-spacing:.8px}
        .formula{font:500 18px JetBrains Mono,DejaVu Sans Mono,monospace;fill:#0c2b59}
        .formula2{font:600 21px STIX Two Text,Georgia,serif;fill:#0c2b59}
        .card{fill:#ffffff;fill-opacity:.92;stroke:#b9cbe3;stroke-width:1.2}
        .card2{fill:#f8fbff;fill-opacity:.92;stroke:#b9cbe3;stroke-width:1.1}
