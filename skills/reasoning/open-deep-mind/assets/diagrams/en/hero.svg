<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">OpenDeepMind system overview</title><desc id="desc">An English AI-designed overview of First Philosophy, First Principles, competing models, cross-scale modeling, quality gates, and iterative action.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset=".55" stop-color="#f2f7ff"/><stop offset="1" stop-color="#eef9f6"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e83e6"/><stop offset="1" stop-color="#0c55b5"/></linearGradient><linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd5b6"/><stop offset="1" stop-color="#078d71"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc970"/><stop offset="1" stop-color="#d96b11"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bf9cff"/><stop offset="1" stop-color="#6c3dd4"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#6689b8" stroke-opacity=".04"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#4b6b91" flood-opacity=".18"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2e83e6"/></marker><style>.t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#0c2b59}.title{font-size:50px;font-weight:800}.sub{font-size:21px;font-weight:500;fill:#4f6889}.h2{font-size:25px;font-weight:800}.h3{font-size:18px;font-weight:750}.body{font-size:15px;font-weight:450;fill:#526b8c}.small{font-size:13px;font-weight:500;fill:#526b8c}.tiny{font-size:11px;font-weight:700;fill:#7690ad;letter-spacing:.5px}.formula{font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;font-size:14px;font-weight:600;fill:#183a68}.card{fill:#ffffff;fill-opacity:.94;stroke:#c2d2e6;stroke-width:1.15}.soft{fill:#f7faff;stroke:#ccd9e9;stroke-width:1.05}</style></defs><rect width="1600" height="1080" rx="28" fill="url(#bg)"/><rect width="1600" height="1080" rx="28" fill="url(#grid)"/><g transform="translate(48,46)"><text class="t title" x="0" y="45">OpenDeepMind_skill</text><text class="t h2" x="0" y="86">First Philosophy × First Principles × Systems Thinking × Creative Practice</text><g transform="translate(0,110)"><rect width="126" height="30" rx="15" fill="#4a98e8"/><text class="t tiny" x="63" y="20" text-anchor="middle" fill="#fff">First Philosophy</text><rect x="136" width="126" height="30" rx="15" fill="#37ad91"/><text class="t tiny" x="199" y="20" text-anchor="middle" fill="#fff">First Principles</text><rect x="272" width="126" height="30" rx="15" fill="#3c7abc"/><text class="t tiny" x="335" y="20" text-anchor="middle" fill="#fff">Systems Thinking</text><rect x="408" width="142" height="30" rx="15" fill="#8c62d4"/><text class="t tiny" x="479" y="20" text-anchor="middle" fill="#fff">Scientific Modeling</text><rect x="560" width="126" height="30" rx="15" fill="#d47937"/><text class="t tiny" x="623" y="20" text-anchor="middle" fill="#fff">Creative Design</text><rect x="696" width="124" height="30" rx="15" fill="#7d58cc"/><text class="t tiny" x="758" y="20" text-anchor="middle" fill="#fff">AI Augmentation</text></g><text class="t sub" x="0" y="174">An auditable, falsifiable, and iterative deep-thinking operating system</text><text class="t sub" x="0" y="202">for complex problems and consequential decisions.</text></g><g transform="translate(1110,10)" opacity=".95"><circle cx="345" cy="44" r="16" fill="#e3b85e" opacity=".35"/><path d="M0 188L92 105L153 150L235 58L324 145L410 74L490 188Z" fill="#dfeaf8"/><path d="M0 188L115 132L176 168L265 102L340 165L490 112V212H0Z" fill="#dcefe9"/><path d="M10 202Q140 166 250 194T490 170" fill="none" stroke="#6aa0d2" stroke-width="4" opacity=".45"/><circle cx="298" cy="153" r="8" fill="#28496d"/><path d="M298 162V205M283 178L298 168L314 179M298 205L287 225M298 205L309 225" stroke="#28496d" stroke-width="7" stroke-linecap="round"/></g><g transform="translate(48,245)" filter="url(#shadow)"><rect width="1504" height="176" rx="22" class="card"/><text class="t h2" x="24" y="36">Overview: The Dual-Engine Thinking System</text><g transform="translate(38,57)"><rect width="250" height="92" rx="16" fill="#f7fbff" stroke="#2e83e6"/><text class="t h3" x="125" y="29" text-anchor="middle" fill="#0c55b5">First Philosophy</text><text class="t body" x="125" y="55" text-anchor="middle">Qualify foundations</text><text class="t tiny" x="125" y="78" text-anchor="middle">Φ8 Foundation Audit</text><line x1="256" y1="46" x2="286" y2="46" stroke="#2e83e6" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" width="250" height="92" rx="16" fill="#f6fffb" stroke="#078d71"/><text class="t h3" x="425" y="29" text-anchor="middle" fill="#078d71">First Principles</text><text class="t body" x="425" y="55" text-anchor="middle">Decompose &amp; reconstruct</text><text class="t tiny" x="425" y="78" text-anchor="middle">P9 Reasoning Loop</text><line x1="556" y1="46" x2="586" y2="46" stroke="#2e83e6" stroke-width="3" marker-end="url(#arrow)"/><rect x="600" width="250" height="92" rx="16" fill="#fffaf2" stroke="#d96b11"/><text class="t h3" x="725" y="29" text-anchor="middle" fill="#d96b11">Competing Models</text><text class="t body" x="725" y="55" text-anchor="middle">Maintain alternatives</text><text class="t tiny" x="725" y="78" text-anchor="middle">M₁ … Mₙ</text><line x1="856" y1="46" x2="886" y2="46" stroke="#2e83e6" stroke-width="3" marker-end="url(#arrow)"/><rect x="900" width="250" height="92" rx="16" fill="#fbf8ff" stroke="#6c3dd4"/><text class="t h3" x="1025" y="29" text-anchor="middle" fill="#6c3dd4">Quality Gate</text><text class="t body" x="1025" y="55" text-anchor="middle">Falsify &amp; score</text><text class="t tiny" x="1025" y="78" text-anchor="middle">Blockers + 100 points</text><line x1="1156" y1="46" x2="1186" y2="46" stroke="#2e83e6" stroke-width="3" marker-end="url(#arrow)"/><rect x="1200" width="250" height="92" rx="16" fill="#fff8f6" stroke="#d94444"/><text class="t h3" x="1325" y="29" text-anchor="middle" fill="#d94444">Action &amp; Iteration</text><text class="t body" x="1325" y="55" text-anchor="middle">Create value &amp; learn</text><text class="t tiny" x="1325" y="78" text-anchor="middle">Decide → Observe → Revise</text></g></g><g transform="translate(48,443)"><g filter="url(#shadow)"><rect width="736" height="300" rx="22" class="card"/><text class="t h2" x="24" y="38" fill="#0c55b5">First Philosophy: Φ8 Eight Lenses</text><circle cx="220" cy="175" r="92" fill="#edf5ff"/><circle cx="220" cy="175" r="66" fill="none" stroke="#97b5d9"/><circle cx="220" cy="175" r="38" fill="#fff" stroke="#2e83e6"/><circle cx="220" cy="175" r="15" fill="#28496d"/><g class="t small" text-anchor="middle"><circle cx="220" cy="88" r="18" fill="#4d8fd5"/><text x="220" y="93" fill="#fff">1</text><text x="220" y="70">Problem Framing</text><circle cx="290" cy="113" r="18" fill="#4d8fd5"/><text x="290" y="118" fill="#fff">2</text><text x="365" y="100">Semantic Audit</text><circle cx="318" cy="184" r="18" fill="#4d8fd5"/><text x="318" y="189" fill="#fff">3</text><text x="400" y="189">Ontological Audit</text><circle cx="290" cy="255" r="18" fill="#4d8fd5"/><text x="290" y="260" fill="#fff">4</text><text x="370" y="274">Epistemic Audit</text><circle cx="220" cy="280" r="18" fill="#4d8fd5"/><text x="220" y="285" fill="#fff">5</text><text x="220" y="304">Logic &amp; Explanation</text><circle cx="150" cy="255" r="18" fill="#4d8fd5"/><text x="150" y="260" fill="#fff">6</text><text x="72" y="274">Boundary &amp; Scale</text><circle cx="122" cy="184" r="18" fill="#4d8fd5"/><text x="122" y="189" fill="#fff">7</text><text x="47" y="189">Value &amp; Ethics</text><circle cx="150" cy="113" r="18" fill="#4d8fd5"/><text x="150" y="118" fill="#fff">8</text><text x="72" y="100">Qualification</text></g><rect x="445" y="72" width="260" height="196" rx="16" class="soft"/><text class="t h3" x="575" y="104" text-anchor="middle">Output: Foundation Charter</text><text class="t body" x="468" y="136">• Definitions &amp; ontology</text><text class="t body" x="468" y="164">• Evidence status</text><text class="t body" x="468" y="192">• Causality, boundary &amp; scale</text><text class="t body" x="468" y="220">• Values, duties &amp; blockers</text><text class="t formula" x="468" y="252">FΦ={S,O,E,L,C,B,V,P}</text></g><g transform="translate(768,0)" filter="url(#shadow)"><rect width="736" height="300" rx="22" class="card"/><text class="t h2" x="24" y="38" fill="#078d71">First Principles: P9 Decompose–Reconstruct Loop</text><path d="M215 82 C110 95 95 224 202 250 C304 274 362 185 313 119 C275 69 197 83 179 131 C162 176 208 210 244 186 C272 167 264 126 235 121" fill="none" stroke="#27b99a" stroke-width="5"/><path d="M235 121l-16-3 8 14" fill="none" stroke="#078d71" stroke-width="4"/><g class="t small"><text x="353" y="72">1. Delete / modify / prove the need</text><text x="353" y="95">2. Define outcomes &amp; boundaries</text><text x="353" y="118">3. Expose assumptions</text><text x="353" y="141">4. Decompose dependencies</text><text x="353" y="164">5. Qualify primitive claims</text><text x="353" y="187">6. Build models &amp; constraints</text><text x="353" y="210">7. Construct rival solutions</text><text x="353" y="233">8. Derive, compute &amp; falsify</text><text x="353" y="256">9. Decide, monitor &amp; iterate</text></g><text class="t formula" x="40" y="286">Foundation → Model → Prediction → Test → Action → Revision</text></g></g><g transform="translate(48,765)"><g filter="url(#shadow)"><rect width="470" height="218" rx="20" class="card"/><text class="t h2" x="22" y="36">Claim Ledger: D/O/L/C/A/E/V/U</text><g class="t small"><text x="24" y="70" fill="#1f70c1">D Definition</text><text x="24" y="94">O Observation</text><text x="24" y="118" fill="#078d71">L Law / invariant</text><text x="24" y="142" fill="#c77709">C Constraint</text><text x="164" y="70" fill="#7a44cc">A Assumption</text><text x="164" y="94" fill="#d45d37">E Empirical closure</text><text x="164" y="118" fill="#b38200">V Value / goal</text><text x="164" y="142" fill="#657a91">U Unknown</text></g><rect x="300" y="58" width="144" height="98" rx="12" class="soft"/><g stroke="#8ba7c7"><line x1="300" y1="82" x2="444" y2="82"/><line x1="300" y1="106" x2="444" y2="106"/><line x1="300" y1="130" x2="444" y2="130"/><line x1="336" y1="58" x2="336" y2="156"/><line x1="372" y1="58" x2="372" y2="156"/><line x1="408" y1="58" x2="408" y2="156"/></g><text class="t formula" x="24" y="181">Cᵢ=qₛ·qₑ·qₜ·qᵣ</text><text class="t tiny" x="24" y="204">Unknown ≠ 0　Model output ≠ direct observation</text></g><g transform="translate(492,0)" filter="url(#shadow)"><rect width="520" height="218" rx="20" class="card"/><text class="t h2" x="22" y="34" style="font-size:21px">Cross-Scale Bridge</text><text class="t small" x="22" y="55">Micro → Meso → Macro → System</text><g transform="translate(26,66)" stroke="#2e83e6" fill="none" stroke-width="2"><circle cx="36" cy="34" r="28"/><circle cx="30" cy="28" r="5" fill="#d96b11"/><path d="M8 34h56M36 6v56M16 14l40 40M56 14L16 54"/><line x1="72" y1="34" x2="112" y2="34" marker-end="url(#arrow)"/><circle cx="142" cy="24" r="10"/><circle cx="166" cy="42" r="10"/><circle cx="132" cy="50" r="8"/><line x1="150" y1="28" x2="160" y2="38"/><line x1="138" y1="32" x2="134" y2="42"/><line x1="186" y1="34" x2="226" y2="34" marker-end="url(#arrow)"/><polygon points="256,8 282,22 282,50 256,64 230,50 230,22"/><path d="M230 22l26 14 26-14M256 36v28"/><line x1="292" y1="34" x2="332" y2="34" marker-end="url(#arrow)"/><circle cx="362" cy="36" r="28"/><path d="M334 36h56M362 8v56M342 16q20 20 40 0M342 56q20-20 40 0"/><line x1="398" y1="34" x2="438" y2="34" marker-end="url(#arrow)"/><rect x="448" y="10" width="44" height="52" rx="7"/><path d="M456 52h28M460 44l7-11 7 7 8-18"/></g><g class="t tiny" text-anchor="middle"><text x="62" y="148">Electronic / atomic</text><text x="164" y="148">Molecular / chain</text><text x="256" y="148">Mesoscale</text><text x="362" y="148">Continuum fields</text><text x="470" y="148">System decision</text></g><text class="t formula" x="24" y="183">H Psi=E Psi → m_i r_i''=−grad_i U → dphi/dt=−L dF/dphi → du/dt+div F=S</text><text class="t tiny" x="24" y="205">Every bridge declares mapping, closure, parameter source, uncertainty, validation domain</text></g><g transform="translate(1034,0)" filter="url(#shadow)"><rect width="470" height="218" rx="20" class="card"/><text class="t h2" x="22" y="34" style="font-size:21px">Quality Gate &amp; Red Blockers</text><text class="t tiny" x="22" y="54">Research · Engineering · Strategy · Creative · AI</text><polygon points="112,68 152,90 152,134 112,156 72,134 72,90" fill="#d9ebff" stroke="#2e83e6"/><polygon points="112,80 140,96 140,128 112,144 84,128 84,96" fill="#83b9ea" opacity=".65"/><text class="t tiny" x="112" y="178" text-anchor="middle">12 dimensions / 100 pts</text><g class="t small"><text x="188" y="74" fill="#d94444">✕ Undefined load-bearing term</text><text x="188" y="98" fill="#d94444">✕ Unsupported critical fact</text><text x="188" y="122" fill="#d94444">✕ Correlation presented as cause</text><text x="188" y="146" fill="#d94444">✕ Model output treated as observation</text><text x="188" y="170" fill="#d94444">✕ No rival model or falsifier</text></g><text class="t formula" x="22" y="204">Q=Σwᵢsᵢ−λB, B&gt;0 ⇒ reject delivery</text></g></g><g transform="translate(48,1003)"><rect width="1504" height="52" rx="16" class="soft"/><text class="t h3" x="22" y="32" fill="#c77709">Decision rule:</text><text class="t formula" x="145" y="32">a*=arg minₐ [Cost(a)+Risk(a)−Value(a)]　s.t. g(a)≤0, h(a)=0</text><text class="t small" x="1030" y="32">Transparency &gt; complexity　Evidence &gt; authority　Iteration &gt; perfection</text></g></svg>