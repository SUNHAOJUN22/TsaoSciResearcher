"small">O-09</text><text x="1236" y="580" text-anchor="start" class="small">New calibration fails</text><rect x="78" y="559" width="48" height="28" rx="9" fill="#6f48cf" opacity=".13" stroke="#6f48cf"/><text x="102" y="578" text-anchor="middle" class="tiny">E-11</text><rect x="70" y="600" width="1460" height="54" fill="#1178ff" opacity=".025"/><text x="86" y="634" text-anchor="start" class="small">Safety takes precedence over speed</text><text x="376" y="634" text-anchor="start" class="small">Value charter</text><text x="695.0" y="634" text-anchor="middle" class="small">Global</text><text x="885.0" y="634" text-anchor="middle" class="small">1.00</text><text x="1100.0" y="634" text-anchor="middle" class="small">V-00</text><text x="1236" y="634" text-anchor="start" class="small">Safety charter revoked</text><rect x="78" y="613" width="48" height="28" rx="9" fill="#d7434e" opacity=".13" stroke="#d7434e"/><text x="102" y="632" text-anchor="middle" class="tiny">V-01</text><rect x="145" y="718" width="1310" height="60" rx="20" class="card"/><text x="800" y="756" text-anchor="middle" class="formula2">C_i = q_s × q_e × q_t × q_r    ·    Unknown U != 0    ·    Model output != direct observation</text></svg>