<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
    <title id="title">First Philosophy: The Φ8 Lenses</title><desc id="desc">“First” means foundational priority for the present problem, scale, and purpose—not chronological priority.</desc>
    <defs>
      <linearGradient id="lenses-en-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset=".55" stop-color="#edf4ff"/><stop offset="1" stop-color="#e9f8f5"/></linearGradient>
      <linearGradient id="lenses-en-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1178ff"/><stop offset="1" stop-color="#0b5ed7"/></linearGradient>
      <linearGradient id="lenses-en-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#e9891a"/></linearGradient>
      <linearGradient id="lenses-en-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7c8ff"/><stop offset="1" stop-color="#6f48cf"/></linearGradient>
      <linearGradient id="lenses-en-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b5ffe7"/><stop offset="1" stop-color="#008e73"/></linearGradient>
      <radialGradient id="lenses-en-halo"><stop offset="0" stop-color="#1178ff" stop-opacity=".32"/><stop offset="1" stop-color="#1178ff" stop-opacity="0"/></radialGradient>
      <pattern id="lenses-en-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8ba7c7" stroke-opacity=".08" stroke-width="1"/></pattern>
      <filter id="lenses-en-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="lenses-en-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#31557d" flood-opacity=".25"/></filter>
      <marker id="lenses-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1178ff"/></marker>
      <clipPath id="lenses-en-sceneclip"><rect x="870" y="0" width="730" height="480" rx="28"/></clipPath>
      <linearGradient id="lenses-en-fade" x1="0" x2="1"><stop offset="0" stop-color="#f8fbff" stop-opacity="1"/><stop offset=".35" stop-color="#f8fbff" stop-opacity=".55"/><stop offset="1" stop-color="#f8fbff" stop-opacity="0"/></linearGradient>
      
      <style>
        .title{font:700 50px Inter,Segoe UI,Arial,sans-serif;fill:#0c2b59;letter-spacing:-.5px}
        .subtitle{font:400 21px Inter,Segoe UI,Arial,sans-serif;fill:#526b8c}
        .h2{font:700 29px Inter,Segoe UI,Arial,sans-serif;fill:#0c2b59}
        .h3{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#0c2b59}
        .body{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#526b8c}
        .small{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#526b8c}
        .tiny{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#8295ad;letter-spacing:.8px}
        .formula{font:500 18px JetBrains Mono,DejaVu Sans Mono,monospace;fill:#0c2b59}
        .formula2{font:600 21px STIX Two Text,Georgia,serif;fill:#0c2b59}
        .card{fill:#ffffff;fill-opacity:.92;stroke:#b9cbe3;stroke-width:1.2}
        .card2{fill:#f8fbff;fill-opacity:.92;stroke:#b9cbe3;stroke-width:1.1}
      </style>
    </defs>
    <rect width="1600" height="820" rx="30" fill="url(#lenses-en-bg)"/>
    <rect width="1600" height="820" rx="30" fill="url(#lenses-en-grid)"/>
    
    <circle cx="1320" cy="120" r="330" fill="url(#lenses-en-halo)"/>
    <circle cx="210" cy="760" r="330" fill="url(#lenses-en-halo)" opacity=".35"/>
    <text x="84" y="62" class="tiny">ENGINE Φ · FOUNDATION QUALIFICATION</text><text x="84" y="118" class="title">First Philosophy: The Φ8 Lenses</text>
    <text x="84" y="158" class="subtitle">“First” means foundational priority for the present problem, scale, and purpose—not chronological priority.</text><circle cx="600" cy="500" r="190" fill="none" stroke="#1178ff" stroke-width="2" opacity="0.18"/><circle cx="600" cy="500" r="145" fill="none" stroke="#1178ff" stroke-width="2" opacity="0.25"/><circle cx="600" cy="500" r="95" fill="none" stroke="#1178ff" stroke-width="2" opacity="0.34"/><circle cx="600" cy="500" r="72" fill="url(#lenses-en-violet)" opacity=".12" stroke="#6f48cf" stroke-width="2"/><path d="M558.4,500 Q600,470.1 641.6,500 Q600,529.9 558.4,500Z" fill="none" stroke="#1178ff" stroke-width="4"/><circle cx="600" cy="500" r="10.92" fill="#e9891a"/><circle cx="600" cy="500" r="3.9" fill="#f8fbff"/><line x1="600.0" y1="310.0" x2="600.0" y2="275.0" stroke="#1178ff" stroke-width="2" opacity=".75"/><circle cx="600.0" cy="245.0" r="42" fill="#ffffff" stroke="#1178ff" stroke-width="2.5"/><text x="600.0" y="240.0" text-anchor="middle" style="font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#1178ff">1</text><text x="658.0" y="253.0" text-anchor="start" class="h3">Problem Reframing</text><line x1="734.4" y1="365.6" x2="759.1" y2="340.9" stroke="#008e73" stroke-width="2" opacity=".75"/><circle cx="780.3" cy="319.7" r="42" fill="#ffffff" stroke="#008e73" stroke-width="2.5"/><text x="780.3" y="314.7" text-anchor="middle" style="font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#008e73">2</text><text x="838.3" y="327.7" text-anchor="start" class="h3">Semantic Audit</text><line x1="790.0" y1="500.0" x2="825.0" y2="500.0" stroke="#e9891a" stroke-width="2" opacity=".75"/><circle cx="855.0" cy="500.0" r="42" fill="#ffffff" stroke="#e9891a" stroke-width="2.5"/><text x="855.0" y="495.0" text-anchor="middle" style="font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#e9891a">3</text><text x="913.0" y="508.0" text-anchor="start" class="h3">Ontological Audit</text><line x1="734.4" y1="634.4" x2="759.1" y2="659.1" stroke="#6f48cf" stroke-width="2" opacity=".75"/><circle cx="780.3" cy="680.3" r="42" fill="#ffffff" stroke="#6f48cf" stroke-width="2.5"/><text x="780.3" y="675.3" text-anchor="middle" style="font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#6f48cf">4</text><text x="838.3" y="688.3" text-anchor="start" class="h3">Epistemic Audit</text><line x1="600.0" y1="690.0" x2="600.0" y2="725.0" stroke="#d7434e" stroke-width="2" opacity=".75"/><circle cx="600.0" cy="755.0" r="42" fill="#ffffff" stroke="#d7434e" stroke-width="2.5"/><text x="600.0" y="750.0" text-anchor="middle" style="font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#d7434e">5</text><text x="658.0" y="763.0" text-anchor="start" class="h3">Logic &amp; Explanation</text><line x1="465.6" y1="634.4" x2="440.9" y2="659.1" stroke="#0b5ed7" stroke-width="2" opacity=".75"/><circle cx="419.7" cy="680.3" r="42" fill="#ffffff" stroke="#0b5ed7" stroke-width="2.5"/><text x="419.7" y="675.3" text-anchor="middle" style="font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#0b5ed7">6</text><text x="361.7" y="688.3" text-anchor="end" class="h3">Boundary &amp; Scale</text><line x1="410.0" y1="500.0" x2="375.0" y2="500.0" stroke="#1178ff" stroke-width="2" opacity=".75"/><circle cx="345.0" cy="500.0" r="42" fill="#ffffff" stroke="#1178ff" stroke-width="2.5"/><text x="345.0" y="495.0" text-anchor="middle" style="font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#1178ff">7</text><text x="287.0" y="508.0" text-anchor="end" class="h3">Value &amp; Ethics</text><line x1="465.6" y1="365.6" x2="440.9" y2="340.9" stroke="#008e73" stroke-width="2" opacity=".75"/><circle cx="419.7" cy="319.7" r="42" fill="#ffffff" stroke="#008e73" stroke-width="2.5"/><text x="419.7" y="314.7" text-anchor="middle" style="font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#008e73">8</text><text x="361.7" y="327.7" text-anchor="end" class="h3">Foundation Qualification</text><rect x="1020" y="240" width="490" height="430" rx="28" class="card"/><text x="1265" y="292" text-anchor="middle" class="h2">Foundation Charter</text><rect x="1080" y="325" width="370" height="64" rx="18" fill="#6f48cf" opacity=".10" stroke="#6f48cf"/><text x="1265" y="365" text-anchor="middle" class="formula2">Φ(x) = [S, O, E, L, B, V, P, F]</text><rect x="1080" y="430" width="370" height="54" rx="16" fill="#008e73" opacity=".12" stroke="#008e73"/><circle cx="1112" cy="457" r="10" fill="#008e73"/><text x="1140" y="464" class="h3">Accepted Foundation</text><rect x="1080" y="502" width="370" height="54" rx="16" fill="#e9891a" opacity=".12" stroke="#e9891a"/><circle cx="1112" cy="529" r="10" fill="#e9891a"/><text x="1140" y="536" class="h3">Conditional Foundation</text><rect x="1080" y="574" width="370" height="54" rx="16" fill="#d7434e" opacity=".12" stroke="#d7434e"/><circle cx="1112" cy="601" r="10" fill="#d7434e"/><text x="1140" y="608" class="h3">Blocking Unknown</text><text x="1265" y="645" text-anchor="middle" class="small">Meaning → Being → Knowing → Reasoning → Responsibility</text></svg>