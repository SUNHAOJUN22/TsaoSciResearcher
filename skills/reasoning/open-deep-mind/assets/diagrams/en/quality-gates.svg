<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
    <title id="title">Quality Gate: Red Blockers + 12-Dimension Reasoning Score</title><desc id="desc">No aggregate score may conceal a foundational failure. Any red blocker stops delivery.</desc>
    <defs>
      <linearGradient id="quality-en-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset=".55" stop-color="#edf4ff"/><stop offset="1" stop-color="#e9f8f5"/></linearGradient>
      <linearGradient id="quality-en-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1178ff"/><stop offset="1" stop-color="#0b5ed7"/></linearGradient>
      <linearGradient id="quality-en-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#e9891a"/></linearGradient>
      <linearGradient id="quality-en-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7c8ff"/><stop offset="1" stop-color="#6f48cf"/></linearGradient>
      <linearGradient id="quality-en-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b5ffe7"/><stop offset="1" stop-color="#008e73"/></linearGradient>
      <radialGradient id="quality-en-halo"><stop offset="0" stop-color="#1178ff" stop-opacity=".32"/><stop offset="1" stop-color="#1178ff" stop-opacity="0"/></radialGradient>
      <pattern id="quality-en-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8ba7c7" stroke-opacity=".08" stroke-width="1"/></pattern>
      <filter id="quality-en-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="quality-en-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#31557d" flood-opacity=".25"/></filter>
      <marker id="quality-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1178ff"/></marker>
      <clipPath id="quality-en-sceneclip"><rect x="870" y="0" width="730" height="480" rx="28"/></clipPath>
      <linearGradient id="quality-en-fade" x1="0" x2="1"><stop offset="0" stop-color="#f8fbff" stop-opacity="1"/><stop offset=".35" stop-color="#f8fbff" stop-opacity=".55"/><stop offset="1" stop-color="#f8fbff" stop-opacity="0"/></linearGradient>
      
      <style>
