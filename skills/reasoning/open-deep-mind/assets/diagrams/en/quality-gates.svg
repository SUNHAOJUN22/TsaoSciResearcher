"607.5" stroke="#8ba7c7" stroke-width="1" opacity=".28"/><text x="697.8" y="636.5" text-anchor="start" class="tiny">Causal Explanation</text><line x1="470" y1="500" x2="577.5" y2="686.2" stroke="#8ba7c7" stroke-width="1" opacity=".28"/><text x="601.5" y="732.8" text-anchor="start" class="tiny">Model Completeness</text><line x1="470" y1="500" x2="470.0" y2="715.0" stroke="#8ba7c7" stroke-width="1" opacity=".28"/><text x="470.0" y="768.0" text-anchor="middle" class="tiny">Traceability</text><line x1="470" y1="500" x2="362.5" y2="686.2" stroke="#8ba7c7" stroke-width="1" opacity=".28"/><text x="338.5" y="732.8" text-anchor="end" class="tiny">Alternatives</text><line x1="470" y1="500" x2="283.8" y2="607.5" stroke="#8ba7c7" stroke-width="1" opacity=".28"/><text x="242.2" y="636.5" text-anchor="end" class="tiny">Falsifiability</text><line x1="470" y1="500" x2="255.0" y2="500.0" stroke="#8ba7c7" stroke-width="1" opacity=".28"/><text x="207.0" y="505.0" text-anchor="end" class="tiny">Uncertainty</text><line x1="470" y1="500" x2="283.8" y2="392.5" stroke="#8ba7c7" stroke-width="1" opacity=".28"/><text x="242.2" y="373.5" text-anchor="end" class="tiny">Values &amp; Ethics</text><line x1="470" y1="500" x2="362.5" y2="313.8" stroke="#8ba7c7" stroke-width="1" opacity=".28"/><text x="338.5" y="277.2" text-anchor="end" class="tiny">Actionability</text><polygon points="470.0,302.2 564.6,336.1 626.4,409.7 646.3,500.0 617.1,584.9 551.7,641.5 470.0,695.6 391.5,635.9 309.9,592.5 323.8,500.0 295.0,398.9 382.9,349.2" fill="#1178ff" fill-opacity=".18" stroke="#1178ff" stroke-width="3"/><circle cx="470.0" cy="302.2" r="5" fill="#e9891a"/><circle cx="564.6" cy="336.1" r="5" fill="#e9891a"/><circle cx="626.4" cy="409.7" r="5" fill="#e9891a"/><circle cx="646.3" cy="500.0" r="5" fill="#e9891a"/><circle cx="617.1" cy="584.9" r="5" fill="#e9891a"/><circle cx="551.7" cy="641.5" r="5" fill="#e9891a"/><circle cx="470.0" cy="695.6" r="5" fill="#e9891a"/><circle cx="391.5" cy="635.9" r="5" fill="#e989