<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
    <title id="title">Cross-Scale Bridge: From Fundamental Equations to System Decisions</title><desc id="desc">Every scale transition must state its mapping variables, closures, parameter source, error propagation, and validation evidence.</desc>
    <defs>
      <linearGradient id="scale-en-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset=".55" stop-color="#edf4ff"/><stop offset="1" stop-color="#e9f8f5"/></linearGradient>
      <linearGradient id="scale-en-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1178ff"/><stop offset="1" stop-color="#0b5ed7"/></linearGradient>
      <linearGradient id="scale-en-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#e9891a"/></linearGradient>
      <linearGradient id="scale-en-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7c8ff"/><stop offset="1" stop-color="#6f48cf"/></linearGradient>
      <linearGradient id="scale-en-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b5ffe7"/><stop offset="1" stop-color="#008e73"/></linearGradient>
      <radialGradient id="scale-en-halo"><stop offset="0" stop-color="#1178ff" stop-opacity=".32"/><stop offset="1" stop-color="#1178ff" stop-opacity="0"/></radialGradient>
      <pattern id="scale-en-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8ba7c7" stroke-opacity=".08" stroke-width="1"/></pattern>
      <filter id="scale-en-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="scale-en-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#31557d" flood-opacity=".25"/></filter>
      <marker id="scale-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1178ff"/></marker>
      <clipPath id="scale-en-sceneclip"><rect x="870" y="0" width="730" height="480" rx="28"/></clipPath>
      <linearGradient id="scale-en-fade" x1="0" x2="1"><stop offset="0" stop-color="#f8fbff" stop-opacity="1"/><stop offset=".35" stop-color="#f8fbff" stop-opacity=".55"/><stop offset="1" stop-color="#f8fbff" stop-opacity="0"/></linearGradient>
      
      <style>
        .title{font:700 50px Inter,Segoe UI,Arial,sans-serif;fill:#0c2b59;letter-spacing:-.5px}
        .subtitle{font:400 21px Inter,Segoe UI,Arial,sans-serif;fill:#526b8c}
        .h2{font:700 29px Inter,Segoe UI,Arial,sans-serif;fill:#0c2b59}
        .h3{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#0c2b59}
        .body{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#526b8c}
        .small{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#526b8c}
        .tiny{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#8295ad;letter-spacing:.8px}
        .formula{font:500 18px JetBrains Mono,DejaVu Sans Mono,monospace;fill:#0c2b59}
        .formula2{font:600 21px STIX Two Text,Georgia,serif;fill:#0c2b59}
        .card{fill:#ffffff;fill-opacity:.92;stroke:#b9cbe3;stroke-width:1.2}
        .card2{fill:#f8fbff;fill-opacity:.92;stroke:#b9cbe3;stroke-width:1.1}
      </style>
    </defs>
    <rect width="1600" height="820" rx="30" fill="url(#scale-en-bg)"/>
    <rect width="1600" height="820" rx="30" fill="url(#scale-en-grid)"/>
    
    <circle cx="1320" cy="120" r="330" fill="url(#scale-en-halo)"/>
    <circle cx="210" cy="760" r="330" fill="url(#scale-en-halo)" opacity=".35"/>
    <text x="84" y="62" class="tiny">MICRO → MESO → MACRO → SYSTEM</text><text x="84" y="118" class="title">Cross-Scale Bridge: From Fundamental Equations to System Decisions</text>
    <text x="84" y="158" class="subtitle">Every scale transition must state its mapping variables, closures, parameter source, error propagation, and validation evidence.</text><path d="M80,620 L80,540 L330,540 L330,620Z" fill="#1178ff" fill-opacity=".08" stroke="#1178ff" stroke-width="2"/><circle cx="205" cy="598" r="28" fill="none" stroke="#1178ff" stroke-width="2"/><ellipse cx="205" cy="598" rx="46" ry="15" fill="none" stroke="#1178ff"/><ellipse cx="205" cy="598" rx="15" ry="46" fill="none" stroke="#1178ff" transform="rotate(35 205 598)"/><text x="205" y="652" text-anchor="middle" class="h3">Electronic / Quantum</text><text x="205" y="680" text-anchor="middle" class="small">Quantum mechanics</text><rect x="100" y="694" width="210" height="42" rx="13" fill="#ffffff" stroke="#1178ff"/><text x="205" y="721" text-anchor="middle" class="formula">H Psi = E Psi</text><path d="M330,612 C350,585 360,585 380,530" fill="none" stroke="#1178ff" stroke-width="3" marker-end="url(#scale-en-arrow)"/><path d="M380,620 L380,458 L630,458 L630,620Z" fill="#008e73" fill-opacity=".08" stroke="#008e73" stroke-width="2"/><line x1="505" y1="492" x2="483.4" y2="531.6" stroke="#e9891a" stroke-width="3"/><line x1="483.4" y1="531.6" x2="526.6" y2="531.6" stroke="#e9891a" stroke-width="3"/><line x1="526.6" y1="531.6" x2="505" y2="492" stroke="#e9891a" stroke-width="3"/><circle cx="505" cy="492" r="10" fill="#ffffff" stroke="#e9891a" stroke-width="4"/><circle cx="483.4" cy="531.6" r="10" fill="#ffffff" stroke="#e9891a" stroke-width="4"/><circle cx="526.6" cy="531.6" r="10" fill="#ffffff" stroke="#e9891a" stroke-width="4"/><text x="505" y="570" text-anchor="middle" class="h3">Molecular / Chain</text><text x="505" y="598" text-anchor="middle" class="small">Molecular dynamics</text><rect x="400" y="612" width="210" height="42" rx="13" fill="#ffffff" stroke="#008e73"/><text x="505" y="639" text-anchor="middle" class="formula">m_i d2r_i/dt2 = -grad_i U</text><path d="M630,530 C650,503 660,503 680,448" fill="none" stroke="#1178ff" stroke-width="3" marker-end="url(#scale-en-arrow)"/><path d="M680,620 L680,376 L930,376 L930,620Z" fill="#e9891a" fill-opacity=".08" stroke="#e9891a" stroke-width="2"/><polygon points="805,406 829.08,420.0 829.08,448.0 805,462 780.92,448.0 780.92,420.0" fill="none" stroke="#008e73" stroke-width="4"/><path d="M805,406V462M780.92,420.0L805,434L829.08,420.0" fill="none" stroke="#008e73" stroke-width="3"/><text x="805" y="488" text-anchor="middle" class="h3">Mesoscale Structure</text><text x="805" y="516" text-anchor="middle" class="small">Phase field / statistics</text><rect x="700" y="530" width="210" height="42" rx="13" fill="#ffffff" stroke="#e9891a"/><text x="805" y="557" text-anchor="middle" class="formula">dphi/dt = -L dF/dphi</text><path d="M930,448 C950,421 960,421 980,366" fill="none" stroke="#1178ff" stroke-width="3" marker-end="url(#scale-en-arrow)"/><path d="M980,620 L980,294 L1230,294 L1230,620Z" fill="#6f48cf" fill-opacity=".08" stroke="#6f48cf" stroke-width="2"/><circle cx="1105" cy="352" r="34" fill="none" stroke="#6f48cf" stroke-width="3"/><path d="M1077,352 C1095,324 1115,380 1133,352M1105,320C1133,342 1077,362 1105,384" fill="none" stroke="#6f48cf" stroke-width="2"/><text x="1105" y="406" text-anchor="middle" class="h3">Continuum Fields</text><text x="1105" y="434" text-anchor="middle" class="small">Conservation laws</text><rect x="1000" y="448" width="210" height="42" rx="13" fill="#ffffff" stroke="#6f48cf"/><text x="1105" y="475" text-anchor="middle" class="formula">d_t u + div F(u) = S</text><path d="M1230,366 C1250,339 1260,339 1280,284" fill="none" stroke="#1178ff" stroke-width="3" marker-end="url(#scale-en-arrow)"/><path d="M1280,620 L1280,212 L1530,212 L1530,620Z" fill="#d7434e" fill-opacity=".08" stroke="#d7434e" stroke-width="2"/><path d="M1367,300V260h24v40m12 0V240h24v60m12 0V220h24v80" fill="none" stroke="#d7434e" stroke-width="5"/><text x="1405" y="324" text-anchor="middle" class="h3">System / Organization</text><text x="1405" y="352" text-anchor="middle" class="small">Optimization &amp; control</text><rect x="1300" y="366" width="210" height="42" rx="13" fill="#ffffff" stroke="#d7434e"/><text x="1405" y="393" text-anchor="middle" class="formula">x* = arg min J(x,u)</text><rect x="155" y="724" width="1290" height="56" rx="20" class="card"/><text x="800" y="759" text-anchor="middle" class="formula2">U_total^2 = sum(U_model,k^2) + sum(U_bridge,k^2) + U_measurement^2</text></svg>