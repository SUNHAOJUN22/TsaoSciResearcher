<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
    <title id="title">Dual Engine: Foundation Qualification × Decompose–Reconstruct</title><desc id="desc">First decide what may count as a foundation; then build upward and actively search for counterevidence.</desc>
    <defs>
      <linearGradient id="dual-en-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset=".55" stop-color="#edf4ff"/><stop offset="1" stop-color="#e9f8f5"/></linearGradient>
      <linearGradient id="dual-en-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1178ff"/><stop offset="1" stop-color="#0b5ed7"/></linearGradient>
      <linearGradient id="dual-en-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#e9891a"/></linearGradient>
      <linearGradient id="dual-en-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7c8ff"/><stop offset="1" stop-color="#6f48cf"/></linearGradient>
      <linearGradient id="dual-en-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b5ffe7"/><stop offset="1" stop-color="#008e73"/></linearGradient>
      <radialGradient id="dual-en-halo"><stop offset="0" stop-color="#1178ff" stop-opacity=".32"/><stop offset="1" stop-color="#1178ff" stop-opacity="0"/></radialGradient>
      <pattern id="dual-en-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8ba7c7" stroke-opacity=".08" stroke-width="1"/></pattern>
      <filter id="dual-en-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="dual-en-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#31557d" flood-opacity=".25"/></filter>
      <marker id="dual-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1178ff"/></marker>
      <clipPath id="dual-en-sceneclip"><rect x="870" y="0" width="730" height="480" rx="28"/></clipPath>
      <linearGradient id="dual-en-fade" x1="0" x2="1"><stop offset="0" stop-color="#f8fbff" stop-opacity="1"/><stop offset=".35" stop-color="#f8fbff" stop-opacity=".55"/><stop offset="1" stop-color="#f8fbff" stop-opacity="0"/></linearGradient>
      
      <style>
        .title{font:700 50px Inter,Segoe UI,Arial,sans-serif;fill:#0c2b59;letter-spacing:-.5px}
        .subtitle{font:400 21px Inter,Segoe UI,Arial,sans-serif;fill:#526b8c}
        .h2{font:700 29px Inter,Segoe UI,Arial,sans-serif;fill:#0c2b59}
        .h3{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#0c2b59}
        .body{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#526b8c}
        .small{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#526b8c}
        .tiny{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#8295ad;letter-spacing:.8px}
        .formula{font:500 18px JetBrains Mono,DejaVu Sans Mono,monospace;fill:#0c2b59}
        .formula2{font:600 21px STIX Two Text,Georgia,serif;fill:#0c2b59}
        .card{fill:#ffffff;fill-opacity:.92;stroke:#b9cbe3;stroke-width:1.2}
        .card2{fill:#f8fbff;fill-opacity:.92;stroke:#b9cbe3;stroke-width:1.1}
      </style>
    </defs>
    <rect width="1600" height="820" rx="30" fill="url(#dual-en-bg)"/>
    <rect width="1600" height="820" rx="30" fill="url(#dual-en-grid)"/>
    
    <circle cx="1320" cy="120" r="330" fill="url(#dual-en-halo)"/>
    <circle cx="210" cy="760" r="330" fill="url(#dual-en-halo)" opacity=".35"/>
    <text x="84" y="62" class="tiny">Φ × P · DUAL ENGINE</text><text x="84" y="118" class="title">Dual Engine: Foundation Qualification × Decompose–Reconstruct</text>
    <text x="84" y="158" class="subtitle">First decide what may count as a foundation; then build upward and actively search for counterevidence.</text><rect x="90" y="220" width="660" height="460" rx="28" class="card" filter="url(#dual-en-shadow)"/><text x="420" y="270" text-anchor="middle" class="h2">ENGINE Φ · FIRST PHILOSOPHY</text><circle cx="420" cy="450" r="126" fill="none" stroke="#e9891a" stroke-width="2" opacity=".45"/><circle cx="420" cy="450" r="92" fill="url(#dual-en-gold)" opacity=".09" stroke="#e9891a" stroke-width="3"/><circle cx="420" cy="450" r="42" fill="#e9891a" opacity=".18" filter="url(#dual-en-glow)"/><text x="420" y="463" text-anchor="middle" style="font:800 34px Inter,Segoe UI,Arial,sans-serif;fill:#e9891a">Φ</text><circle cx="420.0" cy="295.0" r="28" fill="#f8fbff" stroke="#e9891a" stroke-width="2"/><text x="420.0" y="300.0" text-anchor="middle" class="tiny">Semantics</text><circle cx="529.6" cy="340.4" r="28" fill="#f8fbff" stroke="#e9891a" stroke-width="2"/><text x="529.6" y="345.4" text-anchor="middle" class="tiny">Ontology</text><circle cx="575.0" cy="450.0" r="28" fill="#f8fbff" stroke="#e9891a" stroke-width="2"/><text x="575.0" y="455.0" text-anchor="middle" class="tiny">Epistemology</text><circle cx="529.6" cy="559.6" r="28" fill="#f8fbff" stroke="#e9891a" stroke-width="2"/><text x="529.6" y="564.6" text-anchor="middle" class="tiny">Logic</text><circle cx="420.0" cy="605.0" r="28" fill="#f8fbff" stroke="#e9891a" stroke-width="2"/><text x="420.0" y="610.0" text-anchor="middle" class="tiny">Scale</text><circle cx="310.4" cy="559.6" r="28" fill="#f8fbff" stroke="#e9891a" stroke-width="2"/><text x="310.4" y="564.6" text-anchor="middle" class="tiny">Value</text><circle cx="265.0" cy="450.0" r="28" fill="#f8fbff" stroke="#e9891a" stroke-width="2"/><text x="265.0" y="455.0" text-anchor="middle" class="tiny">Ethics</text><circle cx="310.4" cy="340.4" r="28" fill="#f8fbff" stroke="#e9891a" stroke-width="2"/><text x="310.4" y="345.4" text-anchor="middle" class="tiny">Praxis</text><rect x="162" y="620" width="516" height="42" rx="15" fill="#e9891a" opacity=".09" stroke="#e9891a"/><text x="420" y="647" text-anchor="middle" class="formula">Charter = {Meaning, Being, Knowing, Logic, Scale, Value}</text><rect x="850" y="220" width="660" height="460" rx="28" class="card" filter="url(#dual-en-shadow)"/><text x="1180" y="270" text-anchor="middle" class="h2">ENGINE P · FIRST PRINCIPLES</text><circle cx="1180" cy="450" r="126" fill="none" stroke="#1178ff" stroke-width="2" opacity=".45"/><circle cx="1180" cy="450" r="92" fill="url(#dual-en-cyan)" opacity=".09" stroke="#1178ff" stroke-width="3"/><circle cx="1180" cy="450" r="42" fill="#1178ff" opacity=".18" filter="url(#dual-en-glow)"/><text x="1180" y="463" text-anchor="middle" style="font:800 34px Inter,Segoe UI,Arial,sans-serif;fill:#1178ff">P</text><circle cx="1180.0" cy="295.0" r="28" fill="#f8fbff" stroke="#1178ff" stroke-width="2"/><text x="1180.0" y="300.0" text-anchor="middle" class="tiny">Delete</text><circle cx="1279.6" cy="331.3" r="28" fill="#f8fbff" stroke="#1178ff" stroke-width="2"/><text x="1279.6" y="336.3" text-anchor="middle" class="tiny">Boundary</text><circle cx="1332.6" cy="423.1" r="28" fill="#f8fbff" stroke="#1178ff" stroke-width="2"/><text x="1332.6" y="428.1" text-anchor="middle" class="tiny">Assumptions</text><circle cx="1314.2" cy="527.5" r="28" fill="#f8fbff" stroke="#1178ff" stroke-width="2"/><text x="1314.2" y="532.5" text-anchor="middle" class="tiny">Decompose</text><circle cx="1233.0" cy="595.7" r="28" fill="#f8fbff" stroke="#1178ff" stroke-width="2"/><text x="1233.0" y="600.7" text-anchor="middle" class="tiny">Primitives</text><circle cx="1127.0" cy="595.7" r="28" fill="#f8fbff" stroke="#1178ff" stroke-width="2"/><text x="1127.0" y="600.7" text-anchor="middle" class="tiny">Model</text><circle cx="1045.8" cy="527.5" r="28" fill="#f8fbff" stroke="#1178ff" stroke-width="2"/><text x="1045.8" y="532.5" text-anchor="middle" class="tiny">Compete</text><circle cx="1027.4" cy="423.1" r="28" fill="#f8fbff" stroke="#1178ff" stroke-width="2"/><text x="1027.4" y="428.1" text-anchor="middle" class="tiny">Falsify</text><circle cx="1080.4" cy="331.3" r="28" fill="#f8fbff" stroke="#1178ff" stroke-width="2"/><text x="1080.4" y="336.3" text-anchor="middle" class="tiny">Iterate</text><rect x="922" y="620" width="516" height="42" rx="15" fill="#1178ff" opacity=".09" stroke="#1178ff"/><text x="1180" y="647" text-anchor="middle" class="formula">Model Set ℳ = {M₁, M₂, …, Mₙ}; choose by evidence &amp; falsification</text><path d="M750 398 C790 350 810 350 850 398" fill="none" stroke="#1178ff" stroke-width="4" marker-end="url(#dual-en-arrow)"/><path d="M850 540 C810 590 790 590 750 540" fill="none" stroke="#e9891a" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#dual-en-arrow)"/><rect x="290" y="716" width="1020" height="58" rx="20" class="card"/><text x="800" y="751" text-anchor="middle" class="small">New evidence, failures, and counterexamples return to the foundation layer and revise concepts, boundaries, and values.</text></svg>