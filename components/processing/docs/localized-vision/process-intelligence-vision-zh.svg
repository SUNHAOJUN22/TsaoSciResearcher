<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">TSAO Process Intelligence OS 中文项目愿景图</title>
<desc id="desc">从证据参数、动力学衡算、群体矩结构、可辨识性不确定度到规范发布的中文概念设计图。</desc>
<defs>
