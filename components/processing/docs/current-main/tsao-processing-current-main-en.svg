  <path d="M 319 336 H 348" stroke="#5eead4" stroke-width="5" marker-end="url(#arrow)"/><path d="M 629 336 H 658" stroke="#5eead4" stroke-width="5" marker-end="url(#arrow)"/><path d="M 939 336 H 968" stroke="#5eead4" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1249 336 H 1278" stroke="#5eead4" stroke-width="5" marker-end="url(#arrow)"/><g><rect x="44" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#34d399" stroke-width="2"/><text x="68" y="280" class="stage">Process package</text><text x="68" y="324" class="detail">Schema, units and evidence lineage</text><text x="68" y="394" class="index">01</text></g><g><rect x="354" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#34d399" stroke-width="2"/><text x="378" y="280" class="stage">Kinetic network</text><text x="378" y="324" class="detail">Elementary steps, chain moments, states</text><text x="378" y="394" class="index">02</text></g><g><rect x="664" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#34d399" stroke-width="2"/><text x="688" y="280" class="stage">Numerical integration</text><text x="688" y="324" class="detail">DOPRI5, events and conservation</text><text x="688" y="394" class="index">03</text></g><g><rect x="974" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#34d399" stroke-width="2"/><text x="998" y="280" class="stage">Identification and UQ</text><text x="998" y="324" class="detail">Fisher, sensitivity, applicability</text><text x="998" y="394" class="index">04</text></g><g><rect x="1284" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#34d399" stroke-width="2"/><text x="1308" y="280" class="stage">Canonical publication</text><text x="1308" y="324" class="detail">Wheel, source snapshot, authority</text><text x="1308" y="394" class="index">05</text></g><g><rect x="44" y="522" width="465" height="128" rx="22" fill="#071b25" stroke="#a78bfa" stroke-width="2"/><text x="66" y="575" class="formula">dN/dt = F_in z − F_out x + V νᵀ r</text><text x="66" y="619" class="micro">CODE CONTRACT 01</text></g><g><rect x="549" y="522" width="465" height="128" rx="22" fill="#071b25" stroke="#a78bfa" stroke-width="2"/><text x="571" y="575" class="formula">e = ‖y₅ − y₄‖ / (atol + rtol max(‖yₙ‖, ‖y₅‖))</text><text x="571" y="619" class="micro">CODE CONTRACT 02</text></g><g><rect x="1054" y="522" width="465" height="128" rx="22" fill="#071b25" stroke="#a78bfa" stroke-width="2"/><text x="1076" y="575" class="formula">I(θ) = J(θ)ᵀ W J(θ)</text><text x="1076" y="619" class="micro">CODE CONTRACT 03</text></g>
