<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" focusable="false" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" data-design-system="scientific-midnight-bento" data-design-version="2"><title id="title">Layered process-package architecture</title><desc id="desc">A layered scientific and engineering architecture with explicit evidence and approval boundaries.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111F"/>
    <stop offset="0.55" stop-color="#0B1729"/>
    <stop offset="1" stop-color="#07111F"/>
  </linearGradient>
  <radialGradient id="glowBlue" cx="0.1" cy="0.05" r="0.8">
    <stop offset="0" stop-color="#4F7CFF" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4F7CFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowCyan" cx="0.9" cy="0.8" r="0.65">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#18304C" stroke-width="1" opacity="0.32"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,8 L9,4 z" fill="#6F8299"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,8 L9,4 z" fill="#4F7CFF"/>
  </marker>
  <style>
    .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
  </style>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/><rect width="1200" height="720" fill="url(#grid)"/><rect width="1200" height="720" fill="url(#glowBlue)"/><rect width="1200" height="720" fill="url(#glowCyan)"/><rect x="52" y="38" width="164.8" height="30" rx="15" fill="#4F7CFF18" stroke="#4F7CFF88" stroke-width="1" opacity="1.0"/><text class="mono" x="134.4" y="58.0" fill="#4F7CFF" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">SYSTEM ARCHITECTURE</text><text class="sans" x="52" y="105" fill="#F8FAFC" font-size="34" font-weight="800" text-anchor="start" opacity="1.0" letter-spacing="0">Layered process-package architecture</text><text class="sans" x="52" y="138" fill="#A8B5C7" font-size="15" font-weight="500" text-anchor="start" opacity="1.0" letter-spacing="0">Every decision layer is supported by governed models, data and approvals</text><line x1="52" y1="164" x2="1148" y2="164" stroke="#263A55" stroke-width="1" stroke-linecap="round" opacity="1.0"/><rect x="80.0" y="210" width="1040" height="90" rx="18" fill="#101E33" stroke="#4F7CFF77" stroke-width="1.2" opacity="1.0" filter="url(#shadow)"/><rect x="80.0" y="210" width="7" height="90" rx="3" fill="#4F7CFF" stroke="#4F7CFF" stroke-width="1.2" opacity="1.0"/><text class="sans" x="110.0" y="248" fill="#F8FAFC" font-size="20" font-weight="780" text-anchor="start" opacity="1.0" letter-spacing="0">Decision &amp; acceptance</text><text class="mono" x="110.0" y="275" fill="#A8B5C7" font-size="13" font-weight="500" text-anchor="start" opacity="1.0" letter-spacing="0">targets · CQAs · trade-offs · Gate state · named approval</text><line x1="600" y1="300" x2="600" y2="325" stroke="#6F8299" stroke-width="2" stroke-linecap="round" opacity="1.0" marker-end="url(#arrow)"/><rect x="110.0" y="320" width="980" height="90" rx="18" fill="#101E33" stroke="#22D3EE77" stroke-width="1.2" opacity="1.0" filter="url(#shadow)"/><rect x="110.0" y="320" width="7" height="90" rx="3" fill="#22D3EE" stroke="#22D3EE" stroke-width="1.2" opacity="1.0"/><text class="sans" x="140.0" y="358" fill="#F8FAFC" font-size="20" font-weight="780" text-anchor="start" opacity="1.0" letter-spacing="0">Process &amp; equipment</text><text class="mono" x="140.0" y="385" fill="#A8B5C7" font-size="13" font-weight="500" text-anchor="start" opacity="1.0" letter-spacing="0">streams · balances · reactors · separation · utilities · controls</text><line x1="600" y1="410" x2="600" y2="435" stroke="#6F8299" stroke-width="2" stroke-linecap="round" opacity="1.0" marker-end="url(#arrow)"/><rect x="140.0" y="430" width="920" height="90" rx="18" fill="#101E33" stroke="#A78BFA77" stroke-width="1.2" opacity="1.0" filter="url(#shadow)"/><rect x="140.0" y="430" width="7" height="90" rx="3" fill="#A78BFA" stroke="#A78BFA" stroke-width="1.2" opacity="1.0"/><text class="sans" x="170.0" y="468" fill="#F8FAFC" font-size="20" font-weight="780" text-anchor="start" opacity="1.0" letter-spacing="0">Models &amp; computation</text><text class="mono" x="170.0" y="495" fill="#A8B5C7" font-size="13" font-weight="500" text-anchor="start" opacity="1.0" letter-spacing="0">kinetics · thermo · transport · estimation · uncertainty · simulation</text><line x1="600" y1="520" x2="600" y2="545" stroke="#6F8299" stroke-width="2" stroke-linecap="round" opacity="1.0" marker-end="url(#arrow)"/><rect x="170.0" y="540" width="860" height="90" rx="18" fill="#101E33" stroke="#34D39977" stroke-width="1.2" opacity="1.0" filter="url(#shadow)"/><rect x="170.0" y="540" width="7" height="90" rx="3" fill="#34D399" stroke="#34D399" stroke-width="1.2" opacity="1.0"/><text class="sans" x="200.0" y="578" fill="#F8FAFC" font-size="20" font-weight="780" text-anchor="start" opacity="1.0" letter-spacing="0">Evidence &amp; identity</text><text class="mono" x="200.0" y="605" fill="#A8B5C7" font-size="13" font-weight="500" text-anchor="start" opacity="1.0" letter-spacing="0">sources · assumptions · conflicts · manifests · provenance · audit trail</text><rect x="52" y="656" width="1096" height="38" rx="12" fill="#0A1627" stroke="#263A55" stroke-width="1.2" opacity="1.0"/><text class="mono" x="76" y="681" fill="#A8B5C7" font-size="12" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0.6">SOFTWARE EVIDENCE ≠ ENGINEERING APPROVAL</text><rect x="1010" y="661" width="107.2" height="28" rx="14" fill="#FBBF2418" stroke="#FBBF2488" stroke-width="1" opacity="1.0"/><text class="mono" x="1063.6" y="680.0" fill="#FBBF24" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">FAIL-CLOSED</text></svg>
