<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" focusable="false" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" data-design-system="scientific-midnight-bento" data-design-version="2">
<title id="title">Software acceptance readiness map</title>
<desc id="desc">Separation of verified software evidence from external approvals.</desc>
<rect width="1200" height="720" fill="#07111F"/>
<style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"JetBrains Mono",Consolas,monospace}</style>
<text x="52" y="72" font-size="30" font-weight="850" fill="#F8FAFC" text-anchor="start">SOFTWARE ACCEPTANCE READINESS</text>
<text x="52" y="108" font-size="15" font-weight="600" fill="#A8B5C7" text-anchor="start">Software delivery can pass while external approval remains NOT_EVALUATED</text>
<rect x="52" y="190" width="300" height="120" rx="18" fill="#101E33" stroke="#4F7CFF" stroke-width="2"/>
<text class="mono" x="74" y="224" font-size="15" font-weight="800" fill="#4F7CFF" text-anchor="start">SOURCE IDENTITY</text>
<text x="74" y="256" font-size="13" font-weight="500" fill="#A8B5C7" text-anchor="start">manifest / overlay</text>
<text x="74" y="279" font-size="13" font-weight="500" fill="#A8B5C7" text-anchor="start">SHA256 / byte count</text>
<rect x="52" y="350" width="300" height="120" rx="18" fill="#101E33" stroke="#22D3EE" stroke-width="2"/>
<text class="mono" x="74" y="384" font-size="15" font-weight="800" fill="#22D3EE" text-anchor="start">SOFTWARE GATES</text>
<text x="74" y="416" font-size="13" font-weight="500" fill="#A8B5C7" text-anchor="start">tests / coverage / Ruff</text>
<text x="74" y="439" font-size="13" font-weight="500" fill="#A8B5C7" text-anchor="start">Doctor / Wheel / CI</text>
<rect x="848" y="190" width="300" height="120" rx="18" fill="#101E33" stroke="#A78BFA" stroke-width="2"/>
<text class="mono" x="870" y="224" font-size="15" font-weight="800" fill="#A78BFA" text-anchor="start">SCIENTIFIC</text>
<text x="870" y="256" font-size="13" font-weight="500" fill="#A8B5C7" text-anchor="start">parameters / evidence</text>
<text x="870" y="279" font-size="13" font-weight="500" fill="#A8B5C7" text-anchor="start">applicability / uncertainty</text>
<rect x="848" y="350" width="300" height="120" rx="18" fill="#101E33" stroke="#FB7185" stroke-width="2"/>
<text class="mono" x="870" y="384" font-size="15" font-weight="800" fill="#FB7185" text-anchor="start">ENGINEERING / HSE</text>
<text x="870" y="416" font-size="13" font-weight="500" fill="#A8B5C7" text-anchor="start">equipment / relief</text>
<text x="870" y="439" font-size="13" font-weight="500" fill="#A8B5C7" text-anchor="start">HAZOP / LOPA / authority</text>
<rect x="430" y="210" width="340" height="260" rx="28" fill="#101E33" stroke="#34D399" stroke-width="3"/>
<text class="mono" x="600" y="275" font-size="17" font-weight="850" fill="#34D399" text-anchor="middle">SOFTWARE DELIVERY</text>
<text x="600" y="350" font-size="56" font-weight="900" fill="#34D399" text-anchor="middle">PASS</text>
<text class="mono" x="600" y="405" font-size="16" font-weight="800" fill="#FBBF24" text-anchor="middle">EXTERNAL: NOT_EVALUATED</text>
<rect x="52" y="650" width="1096" height="42" rx="12" fill="#101E33" stroke="#263A55"/>
<text class="mono" x="76" y="677" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="start">GREEN CI QUALIFIES SOFTWARE - NOT PLANT OR CUSTOMER PERFORMANCE</text>
</svg>
