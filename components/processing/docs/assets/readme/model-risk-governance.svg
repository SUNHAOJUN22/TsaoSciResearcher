ndencies</text><rect x="165.0" y="296" width="870" height="64" rx="18" fill="#22D3EE14" stroke="#22D3EE" stroke-width="1.2" opacity="1.0"/><circle cx="203.0" cy="328" r="22" fill="#22D3EE18" stroke="#22D3EEAA" stroke-width="1.2"/><rect x="195.0" y="320" width="16" height="16" rx="3" fill="none" stroke="#22D3EE" stroke-width="2" opacity="1.0"/><line x1="193.0" y1="323" x2="193.0" y2="333" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><line x1="198.0" y1="318" x2="208.0" y2="318" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><line x1="213.0" y1="323" x2="213.0" y2="333" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><line x1="198.0" y1="338" x2="208.0" y2="338" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><text class="mono" x="239.0" y="324" fill="#22D3EE" font-size="15" font-weight="850" text-anchor="start" opacity="1.0" letter-spacing="0">VERIFY</text><text class="sans" x="239.0" y="345" fill="#F8FAFC" font-size="13" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">tests, invariants, numerical stability and reproducibility</text><rect x="220.0" y="382" width="760" height="64" rx="18" fill="#A78BFA14" stroke="#A78BFA" stroke-width="1.2" opacity="1.0"/><circle cx="258.0" cy="414" r="22" fill="#A78BFA18" stroke="#A78BFAAA" stroke-width="1.2"/><rect x="248.0" y="416" width="5" height="8" rx="1" fill="#A78BFA" stroke="#A78BFA" stroke-width="1.2" opacity="1.0"/><rect x="256.0" y="410" width="5" height="14" rx="1" fill="#A78BFA" stroke="#A78BFA" stroke-width="1.2" opacity="1.0"/><rect x="264.0" y="404" width="5" height="20" rx="1" fill="#A78BFA" stroke="#A78BFA" stroke-width="1.2" opacity="1.0"/><text class="mono" x="294.0" y="410" fill="#A78BFA" font-size="15" font-weight="850" text-anchor="start" opacity="1.0" letter-spacing="0">VALIDATE</text><text class="sans" x="294.0" y="431" fill="#F8FAFC" font-size="13" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">independent evidence, uncertainty and applicability</text><rect x="275.0" y="468" width="650" height="64" rx="18" fill="#FBBF2414" stroke="#FBBF24" stroke-width="1.2" opacity="1.0"/><circle cx="313.0" cy="500" r="22" fill="#FBBF2418" stroke="#FBBF24AA" stroke-width="1.2"/><path d="M 313.0 489 L 323.0 493 L 321.0 505 Q 313.0 513 305.0 505 L 303.0 493 Z" stroke="#FBBF24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text class="mono" x="349.0" y="496" fill="#FBBF24" font-size="15" font-weight="850" text-anchor="start" opacity="1.0" letter-spacing="0">APPROVE</text><text class="sans" x="349.0" y="517" fill="#F8FAFC" font-size="13" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">named technical, engineering, HSE and customer authorities</text><rect x="330.0" y="554" width="540" height="64" rx="18" fill="#34D39914" stroke="#34D399" stroke-width="1.2" opacity="1.0"/><circle cx="368.0" cy="586" r="22" fill="#34D39918" stroke="#34D399AA" stroke-width="1.2"/><circle cx="360.0" cy="586" r="3.5" fill="#34D399" stroke="#34D399" stroke-width="1.2"/><circle cx="376.0" cy="586" r="3.5" fill="#34D399" stroke="#34D399" stroke-width="1.2"/><line x1="364.0" y1="586" x2="372.0" y2="586" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity="1.0" marker-end="url(#arrow)"/><text class="mono" x="404.0" y="582" fill="#34D399" font-size="15" font-weight="850" text-anchor="start" opacity="1.0" letter-spacing="0">MONITOR</text><text class="sans" x="404.0" y="603" fill="#F8FAFC" font-size="13" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">drift, incidents, change control and retirement</text><rect x="52" y="656" width="1096" height="38" rx="12" fill="#0A1627" stroke="#263A55" stroke-width="1.2" opacity="1.0"/><text class="mono" x="76" y="681" fill="#A8B5C7" font-size="12" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0.6">MODEL 