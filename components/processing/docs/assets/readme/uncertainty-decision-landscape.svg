<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" focusable="false" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" data-design-system="scientific-midnight-bento" data-design-version="2"><title id="title">Uncertainty-to-decision landscape</title><desc id="desc">A qualification landscape where uncertainty and applicability determine PASS, HOLD, FAIL or NOT_EVALUATED.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111F"/>
    <stop offset="0.55" stop-color="#0B1729"/>
    <stop offset="1" stop-color="#07111F"/>
  </linearGradient>
  <radialGradient id="glowBlue" cx="0.1" cy="0.05" r="0.8">
    <stop offset="0" stop-color="#4F7CFF" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4F7CFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowCyan" cx="0.9" cy="0.8" r="0.65">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#18304C" stroke-width="1" opacity="0.32"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,8 L9,4 z" fill="#6F8299"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,8 L9,4 z" fill="#4F7CFF"/>
  </marker>
  <style>
    .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
  </style>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/><rect width="1200" height="720" fill="url(#grid)"/><rect width="1200" height="720" fill="url(#glowBlue)"/><rect width="1200" height="720" fill="url(#glowCyan)"/><rect x="52" y="38" width="143.2" height="30" rx="15" fill="#FBBF2418" stroke="#FBBF2488" stroke-width="1" opacity="1.0"/><text class="mono" x="123.6" y="58.0" fill="#FBBF24" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">DECISION SCIENCE</text><text class="sans" x="52" y="105" fill="#F8FAFC" font-size="34" font-weight="800" text-anchor="start" opacity="1.0" letter-spacing="0">Uncertainty-to-decision landscape</text><text class="sans" x="52" y="138" fill="#A8B5C7" font-size="15" font-weight="500" text-anchor="start" opacity="1.0" letter-spacing="0">Precision is not confidence; confidence requires independent closure</text><line x1="52" y1="164" x2="1148" y2="164" stroke="#263A55" stroke-width="1" stroke-linecap="round" opacity="1.0"/><rect x="72" y="226" width="330" height="360" rx="28" fill="#101D31" stroke="#A78BFA" stroke-width="1.2" opacity="1.0" filter="url(#shadow)"/><text class="sans" x="102" y="272" fill="#A78BFA" font-size="18" font-weight="800" text-anchor="start" opacity="1.0" letter-spacing="0">1 - UNCERTAINTY</text><rect x="435" y="226" width="330" height="360" rx="28" fill="#101D31" stroke="#22D3EE" stroke-width="1.2" opacity="1.0" filter="url(#shadow)"/><text class="sans" x="465" y="272" fill="#22D3EE" font-size="18" font-weight="800" text-anchor="start" opacity="1.0" letter-spacing="0">2 - APPLICABILITY</text><rect x="798" y="226" width="330" height="360" rx="28" fill="#101D31" stroke="#34D399" stroke-width="1.2" opacity="1.0" filter="url(#shadow)"/><text class="sans" x="828" y="272" fill="#34D399" font-size="18" font-weight="800" text-anchor="start" opacity="1.0" letter-spacing="0">3 - DECISION GATE</text><rect x="102" y="298" width="116" height="26" rx="13" fill="#A78BFA18" stroke="#A78BFA88" stroke-width="1" opacity="1.0"/><text class="mono" x="160.0" y="316.0" fill="#A78BFA" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">PARAMETER</text><text class="sans" x="232" y="320" fill="#F8FAFC" font-size="13" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">identified / prior / nuisance</text><rect x="102" y="360" width="116" height="26" rx="13" fill="#A78BFA18" stroke="#A78BFA88" stroke-width="1" opacity="1.0"/><text class="mono" x="160.0" y="378.0" fill="#A78BFA" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">MODEL FORM</text><text class="sans" x="232" y="382" fill="#F8FAFC" font-size="13" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">candidate closures and bias</text><rect x="102" y="422" width="116" height="26" rx="13" fill="#A78BFA18" stroke="#A78BFA88" stroke-width="1" opacity="1.0"/><text class="mono" x="160.0" y="440.0" fill="#A78BFA" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">NUMERICAL</text><text class="sans" x="232" y="444" fill="#F8FAFC" font-size="13" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">tolerance, stiffness and drift</text><rect x="102" y="484" width="116" height="26" rx="13" fill="#A78BFA18" stroke="#A78BFA88" stroke-width="1" opacity="1.0"/><text class="mono" x="160.0" y="502.0" fill="#A78BFA" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">MEASUREMENT</text><text class="sans" x="232" y="506" fill="#F8FAFC" font-size="13" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">noise, censoring and calibration</text><rect x="465" y="298" width="104" height="26" rx="13" fill="#22D3EE18" stroke="#22D3EE88" stroke-width="1" opacity="1.0"/><text class="mono" x="517.0" y="316.0" fill="#22D3EE" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">DOMAIN</text><text class="sans" x="583" y="320" fill="#F8FAFC" font-size="13" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">temperature / pressure / composition</text><rect x="465" y="360" width="104" height="26" rx="13" fill="#22D3EE18" stroke="#22D3EE88" stroke-width="1" opacity="1.0"/><text class="mono" x="517.0" y="378.0" fill="#22D3EE" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">SCALE</text><text class="sans" x="583" y="382" fill="#F8FAFC" font-size="13" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">laboratory / pilot / plant</text><rect x="465" y="422" width="104" height="26" rx="13" fill="#22D3EE18" stroke="#22D3EE88" stroke-width="1" opacity="1.0"/><text class="mono" x="517.0" y="440.0" fill="#22D3EE" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">REGIME</text><text class="sans" x="583" y="444" fill="#F8FAFC" font-size="13" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">phase / transport / kinetics</text><rect x="465" y="484" width="104" height="26" rx="13" fill="#22D3EE18" stroke="#22D3EE88" stroke-width="1" opacity="1.0"/><text class="mono" x="517.0" y="502.0" fill="#22D3EE" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">EVIDENCE</text><text class="sans" x="583" y="506" fill="#F8FAFC" font-size="13" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0">direct / inferred / missing</text><rect x="832" y="304" width="264" height="50" rx="14" fill="#34D39918" stroke="#34D399" stroke-width="1.2" opacity="1.0"/><text class="mono" x="850" y="335" fill="#34D399" font-size="13" font-weight="800" text-anchor="start" opacity="1.0" letter-spacing="0">PASS</text><text class="sans" x="1080" y="335" fill="#F8FAFC" font-size="12" font-weight="650" text-anchor="end" opacity="1.0" letter-spacing="0">declared Gate closed</text><rect x="832" y="370" width="264" height="50" rx="14" fill="#FBBF2418" stroke="#FBBF24" stroke-width="1.2" opacity="1.0"/><text class="mono" x="850" y="401" fill="#FBBF24" font-size="13" font-weight="800" text-anchor="start" opacity="1.0" letter-spacing="0">HOLD</text><text class="sans" x="1080" y="401" fill="#F8FAFC" font-size="12" font-weight="650" text-anchor="end" opacity="1.0" letter-spacing="0">evidence incomplete</text><rect x="832" y="436" width="264" height="50" rx="14" fill="#FB718518" stroke="#FB7185" stroke-width="1.2" opacity="1.0"/><text class="mono" x="850" y="467" fill="#FB7185" font-size="13" font-weight="800" text-anchor="start" opacity="1.0" letter-spacing="0">FAIL</text><text class="sans" x="1080" y="467" fill="#F8FAFC" font-size="12" font-weight="650" text-anchor="end" opacity="1.0" letter-spacing="0">contract violated</text><rect x="832" y="502" width="264" height="50" rx="14" fill="#6F829918" stroke="#6F8299" stroke-width="1.2" opacity="1.0"/><text class="mono" x="850" y="533" fill="#6F8299" font-size="13" font-weight="800" text-anchor="start" opacity="1.0" letter-spacing="0">NOT EVALUATED</text><text class="sans" x="1080" y="533" fill="#F8FAFC" font-size="12" font-weight="650" text-anchor="end" opacity="1.0" letter-spacing="0">no qualified claim</text><line x1="402" y1="406" x2="435" y2="406" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" opacity="1.0" marker-end="url(#arrow)"/><line x1="765" y1="406" x2="798" y2="406" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" opacity="1.0" marker-end="url(#arrow)"/><rect x="52" y="656" width="1096" height="38" rx="12" fill="#0A1627" stroke="#263A55" stroke-width="1.2" opacity="1.0"/><text class="mono" x="76" y="681" fill="#A8B5C7" font-size="12" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0.6">TRACEABILITY TURNS UNCERTAINTY INTO AN ACTIONABLE DECISION</text><rect x="1010" y="661" width="107.2" height="28" rx="14" fill="#FBBF2418" stroke="#FBBF2488" stroke-width="1" opacity="1.0"/><text class="mono" x="1063.6" y="680.0" fill="#FBBF24" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">FAIL-CLOSED</text></svg>
