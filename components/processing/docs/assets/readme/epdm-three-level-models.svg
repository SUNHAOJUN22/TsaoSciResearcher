<rect width="1200" height="720" fill="url(#bg)"/><rect width="1200" height="720" fill="url(#grid)"/><rect width="1200" height="720" fill="url(#glowBlue)"/><rect width="1200" height="720" fill="url(#glowCyan)"/><rect x="52" y="38" width="186.4" height="30" rx="15" fill="#4F7CFF18" stroke="#4F7CFF88" stroke-width="1" opacity="1.0"/><text class="mono" x="145.2" y="58.0" fill="#4F7CFF" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">MULTIFIDELITY MODELING</text><text class="sans" x="52" y="105" fill="#F8FAFC" font-size="34" font-weight="800" text-anchor="start" opacity="1.0" letter-spacing="0">Three EPDM model levels</text><text class="sans" x="52" y="138" fill="#A8B5C7" font-size="15" font-weight="500" text-anchor="start" opacity="1.0" letter-spacing="0">Fidelity increases only when the decision and available evidence justify the added complexity</text><line x1="52" y1="164" x2="1148" y2="164" stroke="#263A55" stroke-width="1" stroke-linecap="round" opacity="1.0"/><rect x="70" y="225" width="300" height="330" rx="20" fill="#101E33" stroke="#4F7CFF66" stroke-width="1.2" opacity="1.0" filter="url(#shadow)"/><rect x="70" y="225" width="5" height="330" rx="3" fill="#4F7CFF" stroke="#4F7CFF" stroke-width="1.2" opacity="1.0"/><circle cx="106" cy="263" r="22" fill="#4F7CFF18" stroke="#4F7CFFAA" stroke-width="1.2"/><rect x="96" y="265" width="5" height="8" rx="1" fill="#4F7CFF" stroke="#4F7CFF" stroke-width="1.2" opacity="1.0"/><rect x="104" y="259" width="5" height="14" rx="1" fill="#4F7CFF" stroke="#4F7CFF" stroke-width="1.2" opacity="1.0"/><rect x="112" y="253" width="5" height="20" rx="1" fill="#4F7CFF" stroke="#4F7CFF" stroke-width="1.2" opacity="1.0"/><text class="sans" x="140" y="268" fill="#F8FAFC" font-size="19" font-weight="750" text-anchor="start" opacity="1.0" letter-spacing="0">Level 1 · Screening</text><text class="sans" x="92" y="307" fill="#A8B5C7" font-size="13" font-weight="500" text-anchor="start"><tspan x="92" dy="0"