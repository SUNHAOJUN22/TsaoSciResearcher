tter-spacing="0.2">HIGH-FIDELITY DECISION</text><rect x="52" y="656" width="1096" height="38" rx="12" fill="#0A1627" stroke="#263A55" stroke-width="1.2" opacity="1.0"/><text class="mono" x="76" y="681" fill="#A8B5C7" font-size="12" font-weight="650" text-anchor="start" opacity="1.0" letter-spacing="0.6">ALL LEVELS RETURN CALCULATED_REFERENCE_ONLY</text><rect x="1010" y="661" width="107.2" height="28" rx="14" fill="#FBBF2418" stroke="#FBBF2488" stroke-width="1" opacity="1.0"/><text class="mono" x="1063.6" y="680.0" fill="#FBBF24" font-size="12" font-weight="700" text-anchor="middle" opacity="1.0" letter-spacing="0.2">FAIL-CLOSED</text></svg>
