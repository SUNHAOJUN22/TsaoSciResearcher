<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" focusable="false" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" data-design-system="scientific-midnight-bento" data-design-version="2"><title id="title">Three EPDM model levels</title><desc id="desc">Screening, engineering and detailed-reference model levels with increasing evidence requirements.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111F"/>
    <stop offset="0.55" stop-color="#0B1729"/>
    <stop offset="1" stop-color="#07111F"/>
  </linearGradient>
  <radialGradient id="glowBlue" cx="0.1" cy="0.05" r="0.8">
    <stop offset="0" stop-color="#4F7CFF" stop-opacity="0.18"/>
