<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" focusable="false" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" data-design-system="scientific-midnight-bento" data-design-version="2"><title id="title">EPDM reactor-mode decision map</title><desc id="desc">Decision map for semibatch, continuous and multi-reactor EPDM process routes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111F"/>
    <stop offset="0.55" stop-color="#0B1729"/>
    <stop offset="1" stop-color="#07111F"/>
  </linearGradient>
  <radialGradient id="glowBlue" cx="0.1" cy="0.05" r="0.8">
    <stop offset="0" stop-color="#4F7CFF" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4F7CFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowCyan" cx="0.9" cy="0.8" r="0.65">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#18304C" stroke-width="1" opacity="0.32"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
