<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" focusable="false" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" data-design-system="scientific-midnight-bento" data-design-version="2"><title id="title">EPDM batch parameter-scan data flow</title><desc id="desc">Broadcast arrays pass through validated EPDM screening kernels to decision-ready outputs.</desc>
