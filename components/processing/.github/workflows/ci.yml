name: TSAO alpha15 qualification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PERFORMANCE_BASELINE_COMMIT: "8719e59140202aae53cdfb80239b80dedad6767a"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

concurrency:
  group: tsao-main-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements.lock
      - name: Verify exact hashed dependency lock
        run: >-
          python scripts/verify_dependency_lock.py requirements.lock
          --pyproject pyproject.toml
          --json-out reports/runtime/DEPENDENCY_LOCK_VERIFICATION.json
      - name: Install exact locked dependencies
        run: python -m pip install --quiet --require-hashes -r requirements.lock
      - name: Install TSAO without dependency resolution
        run: python -m pip install --quiet --no-deps --no-build-isolation -e .
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Verify controlled registry blocks public artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYBLOCK'
          from pathlib import Path
          from tsao.distribution_policy import assert_public_distribution_allowed

          for artifact_kind in ('public source distribution', 'public wheel'):
              try:
                  assert_public_distribution_allowed(Path.cwd(), artifact_kind=artifact_kind)
              except Exception as exc:
                  message = str(exc)
                  if 'CONTROLLED' not in message.upper() and 'BLOCK' not in message.upper():
                      raise SystemExit(f'{artifact_kind} failed for an unrelated reason: {message}') from exc
              else:
                  raise SystemExit(f'{artifact_kind} was permitted while the registry remains controlled')
          PYBLOCK
      - name: Run distribution containment regressions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_distribution_containment_v20.py \
            tests/test_release_integrity_alpha6.py \
            tests/test_main_only_ci_policy.py \
            tests/test_public_distribution_boundary_workflow.py
      - name: Verify permanent repository hygiene
        run: >-
          python -c "import subprocess; from pathlib import Path; tracked=[p for p in subprocess.check_output(['git','ls-files','-z']).decode().split(chr(0)) if p]; w=sorted(p for p in tracked if p.startswith('.github/workflows/')); assert w==['.github/workflows/ci.yml'],w; f=[p for p in tracked if '-once.yml' in Path(p).name or 'CANDIDATE' in Path(p).name or 'DIAGNOSTIC' in Path(p).name or p.startswith('.github/upgrade/')]; assert not f,f"
      - name: Clean editable-install metadata
        run: python -c "import pathlib, shutil; [shutil.rmtree(path) for path in pathlib.Path('.').glob('*.egg-info') if path.is_dir()]"
      - name: Verify deterministic README graphics and visual contract
        run: |
          python scripts/generate_readme_assets.py
          python scripts/generate_extended_readme_assets.py
          python scripts/generate_decision_readme_assets.py
          python scripts/generate_performance_readme_assets.py
          python scripts/generate_uiux_readme_assets.py
          python scripts/harden_readme_svg_accessibility.py
          python scripts/verify_readme_visual_accessibility.py
          python scripts/sync_readme_visuals.py --check
          git diff --exit-code -- docs/assets/readme README.md README.zh-CN.md
      - name: Core, specialists, Ruff and coverage qualification
        run: python scripts/run_ci.py
      - name: EPDM canonical software-acceptance gate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: >-
          python scripts/qualify_acceptance.py
          --project skills/epdm/fixtures/v2_phase_a1_reference_project.json
          --output reports/runtime/EPDM_SOFTWARE_ACCEPTANCE.json
          --load-samples 7
      - name: Alpha15 adaptive-integrator branch coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest -q -p no:cacheprovider skills/epdm/tests/test_epdm_phase_a4_integration.py
          python -m coverage report --include='skills/epdm/numerical_integration.py' --fail-under=90
          python -c "from pathlib import Path; Path('.coverage').unlink(missing_ok=True)"
      - name: Universal Skillpack closure
        run: |
          python -m tsao.skillpacks --root .
          python -m tsao.cli package template --family "generic process"
      - name: Prove controlled public wheel is blocked without emitting an artifact
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys

          wheelhouse = pathlib.Path("wheelhouse")
          wheelhouse.mkdir(exist_ok=True)
          result = subprocess.run(
              [sys.executable, "-m", "pip", "wheel", "--no-deps", "--no-build-isolation", ".", "-w", str(wheelhouse)],
              text=True,
              capture_output=True,
              check=False,
          )
          output = result.stdout + result.stderr
          if result.returncode == 0:
              raise SystemExit("public wheel was emitted while controlled metadata remains blocked")
          if "BLOCKED_CONTROLLED_METADATA_CLASSIFICATION" not in output:
              raise SystemExit(f"wheel build failed for an unrelated reason:\n{output}")
          if list(wheelhouse.glob("*.whl")):
              raise SystemExit("blocked wheel build left a public artifact")
          print("EXPECTED_BLOCK: public wheel remains fail-closed")
      - name: Extended performance regression gate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        shell: bash
        run: |
          baseline_root="$RUNNER_TEMP/alpha14-performance-baseline"
          baseline_report="$RUNNER_TEMP/PERFORMANCE_BASELINE_ALPHA14_SAME_RUN.json"
          baseline_commit="${PERFORMANCE_BASELINE_COMMIT}"
          git cat-file -e "${baseline_commit}^{commit}"
          git merge-base --is-ancestor "$baseline_commit" HEAD
          cleanup_baseline_worktree() {
            if git worktree list --porcelain | grep -Fqx "worktree $baseline_root"; then
              git worktree remove --force "$baseline_root"
            fi
          }
          trap cleanup_baseline_worktree EXIT
          git worktree add --detach "$baseline_root" "$baseline_commit"
          (
            cd "$baseline_root"
            rm -rf wheelhouse build dist *.egg-info
            python scripts/benchmark_performance_v2.py \
              --repeats 7 \
              --output "$baseline_report"
          )
          python scripts/benchmark_performance_v2.py \
            --repeats 7 \
            --output reports/runtime/PERFORMANCE_RESULTS_V2.json
          python scripts/annotate_performance_work_units.py \
            --report "$baseline_report" \
            --worktree "$baseline_root"
          python scripts/annotate_performance_work_units.py \
            --report reports/runtime/PERFORMANCE_RESULTS_V2.json \
            --worktree .
          python scripts/compare_performance_v2.py \
            --baseline "$baseline_report" \
            --current reports/runtime/PERFORMANCE_RESULTS_V2.json \
            --output reports/runtime/PERFORMANCE_COMPARISON_V2.json
          python scripts/compare_performance_v2.py \
            --baseline reports/PERFORMANCE_BASELINE_ALPHA10_EXTENDED.json \
            --current reports/runtime/PERFORMANCE_RESULTS_V2.json \
            --output reports/runtime/PERFORMANCE_COMPARISON_ALPHA10_HISTORICAL.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/runtime/PERFORMANCE_COMPARISON_ALPHA10_HISTORICAL.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["qualification_role"] = "BLOCKING_HISTORICAL_TREND"
          data["historical_comparator_exit_code"] = 0
          data["qualification_baseline"] = "ALPHA14_SAME_RUN_SAME_PYTHON"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          cp "$baseline_report" reports/runtime/PERFORMANCE_BASELINE_ALPHA14_SAME_RUN.json
          git worktree remove --force "$baseline_root"
          trap - EXIT
          python scripts/update_performance_readme.py --comparison reports/PERFORMANCE_COMPARISON_ALPHA11.json --check
      - name: CLI smoke
        run: |
          python -m tsao.cli doctor --root . --profile core
          python -m tsao.skillpacks --root .
          python -m tsao.cli route "POE solution polymerization and solvent recovery"
          python -m tsao.cli package template --family "continuous chemical process"
          python -m tsao.cli epdm status
          python -m tsao.cli epdm audit
          python -m tsao.cli epdm reference-demo
          python -m tsao.cli epdm model-suite --temperature-k 323.15 --residence-s 300
          python -m tsao.cli poe status --root .
          python -m tsao.cli poe audit-p0 --root .
          python -m tsao.cli poe audit-p1 --root .
          python -m tsao.cli poe reference-demo
      - name: Upload qualification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsao-qualification-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.sha }}
          path: |
            reports/runtime/CI_RESULTS.json
            reports/runtime/PERFORMANCE_RESULTS_V2.json
            reports/runtime/PERFORMANCE_COMPARISON_V2.json
            reports/runtime/PERFORMANCE_BASELINE_ALPHA14_SAME_RUN.json
            reports/runtime/PERFORMANCE_COMPARISON_ALPHA10_HISTORICAL.json
            reports/runtime/EPDM_SOFTWARE_ACCEPTANCE.json
          if-no-files-found: warn
          retention-days: 14

  source-snapshot:
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Verify exact hashed dependency lock
        run: python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
      - name: Install exact locked dependencies
        run: python -m pip install --quiet --require-hashes -r requirements.lock
      - name: Install TSAO without dependency resolution
        run: python -m pip install --quiet --no-deps --no-build-isolation -e .
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Verify committed source identity
        run: python -m tsao.cli doctor --root . --profile core
      - name: Prove controlled public-source snapshot is blocked without emitting an artifact
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys

          archive = pathlib.Path("TSAO-PROCESSING-SKILL-source-alpha.15.zip")
          result = subprocess.run(
              [sys.executable, "scripts/export_source_snapshot.py", "--root", ".", "--out", str(archive)],
              text=True,
              capture_output=True,
              check=False,
          )
          output = result.stdout + result.stderr
          if result.returncode == 0:
              raise SystemExit("public source snapshot was emitted while controlled metadata remains blocked")
          if "BLOCKED_CONTROLLED_METADATA_CLASSIFICATION" not in output:
              raise SystemExit(f"snapshot export failed for an unrelated reason:\n{output}")
          if archive.exists() or archive.with_suffix(archive.suffix + ".sha256").exists():
              raise SystemExit("blocked snapshot export left a public artifact")
          print("EXPECTED_BLOCK: public source snapshot remains fail-closed")

  qualification-ledger:
    needs: [qualification, source-snapshot]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record main qualification result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
          SNAPSHOT_RESULT: ${{ needs.source-snapshot.result }}
        run: |
          set -euo pipefail
          verdict=FAIL
          if [[ "$QUALIFICATION_RESULT" == success && "$SNAPSHOT_RESULT" == success ]]; then
            verdict=PASS
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(cat <<EOF
          Permanent main qualification: **$verdict**

          - commit: \`$GITHUB_SHA\`
          - run: $run_url
          - matrix qualification: \`$QUALIFICATION_RESULT\`
          - source snapshot: \`$SNAPSHOT_RESULT\`
          - event: \`$GITHUB_EVENT_NAME\`

          This ledger records software-artifact qualification only. Scientific, engineering, HSE, customer and industrial approvals remain \`NOT_EVALUATED\`.
          EOF
          )
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body "$body"
          test "$verdict" = PASS
