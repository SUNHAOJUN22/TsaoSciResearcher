[tool.pytest.ini_options]
testpaths = [
  "tests",
  "skills/process-general/tests",
  "skills/epdm/tests",
  "skills/poe/tests",
  "skills/polymer-general/tests",
]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
