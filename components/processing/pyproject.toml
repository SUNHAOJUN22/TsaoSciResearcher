  "skills/poe/modules/05_thermodynamics_properties/*.md",
  "skills/poe/modules/05_thermodynamics_properties/*.json",
]
"share/tsao-processing-skill/skills/poe/modules/06_rheology_transport" = [
  "skills/poe/modules/06_rheology_transport/*.md",
  "skills/poe/modules/06_rheology_transport/*.json",
]
"share/tsao-processing-skill/skills/poe/modules/07_reactor_cfd_heat_removal" = [
  "skills/poe/modules/07_reactor_cfd_heat_removal/*.md",
  "skills/poe/modules/07_reactor_cfd_heat_removal/*.json",
]
"share/tsao-processing-skill/skills/poe/modules/08_steady_flowsheet_balances" = [
  "skills/poe/modules/08_steady_flowsheet_balances/*.md",
