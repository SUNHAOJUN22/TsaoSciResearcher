<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">TsaoDFT 中文第一性原理与证据链愿景图</title>
<desc id="desc">从方法指纹、结构周期几何、外部引擎交接、解析收敛到证据资格的中文概念设计图。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06121f"/><stop offset="0.55" stop-color="#10233f"/><stop offset="1" stop-color="#1f2554"/></linearGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#dbeafe" stroke-opacity=".055"/></pattern>
  <style>
    text{font-family:Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei','PingFang SC','WenQuanYi Micro Hei','Segoe UI',Arial,sans-serif}
    .eyebrow{font-size:17px;letter-spacing:3.5px;font-weight:800;fill:#67e8f9}
    .title{font-size:50px;font-weight:850;fill:#f8fafc}
    .subtitle{font-size:21px;fill:#cbd5e1}
    .vision{font-size:18px;font-weight:700;fill:#dbeafe}
    .card-title{font-size:23px;font-weight:800;fill:#f8fafc}
    .card-sub{font-size:15px;fill:#9fb1c8}
    .body{font-size:15px;fill:#d5deea}
    .micro{font-size:12px;fill:#8ea2ba}
    .step{font-size:15px;font-weight:900;fill:#07111f}
    .formula{font-family:'STIX Two Math','Cambria Math','Noto Sans Math','Noto Sans SC',serif;font-size:22px;fill:#e0f2fe}
    .formula-small{font-family:'STIX Two Math','Cambria Math','Noto Sans Math','Noto Sans SC',serif;font-size:17px;fill:#f0f9ff}
    .disclaimer{font-size:12px;font-weight:850;letter-spacing:1.1px;fill:#111827}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<ellipse cx="800" cy="188" rx="610" ry="190" fill="url(#halo)"/>
<g transform="translate(78 54)">
  <text class="eyebrow">TSAODFT · 第一性原理与证据锁定工作流</text>
  <text class="title" y="63">从 Kohn–Sham 方程到材料与分子证据链</text>
  <text class="subtitle" y="105">方法指纹 · 周期几何 · 外部引擎交接 · Parser/SCF · 科学资格</text>
</g>
<g transform="translate(1030 68)">
  <rect width="490" height="104" rx="24" fill="#0a1829" stroke="#334155"/>
  <text x="24" y="36" class="vision">项目愿景</text>
  <text x="24" y="70" class="formula-small">让每个电子结构结论都能追溯到方法、输入、引擎、收敛和证据身份</text>
  <text x="24" y="92" class="micro">仓库验证控制面与适配器；真实 Gaussian/VASP/QE/CP2K 结果保持外部资格。</text>
</g>
<g transform="translate(78 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#22d3ee"/><text x="42" y="48" text-anchor="middle" class="step">1</text>
  <text x="24" y="93" class="card-title">方法指纹</text>
  <text x="24" y="124" class="card-sub">Functional · Basis · PP</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">M=(XC,basis,PP,cutoff,k)</text>
  <text x="125" y="207" text-anchor="middle" class="micro">方法不可静默混用</text>
  <circle cx="34" cy="274" r="6" fill="#22d3ee"/><text x="51" y="280" class="body">泛函与色散</text>
  <circle cx="34" cy="316" r="6" fill="#22d3ee"/><text x="51" y="322" class="body">基组/赝势族</text>
  <circle cx="34" cy="358" r="6" fill="#22d3ee"/><text x="51" y="364" class="body">自旋与参考态</text>
</g><g transform="translate(370 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#818cf8" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#818cf8"/><text x="42" y="48" text-anchor="middle" class="step">2</text>
  <text x="24" y="93" class="card-title">结构与周期几何</text>
  <text x="24" y="124" class="card-sub">Molecule · Cell · MIC</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">ΔrMIC=Δr−n*H</text>
  <text x="125" y="207" text-anchor="middle" class="micro">三斜/部分周期精确</text>
  <circle cx="34" cy="274" r="6" fill="#818cf8"/><text x="51" y="280" class="body">结构规范化</text>
  <circle cx="34" cy="316" r="6" fill="#818cf8"/><text x="51" y="322" class="body">晶胞与周期轴</text>
  <circle cx="34" cy="358" r="6" fill="#818cf8"/><text x="51" y="364" class="body">邻居表与距离</text>
</g><g transform="translate(662 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#c084fc" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#c084fc"/><text x="42" y="48" text-anchor="middle" class="step">3</text>
  <text x="24" y="93" class="card-title">引擎交接</text>
  <text x="24" y="124" class="card-sub">Gaussian · VASP · QE · CP2K</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">Hinput=SHA256(bytes)</text>
  <text x="125" y="207" text-anchor="middle" class="micro">L1/L2 不冒充 L3</text>
  <circle cx="34" cy="274" r="6" fill="#c084fc"/><text x="51" y="280" class="body">输入生成</text>
  <circle cx="34" cy="316" r="6" fill="#c084fc"/><text x="51" y="322" class="body">许可证与版本</text>
  <circle cx="34" cy="358" r="6" fill="#c084fc"/><text x="51" y="364" class="body">调度与硬件身份</text>
</g><g transform="translate(954 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#34d399" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#34d399"/><text x="42" y="48" text-anchor="middle" class="step">4</text>
  <text x="24" y="93" class="card-title">解析与收敛</text>
  <text x="24" y="124" class="card-sub">Parser · SCF · Forces</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">Rₙ≤τρ ∧ finite</text>
  <text x="125" y="207" text-anchor="middle" class="micro">正常退出不等于收敛</text>
  <circle cx="34" cy="274" r="6" fill="#34d399"/><text x="51" y="280" class="body">fatal marker 优先</text>
  <circle cx="34" cy="316" r="6" fill="#34d399"/><text x="51" y="322" class="body">能量/力/应力</text>
  <circle cx="34" cy="358" r="6" fill="#34d399"/><text x="51" y="364" class="body">单位与有限数</text>
</g><g transform="translate(1246 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#fbbf24"/><text x="42" y="48" text-anchor="middle" class="step">5</text>
  <text x="24" y="93" class="card-title">证据与资格</text>
  <text x="24" y="124" class="card-sub">Receipt · Equivalence</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">δ=|y−yref|/max(|yref|,ε)</text>
  <text x="125" y="207" text-anchor="middle" class="micro">正确性先于性能</text>
  <circle cx="34" cy="274" r="6" fill="#fbbf24"/><text x="51" y="280" class="body">结果与环境哈希</text>
  <circle cx="34" cy="316" r="6" fill="#fbbf24"/><text x="51" y="322" class="body">参考值与容差</text>
  <circle cx="34" cy="358" r="6" fill="#fbbf24"/><text x="51" y="364" class="body">外部签署审查</text>
</g>
<path d="M330 445h28" stroke="#94a3b8" stroke-width="4"/><path d="M358 445l-12-8v16z" fill="#94a3b8"/><path d="M622 445h28" stroke="#94a3b8" stroke-width="4"/><path d="M650 445l-12-8v16z" fill="#94a3b8"/><path d="M914 445h28" stroke="#94a3b8" stroke-width="4"/><path d="M942 445l-12-8v16z" fill="#94a3b8"/><path d="M1206 445h28" stroke="#94a3b8" stroke-width="4"/><path d="M1234 445l-12-8v16z" fill="#94a3b8"/>
<g transform="translate(78 686)">
  <rect width="1444" height="128" rx="25" fill="#091827" stroke="#334155"/>
  <text x="24" y="34" class="vision">核心第一性原理与数值合同</text>
  <text x="24" y="68" class="formula">ĤKS[ρ]ψᵢ=εᵢψᵢ   ·   ρ(r)=Σ fᵢ|ψᵢ(r)|²   ·   Rₙ=||ρ⁽ⁿ⁺¹⁾−ρ⁽ⁿ⁾||≤τρ</text>
  <text x="24" y="100" class="formula">n* = argminₙ∈ℤᴾ ||Δr−nH||₂   ·   Hrun=SHA256(input∥engine∥method∥parser∥environment)</text>
</g>
<g transform="translate(78 842)">
  <rect width="640" height="28" rx="14" fill="#f8fafc" opacity=".95"/>
  <text x="320" y="19" text-anchor="middle" class="disclaimer">AI辅助概念设计 · 非科学数据 · 公式对应软件合同而非运行结果</text>
  <text x="1440" y="20" text-anchor="end" class="micro">TsaoDFT Skill · 中文第一性原理愿景</text>
</g>
</svg>