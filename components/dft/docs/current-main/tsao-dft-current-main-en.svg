<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">TsaoDFT Skill current-main acceptance architecture</title><desc id="desc">From Kohn–Sham contracts, periodic geometry and engine identity to falsifiable electronic-structure evidence. Software gates validate the control plane, reference numerics and evidence contracts only; external engines such as Gaussian, VASP, QE and CP2K are not executed here and remain EXTERNAL_HOLD.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".5" stop-color="#0b2452"/><stop offset="1" stop-color="#2e1065"/></linearGradient><linearGradient id="card"><stop offset="0" stop-color="#12345f"/><stop offset="1" stop-color="#20164c"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC","Noto Sans",Arial,sans-serif;fill:#eff6ff}.title{font-size:54px;font-weight:800}.subtitle{font-size:24px;fill:#bae6fd}.stage{font-size:24px;font-weight:750}.detail{font-size:17px;fill:#c7d2fe}.index{font-size:58px;font-weight:800;fill:#1d4ed8}.formula{font-family:"STIX Two Math","Cambria Math","Noto Sans Math","Noto Sans CJK SC",sans-serif;font-size:19px;fill:#f3e8ff}.micro{font-size:14px;letter-spacing:2px;fill:#67e8f9}.boundary{font-size:18px;fill:#dbeafe}.badge{font-size:16px;fill:#93c5fd}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1390" cy="92" r="125" fill="#3b82f6" opacity=".16"/><circle cx="210" cy="790" r="170" fill="#a855f7" opacity=".12"/><text x="48" y="88" class="title">TsaoDFT Skill</text><text x="48" y="132" class="subtitle">From Kohn–Sham contracts, periodic geometry and engine identity to falsifiable electronic-structure evidence</text><text x="48" y="184" class="badge">AI-ASSISTED CONCEPTUAL DESIGN · NOT EXTERNAL-ENGINE DATA</text><path d="M 319 336 H 348" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/><path d="M 629 336 H 658" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/><path d="M 939 336 H 968" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1249 336 H 1278" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/><g><rect x="44" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="66" y="280" class="stage">Scientific question</text><text x="66" y="324" class="detail">System, observables and accuracy</text><text x="66" y="394" class="index">01</text></g><g><rect x="354" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="376" y="280" class="stage">Structure and periodicity</text><text x="376" y="324" class="detail">Cell, PBC and neighbour lists</text><text x="376" y="394" class="index">02</text></g><g><rect x="664" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="686" y="280" class="stage">Method contract</text><text x="686" y="324" class="detail">Functional, basis/cutoff and SCF</text><text x="686" y="394" class="index">03</text></g><g><rect x="974" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="996" y="280" class="stage">Numerical acceptance</text><text x="996" y="324" class="detail">Energy, forces, stress and parity</text><text x="996" y="394" class="index">04</text></g><g><rect x="1284" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="1306" y="280" class="stage">Evidence grading</text><text x="1306" y="324" class="detail">L0–L3, hashes and authority</text><text x="1306" y="394" class="index">05</text></g><g><rect x="44" y="522" width="465" height="128" rx="22" fill="#091426" stroke="#c084fc" stroke-width="2"/><text x="66" y="575" class="formula">[-½∇² + V_eff[n]] ψᵢ = εᵢ ψᵢ</text><text x="66" y="619" class="micro">CODE CONTRACT 01</text></g><g><rect x="549" y="522" width="465" height="128" rx="22" fill="#091426" stroke="#c084fc" stroke-width="2"/><text x="571" y="575" class="formula">n* = argminₙ ‖A(s − n)‖₂</text><text x="571" y="619" class="micro">CODE CONTRACT 02</text></g><g><rect x="1054" y="522" width="465" height="128" rx="22" fill="#091426" stroke="#c084fc" stroke-width="2"/><text x="1076" y="575" class="formula">|ΔE| ≤ τ_E ∧ maxᵢ ‖ΔFᵢ‖₂ ≤ τ_F</text><text x="1076" y="619" class="micro">CODE CONTRACT 03</text></g><rect x="44" y="710" width="1512" height="104" rx="24" fill="#071124" stroke="#334155"/><text x="76" y="756" class="micro">QUALIFICATION BOUNDARY</text><text x="76" y="790" class="boundary">Software gates validate the control plane, reference numerics and evidence contracts only; external engines such as Gaussian, VASP, QE and CP2K are not executed here and remain EXTERNAL_HOLD.</text><text x="48" y="866" class="micro">CURRENT MAIN · EXACT TREE · FINITE NUMERICS · L0–L3 EVIDENCE</text>
</svg>
