schema_version: '1.2'
job_id: G16-DEMO
engine: gaussian
engine_version: 16-C.01
support_level: L2_VALIDATED_ADAPTER
method_fingerprint_id: MF-DEMO
executable: g16
input: demo.gjf
stdout: demo.log
stderr: demo.stderr
workdir: ./run
scheduler: slurm
launcher: ''
resources:
  nodes: 1
  tasks_per_node: 1
  cpus_per_task: 8
  memory_gb: 32
  walltime: '12:00:00'
  gpus_per_node: 0
  partition: null
environment:
  modules:
  - gaussian/16
  source: []
  variables:
    OMP_NUM_THREADS: '8'
scratch:
  path: ./scratch
  preserve_on_failure: true
expected_outputs:
- demo.log
- demo.chk
estimated_storage_gb: 4
checkpoint_policy: preserve
preflight:
  argv:
  - python
  - preflight_gaussian_input.py
  - demo.gjf
  run_in_job: false
parser:
  argv:
  - python
  - parse_gaussian.py
  - demo.log
  - --json
  run_in_job: false
approval: pending
acceleration:
  enabled: false
  profile_id: CPU-ONLY
  backend: none
  mode: none
  gpu_vendor: none
  ranks_per_gpu: 1
  allow_gpu_oversubscription: false
  cpu_bind: none
  gpu_bind: none
  device_order: scheduler
  precision: fp64
  record_runtime: false
