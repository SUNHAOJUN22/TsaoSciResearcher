schema_version: "1.2"
job_id: VASP-GPU-BENCH
engine: vasp
engine_version: "site-version-required"
support_level: L2_VALIDATED_ADAPTER
method_fingerprint_id: MF-VASP-001
executable: vasp_std
input: INCAR
stdout: vasp.stdout
stderr: vasp.stderr
workdir: ./run
scheduler: slurm
launcher: ""
resources:
  nodes: 1
  tasks_per_node: 4
  cpus_per_task: 8
  memory_gb: 256
  walltime: "02:00:00"
  gpus_per_node: 0
  partition: null
environment:
  modules: []
  source: []
  variables:
    OMP_NUM_THREADS: "8"
acceleration:
  enabled: false
  profile_id: CPU-ONLY
  backend: none
  mode: none
  gpu_vendor: none
  ranks_per_gpu: 1
  allow_gpu_oversubscription: false
  cpu_bind: none
  gpu_bind: none
  device_order: scheduler
  precision: fp64
  record_runtime: false
scratch: {path: ./scratch, preserve_on_failure: true}
expected_outputs: [OUTCAR, vasprun.xml]
estimated_storage_gb: 16
checkpoint_policy: preserve
preflight:
  argv: [python, preflight_vasp.py, .]
  run_in_job: false
parser:
  argv: [python, parse_vasp.py, OUTCAR]
  run_in_job: false
approval: pending
