<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-label="Free-energy profile with explicit validation gates">
<title>Free-energy profile with explicit validation gates</title>
<desc>A synthetic free-energy profile with transition-state and standard-state validation gates. Synthetic demonstration only and not scientific data.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030816"/>
    <stop offset="0.55" stop-color="#071529"/>
    <stop offset="1" stop-color="#061020"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2E8CFF"/><stop offset="1" stop-color="#62D4FF"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6D5DFB"/><stop offset="1" stop-color="#D06BFF"/>
  </linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#FB4B5A"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#173052" stroke-width="1" opacity=".55"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .h1 {font:700 30px Inter,Segoe UI,sans-serif;fill:#F4F8FF}
    .ey {font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.4px;fill:#66C8FF}
    .t {font:600 16px Inter,Segoe UI,sans-serif;fill:#CFE3FF}
    .s {font:400 13px Inter,Segoe UI,sans-serif;fill:#9FB5D2}
    .mono {font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#76D9FF}
    .chip {font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace}
  </style>
</defs>
<rect width="1080" height="500" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1078" height="498" rx="23" fill="none" stroke="#23528C" stroke-width="2"/>
<rect width="1080" height="500" rx="24" fill="url(#grid)" opacity=".42"/>
<text x="34" y="34" class="ey">THERMOCHEMISTRY · TS · IRC</text><text x="34" y="72" class="h1">Free energy only after reference states are explicit.</text><rect x="34" y="105" width="690" height="325" rx="16" fill="#07152A" stroke="#27598F" stroke-width="1.5"/>
<text x="52" y="133" class="t">Reaction coordinate</text>
<text x="52" y="154" class="s">synthetic profile · units and reference state visible</text><path d="M 92 382 V 155 H 675" fill="none" stroke="#8AA4C4" stroke-width="2"/><path d="M 105 340 L 205 315 L 300 225 L 390 140 L 480 250 L 565 310 L 655 330" fill="none" stroke="url(#warm)" stroke-width="5" filter="url(#glow)"/><circle cx="105" cy="340" r="6" fill="#FFB01F" stroke="#FFF2C6"/><circle cx="205" cy="315" r="6" fill="#FFB01F" stroke="#FFF2C6"/><circle cx="300" cy="225" r="6" fill="#FFB01F" stroke="#FFF2C6"/><circle cx="390" cy="140" r="6" fill="#FFB01F" stroke="#FFF2C6"/><circle cx="480" cy="250" r="6" fill="#FFB01F" stroke="#FFF2C6"/><circle cx="565" cy="310" r="6" fill="#FFB01F" stroke="#FFF2C6"/><circle cx="655" cy="330" r="6" fill="#FFB01F" stroke="#FFF2C6"/><line x1="390" y1="140" x2="390" y2="340" stroke="#7B91AD" stroke-dasharray="6 6"/>
<text x="390" y="124" text-anchor="middle" class="t">TS candidate</text>
<text x="110" y="405" class="s">Reactants</text><text x="605" y="405" class="s">Products</text>
<path d="M 440 328 V 150" stroke="#62D4FF" stroke-width="2"/><path d="M 432 158 L 440 148 L 448 158" fill="none" stroke="#62D4FF" stroke-width="2"/>
<text x="454" y="238" class="t">ΔG‡</text><text x="52" y="270" transform="rotate(-90 52 270)" class="s">G (kcal mol⁻¹)</text><rect x="750" y="105" width="296" height="95" rx="16" fill="#07152A" stroke="#2E8CFF" stroke-width="1.5"/>
<text x="768" y="133" class="t">Gate 1 · stationary point</text>
<text x="768" y="154" class="s">imaginary modes checked</text><rect x="750" y="214" width="296" height="95" rx="16" fill="#07152A" stroke="#765BFF" stroke-width="1.5"/>
