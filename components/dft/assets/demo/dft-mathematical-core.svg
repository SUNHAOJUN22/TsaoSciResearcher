<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TsaoDFT mathematical core and software boundaries</title>
  <desc id="desc">Synthetic diagram connecting Kohn-Sham equations, SCF convergence, forces, periodic sampling, repository validation and external engines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102a43"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16324f"/><stop offset="1" stop-color="#0b1f33"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="85" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="44" font-weight="700">TsaoDFT · Mathematical Core → Auditable Software Contracts</text>
  <text x="80" y="128" fill="#93c5fd" font-family="Inter,Segoe UI,Arial" font-size="23">AI-assisted deterministic SVG · SYNTHETIC DEMO · NOT SCIENTIFIC DATA</text>
  <g filter="url(#shadow)" font-family="Cambria Math,Times New Roman,serif">
    <rect x="70" y="190" width="440" height="210" rx="28" fill="url(#card)" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="245" fill="#7dd3fc" font-size="28" font-family="Inter,Segoe UI,Arial" font-weight="700">Kohn–Sham fixed point</text>
    <text x="105" y="305" fill="#f8fafc" font-size="27">ĤKS[ρ] ψᵢ = εᵢ ψᵢ</text>
    <text x="105" y="355" fill="#f8fafc" font-size="25">ρ(r) = Σᵢ fᵢ |ψᵢ(r)|²</text>
    <text x="105" y="385" fill="#94a3b8" font-size="18" font-family="Inter,Segoe UI,Arial">External engine numerical kernel</text>
    <rect x="580" y="190" width="440" height="210" rx="28" fill="url(#card)" stroke="#34d399" stroke-width="2"/>
    <text x="615" y="245" fill="#6ee7b7" font-size="28" font-family="Inter,Segoe UI,Arial" font-weight="700">SCF and scientific acceptance</text>
    <text x="615" y="305" fill="#f8fafc" font-size="25">Rₙ = ‖ρₙ₊₁ − ρₙ‖</text>
    <text x="615" y="350" fill="#f8fafc" font-size="24">Rₙ ≤ τρ  ∧  parser = ACCEPTED</text>
    <text x="615" y="385" fill="#94a3b8" font-size="18" font-family="Inter,Segoe UI,Arial">Finite values · convergence · immutable artifacts</text>
    <rect x="1090" y="190" width="440" height="210" rx="28" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/>
    <text x="1125" y="245" fill="#fbbf24" font-size="28" font-family="Inter,Segoe UI,Arial" font-weight="700">Forces and periodic observables</text>
    <text x="1125" y="305" fill="#f8fafc" font-size="24">Fᴵ = −∂E/∂Rᴵ</text>
    <text x="1125" y="350" fill="#f8fafc" font-size="24">A = Σₖ wₖ A(k)</text>
    <text x="1125" y="385" fill="#94a3b8" font-size="18" font-family="Inter,Segoe UI,Arial">Method identity must remain fixed</text>
  </g>
  <path d="M510 295 H570" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1020 295 H1080" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial">
    <rect x="105" y="505" width="350" height="210" rx="26" fill="#0f2740" stroke="#a78bfa" stroke-width="2"/>
    <text x="140" y="558" fill="#c4b5fd" font-size="27" font-weight="700">Python control plane</text>
    <text x="140" y="605" fill="#e2e8f0" font-size="21">Schema · argv · DAG</text>
    <text x="140" y="640" fill="#e2e8f0" font-size="21">method fingerprint</text>
    <text x="140" y="675" fill="#e2e8f0" font-size="21">evidence graph</text>
    <rect x="495" y="505" width="350" height="210" rx="26" fill="#0f2740" stroke="#22d3ee" stroke-width="2"/>
    <text x="530" y="558" fill="#67e8f9" font-size="27" font-weight="700">Repository numerical cores</text>
    <text x="530" y="605" fill="#e2e8f0" font-size="21">reference / NumPy / cell-list</text>
    <text x="530" y="640" fill="#e2e8f0" font-size="21">mmap parser scanner</text>
    <text x="530" y="675" fill="#e2e8f0" font-size="21">deterministic equivalence</text>
    <rect x="885" y="505" width="350" height="210" rx="26" fill="#0f2740" stroke="#fb7185" stroke-width="2"/>
    <text x="920" y="558" fill="#fda4af" font-size="27" font-weight="700">External engines</text>
    <text x="920" y="605" fill="#e2e8f0" font-size="21">Gaussian · VASP</text>
    <text x="920" y="640" fill="#e2e8f0" font-size="21">QE · CP2K</text>
    <text x="920" y="675" fill="#e2e8f0" font-size="21">license + build boundary</text>
    <rect x="1275" y="505" width="255" height="210" rx="26" fill="#3b1d13" stroke="#f97316" stroke-width="2"/>
    <text x="1310" y="558" fill="#fdba74" font-size="27" font-weight="700">Qualification</text>
    <text x="1310" y="605" fill="#f8fafc" font-size="20">software: READY</text>
    <text x="1310" y="640" fill="#f8fafc" font-size="20">real solver:</text>
    <text x="1310" y="675" fill="#fb923c" font-size="22" font-weight="700">EXTERNAL_HOLD</text>
  </g>
  <path d="M455 610 H485" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M845 610 H875" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1235 610 H1265" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="80" y="835" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial" font-size="20">Formulas define scientific contracts and acceptance logic; they are not outputs from a real solver run.</text>
</svg>
