<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-label="TsaoDFT auditable research loop">
<title>TsaoDFT auditable research loop</title>
<desc>A five-stage DFT evidence workflow with provenance gates. Synthetic demonstration only and not scientific data.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030816"/>
    <stop offset="0.55" stop-color="#071529"/>
    <stop offset="1" stop-color="#061020"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2E8CFF"/><stop offset="1" stop-color="#62D4FF"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6D5DFB"/><stop offset="1" stop-color="#D06BFF"/>
  </linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#FB4B5A"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#173052" stroke-width="1" opacity=".55"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .h1 {font:700 30px Inter,Segoe UI,sans-serif;fill:#F4F8FF}
    .ey {font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.4px;fill:#66C8FF}
    .t {font:600 16px Inter,Segoe UI,sans-serif;fill:#CFE3FF}
    .s {font:400 13px Inter,Segoe UI,sans-serif;fill:#9FB5D2}
    .mono {font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#76D9FF}
    .chip {font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace}
  </style>
</defs>
<rect width="1180" height="430" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1178" height="428" rx="23" fill="none" stroke="#23528C" stroke-width="2"/>
<rect width="1180" height="430" rx="24" fill="url(#grid)" opacity=".42"/>
<text x="34" y="34" class="ey">AUDITABLE RESEARCH LOOP</text><text x="34" y="72" class="h1">Every transition has an owner, artifact and gate.</text><rect x="34" y="118" width="198" height="150" rx="18" fill="#07162B" stroke="#2E8CFF" stroke-width="2"/>
<circle cx="64" cy="148" r="17" fill="#0B2444" stroke="#2E8CFF" stroke-width="2"/>
<text x="64" y="153" text-anchor="middle" class="mono">01</text>
<text x="56" y="194" class="t">INTAKE</text>
<text x="56" y="222" class="s">question</text>
<text x="56" y="246" class="s">observable</text><path d="M 237 193 H 252" stroke="#6E88A8" stroke-width="3"/>
<path d="M 248 186 L 257 193 L 248 200" fill="none" stroke="#6E88A8" stroke-width="3"/><rect x="255" y="118" width="198" height="150" rx="18" fill="#07162B" stroke="#18B7D4" stroke-width="2"/>
<circle cx="285" cy="148" r="17" fill="#0B2444" stroke="#18B7D4" stroke-width="2"/>
<text x="285" y="153" text-anchor="middle" class="mono">02</text>
<text x="277" y="194" class="t">MODEL</text>
<text x="277" y="222" class="s">identity</text>
<text x="277" y="246" class="s">assumptions</text><path d="M 458 193 H 473" stroke="#6E88A8" stroke-width="3"/>
<path d="M 469 186 L 478 193 L 469 200" fill="none" stroke="#6E88A8" stroke-width="3"/><rect x="476" y="118" width="198" height="150" rx="18" fill="#07162B" stroke="#765BFF" stroke-width="2"/>
<circle cx="506" cy="148" r="17" fill="#0B2444" stroke="#765BFF" stroke-width="2"/>
<text x="506" y="153" text-anchor="middle" class="mono">03</text>
<text x="498" y="194" class="t">COMPUTE</text>
<text x="498" y="222" class="s">engine</text>
<text x="498" y="246" class="s">provenance</text><path d="M 679 193 H 694" stroke="#6E88A8" stroke-width="3"/>
<path d="M 690 186 L 699 193 L 690 200" fill="none" stroke="#6E88A8" stroke-width="3"/><rect x="697" y="118" width="198" height="150" rx="18" fill="#07162B" stroke="#F59E0B" stroke-width="2"/>
<circle cx="727" cy="148" r="17" fill="#0B2444" stroke="#F59E0B" stroke-width="2"/>
<text x="727" y="153" text-anchor="middle" class="mono">04</text>
<text x="719" y="194" class="t">VALIDATE</text>
<text x="719" y="222" class="s">technical</text>
<text x="719" y="246" class="s">scientific</text><path d="M 900 193 H 915" stroke="#6E88A8" stroke-width="3"/>
<path d="M 911 186 L 920 193 L 911 200" fill="none" stroke="#6E88A8" stroke-width="3"/><rect x="918" y="118" width="198" height="150" rx="18" fill="#07162B" stroke="#22C55E" stroke-width="2"/>
<circle cx="948" cy="148" r="17" fill="#0B2444" stroke="#22C55E" stroke-width="2"/>
<text x="948" y="153" text-anchor="middle" class="mono">05</text>
<text x="940" y="194" class="t">CLAIM</text>
<text x="940" y="222" class="s">scope</text>
<text x="940" y="246" class="s">evidence grade</text><rect x="34" y="295" width="1112" height="82" rx="16" fill="#061225" stroke="#2C5E98"/>
<text x="56" y="326" class="ey">EVIDENCE LEDGER</text>
<path d="M 210 338 H 322" stroke="#2E8CFF" stroke-width="4"/><text x="340" y="343" class="s">artifact hash</text>
<path d="M 500 338 H 612" stroke="#18B7D4" stroke-width="4"/><text x="630" y="343" class="s">method fingerprint</text>
<path d="M 800 338 H 912" stroke="#765BFF" stroke-width="4"/><text x="930" y="343" class="s">acceptance status</text>
<rect x="820" y="396" width="332" height="22" rx="7" fill="#07192F" stroke="#2E7CC8"/>
<text x="986" y="411" text-anchor="middle" class="mono">SYNTHETIC DEMO · NOT SCIENTIFIC DATA</text>
</svg>