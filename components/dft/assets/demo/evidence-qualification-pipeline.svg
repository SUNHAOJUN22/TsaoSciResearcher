<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Scoped L3 acceleration evidence qualification pipeline</title>
  <desc id="desc">Synthetic evidence pipeline from schema validation and identity checks through parser acceptance, numerical equivalence, repeated performance observations and signed review. Not scientific data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17142d"/></linearGradient>
    <linearGradient id="gate1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="gate2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="gate3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#db2777"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <linearGradient id="pass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#84cc16"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".38"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/></marker>
  </defs>
  <rect width="1120" height="500" rx="28" fill="url(#bg)"/>
  <g opacity=".13" stroke="#818cf8"><path d="M0 110H1120M0 220H1120M0 330H1120M0 440H1120"/><path d="M140 0V500M280 0V500M420 0V500M560 0V500M700 0V500M840 0V500M980 0V500"/></g>
  <text x="54" y="60" fill="#f8fafc" font-size="28" font-family="Inter,Segoe UI,sans-serif" font-weight="700">Scoped L3 acceleration evidence qualification</text>
  <text x="54" y="88" fill="#a5b4fc" font-size="15" font-family="Inter,Segoe UI,sans-serif">Qualification is a gated evidence decision—not a self-reported speedup or automatic public capability promotion.</text>

  <g font-family="Inter,Segoe UI,sans-serif" filter="url(#shadow)">
    <g transform="translate(45 145)">
      <rect width="160" height="170" rx="22" fill="#0c2940" stroke="#38bdf8"/>
      <circle cx="80" cy="48" r="28" fill="url(#gate1)"/>
      <text x="80" y="56" text-anchor="middle" fill="white" font-size="20" font-weight="800">01</text>
      <text x="80" y="94" text-anchor="middle" fill="#e0f2fe" font-size="16" font-weight="700">Schema</text>
      <text x="80" y="119" text-anchor="middle" fill="#bae6fd" font-size="12">strict types</text>
      <text x="80" y="138" text-anchor="middle" fill="#7dd3fc" font-size="12">finite values</text>
      <text x="80" y="157" text-anchor="middle" fill="#7dd3fc" font-size="12">no extra fields</text>
    </g>
    <g transform="translate(225 145)">
      <rect width="160" height="170" rx="22" fill="#171d46" stroke="#818cf8"/>
      <circle cx="80" cy="48" r="28" fill="url(#gate2)"/>
      <text x="80" y="56" text-anchor="middle" fill="white" font-size="20" font-weight="800">02</text>
      <text x="80" y="94" text-anchor="middle" fill="#eef2ff" font-size="16" font-weight="700">Identity</text>
      <text x="80" y="119" text-anchor="middle" fill="#c7d2fe" font-size="12">engine + build</text>
      <text x="80" y="138" text-anchor="middle" fill="#a5b4fc" font-size="12">hardware + topology</text>
      <text x="80" y="157" text-anchor="middle" fill="#a5b4fc" font-size="12">input + method</text>
    </g>
    <g transform="translate(405 145)">
      <rect width="160" height="170" rx="22" fill="#27163d" stroke="#c084fc"/>
      <circle cx="80" cy="48" r="28" fill="url(#gate2)"/>
      <text x="80" y="56" text-anchor="middle" fill="white" font-size="20" font-weight="800">03</text>
      <text x="80" y="94" text-anchor="middle" fill="#f3e8ff" font-size="16" font-weight="700">Parser</text>
      <text x="80" y="119" text-anchor="middle" fill="#e9d5ff" font-size="12">normal termination</text>
      <text x="80" y="138" text-anchor="middle" fill="#d8b4fe" font-size="12">fatal markers</text>
      <text x="80" y="157" text-anchor="middle" fill="#d8b4fe" font-size="12">required observables</text>
    </g>
    <g transform="translate(585 145)">
      <rect width="160" height="170" rx="22" fill="#3a1732" stroke="#fb7185"/>
      <circle cx="80" cy="48" r="28" fill="url(#gate3)"/>
      <text x="80" y="56" text-anchor="middle" fill="white" font-size="20" font-weight="800">04</text>
      <text x="80" y="94" text-anchor="middle" fill="#ffe4e6" font-size="16" font-weight="700">Equivalence</text>
      <text x="80" y="119" text-anchor="middle" fill="#fecdd3" font-size="12">energy · forces</text>
      <text x="80" y="138" text-anchor="middle" fill="#fda4af" font-size="12">stress · properties</text>
      <text x="80" y="157" text-anchor="middle" fill="#fda4af" font-size="12">task tolerances</text>
    </g>
    <g transform="translate(765 145)">
      <rect width="160" height="170" rx="22" fill="#2d2210" stroke="#fbbf24"/>
      <circle cx="80" cy="48" r="28" fill="#f59e0b"/>
      <text x="80" y="56" text-anchor="middle" fill="white" font-size="20" font-weight="800">05</text>
      <text x="80" y="94" text-anchor="middle" fill="#fef3c7" font-size="16" font-weight="700">Performance</text>
      <text x="80" y="119" text-anchor="middle" fill="#fde68a" font-size="12">≥ 3 real repeats</text>
      <text x="80" y="138" text-anchor="middle" fill="#fcd34d" font-size="12">median + dispersion</text>
      <text x="80" y="157" text-anchor="middle" fill="#fcd34d" font-size="12">CPU reference</text>
    </g>
    <g transform="translate(945 145)">
      <rect width="130" height="170" rx="22" fill="#15321e" stroke="#4ade80"/>
      <circle cx="65" cy="48" r="28" fill="url(#pass)"/>
      <text x="65" y="56" text-anchor="middle" fill="white" font-size="20" font-weight="800">06</text>
      <text x="65" y="94" text-anchor="middle" fill="#ecfdf5" font-size="16" font-weight="700">Review</text>
      <text x="65" y="119" text-anchor="middle" fill="#bbf7d0" font-size="12">signed scope</text>
      <text x="65" y="138" text-anchor="middle" fill="#86efac" font-size="12">bundle hashes</text>
      <text x="65" y="157" text-anchor="middle" fill="#86efac" font-size="12">independent approval</text>
    </g>
  </g>

  <g stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)">
    <path d="M205 230H218"/><path d="M385 230H398"/><path d="M565 230H578"/><path d="M745 230H758"/><path d="M925 230H938"/>
  </g>

  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="190" y="365" width="740" height="62" rx="24" fill="#112b22" stroke="#34d399" stroke-width="1.5"/>
    <text x="560" y="393" text-anchor="middle" fill="#d1fae5" font-size="19" font-weight="800">QUALIFIED_FOR_SCOPED_L3_PERFORMANCE_EVIDENCE</text>
    <text x="560" y="415" text-anchor="middle" fill="#86efac" font-size="13">Valid only for the recorded engine, build, hardware, input, method and review scope.</text>
    <rect x="334" y="442" width="452" height="28" rx="14" fill="#221b36" stroke="#8b5cf6"/>
    <text x="560" y="461" text-anchor="middle" fill="#ddd6fe" font-size="12" font-weight="700">PUBLIC CAPABILITY REMAINS L2 UNTIL SEPARATELY REVIEWED</text>
  </g>
  <text x="1090" y="486" text-anchor="end" fill="#fbbf24" font-size="11" font-family="Inter,Segoe UI,sans-serif">SYNTHETIC DEMO · NOT SCIENTIFIC DATA</text>
</svg>
