<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TsaoDFT numerical equivalence and performance qualification</title>
  <desc id="desc">Synthetic evidence pipeline with tolerance equation, median speed ratio, repeated runs and external hold.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1d2537"/></linearGradient>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5eead4"/></marker>
    <filter id="shadow2"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="75" y="80" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="43" font-weight="700">Numerical Equivalence Before Performance Qualification</text>
  <text x="75" y="123" fill="#99f6e4" font-family="Inter,Segoe UI,Arial" font-size="23">AI-assisted deterministic SVG · SYNTHETIC DEMO · NOT SCIENTIFIC DATA</text>
  <g filter="url(#shadow2)" font-family="Inter,Segoe UI,Arial">
    <rect x="80" y="190" width="290" height="190" rx="25" fill="#163047" stroke="#38bdf8" stroke-width="2"/>
    <text x="115" y="245" fill="#7dd3fc" font-size="25" font-weight="700">1 · Immutable identity</text>
    <text x="115" y="295" fill="#e2e8f0" font-size="20">input SHA-256</text>
    <text x="115" y="328" fill="#e2e8f0" font-size="20">method/build/site</text>
    <text x="115" y="361" fill="#e2e8f0" font-size="20">hardware/run/artifact</text>
    <rect x="430" y="190" width="330" height="190" rx="25" fill="#163047" stroke="#a78bfa" stroke-width="2"/>
    <text x="465" y="245" fill="#c4b5fd" font-size="25" font-weight="700">2 · Scientific equivalence</text>
    <text x="465" y="302" fill="#f8fafc" font-size="24" font-family="Cambria Math,Times New Roman,serif">|x − xref| ≤ atol + rtol |xref|</text>
    <text x="465" y="350" fill="#e2e8f0" font-size="19">same observables · finite values</text>
    <rect x="820" y="190" width="300" height="190" rx="25" fill="#163047" stroke="#34d399" stroke-width="2"/>
    <text x="855" y="245" fill="#6ee7b7" font-size="25" font-weight="700">3 · Repeated timing</text>
    <text x="855" y="302" fill="#f8fafc" font-size="24" font-family="Cambria Math,Times New Roman,serif">S = median(tref) / median(tcand)</text>
    <text x="855" y="350" fill="#e2e8f0" font-size="19">n ≥ 3 · contiguous repeats</text>
    <rect x="1180" y="190" width="340" height="190" rx="25" fill="#3c2712" stroke="#f59e0b" stroke-width="2"/>
    <text x="1215" y="245" fill="#fbbf24" font-size="25" font-weight="700">4 · Scoped qualification</text>
    <text x="1215" y="295" fill="#f8fafc" font-size="20">parser accepted</text>
    <text x="1215" y="328" fill="#f8fafc" font-size="20">artifacts VERIFIED</text>
    <text x="1215" y="361" fill="#fb923c" font-size="21" font-weight="700">otherwise EXTERNAL_HOLD</text>
  </g>
  <path d="M370 285 H420" stroke="#5eead4" stroke-width="5" marker-end="url(#arrow2)"/>
  <path d="M760 285 H810" stroke="#5eead4" stroke-width="5" marker-end="url(#arrow2)"/>
  <path d="M1120 285 H1170" stroke="#5eead4" stroke-width="5" marker-end="url(#arrow2)"/>
  <g font-family="Inter,Segoe UI,Arial" filter="url(#shadow2)">
    <rect x="150" y="500" width="600" height="220" rx="28" fill="#0f2a32" stroke="#2dd4bf" stroke-width="2"/>
    <text x="190" y="555" fill="#5eead4" font-size="28" font-weight="700">Accepted software evidence</text>
    <text x="190" y="605" fill="#e2e8f0" font-size="21">Schema + strict parsing + deterministic reference</text>
    <text x="190" y="642" fill="#e2e8f0" font-size="21">Linux/Windows gates + SBOM + CodeQL</text>
    <text x="190" y="679" fill="#6ee7b7" font-size="22" font-weight="700">SOFTWARE_ACCEPTANCE_READY</text>
    <rect x="850" y="500" width="600" height="220" rx="28" fill="#3a1f1f" stroke="#fb7185" stroke-width="2"/>
    <text x="890" y="555" fill="#fda4af" font-size="28" font-weight="700">Evidence not supplied by this repository</text>
    <text x="890" y="605" fill="#e2e8f0" font-size="21">licensed solver + fixed input + real hardware</text>
    <text x="890" y="642" fill="#e2e8f0" font-size="21">scientific reference + repeated real execution</text>
    <text x="890" y="679" fill="#fb923c" font-size="22" font-weight="700">EXTERNAL_HOLD</text>
  </g>
  <text x="75" y="830" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial" font-size="20">No performance ratio is valid unless identity, numerical equivalence and artifact verification all pass first.</text>
</svg>
