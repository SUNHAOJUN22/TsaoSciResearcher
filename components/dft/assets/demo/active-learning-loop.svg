<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-label="DFT + ML active-learning loop">
<title>DFT + ML active-learning loop</title>
<desc>A synthetic active-learning loop with acquisition and acceptance gates. Synthetic demonstration only and not scientific data.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030816"/>
    <stop offset="0.55" stop-color="#071529"/>
    <stop offset="1" stop-color="#061020"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2E8CFF"/><stop offset="1" stop-color="#62D4FF"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6D5DFB"/><stop offset="1" stop-color="#D06BFF"/>
  </linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#FB4B5A"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#173052" stroke-width="1" opacity=".55"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .h1 {font:700 30px Inter,Segoe UI,sans-serif;fill:#F4F8FF}
    .ey {font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.4px;fill:#66C8FF}
    .t {font:600 16px Inter,Segoe UI,sans-serif;fill:#CFE3FF}
    .s {font:400 13px Inter,Segoe UI,sans-serif;fill:#9FB5D2}
    .mono {font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#76D9FF}
    .chip {font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace}
  </style>
</defs>
<rect width="1080" height="480" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1078" height="478" rx="23" fill="none" stroke="#23528C" stroke-width="2"/>
<rect width="1080" height="480" rx="24" fill="url(#grid)" opacity=".42"/>
<text x="34" y="34" class="ey">ACTIVE LEARNING · ACQUISITION · STOP RULE</text><text x="34" y="72" class="h1">Selection is a decision policy, not a proof of novelty.</text><circle cx="340" cy="135" r="58" fill="#07162B" stroke="#2E8CFF" stroke-width="3" filter="url(#glow)"/><text x="340" y="141" text-anchor="middle" class="t">DATASET</text><circle cx="515" cy="250" r="58" fill="#07162B" stroke="#765BFF" stroke-width="3" filter="url(#glow)"/><text x="515" y="256" text-anchor="middle" class="t">MODEL</text><circle cx="340" cy="390" r="58" fill="#07162B" stroke="#F59E0B" stroke-width="3" filter="url(#glow)"/><text x="340" y="396" text-anchor="middle" class="t">ACQUIRE</text><circle cx="165" cy="250" r="58" fill="#07162B" stroke="#22C55E" stroke-width="3" filter="url(#glow)"/><text x="165" y="256" text-anchor="middle" class="t">DFT</text><path d="M 385 154 C 450 165 480 190 490 215" fill="none" stroke="#62D4FF" stroke-width="3"/><path d="M 495 295 C 472 338 430 366 390 375" fill="none" stroke="#C96BFF" stroke-width="3"/><path d="M 290 375 C 240 360 195 325 180 298" fill="none" stroke="#F59E0B" stroke-width="3"/><path d="M 183 205 C 205 168 250 145 295 138" fill="none" stroke="#22C55E" stroke-width="3"/><rect x="650" y="105" width="396" height="96" rx="16" fill="#07152A" stroke="#2E8CFF" stroke-width="1.5"/>
<text x="668" y="133" class="t">Acquisition contract</text>
<text x="668" y="154" class="s">objective · constraints · diversity · batch size</text><rect x="650" y="217" width="396" height="96" rx="16" fill="#07152A" stroke="#765BFF" stroke-width="1.5"/>
<text x="668" y="245" class="t">Stop criterion</text>
<text x="668" y="266" class="s">budget · calibration · no-gain threshold</text><rect x="650" y="329" width="396" height="96" rx="16" fill="#07152A" stroke="#22C55E" stroke-width="1.5"/>
<text x="668" y="357" class="t">Acceptance boundary</text>
<text x="668" y="378" class="s">unvalidated DFT never enters training</text>
<rect x="720" y="446" width="332" height="22" rx="7" fill="#07192F" stroke="#2E7CC8"/>
<text x="886" y="461" text-anchor="middle" class="mono">SYNTHETIC DEMO · NOT SCIENTIFIC DATA</text>
</svg>