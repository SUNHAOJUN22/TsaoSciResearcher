<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-label="HPC execution and provenance">
<title>HPC execution and provenance</title>
<desc>A synthetic HPC execution lineage with resource and provenance controls. Synthetic demonstration only and not scientific data.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030816"/>
    <stop offset="0.55" stop-color="#071529"/>
    <stop offset="1" stop-color="#061020"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2E8CFF"/><stop offset="1" stop-color="#62D4FF"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6D5DFB"/><stop offset="1" stop-color="#D06BFF"/>
  </linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#FB4B5A"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#173052" stroke-width="1" opacity=".55"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .h1 {font:700 30px Inter,Segoe UI,sans-serif;fill:#F4F8FF}
    .ey {font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.4px;fill:#66C8FF}
    .t {font:600 16px Inter,Segoe UI,sans-serif;fill:#CFE3FF}
    .s {font:400 13px Inter,Segoe UI,sans-serif;fill:#9FB5D2}
    .mono {font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#76D9FF}
    .chip {font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace}
  </style>
</defs>
<rect width="1120" height="450" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1118" height="448" rx="23" fill="none" stroke="#23528C" stroke-width="2"/>
<rect width="1120" height="450" rx="24" fill="url(#grid)" opacity=".42"/>
<text x="34" y="34" class="ey">SCHEDULER · CHECKPOINT · RESTART · HASH</text><text x="34" y="72" class="h1">Scheduler completion is not scientific acceptance.</text><rect x="34" y="100" width="720" height="280" rx="16" fill="#07152A" stroke="#27598F" stroke-width="1.5"/>
<text x="52" y="128" class="t">Immutable execution lineage</text>
<text x="52" y="149" class="s">submitted → running → checkpoint → parser → archive</text><circle cx="92" cy="235" r="28" fill="#07162B" stroke="#2E8CFF" stroke-width="3"/><text x="92" y="240" text-anchor="middle" class="chip" fill="#E8F4FF">SUBMIT</text><path d="M 120 235 C 156 235, 156 295, 192 295" fill="none" stroke="#6E8DB4" stroke-width="3"/><circle cx="220" cy="295" r="28" fill="#07162B" stroke="#18B7D4" stroke-width="3"/><text x="220" y="300" text-anchor="middle" class="chip" fill="#E8F4FF">RUN</text><path d="M 248 295 C 285 295, 285 235, 322 235" fill="none" stroke="#6E8DB4" stroke-width="3"/><circle cx="350" cy="235" r="28" fill="#07162B" stroke="#765BFF" stroke-width="3"/><text x="350" y="240" text-anchor="middle" class="chip" fill="#E8F4FF">CHECKPOINT</text><path d="M 378 235 C 415 235, 415 295, 452 295" fill="none" stroke="#6E8DB4" stroke-width="3"/><circle cx="480" cy="295" r="28" fill="#07162B" stroke="#F59E0B" stroke-width="3"/><text x="480" y="300" text-anchor="middle" class="chip" fill="#E8F4FF">PARSE</text><path d="M 508 295 C 545 295, 545 235, 582 235" fill="none" stroke="#6E8DB4" stroke-width="3"/><circle cx="610" cy="235" r="28" fill="#07162B" stroke="#22C55E" stroke-width="3"/><text x="610" y="240" text-anchor="middle" class="chip" fill="#E8F4FF">ARCHIVE</text><path d="M 638 235 C 655 235, 655 295, 672 295" fill="none" stroke="#6E8DB4" stroke-width="3"/><circle cx="700" cy="295" r="28" fill="#07162B" stroke="#C96BFF" stroke-width="3"/><text x="700" y="300" text-anchor="middle" class="chip" fill="#E8F4FF">CLAIM</text><rect x="780" y="100" width="306" height="116" rx="16" fill="#07152A" stroke="#2E8CFF" stroke-width="1.5"/>
<text x="798" y="128" class="t">Resource guard</text>
<text x="798" y="149" class="s">MPI × OpenMP × BLAS ≤ allocation</text><rect x="780" y="232" width="306" height="148" rx="16" fill="#07152A" stroke="#22C55E" stroke-width="1.5"/>
<text x="798" y="260" class="t">Provenance record</text>
<text x="798" y="281" class="s">script hash · environment · outputs · restart lineage</text><text x="808" y="322" class="mono">SHA256  3a5c…9f2b</text>
<text x="808" y="350" class="mono">ATTEMPT  03 / compatible</text>
<rect x="760" y="416" width="332" height="22" rx="7" fill="#07192F" stroke="#2E7CC8"/>
<text x="926" y="431" text-anchor="middle" class="mono">SYNTHETIC DEMO · NOT SCIENTIFIC DATA</text>
</svg>