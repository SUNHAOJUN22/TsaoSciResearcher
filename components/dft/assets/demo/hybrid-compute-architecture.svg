<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid Python native and engine compute architecture</title>
  <desc id="desc">Synthetic conceptual architecture showing a Python control plane, backend-neutral array interface, optional native CPU and GPU kernels, and external DFT engines. Not scientific data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111a33"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#84cc16"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1120" height="520" rx="28" fill="url(#bg)"/>
  <g opacity=".16" stroke="#38bdf8"><path d="M0 92H1120M0 184H1120M0 276H1120M0 368H1120M0 460H1120"/><path d="M160 0V520M320 0V520M480 0V520M640 0V520M800 0V520M960 0V520"/></g>
  <text x="56" y="62" fill="#f8fafc" font-size="28" font-family="Inter,Segoe UI,sans-serif" font-weight="700">Hybrid scientific-computing architecture</text>
  <text x="56" y="90" fill="#94a3b8" font-size="15" font-family="Inter,Segoe UI,sans-serif">Keep orchestration in Python; move only measured kernels to native or accelerator backends.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="126" width="1012" height="82" rx="20" fill="#0f2744" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="72" y="144" width="206" height="46" rx="14" fill="url(#blue)"/>
    <text x="175" y="172" text-anchor="middle" fill="white" font-size="18" font-family="Inter,Segoe UI,sans-serif" font-weight="700">Python control plane</text>
    <text x="310" y="158" fill="#dbeafe" font-size="14" font-family="Inter,Segoe UI,sans-serif">schemas · manifests · validation · scheduling · provenance</text>
    <text x="310" y="181" fill="#93c5fd" font-size="13" font-family="Inter,Segoe UI,sans-serif">No Kohn–Sham kernels; deterministic CPU fallback remains authoritative.</text>
  </g>

  <path d="M560 208V244" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="168" y="246" width="784" height="74" rx="20" fill="#171b3c" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="560" y="275" text-anchor="middle" fill="#ede9fe" font-size="20" font-family="Inter,Segoe UI,sans-serif" font-weight="700">Backend-neutral numerical boundary</text>
    <text x="560" y="300" text-anchor="middle" fill="#c4b5fd" font-size="14" font-family="Inter,Segoe UI,sans-serif">Array API · DLPack · versioned JSON/argv · content hashes · explicit device ownership</text>
  </g>

  <path d="M360 320V354" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M760 320V354" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="64" y="356" width="470" height="104" rx="22" fill="#102f2c" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="110" cy="408" r="25" fill="url(#green)"/>
    <text x="110" y="415" text-anchor="middle" fill="white" font-size="18" font-family="Inter,Segoe UI,sans-serif" font-weight="700">CPU</text>
    <text x="152" y="391" fill="#d1fae5" font-size="18" font-family="Inter,Segoe UI,sans-serif" font-weight="700">Native kernels</text>
    <text x="152" y="416" fill="#a7f3d0" font-size="14" font-family="Inter,Segoe UI,sans-serif">NumPy / BLAS / LAPACK · C++20 · OpenMP · Kokkos</text>
    <text x="152" y="439" fill="#6ee7b7" font-size="13" font-family="Inter,Segoe UI,sans-serif">Admit only after profile + equivalence + end-to-end gain.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="586" y="356" width="470" height="104" rx="22" fill="#2b173d" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="632" cy="408" r="25" fill="url(#violet)"/>
    <text x="632" y="415" text-anchor="middle" fill="white" font-size="18" font-family="Inter,Segoe UI,sans-serif" font-weight="700">GPU</text>
    <text x="674" y="391" fill="#f3e8ff" font-size="18" font-family="Inter,Segoe UI,sans-serif" font-weight="700">Accelerator plugins</text>
    <text x="674" y="416" fill="#e9d5ff" font-size="14" font-family="Inter,Segoe UI,sans-serif">CUDA · HIP · SYCL · cuBLAS · cuFFT · cuTENSOR</text>
    <text x="674" y="439" fill="#d8b4fe" font-size="13" font-family="Inter,Segoe UI,sans-serif">Data transfer and launch overhead must be measured.</text>
  </g>

  <rect x="382" y="476" width="356" height="25" rx="12" fill="#0b2136" stroke="#38bdf8"/>
  <text x="560" y="494" text-anchor="middle" fill="#bae6fd" font-size="12" font-family="Inter,Segoe UI,sans-serif">EXTERNAL ENGINES: VASP · QE · CP2K · Gaussian</text>
  <text x="1090" y="505" text-anchor="end" fill="#fbbf24" font-size="11" font-family="Inter,Segoe UI,sans-serif">SYNTHETIC DEMO · NOT SCIENTIFIC DATA</text>
</svg>
