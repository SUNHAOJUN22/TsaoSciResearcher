<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">TsaoSciComputation——证据绑定的科学计算编排</title>
<desc id="desc">概念架构图，展示带单位输入、受控外部求解器、数值验证、谱系和独立接受。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset=".55" stop-color="#102b46"/><stop offset="1" stop-color="#2a123f"/></linearGradient>
  <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#45e0bf"/><stop offset=".52" stop-color="#62a9ff"/><stop offset="1" stop-color="#d383ff"/></linearGradient>
  <style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#f7fbff}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#d9f7ff}.muted{fill:#a9c4d8}.head{font-size:50px;font-weight:700}.sub{font-size:27px}.body{font-size:29px}.small{font-size:22px}.eq{font-size:24px}.b1{fill:#0c2539;stroke:#45e0bf;stroke-width:2}.b2{fill:#122b4b;stroke:#62a9ff;stroke-width:2}.b3{fill:#271a42;stroke:#d383ff;stroke-width:2}</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="86" y="95" class="t head">TsaoSciComputation 科学计算编排</text>
<text x="88" y="140" class="t sub">带单位数据 · 有界执行 · 可复现数值证据</text>
<rect x="86" y="180" width="1428" height="4" rx="2" fill="url(#a)"/>
<g transform="translate(92 240)"><rect width="300" height="220" rx="26" class="b1"/><text x="27" y="54" class="t body" font-weight="700">1. 科学数据包络</text><text x="27" y="96" class="t small">数值 · 单位 · 量纲</text><text x="27" y="130" class="t small">方法 · 条件 · 来源</text><text x="27" y="177" class="m eq">q̃ = q / q参考</text></g>
<g transform="translate(430 240)"><rect width="300" height="220" rx="26" class="b2"/><text x="27" y="54" class="t body" font-weight="700">2. 受控求解器</text><text x="27" y="96" class="t small">能力令牌 · 进程树</text><text x="27" y="130" class="t small">有界标准输出与错误</text><text x="27" y="177" class="m eq">已执行 ≠ 已接受</text></g>
<g transform="translate(768 240)"><rect width="300" height="220" rx="26" class="b2"/><text x="27" y="54" class="t body" font-weight="700">3. 数值可信门</text><text x="27" y="96" class="t small">收敛 · 守恒</text><text x="27" y="130" class="t small">网格与时间步不变性</text><text x="27" y="177" class="m eq">η = ||r|| / S ≤ τ</text></g>
<g transform="translate(1106 240)"><rect width="300" height="220" rx="26" class="b3"/><text x="27" y="54" class="t body" font-weight="700">4. 证据接受图</text><text x="27" y="96" class="t small">制品摘要 · 主体角色</text><text x="27" y="130" class="t small">复核 · 时效 · 撤销</text><text x="27" y="177" class="m eq">C5 要求独立性</text></g>
<path d="M392 350 H430 M730 350 H768 M1068 350 H1106" stroke="url(#a)" stroke-width="7" stroke-linecap="round"/>
<g transform="translate(92 520)"><rect width="1314" height="214" rx="30" fill="#081b2f" stroke="#527894" stroke-width="2"/><text x="34" y="54" class="t body" font-weight="700">跨尺度科学计算合同</text><text x="34" y="102" class="m eq">R = 输入 − 输出 + 生成 − 消耗 − 累积</text><text x="34" y="146" class="m eq">状态：已规划 → 已执行 → 已收敛 → 已验证 → 已独立接受</text><text x="34" y="189" class="t small muted">严格 JSON、有限实数、显式量纲与不可变谱系，阻止静默补零和自签接受。</text></g>
<text x="92" y="820" class="t small">愿景：构建从量子化学到流程系统的统一、可治理计算织体</text>
<text x="92" y="858" class="t small muted">AI 设计概念图 · 不构成真实外部求解器、HPC 或科学接受证据</text>
</svg>
