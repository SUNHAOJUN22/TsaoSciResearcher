<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" data-design-system="uiux-pro-max-scientific-console-v4" data-icon-system="uiux-pro-max-line-v1" data-density="balanced" data-layout="workflow" data-family="qualification">
  <title id="title">Correctness-first external execution qualification ladder</title>
  <desc id="desc">A five-stage qualification sequence moves from identity integrity through trusted CPU correctness, accelerator equivalence, physical validation and measured performance.</desc>
  <style>
    .eyebrow { fill: #22D3EE; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1.4px; }
    .heading { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 38px; font-weight: 700; }
    .subtitle { fill: #D1D9E6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 18px; font-weight: 400; }
    .stage { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 21px; font-weight: 650; }
    .detail { fill: #D1D9E6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .mono { fill: #D1D9E6; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .gate { fill: #D1D9E6; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .footer { fill: #93A4BB; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .card { fill: #0F1B2D; stroke: #334865; stroke-width: 2; }
    .raised { fill: #162338; stroke: #334865; stroke-width: 2; }
    .line { fill: none; stroke: #93A4BB; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="620" rx="24" fill="#07111F"/>
  <rect x="24" y="24" width="1152" height="572" rx="20" fill="none" stroke="#334865" stroke-width="2"/>
  <text x="56" y="58" class="eyebrow">QUALIFICATION · WORKFLOW</text>
  <text x="56" y="108" class="heading">Correctness before performance</text>
  <text x="56" y="142" class="subtitle">Every stage inherits the evidence obligations of all earlier stages.</text>
  <rect x="970" y="42" width="174" height="34" rx="17" fill="#162338" stroke="#334865"/>
  <text x="1057" y="65" text-anchor="middle" class="mono">EVIDENCE BOUND</text>

  <line x1="150" y1="286" x2="1048" y2="286" class="line"/>
  <path d="M1034 274L1050 286L1034 298" fill="none" stroke="#93A4BB" stroke-width="2.5"/>
  <g><circle cx="150" cy="286" r="38" fill="#162338" stroke="#60A5FA" stroke-width="3"/><text x="150" y="281" text-anchor="middle" class="mono">01</text><text x="150" y="305" text-anchor="middle" class="detail">IDENTITY</text></g>
  <g><circle cx="375" cy="286" r="38" fill="#162338" stroke="#22D3EE" stroke-width="3"/><text x="375" y="281" text-anchor="middle" class="mono">02</text><text x="375" y="305" text-anchor="middle" class="detail">CPU REF</text></g>
  <g><circle cx="600" cy="286" r="38" fill="#162338" stroke="#2DD4BF" stroke-width="3"/><text x="600" y="281" text-anchor="middle" class="mono">03</text><text x="600" y="305" text-anchor="middle" class="detail">EQUIV</text></g>
  <g><circle cx="825" cy="286" r="38" fill="#162338" stroke="#4ADE80" stroke-width="3"/><text x="825" y="281" text-anchor="middle" class="mono">04</text><text x="825" y="305" text-anchor="middle" class="detail">PHYSICAL</text></g>
  <g><circle cx="1050" cy="286" r="38" fill="#162338" stroke="#FBBF24" stroke-width="3"/><text x="1050" y="281" text-anchor="middle" class="mono">05</text><text x="1050" y="305" text-anchor="middle" class="detail">PERF</text></g>
  <rect x="58" y="366" width="1084" height="112" rx="18" class="card"/>
  <text x="84" y="402" class="stage">Qualification invariant</text>
  <text x="84" y="436" class="mono">identity → CPU correctness → GPU/MPI equivalence → performance</text>
  <text x="84" y="466" class="detail">A later gate cannot repair missing evidence from an earlier gate.</text>

  <circle cx="60" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="78" y="554" class="gate">NUMERICAL</text>
  <circle cx="244" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="262" y="554" class="gate">CONVERGENCE</text>
  <circle cx="428" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="446" y="554" class="gate">PHYSICAL</text>
  <circle cx="612" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="630" y="554" class="gate">UNCERTAINTY</text>
  <circle cx="796" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="814" y="554" class="gate">APPLICABILITY</text>
  <circle cx="980" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="998" y="554" class="gate">REVIEW</text>
  <text x="56" y="590" class="footer">Performance is meaningful only after identity, correctness and equivalence are established.</text>
</svg>
