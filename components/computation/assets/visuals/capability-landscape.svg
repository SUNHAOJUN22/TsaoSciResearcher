<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" data-design-system="uiux-pro-max-scientific-console-v4" data-icon-system="uiux-pro-max-line-v1" data-density="balanced" data-layout="bento" data-family="architecture">
  <title id="title">Scientific capability landscape</title>
  <desc id="desc">Capabilities, workflows, adapters, evidence and governance are organized as separate layers.</desc>
  <style>
    .eyebrow { fill: #2DD4BF; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1.4px; }
    .heading { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 40px; font-weight: 700; }
    .subtitle { fill: #D1D9E6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 18px; font-weight: 400; }
    .card { fill: #0F1B2D; stroke: #334865; stroke-width: 2; }
    .raised { fill: #162338; stroke: #334865; stroke-width: 2; }
    .index { fill: #F8FAFC; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 700; }
    .stage { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 22px; font-weight: 650; }
    .detail { fill: #D1D9E6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .mono { fill: #D1D9E6; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .gate { fill: #D1D9E6; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .footer { fill: #93A4BB; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .line { fill: none; stroke: #93A4BB; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="620" rx="24" fill="#07111F"/>
  <rect x="24" y="24" width="1152" height="572" rx="20" fill="none" stroke="#334865" stroke-width="2"/>
  <text x="56" y="58" class="eyebrow">ARCHITECTURE · BENTO</text>
  <text x="56" y="108" class="heading">Capability system landscape</text>
  <text x="56.0" y="142.0" text-anchor="start" class="subtitle"><tspan x="56.0" dy="0">A clear hierarchy prevents catalog entries from becoming unsupported execution claims.</tspan></text>
  <g transform="translate(920 104)" fill="none" stroke="#2DD4BF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"><path d="M-18-8L0-17L18-8L0 1Z"/><path d="M-18 1L0 10L18 1"/><path d="M-18 9L0 18L18 9"/></g>
  <rect x="970" y="42" width="174" height="34" rx="17" fill="#162338" stroke="#334865"/>
  <text x="1057" y="65" text-anchor="middle" class="mono">EVIDENCE BOUND</text>
  <rect x="48" y="178" width="426" height="132" rx="18" class="card"/><rect x="48" y="178" width="5" height="132" rx="2" fill="#2DD4BF"/><text x="70" y="216" class="index">01</text><text x="120.0" y="216.0" text-anchor="start" class="stage"><tspan x="120.0" dy="0">Capabilities</tspan></text><text x="70.0" y="260.0" text-anchor="start" class="detail"><tspan x="70.0" dy="0">164 scoped contracts</tspan></text><rect x="490" y="178" width="662" height="132" rx="18" class="card"/><rect x="490" y="178" width="5" height="132" rx="2" fill="#2DD4BF"/><text x="512" y="216" class="index">02</text><text x="562.0" y="216.0" text-anchor="start" class="stage"><tspan x="562.0" dy="0">Workflows</tspan></text><text x="512.0" y="260.0" text-anchor="start" class="detail"><tspan x="512.0" dy="0">20 governed programs</tspan></text><rect x="48" y="326" width="340" height="126" rx="18" class="card"/><rect x="48" y="326" width="5" height="126" rx="2" fill="#2DD4BF"/><text x="70" y="364" class="index">03</text><text x="120.0" y="364.0" text-anchor="start" class="stage"><tspan x="120.0" dy="0">Adapters</tspan></text><text x="70.0" y="408.0" text-anchor="start" class="detail"><tspan x="70.0" dy="0">27 conservative interfaces</tspan></text><rect x="404" y="326" width="340" height="126" rx="18" class="card"/><rect x="404" y="326" width="5" height="126" rx="2" fill="#2DD4BF"/><text x="426" y="364" class="index">04</text><text x="476.0" y="364.0" text-anchor="start" class="stage"><tspan x="476.0" dy="0">Evidence</tspan></text><text x="426.0" y="408.0" text-anchor="start" class="detail"><tspan x="426.0" dy="0">tests · hashes · reports</tspan></text><rect x="760" y="326" width="392" height="126" rx="18" class="card"/><rect x="760" y="326" width="5" height="126" rx="2" fill="#2DD4BF"/><text x="782" y="364" class="index">05</text><text x="832.0" y="364.0" text-anchor="start" class="stage"><tspan x="832.0" dy="0">Governance</tspan></text><text x="782.0" y="408.0" text-anchor="start" class="detail"><tspan x="782.0" dy="0">policy · review · release</tspan></text><rect x="48" y="470" width="1104" height="42" rx="14" fill="#162338" stroke="#334865"/><text x="72" y="497" class="mono">DECISION GATE · declare → verify → review</text>
  <circle cx="60.0" cy="542.0" r="9" fill="none" stroke="#2DD4BF" stroke-width="2"/><text x="78.0" y="548.0" class="gate">NUMERICAL</text><circle cx="244.0" cy="542.0" r="9" fill="none" stroke="#2DD4BF" stroke-width="2"/><text x="262.0" y="548.0" class="gate">CONVERGENCE</text><circle cx="428.0" cy="542.0" r="9" fill="none" stroke="#2DD4BF" stroke-width="2"/><text x="446.0" y="548.0" class="gate">PHYSICAL</text><circle cx="612.0" cy="542.0" r="9" fill="none" stroke="#2DD4BF" stroke-width="2"/><text x="630.0" y="548.0" class="gate">UNCERTAINTY</text><circle cx="796.0" cy="542.0" r="9" fill="none" stroke="#2DD4BF" stroke-width="2"/><text x="814.0" y="548.0" class="gate">APPLICABILITY</text><circle cx="980.0" cy="542.0" r="9" fill="none" stroke="#2DD4BF" stroke-width="2"/><text x="998.0" y="548.0" class="gate">REVIEW</text>
  <text x="56.0" y="590.0" text-anchor="start" class="footer"><tspan x="56.0" dy="0">Declared capability, available software and validated live execution are distinct states.</tspan></text>
