  <text x="1057" y="65" text-anchor="middle" class="mono">EVIDENCE BOUND</text>
  <rect x="48" y="190" width="344" height="156" rx="18" class="card"/><rect x="48" y="190" width="344" height="5" rx="2" fill="#F87171"/><text x="70" y="230" class="index">01</text><text x="70.0" y="270.0" text-anchor="start" class="stage"><tspan x="70.0" dy="0">Baseline</tspan></text><text x="70.0" y="310.0" text-anchor="start" class="detail"><tspan x="70.0" dy="0">batch · CSTR · PFR</tspan></text><rect x="416" y="190" width="344" height="156" rx="18" class="card"/><rect x="416" y="190" width="344" height="5" rx="2" fill="#F87171"/><text x="438" y="230" class="index">02</text><text x="438.0" y="270.0" text-anchor="start" class="stage"><tspan x="438.0" dy="0">RTD</tspan></text><text x="438.0" y="310.0" text-anchor="start" class="detail"><tspan x="438.0" dy="0">mixing · bypass · dispersion</tspan></text><rect x="784" y="190" width="344" height="156" rx="18" class="card"/><rect x="784" y="190" width="344" height="5" rx="2" fill="#F87171"/><text x="806" y="230" class="index">03</text><text x="806.0" y="270.0" text-anchor="start" class="stage"><tspan x="806.0" dy="0">Thermal</tspan></text><text x="806.0" y="310.0" text-anchor="start" class="detail"><tspan x="806.0" dy="0">release · removal · runaway</tspan></text><rect x="48" y="366" width="528" height="86" rx="18" class="raised"/><text x="70" y="402" class="index">04</text><text x="124.0" y="402.0" text-anchor="start" class="stage"><tspan x="124.0" dy="0">Scale</tspan></text><text x="70.0" y="434.0" text-anchor="start" class="detail"><tspan x="70.0" dy="0">geometry · transfer · fit</tspan></text><rect x="600" y="366" width="528" height="86" rx="18" class="raised"/><text x="622" y="402" class="index">05</text><text x="676.0" y="402.0" text-anchor="start" class="stage"><tspan x="676.0" dy="0">Margin</tspan></text><text x="622.0" y="434.0" text-anchor="start" class="detail"><tspan x="622.0" dy="0">scenario · protection · review</tspan></text><rect x="278" y="474" width="644" height="42" rx="14" fill="#162338" stroke="#F87171" stroke-width="2"/><text x="600" y="501" text-anchor="middle" class="mono">BARRIER · LIMIT · ESCALATE</text>
  <circle cx="60.0" cy="542.0" r="9" fill="none" stroke="#F87171" stroke-width="2"/><text x="78.0" y="548.0" class="gate">NUMERICAL</text><circle cx="244.0" cy="542.0" r="9" fill="none" stroke="#F87171" stroke-width="2"/><text x="262.0" y="548.0" class="gate">CONVERGENCE</text><circle cx="428.0" cy="542.0" r="9" fill="none" stroke="#F87171" stroke-width="2"/><text x="446.0" y="548.0" class="gate">PHYSICAL</text><circle cx="612.0" cy="542.0" r="9" fill="none" stroke="#F87171" stroke-width="2"/><text x="630.0" y="548.0" class="gate">UNCERTAINTY</text><circle cx="796.0" cy="542.0" r="9" fill="none" stroke="#F87171" stroke-width="2"/><text x="814.0" y="548.0" class="gate">APPLICABILITY</text><circle cx="980.0" cy="542.0" r="9" fill="none" stroke="#F87171" stroke-width="2"/><text x="998.0" y="548.0" class="gate">REVIEW</text>
  <text x="56.0" y="590.0" text-anchor="start" class="footer"><tspan x="56.0" dy="0">A fitted conversion curve cannot authorize scale-up or dismiss runaway risk.</tspan></text>
