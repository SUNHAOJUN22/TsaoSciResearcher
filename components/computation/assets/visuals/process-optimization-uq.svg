<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" data-design-system="uiux-pro-max-scientific-console-v4" data-icon-system="uiux-pro-max-line-v1" data-density="balanced" data-layout="workflow" data-family="delivery">
  <title id="title">Reproducible scientific software delivery feedback loop</title>
  <desc id="desc">Canonical source, deterministic tests, byte-identical artifacts and reviewed evidence form a rebuild-and-revalidate delivery loop.</desc>
  <style>
    .eyebrow { fill: #22D3EE; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1.4px; }
    .heading { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 38px; font-weight: 700; }
    .subtitle { fill: #D1D9E6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 18px; font-weight: 400; }
    .stage { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 21px; font-weight: 650; }
    .detail { fill: #D1D9E6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .mono { fill: #D1D9E6; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .gate { fill: #D1D9E6; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .footer { fill: #93A4BB; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .card { fill: #0F1B2D; stroke: #334865; stroke-width: 2; }
    .raised { fill: #162338; stroke: #334865; stroke-width: 2; }
    .line { fill: none; stroke: #93A4BB; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="620" rx="24" fill="#07111F"/>
  <rect x="24" y="24" width="1152" height="572" rx="20" fill="none" stroke="#334865" stroke-width="2"/>
  <text x="56" y="58" class="eyebrow">DELIVERY · LOOP</text>
  <text x="56" y="108" class="heading">Reproducible evidence chain</text>
  <text x="56" y="142" class="subtitle">Source, tests, artifacts and review remain linked by deterministic hashes.</text>
  <rect x="970" y="42" width="174" height="34" rx="17" fill="#162338" stroke="#334865"/>
  <text x="1057" y="65" text-anchor="middle" class="mono">EVIDENCE BOUND</text>

  <circle cx="600" cy="328" r="118" fill="#0F1B2D" stroke="#334865" stroke-width="2"/>
  <text x="600" y="314" text-anchor="middle" class="stage">REPRODUCIBLE</text><text x="600" y="346" text-anchor="middle" class="stage">DELIVERY</text><text x="600" y="376" text-anchor="middle" class="detail">hash-bound artifacts</text>
  <rect x="78" y="202" width="210" height="92" rx="16" class="card"/><text x="183" y="237" text-anchor="middle" class="stage">SOURCE</text><text x="183" y="266" text-anchor="middle" class="detail">canonical tree</text>
  <rect x="78" y="384" width="210" height="92" rx="16" class="card"/><text x="183" y="419" text-anchor="middle" class="stage">TEST</text><text x="183" y="448" text-anchor="middle" class="detail">quality · mutation</text>
  <rect x="912" y="202" width="210" height="92" rx="16" class="card"/><text x="1017" y="237" text-anchor="middle" class="stage">ARTIFACT</text><text x="1017" y="266" text-anchor="middle" class="detail">source · wheel · SBOM</text>
  <rect x="912" y="384" width="210" height="92" rx="16" class="card"/><text x="1017" y="419" text-anchor="middle" class="stage">REVIEW</text><text x="1017" y="448" text-anchor="middle" class="detail">accept · reject · hold</text>
  <path d="M288 248C390 180 460 192 518 232" class="line"/><path d="M518 424C438 466 368 468 288 430" class="line"/><path d="M682 232C760 184 838 184 912 248" class="line"/><path d="M912 430C834 474 760 468 682 424" class="line"/>
  <rect x="420" y="464" width="360" height="42" rx="14" fill="#162338" stroke="#22D3EE"/><text x="600" y="491" text-anchor="middle" class="mono">FEEDBACK LOOP · rebuild · revalidate</text>

  <circle cx="60" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="78" y="554" class="gate">NUMERICAL</text>
  <circle cx="244" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="262" y="554" class="gate">CONVERGENCE</text>
  <circle cx="428" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="446" y="554" class="gate">PHYSICAL</text>
  <circle cx="612" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="630" y="554" class="gate">UNCERTAINTY</text>
  <circle cx="796" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="814" y="554" class="gate">APPLICABILITY</text>
  <circle cx="980" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="998" y="554" class="gate">REVIEW</text>
  <text x="56" y="590" class="footer">Any source or evidence change restarts the governed build and validation loop.</text>
</svg>
