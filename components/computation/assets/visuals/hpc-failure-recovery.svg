<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" data-design-system="uiux-pro-max-scientific-console-v4" data-icon-system="uiux-pro-max-line-v1" data-density="balanced" data-layout="risk" data-family="operations">
  <title id="title">HPC failure classification and recovery workflow</title>
  <desc id="desc">Preflight, checkpoint integrity, failure classification, bounded retries and escalation govern automated recovery.</desc>
  <style>
    .eyebrow { fill: #2DD4BF; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1.4px; }
    .heading { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 40px; font-weight: 700; }
    .subtitle { fill: #D1D9E6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 18px; font-weight: 400; }
    .card { fill: #0F1B2D; stroke: #334865; stroke-width: 2; }
    .raised { fill: #162338; stroke: #334865; stroke-width: 2; }
    .index { fill: #F8FAFC; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 700; }
    .stage { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 22px; font-weight: 650; }
    .detail { fill: #D1D9E6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .mono { fill: #D1D9E6; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .gate { fill: #D1D9E6; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .footer { fill: #93A4BB; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .line { fill: none; stroke: #93A4BB; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="620" rx="24" fill="#07111F"/>
  <rect x="24" y="24" width="1152" height="572" rx="20" fill="none" stroke="#334865" stroke-width="2"/>
  <text x="56" y="58" class="eyebrow">OPERATIONS · RISK</text>
  <text x="56" y="108" class="heading">HPC failure and recovery</text>
  <text x="56.0" y="142.0" text-anchor="start" class="subtitle"><tspan x="56.0" dy="0">Recovery is limited by reproducibility, retry budgets and preserved artifacts.</tspan></text>
  <g transform="translate(920 104)" fill="none" stroke="#2DD4BF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"><rect x="-17" y="-14" width="34" height="28" rx="4"/><path d="M-9-7H9M-9 0H9M-9 7H3"/><path d="M-22-7H-17M17-7H22M-22 7H-17M17 7H22"/></g>
  <rect x="970" y="42" width="174" height="34" rx="17" fill="#162338" stroke="#334865"/>
  <text x="1057" y="65" text-anchor="middle" class="mono">EVIDENCE BOUND</text>
  <rect x="48" y="190" width="344" height="156" rx="18" class="card"/><rect x="48" y="190" width="344" height="5" rx="2" fill="#2DD4BF"/><text x="70" y="230" class="index">01</text><text x="70.0" y="270.0" text-anchor="start" class="stage"><tspan x="70.0" dy="0">Preflight</tspan></text><text x="70.0" y="310.0" text-anchor="start" class="detail"><tspan x="70.0" dy="0">software · license · resource</tspan></text><rect x="416" y="190" width="344" height="156" rx="18" class="card"/><rect x="416" y="190" width="344" height="5" rx="2" fill="#2DD4BF"/><text x="438" y="230" class="index">02</text><text x="438.0" y="270.0" text-anchor="start" class="stage"><tspan x="438.0" dy="0">Checkpoint</tspan></text><text x="438.0" y="310.0" text-anchor="start" class="detail"><tspan x="438.0" dy="0">state · hash · restart</tspan></text><rect x="784" y="190" width="344" height="156" rx="18" class="card"/><rect x="784" y="190" width="344" height="5" rx="2" fill="#2DD4BF"/><text x="806" y="230" class="index">03</text><text x="806.0" y="270.0" text-anchor="start" class="stage"><tspan x="806.0" dy="0">Classify</tspan></text><text x="806.0" y="310.0" text-anchor="start" class="detail"><tspan x="806.0" dy="0">input · solver · system</tspan></text><rect x="48" y="366" width="528" height="86" rx="18" class="raised"/><text x="70" y="402" class="index">04</text><text x="124.0" y="402.0" text-anchor="start" class="stage"><tspan x="124.0" dy="0">Retry</tspan></text><text x="70.0" y="434.0" text-anchor="start" class="detail"><tspan x="70.0" dy="0">bounded · changed parameter</tspan></text><rect x="600" y="366" width="528" height="86" rx="18" class="raised"/><text x="622" y="402" class="index">05</text><text x="676.0" y="402.0" text-anchor="start" class="stage"><tspan x="676.0" dy="0">Escalate</tspan></text><text x="622.0" y="434.0" text-anchor="start" class="detail"><tspan x="622.0" dy="0">package · preserve · review</tspan></text><rect x="278" y="474" width="644" height="42" rx="14" fill="#162338" stroke="#2DD4BF" stroke-width="2"/><text x="600" y="501" text-anchor="middle" class="mono">BARRIER · LIMIT · ESCALATE</text>
  <circle cx="60.0" cy="542.0" r="9" fill="none" stroke="#2DD4BF" stroke-width="2"/><text x="78.0" y="548.0" class="gate">NUMERICAL</text><circle cx="244.0" cy="542.0" r="9" fill="none" stroke="#2DD4BF" stroke-width="2"/><text x="262.0" y="548.0" class="gate">CONVERGENCE</text><circle cx="428.0" cy="542.0" r="9" fill="none" stroke="#2DD4BF" stroke-width="2"/><text x="446.0" y="548.0" class="gate">PHYSICAL</text><circle cx="612.0" cy="542.0" r="9" fill="none" stroke="#2DD4BF" stroke-width="2"/><text x="630.0" y="548.0" class="gate">UNCERTAINTY</text><circle cx="796.0" cy="542.0" r="9" fill="none" stroke="#2DD4BF" stroke-width="2"/><text x="814.0" y="548.0" class="gate">APPLICABILITY</text><circle cx="980.0" cy="542.0" r="9" fill="none" stroke="#2DD4BF" stroke-width="2"/><text x="998.0" y="548.0" class="gate">REVIEW</text>
  <text x="56.0" y="590.0" text-anchor="start" class="footer"><tspan x="56.0" dy="0">Unknown failures, corrupted checkpoints or repeated divergence stop automation.</tspan></text>
</svg>
