  <text x="1057" y="65" text-anchor="middle" class="mono">EVIDENCE BOUND</text>
  <rect x="48" y="190" width="344" height="156" rx="18" class="card"/><rect x="48" y="190" width="344" height="5" rx="2" fill="#22D3EE"/><text x="70" y="230" class="index">01</text><text x="70.0" y="270.0" text-anchor="start" class="stage"><tspan x="70.0" dy="0">Geometry</tspan></text><text x="70.0" y="310.0" text-anchor="start" class="detail"><tspan x="70.0" dy="0">domain · BC · mesh</tspan></text><rect x="416" y="190" width="344" height="156" rx="18" class="card"/><rect x="416" y="190" width="344" height="5" rx="2" fill="#22D3EE"/><text x="438" y="230" class="index">02</text><text x="438.0" y="270.0" text-anchor="start" class="stage"><tspan x="438.0" dy="0">Closure</tspan></text><text x="438.0" y="310.0" text-anchor="start" class="detail"><tspan x="438.0" dy="0">laminar · turbulence</tspan></text><rect x="784" y="190" width="344" height="156" rx="18" class="card"/><rect x="784" y="190" width="344" height="5" rx="2" fill="#22D3EE"/><text x="806" y="230" class="index">03</text><text x="806.0" y="270.0" text-anchor="start" class="stage"><tspan x="806.0" dy="0">Phases</tspan></text><text x="806.0" y="310.0" text-anchor="start" class="detail"><tspan x="806.0" dy="0">interface · slip · regime</tspan></text><rect x="48" y="366" width="528" height="86" rx="18" class="raised"/><text x="70" y="402" class="index">04</text><text x="124.0" y="402.0" text-anchor="start" class="stage"><tspan x="124.0" dy="0">Transport</tspan></text><text x="70.0" y="434.0" text-anchor="start" class="detail"><tspan x="70.0" dy="0">heat · species · reaction</tspan></text><rect x="600" y="366" width="528" height="86" rx="18" class="raised"/><text x="622" y="402" class="index">05</text><text x="676.0" y="402.0" text-anchor="start" class="stage"><tspan x="676.0" dy="0">Conserve</tspan></text><text x="622.0" y="434.0" text-anchor="start" class="detail"><tspan x="622.0" dy="0">mass · energy · sensitivity</tspan></text><rect x="278" y="474" width="644" height="42" rx="14" fill="#162338" stroke="#22D3EE" stroke-width="2"/><text x="600" y="501" text-anchor="middle" class="mono">BARRIER · LIMIT · ESCALATE</text>
