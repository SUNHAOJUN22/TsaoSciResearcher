  <text x="56" y="108" class="heading">CFD closures and transport</text>
  <text x="56.0" y="142.0" text-anchor="start" class="subtitle"><tspan x="56.0" dy="0">Flow regime and mesh evidence remain independent of residual history.</tspan></text>
