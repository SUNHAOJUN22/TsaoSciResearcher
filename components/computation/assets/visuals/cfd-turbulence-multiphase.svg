<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" data-design-system="uiux-pro-max-scientific-console-v4" data-icon-system="uiux-pro-max-line-v1" data-density="balanced" data-layout="risk" data-family="continuum">
  <title id="title">CFD turbulence multiphase transport workflow</title>
  <desc id="desc">Geometry, closure models, phase regimes, coupled transport and conservation support CFD evidence.</desc>
  <style>
