<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" data-design-system="uiux-pro-max-scientific-console-v4" data-icon-system="uiux-pro-max-line-v1" data-density="balanced" data-layout="workflow" data-family="evidence">
  <title id="title">Fail-closed solver evidence state machine</title>
  <desc id="desc">Solver evidence advances through candidate, detected, fingerprinted and bounded version-probed states while contradictory evidence is rejected.</desc>
  <style>
    .eyebrow { fill: #22D3EE; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1.4px; }
    .heading { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 38px; font-weight: 700; }
    .subtitle { fill: #D1D9E6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 18px; font-weight: 400; }
    .stage { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 21px; font-weight: 650; }
    .detail { fill: #D1D9E6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .mono { fill: #D1D9E6; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .gate { fill: #D1D9E6; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .footer { fill: #93A4BB; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .card { fill: #0F1B2D; stroke: #334865; stroke-width: 2; }
    .raised { fill: #162338; stroke: #334865; stroke-width: 2; }
    .line { fill: none; stroke: #93A4BB; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="620" rx="24" fill="#07111F"/>
  <rect x="24" y="24" width="1152" height="572" rx="20" fill="none" stroke="#334865" stroke-width="2"/>
  <text x="56" y="58" class="eyebrow">SOLVER EVIDENCE · WORKFLOW</text>
  <text x="56" y="108" class="heading">Evidence state machine</text>
  <text x="56" y="142" class="subtitle">Executable identity becomes stronger without becoming a numerical qualification claim.</text>
  <rect x="970" y="42" width="174" height="34" rx="17" fill="#162338" stroke="#334865"/>
  <text x="1057" y="65" text-anchor="middle" class="mono">EVIDENCE BOUND</text>

  <rect x="48" y="196" width="230" height="126" rx="18" class="card"/><text x="72" y="232" class="stage">candidate-only</text><text x="72" y="264" class="detail">registry candidate</text><text x="72" y="292" class="detail">no executable identity</text>
  <rect x="324" y="196" width="250" height="126" rx="18" class="card"/><text x="348" y="232" class="stage">detected-incomplete</text><text x="348" y="264" class="detail">binary observed</text><text x="348" y="292" class="detail">modules/evidence missing</text>
  <rect x="620" y="196" width="250" height="126" rx="18" class="card"/><text x="644" y="232" class="stage">fingerprinted</text><text x="644" y="264" class="detail">path · size · SHA-256</text><text x="644" y="292" class="detail">no numerical claim</text>
  <rect x="916" y="196" width="236" height="126" rx="18" class="card"/><text x="940" y="232" class="stage">version-probed</text><text x="940" y="264" class="detail">bounded output hash</text><text x="940" y="292" class="detail">still unqualified</text>
  <line x1="278" y1="258" x2="324" y2="258" class="line"/><line x1="574" y1="258" x2="620" y2="258" class="line"/><line x1="870" y1="258" x2="916" y2="258" class="line"/>
  <rect x="182" y="366" width="836" height="100" rx="18" fill="#162338" stroke="#F87171" stroke-width="2"/>
  <text x="208" y="404" class="stage">Contradictory state</text><text x="208" y="438" class="detail">hash/size/version/module mismatch → reject and retain EXTERNAL_HOLD</text>

  <circle cx="60" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="78" y="554" class="gate">NUMERICAL</text>
  <circle cx="244" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="262" y="554" class="gate">CONVERGENCE</text>
  <circle cx="428" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="446" y="554" class="gate">PHYSICAL</text>
  <circle cx="612" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="630" y="554" class="gate">UNCERTAINTY</text>
  <circle cx="796" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="814" y="554" class="gate">APPLICABILITY</text>
  <circle cx="980" cy="548" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="998" y="554" class="gate">REVIEW</text>
  <text x="56" y="590" class="footer">A stronger fingerprint changes evidence strength, not scientific correctness.</text>
</svg>
