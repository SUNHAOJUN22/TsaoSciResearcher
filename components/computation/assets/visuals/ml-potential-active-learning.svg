<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" data-design-system="uiux-pro-max-scientific-console-v4" data-icon-system="uiux-pro-max-line-v1" data-density="balanced" data-layout="loop" data-family="reaction">
  <title id="title">Machine learned potential active learning</title>
  <desc id="desc">Reference labels, committee uncertainty, exploration and validation form a bounded active-learning loop.</desc>
  <style>
    .eyebrow { fill: #4ADE80; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1.4px; }
    .heading { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 40px; font-weight: 700; }
    .subtitle { fill: #D1D9E6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 18px; font-weight: 400; }
    .card { fill: #0F1B2D; stroke: #334865; stroke-width: 2; }
    .raised { fill: #162338; stroke: #334865; stroke-width: 2; }
    .index { fill: #F8FAFC; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 700; }
    .stage { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 22px; font-weight: 650; }
    .detail { fill: #D1D9E6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .mono { fill: #D1D9E6; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .gate { fill: #D1D9E6; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .footer { fill: #93A4BB; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .line { fill: none; stroke: #93A4BB; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="650" rx="24" fill="#07111F"/>
  <rect x="24" y="24" width="1152" height="602" rx="20" fill="none" stroke="#334865" stroke-width="2"/>
  <text x="56" y="58" class="eyebrow">REACTION · LOOP</text>
  <text x="56" y="108" class="heading">ML potentials and active learning</text>
  <text x="56.0" y="142.0" text-anchor="start" class="subtitle"><tspan x="56.0" dy="0">Model uncertainty controls data acquisition and the permitted simulation domain.</tspan></text>
  <g transform="translate(920 104)" fill="none" stroke="#4ADE80" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"><circle cx="-14" cy="8" r="4"/><circle cy="-12" r="4"/><circle cx="14" cy="8" r="4"/><path d="M-10 4L-3-8M3-8L10 4M-9 8H9"/></g>
  <rect x="970" y="42" width="174" height="34" rx="17" fill="#162338" stroke="#334865"/>
  <text x="1057" y="65" text-anchor="middle" class="mono">EVIDENCE BOUND</text>
  <circle cx="600" cy="332" r="126" fill="none" stroke="#334865" stroke-width="2"/><rect x="488" y="148" width="224" height="96" rx="18" class="card"/><circle cx="516" cy="178" r="15" fill="#162338" stroke="#4ADE80" stroke-width="2"/><text x="516" y="184" text-anchor="middle" class="index">1</text><text x="542.0" y="182.0" text-anchor="start" class="stage"><tspan x="542.0" dy="0">Labels</tspan></text><text x="600.0" y="218.0" text-anchor="middle" class="detail"><tspan x="600.0" dy="0">reference method ·</tspan></text><rect x="738" y="242" width="224" height="96" rx="18" class="card"/><circle cx="766" cy="272" r="15" fill="#162338" stroke="#4ADE80" stroke-width="2"/><text x="766" y="278" text-anchor="middle" class="index">2</text><text x="792.0" y="276.0" text-anchor="start" class="stage"><tspan x="792.0" dy="0">Train</tspan></text><text x="850.0" y="312.0" text-anchor="middle" class="detail"><tspan x="850.0" dy="0">split · loss · regularize</tspan></text><rect x="648" y="396" width="224" height="96" rx="18" class="card"/><circle cx="676" cy="426" r="15" fill="#162338" stroke="#4ADE80" stroke-width="2"/><text x="676" y="432" text-anchor="middle" class="index">3</text><text x="702.0" y="430.0" text-anchor="start" class="stage"><tspan x="702.0" dy="0">Committee</tspan></text><text x="760.0" y="466.0" text-anchor="middle" class="detail"><tspan x="760.0" dy="0">disagreement · alarm</tspan></text><rect x="328" y="396" width="224" height="96" rx="18" class="card"/><circle cx="356" cy="426" r="15" fill="#162338" stroke="#4ADE80" stroke-width="2"/><text x="356" y="432" text-anchor="middle" class="index">4</text><text x="382.0" y="430.0" text-anchor="start" class="stage"><tspan x="382.0" dy="0">Explore</tspan></text><text x="440.0" y="466.0" text-anchor="middle" class="detail"><tspan x="440.0" dy="0">sample · query · enrich</tspan></text><rect x="238" y="242" width="224" height="96" rx="18" class="card"/><circle cx="266" cy="272" r="15" fill="#162338" stroke="#4ADE80" stroke-width="2"/><text x="266" y="278" text-anchor="middle" class="index">5</text><text x="292.0" y="276.0" text-anchor="start" class="stage"><tspan x="292.0" dy="0">Accept</tspan></text><text x="350.0" y="312.0" text-anchor="middle" class="detail"><tspan x="350.0" dy="0">forces · dynamics · domain</tspan></text><circle cx="600" cy="332" r="68" fill="#162338" stroke="#4ADE80" stroke-width="3"/><text x="600" y="326" text-anchor="middle" class="mono">FEEDBACK LOOP</text><text x="600" y="350" text-anchor="middle" class="detail">measure · update · revalidate</text>
  <circle cx="60.0" cy="572.0" r="9" fill="none" stroke="#4ADE80" stroke-width="2"/><text x="78.0" y="578.0" class="gate">NUMERICAL</text><circle cx="244.0" cy="572.0" r="9" fill="none" stroke="#4ADE80" stroke-width="2"/><text x="262.0" y="578.0" class="gate">CONVERGENCE</text><circle cx="428.0" cy="572.0" r="9" fill="none" stroke="#4ADE80" stroke-width="2"/><text x="446.0" y="578.0" class="gate">PHYSICAL</text><circle cx="612.0" cy="572.0" r="9" fill="none" stroke="#4ADE80" stroke-width="2"/><text x="630.0" y="578.0" class="gate">UNCERTAINTY</text><circle cx="796.0" cy="572.0" r="9" fill="none" stroke="#4ADE80" stroke-width="2"/><text x="814.0" y="578.0" class="gate">APPLICABILITY</text><circle cx="980.0" cy="572.0" r="9" fill="none" stroke="#4ADE80" stroke-width="2"/><text x="998.0" y="578.0" class="gate">REVIEW</text>
  <text x="56.0" y="620.0" text-anchor="start" class="footer"><tspan x="56.0" dy="0">Low test error alone cannot authorize extrapolative dynamics.</tspan></text>
</svg>
