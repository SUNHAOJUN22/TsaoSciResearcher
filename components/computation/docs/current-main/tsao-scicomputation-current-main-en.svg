<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TsaoSciComputation current-main acceptance architecture</title>
  <desc id="desc">From calculation contracts, execution identity and convergence gates to reproducible multiscale delivery. The repository is a computation control plane and qualification framework; third-party DFT, MD, CFD, FEM and process solvers remain EXTERNAL_HOLD.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset="0.5" stop-color="#082f49"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c4a6e"/><stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC","Noto Sans",Arial,sans-serif;fill:#e5f2ff}
      .title{font-size:54px;font-weight:800}.subtitle{font-size:24px;fill:#a5f3fc}.stage{font-size:25px;font-weight:750}
      .detail{font-size:17px;fill:#c7d2fe}.index{font-size:58px;font-weight:800;fill:#155e75}
      .formula{font-family:"STIX Two Math","Cambria Math","Noto Sans Math","Noto Sans CJK SC",sans-serif;font-size:19px;fill:#ede9fe}
      .micro{font-size:14px;letter-spacing:2px;fill:#67e8f9}.boundary{font-size:18px;fill:#dbeafe}.badge{font-size:16px;fill:#93c5fd}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="90" r="122" fill="#0ea5e9" opacity="0.16"/>
  <circle cx="220" cy="790" r="170" fill="#7c3aed" opacity="0.12"/>
  <text x="48" y="88" class="title">TsaoSciComputation</text>
  <text x="48" y="132" class="subtitle">From calculation contracts, execution identity and convergence gates to reproducible multiscale delivery</text>
  <text x="48" y="184" class="badge">AI-ASSISTED CONCEPTUAL DESIGN · NOT SCIENTIFIC DATA</text>
  <path d="M 319 335 H 349" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/><path d="M 629 335 H 659" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/><path d="M 939 335 H 969" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1249 335 H 1279" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="45" y="228" width="270" height="214" rx="28" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/><text x="69" y="278" class="stage">Question and contract</text><text x="69" y="322" class="detail">Objective, method, data, tolerances</text><text x="69" y="392" class="index">01</text></g><g><rect x="355" y="228" width="270" height="214" rx="28" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/><text x="379" y="278" class="stage">Execution identity</text><text x="379" y="322" class="detail">Solver, input and environment hashes</text><text x="379" y="392" class="index">02</text></g><g><rect x="665" y="228" width="270" height="214" rx="28" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/><text x="689" y="278" class="stage">Resource admission</text><text x="689" y="322" class="detail">CPU/GPU/licence and working directory</text><text x="689" y="392" class="index">03</text></g><g><rect x="975" y="228" width="270" height="214" rx="28" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/><text x="999" y="278" class="stage">Numerical acceptance</text><text x="999" y="322" class="detail">Parsing, convergence, conservation, parity</text><text x="999" y="392" class="index">04</text></g><g><rect x="1285" y="228" width="270" height="214" rx="28" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/><text x="1309" y="278" class="stage">Evidence delivery</text><text x="1309" y="322" class="detail">UQ, applicability and authority</text><text x="1309" y="392" class="index">05</text></g>
  <g><rect x="45" y="520" width="465" height="130" rx="22" fill="#08152f" stroke="#a78bfa" stroke-width="2"/><text x="69" y="574" class="formula">admit(C) = 1_schema · 1_identity · 1_inputs · 1_resources · 1_policy</text><text x="69" y="620" class="micro">CODE CONTRACT 01</text></g><g><rect x="550" y="520" width="465" height="130" rx="22" fill="#08152f" stroke="#a78bfa" stroke-width="2"/><text x="574" y="574" class="formula">H_bundle = SHA256(B_solver ∥ B_inputs ∥ B_env ∥ B_contract ∥ B_reference)</text><text x="574" y="620" class="micro">CODE CONTRACT 02</text></g><g><rect x="1055" y="520" width="465" height="130" rx="22" fill="#08152f" stroke="#a78bfa" stroke-width="2"/><text x="1079" y="574" class="formula">δ_rel = |y − y_ref| / max(|y_ref|, ε) ≤ τ_eq</text><text x="1079" y="620" class="micro">CODE CONTRACT 03</text></g>
  <rect x="45" y="710" width="1510" height="104" rx="24" fill="#071124" stroke="#334155"/>
  <text x="76" y="756" class="micro">QUALIFICATION BOUNDARY</text>
  <text x="76" y="790" class="boundary">The repository is a computation control plane and qualification framework; third-party DFT, MD, CFD, FEM and process solvers remain EXTERNAL_HOLD.</text>
  <text x="48" y="866" class="micro">CURRENT MAIN · EXACT TREE · FINITE NUMERICS · BILINGUAL EVIDENCE</text>
</svg>
