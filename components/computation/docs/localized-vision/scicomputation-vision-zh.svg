<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">TsaoSciComputation 中文跨尺度科学计算愿景图</title>
<desc id="desc">连接计算合同、方法尺度路由、资源准入、授权执行和数值物理验证的中文概念设计图。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06121f"/><stop offset="0.55" stop-color="#10233f"/><stop offset="1" stop-color="#1f2554"/></linearGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#dbeafe" stroke-opacity=".055"/></pattern>
  <style>
    text{font-family:Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei','PingFang SC','WenQuanYi Micro Hei','Segoe UI',Arial,sans-serif}
    .eyebrow{font-size:17px;letter-spacing:3.5px;font-weight:800;fill:#67e8f9}
    .title{font-size:50px;font-weight:850;fill:#f8fafc}
    .subtitle{font-size:21px;fill:#cbd5e1}
    .vision{font-size:18px;font-weight:700;fill:#dbeafe}
    .card-title{font-size:23px;font-weight:800;fill:#f8fafc}
    .card-sub{font-size:15px;fill:#9fb1c8}
    .body{font-size:15px;fill:#d5deea}
    .micro{font-size:12px;fill:#8ea2ba}
    .step{font-size:15px;font-weight:900;fill:#07111f}
    .formula{font-family:'STIX Two Math','Cambria Math','Noto Sans Math','Noto Sans SC',serif;font-size:22px;fill:#e0f2fe}
    .formula-small{font-family:'STIX Two Math','Cambria Math','Noto Sans Math','Noto Sans SC',serif;font-size:17px;fill:#f0f9ff}
    .disclaimer{font-size:12px;font-weight:850;letter-spacing:1.1px;fill:#111827}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<ellipse cx="800" cy="188" rx="610" ry="190" fill="url(#halo)"/>
<g transform="translate(78 54)">
  <text class="eyebrow">TSAO SCI COMPUTATION · 跨尺度科学计算控制平面</text>
  <text class="title" y="63">从基本方程到可复现科学计算</text>
  <text class="subtitle" y="105">计算合同 · 方法路由 · 资源准入 · 授权执行 · 数值/物理验收</text>
</g>
<g transform="translate(1030 68)">
  <rect width="490" height="104" rx="24" fill="#0a1829" stroke="#334155"/>
  <text x="24" y="36" class="vision">项目愿景</text>
  <text x="24" y="70" class="formula-small">连接 DFT、MD、CFD、FEM 与流程模拟，同时保持证据和尺度边界</text>
  <text x="24" y="92" class="micro">专业求解器提供数值内核；本仓库治理身份、执行、验证与交付。</text>
</g>
<g transform="translate(78 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#22d3ee"/><text x="42" y="48" text-anchor="middle" class="step">1</text>
  <text x="24" y="93" class="card-title">计算合同</text>
  <text x="24" y="124" class="card-sub">Question → Contract</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">C=(Q,M,D,R,E,V,U,A)</text>
  <text x="125" y="207" text-anchor="middle" class="micro">明确目标与权限</text>
  <circle cx="34" cy="274" r="6" fill="#22d3ee"/><text x="51" y="280" class="body">观测量与单位</text>
  <circle cx="34" cy="316" r="6" fill="#22d3ee"/><text x="51" y="322" class="body">输入和假设</text>
  <circle cx="34" cy="358" r="6" fill="#22d3ee"/><text x="51" y="364" class="body">验收容差</text>
</g><g transform="translate(370 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#818cf8" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#818cf8"/><text x="42" y="48" text-anchor="middle" class="step">2</text>
  <text x="24" y="93" class="card-title">方法与尺度路由</text>
  <text x="24" y="124" class="card-sub">Method · Scale · Adapter</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">admit(C)=∏1ᵢ</text>
  <text x="125" y="207" text-anchor="middle" class="micro">强制谓词合取</text>
  <circle cx="34" cy="274" r="6" fill="#818cf8"/><text x="51" y="280" class="body">最低充分模型</text>
  <circle cx="34" cy="316" r="6" fill="#818cf8"/><text x="51" y="322" class="body">适配器能力</text>
  <circle cx="34" cy="358" r="6" fill="#818cf8"/><text x="51" y="364" class="body">尺度桥变量</text>
</g><g transform="translate(662 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#c084fc" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#c084fc"/><text x="42" y="48" text-anchor="middle" class="step">3</text>
  <text x="24" y="93" class="card-title">资源准入</text>
  <text x="24" y="124" class="card-sub">CPU · GPU · License</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">Σ rₚ ⪯ c</text>
  <text x="125" y="207" text-anchor="middle" class="micro">容量向量约束</text>
  <circle cx="34" cy="274" r="6" fill="#c084fc"/><text x="51" y="280" class="body">线程与内存</text>
  <circle cx="34" cy="316" r="6" fill="#c084fc"/><text x="51" y="322" class="body">设备独占</text>
  <circle cx="34" cy="358" r="6" fill="#c084fc"/><text x="51" y="364" class="body">许可证 token</text>
</g><g transform="translate(954 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#34d399" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#34d399"/><text x="42" y="48" text-anchor="middle" class="step">4</text>
  <text x="24" y="93" class="card-title">授权执行</text>
  <text x="24" y="124" class="card-sub">Immutable Command Plan</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">Hplan = SHA256(argv∥cwd∥env)</text>
  <text x="125" y="207" text-anchor="middle" class="micro">启动前重新绑定</text>
  <circle cx="34" cy="274" r="6" fill="#34d399"/><text x="51" y="280" class="body">可执行体哈希</text>
  <circle cx="34" cy="316" r="6" fill="#34d399"/><text x="51" y="322" class="body">输入文件哈希</text>
  <circle cx="34" cy="358" r="6" fill="#34d399"/><text x="51" y="364" class="body">受控 PATH</text>
</g><g transform="translate(1246 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#fbbf24"/><text x="42" y="48" text-anchor="middle" class="step">5</text>
  <text x="24" y="93" class="card-title">验证与交付</text>
  <text x="24" y="124" class="card-sub">Numerics · Physics · Evidence</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">A=Cfinite∧Cconv∧Cphysics</text>
  <text x="125" y="207" text-anchor="middle" class="micro">外部结果仍需资格</text>
  <circle cx="34" cy="274" r="6" fill="#fbbf24"/><text x="51" y="280" class="body">收敛与守恒</text>
  <circle cx="34" cy="316" r="6" fill="#fbbf24"/><text x="51" y="322" class="body">不确定度/适用域</text>
  <circle cx="34" cy="358" r="6" fill="#fbbf24"/><text x="51" y="364" class="body">可复现证据包</text>
</g>
<path d="M330 445h28" stroke="#94a3b8" stroke-width="4"/><path d="M358 445l-12-8v16z" fill="#94a3b8"/><path d="M622 445h28" stroke="#94a3b8" stroke-width="4"/><path d="M650 445l-12-8v16z" fill="#94a3b8"/><path d="M914 445h28" stroke="#94a3b8" stroke-width="4"/><path d="M942 445l-12-8v16z" fill="#94a3b8"/><path d="M1206 445h28" stroke="#94a3b8" stroke-width="4"/><path d="M1234 445l-12-8v16z" fill="#94a3b8"/>
<g transform="translate(78 686)">
  <rect width="1444" height="128" rx="25" fill="#091827" stroke="#334155"/>
  <text x="24" y="34" class="vision">核心计算不变量</text>
  <text x="24" y="68" class="formula">Hbundle = SHA256(solver∥inputs∥environment∥contract∥reference)</text>
  <text x="24" y="100" class="formula">||xₖ₊₁−xₖ|| ≤ εabs + εrel||xₖ||   ·   Σy ≈ JΣθJᵀ + Σnum + Σmodel + Σtransfer</text>
</g>
<g transform="translate(78 842)">
  <rect width="640" height="28" rx="14" fill="#f8fafc" opacity=".95"/>
  <text x="320" y="19" text-anchor="middle" class="disclaimer">AI辅助概念设计 · 非科学数据 · 公式对应软件合同而非运行结果</text>
  <text x="1440" y="20" text-anchor="end" class="micro">TsaoSciComputation · 中文跨尺度计算愿景</text>
</g>
</svg>