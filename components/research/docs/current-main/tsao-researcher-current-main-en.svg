<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">TsaoSciResearcher current-main acceptance architecture</title><desc id="desc">From scientific questions, evidence grading and dimensional contracts to falsifiable multiscale research routes. The repository generates research strategies, contracts, evidence controls and external-execution receipts; automatic_approval=false and it does not replace experts, experiments or third-party solver qualification.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09090b"/><stop offset=".5" stop-color="#3b1d0b"/><stop offset="1" stop-color="#2e1065"/></linearGradient><linearGradient id="card"><stop offset="0" stop-color="#4a2507"/><stop offset="1" stop-color="#28164d"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC","Noto Sans",Arial,sans-serif;fill:#fff7ed}.title{font-size:54px;font-weight:800}.subtitle{font-size:24px;fill:#fde68a}.stage{font-size:24px;font-weight:750}.detail{font-size:17px;fill:#ffedd5}.index{font-size:58px;font-weight:800;fill:#92400e}.formula{font-family:"STIX Two Math","Cambria Math","Noto Sans Math","Noto Sans CJK SC",sans-serif;font-size:18px;fill:#f3e8ff}.micro{font-size:14px;letter-spacing:2px;fill:#fcd34d}.boundary{font-size:18px;fill:#e9d5ff}.badge{font-size:16px;fill:#fdba74}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1390" cy="92" r="125" fill="#f59e0b" opacity=".14"/><circle cx="210" cy="790" r="170" fill="#a855f7" opacity=".12"/><text x="48" y="88" class="title">TsaoSciResearcher</text><text x="48" y="132" class="subtitle">From scientific questions, evidence grading and dimensional contracts to falsifiable multiscale research routes</text><text x="48" y="184" class="badge">AI-ASSISTED CONCEPTUAL DESIGN · NOT AUTOMATIC SCIENTIFIC APPROVAL</text><path d="M 319 336 H 348" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrow)"/><path d="M 629 336 H 658" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrow)"/><path d="M 939 336 H 968" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1249 336 H 1278" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrow)"/><g><rect x="44" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/><text x="66" y="280" class="stage">Question structuring</text><text x="66" y="324" class="detail">Observables, conditions and decisions</text><text x="66" y="394" class="index">01</text></g><g><rect x="354" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/><text x="376" y="280" class="stage">Capability routing</text><text x="376" y="324" class="detail">Model contracts and execution boundaries</text><text x="376" y="394" class="index">02</text></g><g><rect x="664" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/><text x="686" y="280" class="stage">Evidence control</text><text x="686" y="324" class="detail">Sources, conflicts and applicability</text><text x="686" y="394" class="index">03</text></g><g><rect x="974" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/><text x="996" y="280" class="stage">Scale bridge and UQ</text><text x="996" y="324" class="detail">Identifiability, propagation, calibration</text><text x="996" y="394" class="index">04</text></g><g><rect x="1284" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/><text x="1306" y="280" class="stage">Receipts and acceptance</text><text x="1306" y="324" class="detail">Hashes, authority and falsification</text><text x="1306" y="394" class="index">05</text></g><g><rect x="44" y="522" width="465" height="128" rx="22" fill="#1b1320" stroke="#c084fc" stroke-width="2"/><text x="66" y="575" class="formula">G = min(g_quantity, g_applicability, g_evidence, g_identifiability, g_bridge)</text><text x="66" y="619" class="micro">DECISION CONTRACT 01</text></g><g><rect x="549" y="522" width="465" height="128" rx="22" fill="#1b1320" stroke="#c084fc" stroke-width="2"/><text x="571" y="575" class="formula">Σ_y = J Σ_x Jᵀ + Σ_model + Σ_scale</text><text x="571" y="619" class="micro">DECISION CONTRACT 02</text></g><g><rect x="1054" y="522" width="465" height="128" rx="22" fill="#1b1320" stroke="#c084fc" stroke-width="2"/><text x="1076" y="575" class="formula">H_receipt = SHA256(contract ∥ input ∥ engine ∥ environment ∥ result)</text><text x="1076" y="619" class="micro">DECISION CONTRACT 03</text></g><rect x="44" y="710" width="1512" height="104" rx="24" fill="#140e18" stroke="#57534e"/><text x="76" y="756" class="micro">QUALIFICATION BOUNDARY</text><text x="76" y="790" class="boundary">The repository generates research strategies, contracts, evidence controls and external-execution receipts; automatic_approval=false and it does not replace experts, experiments or third-party solver qualification.</text><text x="48" y="866" class="micro">CURRENT MAIN · EVIDENCE FIRST · DIMENSIONAL CONTRACTS · AUTOMATIC APPROVAL FALSE</text></svg>
