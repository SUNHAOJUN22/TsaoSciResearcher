    <rect x="95" y="170" width="245" height="105" rx="18" fill="#12324a" stroke="#38bdf8"/><text x="218" y="214" text-anchor="middle" fill="#e0f2fe" font-size="21" font-weight="700">Competing mechanism</text><text x="218" y="246" text-anchor="middle" fill="#bae6fd" font-size="16">design discriminating observable</text>
    <rect x="860" y="170" width="245" height="105" rx="18" fill="#12324a" stroke="#60a5fa"/><text x="982" y="214" text-anchor="middle" fill="#dbeafe" font-size="21" font-weight="700">Targeted computation</text><text x="982" y="246" text-anchor="middle" fill="#bfdbfe" font-size="16">convergence + falsification</text>
    <rect x="95" y="470" width="245" height="105" rx="18" fill="#12324a" stroke="#a78bfa"/><text x="218" y="514" text-anchor="middle" fill="#ede9fe" font-size="21" font-weight="700">Independent experiment</text><text x="218" y="546" text-anchor="middle" fill="#ddd6fe" font-size="16">hold-out conditions</text>
    <rect x="860" y="470" width="245" height="105" rx="18" fill="#12324a" stroke="#f0abfc"/><text x="982" y="514" text-anchor="middle" fill="#fae8ff" font-size="21" font-weight="700">Update Passport</text><text x="982" y="546" text-anchor="middle" fill="#f5d0fe" font-size="16">blockers · UQ · domain</text>
