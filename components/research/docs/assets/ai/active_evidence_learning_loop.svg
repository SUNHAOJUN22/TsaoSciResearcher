<rect width="1200" height="700" rx="28" fill="url(#bg)"/>
<rect x="36" y="32" width="1128" height="636" rx="24" fill="none" stroke="#27496d" stroke-width="2"/>
<text x="70" y="92" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">Active Evidence Learning Loop</text>
<rect x="70" y="112" width="220" height="6" rx="3" fill="url(#accent)"/>

<g font-family="Arial, sans-serif">
