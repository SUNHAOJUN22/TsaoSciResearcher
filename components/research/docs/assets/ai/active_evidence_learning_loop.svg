  <path d="M860 225 C730 210 715 250 670 290" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M530 420 C480 455 450 520 340 520" fill="none" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow)"/>
