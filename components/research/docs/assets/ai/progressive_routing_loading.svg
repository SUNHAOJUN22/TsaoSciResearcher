<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">Progressive routing and loading</title><desc id="desc">Shows the single-router workflow and progressive context loading architecture.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3dd9ff"/></marker></defs><rect width="1400" height="820" fill="#07111f" rx="28"/><rect x="36" y="28" width="1328" height="100" rx="22" fill="#10263d" stroke="#284966"/><rect x="36" y="28" width="10" height="100" rx="5" fill="#3dd9ff"/><text x="76" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#eef7ff">Single Router + Progressive On-Demand Loading</text><text x="76" y="104" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#a7bed3">The root skill selects one workflow and only the references/templates required for the task</text><rect x="45" y="210" width="230" height="180" rx="18" fill="#10263d" stroke="#3dd9ff" stroke-opacity=".7"/><rect x="45" y="210" width="230" height="7" rx="3" fill="#3dd9ff"/><text x="67" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#eef7ff">1 · User intent</text><text x="67" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">bounded text</text><text x="67" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">negative intent</text><path d="M275,300 L315,300" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="315" y="210" width="230" height="180" rx="18" fill="#10263d" stroke="#5d8cff" stroke-opacity=".7"/><rect x="315" y="210" width="230" height="7" rx="3" fill="#5d8cff"/><text x="337" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#eef7ff">2 · Deterministic route</text><text x="337" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">priority</text><text x="337" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">stable tie-break</text><path d="M545,300 L585,300" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="585" y="210" width="230" height="180" rx="18" fill="#10263d" stroke="#aa7cff" stroke-opacity=".7"/><rect x="585" y="210" width="230" height="7" rx="3" fill="#aa7cff"/><text x="607" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#eef7ff">3 · Primary workflow</text><text x="607" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">one of 15</text><text x="607" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">entry gates</text><path d="M815,300 L855,300" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="855" y="210" width="230" height="180" rx="18" fill="#10263d" stroke="#ffb86b" stroke-opacity=".7"/><rect x="855" y="210" width="230" height="7" rx="3" fill="#ffb86b"/><text x="877" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#eef7ff">4 · Load context</text><text x="877" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">named references</text><text x="877" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">named templates</text><path d="M1085,300 L1125,300" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="1125" y="210" width="230" height="180" rx="18" fill="#10263d" stroke="#55e6a5" stroke-opacity=".7"/><rect x="1125" y="210" width="230" height="7" rx="3" fill="#55e6a5"/><text x="1147" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#eef7ff">5 · Produce artifact</text><text x="1147" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">schema validation</text><text x="1147" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">state + provenance</text><rect x="175" y="520" width="310" height="160" rx="18" fill="#10263d" stroke="#55e6a5" stroke-opacity=".7"/><rect x="175" y="520" width="310" height="7" rx="3" fill="#55e6a5"/><text x="197" y="558" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">Capability search</text><text x="197" y="588" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">340 records</text><text x="197" y="612" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">cached catalog</text><text x="197" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">bilingual triggers</text><rect x="545" y="520" width="310" height="160" rx="18" fill="#10263d" stroke="#3dd9ff" stroke-opacity=".7"/><rect x="545" y="520" width="310" height="7" rx="3" fill="#3dd9ff"/><text x="567" y="558" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">No full-repo loading</text><text x="567" y="588" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">lower context cost</text><text x="567" y="612" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">smaller attack surface</text><text x="567" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">reproducible routing</text><rect x="915" y="520" width="310" height="160" rx="18" fill="#10263d" stroke="#ff6f91" stroke-opacity=".7"/><rect x="915" y="520" width="310" height="7" rx="3" fill="#ff6f91"/><text x="937" y="558" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">Fallback behavior</text><text x="937" y="588" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">return planned state</text><text x="937" y="612" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">record unresolved inputs</text><text x="937" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">never fabricate execution</text><text x="1360" y="792" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#6f8aa5">TsaoSciResearcher v0.7.0 · documentation diagram</text></svg>
