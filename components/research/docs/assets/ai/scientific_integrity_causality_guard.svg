<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Scientific Integrity &amp; Causality Guard</title><desc id="desc">Evidence, claims, causal tests, and decisions are separated while leakage, overclaiming, cherry-picking, and authority substitution are blocked.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071629"/><stop offset="1" stop-color="#123a59"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38d9ff"/><stop offset="1" stop-color="#9b7cff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66ddff"/></marker></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="70" y="72" font-size="36" font-weight="700" fill="#f4fbff">Scientific Integrity &amp; Causality Guard</text>
<text x="70" y="108" font-size="18" fill="#b7cada">Preserve the evidence graph before strengthening the language of a conclusion.</text>
<rect x="70" y="180" width="250" height="150" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="94" y="220" font-size="21" font-weight="700" fill="#f4fbff">Evidence</text><text x="94" y="250" font-size="15" fill="#b7cada">source identity</text><text x="94" y="274" font-size="15" fill="#b7cada">measurement boundary</text><text x="94" y="298" font-size="15" fill="#b7cada">negative and null results</text><rect x="400" y="180" width="250" height="150" rx="18" fill="#102d49" stroke="#3dd9ff" stroke-width="2"/><text x="424" y="220" font-size="21" font-weight="700" fill="#f4fbff">Claim</text><text x="424" y="250" font-size="15" fill="#b7cada">scope and qualifiers</text><text x="424" y="274" font-size="15" fill="#b7cada">support edge</text><text x="424" y="298" font-size="15" fill="#b7cada">contradictions retained</text><rect x="730" y="180" width="250" height="150" rx="18" fill="#102d49" stroke="#ffbe65" stroke-width="2"/><text x="754" y="220" font-size="21" font-weight="700" fill="#f4fbff">Causal test</text><text x="754" y="250" font-size="15" fill="#b7cada">alternatives</text><text x="754" y="274" font-size="15" fill="#b7cada">confounders</text><text x="754" y="298" font-size="15" fill="#b7cada">intervention / temporal order</text><rect x="1060" y="180" width="250" height="150" rx="18" fill="#102d49" stroke="#9b7cff" stroke-width="2"/><text x="1084" y="220" font-size="21" font-weight="700" fill="#f4fbff">Decision</text><text x="1084" y="250" font-size="15" fill="#b7cada">risk tier</text><text x="1084" y="274" font-size="15" fill="#b7cada">approval gate</text><text x="1084" y="298" font-size="15" fill="#b7cada">accept / reject / supersede</text><path d="M320 255 L390 255" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M650 255 L720 255" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M980 255 L1050 255" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="160" y="440" width="240" height="130" rx="18" fill="#102d49" stroke="#ff7fa0" stroke-width="2"/><text x="184" y="480" font-size="21" font-weight="700" fill="#f4fbff">Guard: leakage</text><text x="184" y="510" font-size="15" fill="#b7cada">test data contamination</text><text x="184" y="534" font-size="15" fill="#b7cada">circular validation</text><rect x="460" y="440" width="240" height="130" rx="18" fill="#102d49" stroke="#ff7fa0" stroke-width="2"/><text x="484" y="480" font-size="21" font-weight="700" fill="#f4fbff">Guard: overclaim</text><text x="484" y="510" font-size="15" fill="#b7cada">correlation → causation</text><text x="484" y="534" font-size="15" fill="#b7cada">simulation → experiment</text><rect x="760" y="440" width="240" height="130" rx="18" fill="#102d49" stroke="#ff7fa0" stroke-width="2"/><text x="784" y="480" font-size="21" font-weight="700" fill="#f4fbff">Guard: cherry-pick</text><text x="784" y="510" font-size="15" fill="#b7cada">missing failures</text><text x="784" y="534" font-size="15" fill="#b7cada">selective conditions</text><rect x="1060" y="440" width="240" height="130" rx="18" fill="#102d49" stroke="#ff7fa0" stroke-width="2"/><text x="1084" y="480" font-size="21" font-weight="700" fill="#f4fbff">Guard: authority</text><text x="1084" y="510" font-size="15" fill="#b7cada">software output</text><text x="1084" y="534" font-size="15" fill="#b7cada">unqualified approval</text>
<rect x="70" y="682" width="1260" height="44" rx="14" fill="#0b2035" stroke="url(#accent)"/>
<text x="100" y="711" font-size="16" fill="#d7e8f5">Correlation, simulation agreement and expert confidence are distinct evidence classes</text>
</g></svg>
