<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">Supply chain and release attestation</title><desc id="desc">Shows deterministic validation, packaging and external attestation stages.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3dd9ff"/></marker></defs><rect width="1400" height="820" fill="#07111f" rx="28"/><rect x="36" y="28" width="1328" height="100" rx="22" fill="#10263d" stroke="#284966"/><rect x="36" y="28" width="10" height="100" rx="5" fill="#3dd9ff"/><text x="76" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#eef7ff">Reproducibility, Supply Chain, and Release Attestation</text><text x="76" y="104" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#a7bed3">Source integrity is checked from repository tree to deterministic archives and isolated distribution installation</text><rect x="45" y="205" width="230" height="190" rx="18" fill="#10263d" stroke="#3dd9ff" stroke-opacity=".7"/><rect x="45" y="205" width="230" height="7" rx="3" fill="#3dd9ff"/><text x="67" y="243" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#eef7ff">Source tree</text><text x="67" y="273" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">schema + audit</text><text x="67" y="297" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">tree SHA-256</text><path d="M275,300 L315,300" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="315" y="205" width="230" height="190" rx="18" fill="#10263d" stroke="#5d8cff" stroke-opacity=".7"/><rect x="315" y="205" width="230" height="7" rx="3" fill="#5d8cff"/><text x="337" y="243" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#