ternal attestation</text><text x="1147" y="273" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">run ID · commit</text><text x="1147" y="297" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">artifact hashes</text><rect x="150" y="535" width="330" height="140" rx="18" fill="#10263d" stroke="#3dd9ff" stroke-opacity=".7"/><rect x="150" y="535" width="330" height="7" rx="3" fill="#3dd9ff"/><text x="172" y="573" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">Checked-in evidence</text><text x="172" y="603" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">preflight / PARTIAL</text><text x="172" y="627" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">non-self-referential digest</text><rect x="535" y="535" width="330" height="140" rx="18" fill="#10263d" stroke="#55e6a5" stroke-opacity=".7"/><rect x="535" y="535" width="330" height="7" rx="3" fill="#55e6a5"/><text x="557" y="573" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">CI evidence</text><text x="557" y="603" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">current-tree / PASS</text><text x="557" y="627" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">publication attestation</text><rect x="920" y="535" width="330" height="140" rx="18" fill="#10263d" stroke="#ff6f91" stroke-opacity=".7"/><rect x="920" y="535" width="330" height="7" rx="3" fill="#ff6f91"/><text x="942" y="573" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">Truth boundary</text><text x="942" y="603" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">software validation ≠</text><text x="942" y="627" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">scientific acceptance</text><text x="1360" y="792" text-anch