="1094" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Qualified Conclusion</text><text x="1094" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">wording bounded by evidence</text><text x="1094" y="308" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">explicit residual uncertainty</text><path d="M320,285 C355.0,285 355.0,285 390,285" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><text x="355.0" y="277.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9eb3c8">normalize</text><path d="M650,285 C690.0,285 690.0,285 730,285" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><text x="690.0" y="277.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9eb3c8">link</text><path d="M990,285 C1030.0,285 1030.0,285 1070,285" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><text x="1030.0" y="277.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9eb3c8">qualify</text><rect x="210" y="500" width="260" height="150" rx="20" fill="#132b46" stroke="#ff6f91" stroke-opacity=".55" filter="url(#shadow)"/><rect x="210" y="500" width="260" height="8" rx="4" fill="#ff6f91"/><text x="234" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Integrity Controls</text><text x="234" y="574" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">no fabricated execution</text><text x="234" y="598" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">traceable citations</text><rect x="570" y="500" width="260" height="150" rx="20" fill="#132b46" stroke="#ffb86b" stroke-opacity=".55" filter="url(#shadow)"/><rect x="570" y="500" width="260" height="8" rx="4" fill="#ffb86b"/><text x="594" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Contradiction Review</text><text x="594" y="574" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">conflicting evidence retained</text><text x="594" y="598" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">resolution status recorded</text><rect x="930" y="500" width="260" height="150" rx="20" fill="#132b46" stroke="#55e6a5" stroke-opacity=".55" filter="url(#shadow)"/><rect x="930" y="500" width="260" height="8" rx="4" fill="#55e6a5"/><text x="954" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Human Acceptance</text><text x="954" y="574" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">domain expert approval</text><text x="954" y="598" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">legal / safety / ethics gates</text><path d="M470,575 C520.0,575 520.0,575 570,575" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><path d="M830,575 C880.0,575 880.0,575 930,575" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/>
