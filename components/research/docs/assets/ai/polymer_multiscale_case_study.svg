<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Polymer Insulation Multiscale Strategy</title><desc id="desc">A polymer-insulation example links electronic defects, chain dynamics, lamellar morphology, continuum fields, process history, and cable reliability.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071629"/><stop offset="1" stop-color="#123a59"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38d9ff"/><stop offset="1" stop-color="#9b7cff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66ddff"/></marker></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="70" y="72" font-size="36" font-weight="700" fill="#f4fbff">Polymer Insulation Multiscale Strategy</text>
<text x="70" y="108" font-size="18" fill="#b7cada">Bridge scales through measured state variables—not by visual similarity between unrelated simulations.</text>
<rect x="55" y="175" width="235" height="155" rx="18" fill="#102d49" stroke="#9b7cff" stroke-width="2"/><text x="79" y="215" font-size="21" font-weight="700" fill="#f4fbff">Å · electronic</text><text x="79" y="245" font-size="15" fill="#b7cada">defects · bonding · trap states</text><text x="79" y="269" font-size="15" fill="#b7cada">DFT / hybrid / GW-BSE</text><rect x="335" y="175" width="235" height="155" rx="18" fill="#102d49" stroke="#3dd9ff" stroke-width="2"/><text x="359" y="215" font-size="21" font-weight="700" fill="#f4fbff">nm · atomistic</text><text x="359" y="245" font-size="15" fill="#b7cada">chain conformation · interfaces</text><text x="359" y="269" font-size="15" fill="#b7cada">MD / enhanced sampling</text><rect x="615" y="175" width="235" height="155" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="639" y="215" font-size="21" font-weight="700" fill="#f4fbff">10 nm–µm · mesoscale</text><text x="639" y="245" font-size="15" fill="#b7cada">lamellae · domains · topology</text><text x="639" y="269" font-size="15" fill="#b7cada">CGMD / SCFT / phase field</text><rect x="895" y="175" width="235" height="155" rx="18" fill="#102d49" stroke="#ffbe65" stroke-width="2"/><text x="919" y="215" font-size="21" font-weight="700" fill="#f4fbff">µm–mm · continuum</text><text x="919" y="245" font-size="15" fill="#b7cada">transport · stress · electrothermal</text><text x="919" y="269" font-size="15" fill="#b7cada">FEM / drift-diffusion / CFD</text><rect x="1175" y="175" width="170" height="155" rx="18" fill="#102d49" stroke="#ff7fa0" stroke-width="2"/><text x="1199" y="215" font-size="21" font-weight="700" fill="#f4fbff">m · cable</text><text x="1199" y="245" font-size="15" fill="#b7cada">process · ageing</text><text x="1199" y="269" font-size="15" fill="#b7cada">reliability</text><path d="M290 252 L325 252" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M570 252 L605 252" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M850 252 L885 252" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1130 252 L1165 252" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="120" y="450" width="330" height="120" rx="18" fill="#102d49" stroke="#3dd9ff" stroke-width="2"/><text x="144" y="490" font-size="21" font-weight="700" fill="#f4fbff">Bridge variables</text><text x="144" y="520" font-size="15" fill="#b7cada">trap-energy distribution · mobility</text><text x="144" y="544" font-size="15" fill="#b7cada">lamellar statistics · crystallinity</text><rect x="535" y="450" width="330" height="120" rx="18" fill="#102d49" stroke="#9b7cff" stroke-width="2"/><text x="559" y="490" font-size="21" font-weight="700" fill="#f4fbff">Cross-scale closure</text><text x="559" y="520" font-size="15" fill="#b7cada">measurable descriptors only</text><text x="559" y="544" font-size="15" fill="#b7cada">uncertainty propagated at each handoff</text><rect x="950" y="450" width="330" height="120" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="974" y="490" font-size="21" font-weight="700" fill="#f4fbff">Validation hierarchy</text><text x="974" y="520" font-size="15" fill="#b7cada">spectroscopy / PEA / SAXS / mechanics</text><text x="974" y="544" font-size="15" fill="#b7cada">hold-out conditions and failure modes</text><path d="M450 510 L525 510" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M865 510 L940 510" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="682" width="1260" height="44" rx="14" fill="#0b2035" stroke="url(#accent)"/>
<text x="100" y="711" font-size="16" fill="#d7e8f5">Chemistry → morphology → transport/failure is a hypothesis chain requiring validation at every scale</text>
</g></svg>
