<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">Original requirements implementation coverage</title><desc id="desc">Maps the initial specification to native, delegated, external and human-reviewed implementation levels.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3dd9ff"/></marker></defs><rect width="1400" height="820" fill="#07111f" rx="28"/><rect x="36" y="28" width="1328" height="100" rx="22" fill="#10263d" stroke="#284966"/><rect x="36" y="28" width="10" height="100" rx="5" fill="#3dd9ff"/><text x="76" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#eef7ff">Original Requirements → Actual Implementation</text><text x="76" y="104" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#a7bed3">Code-grounded compliance: native core, control contracts, host tools, external execution, and human approval</text><rect x="65" y="185" width="235" height="150" rx="18" fill="#10263d" stroke="#55e6a5" stroke-opacity=".7"/><rect x="65" y="185" width="235" height="7" rx="3" fill="#55e6a5"/><text x="87" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">Native core</text><text x="87" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">routing · state · schemas · validators</text><path d="M300,260 L330,260" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="185" width="235" height="150" rx="18" fill="#10263d" stroke="#3dd9ff" stroke-opacity=".7"/><rect x="330" y="185" width="235" height="7" rx="3" fill="#3dd9ff"/><text x="352" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">Control layer</text><text x="352" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">workflows · gates · templates</text><path d="M565,260 L595,260" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="595" y="185" width="235" height="150" rx="18" fill="#10263d" stroke="#5d8cff" stroke-opacity=".7"/><rect x="595" y="185" width="235" height="7" rx="3" fill="#5d8cff"/><text x="617" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">Host tools</text><text x="617" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">retrieval · statistics · plotting · Office</text><path d="M830,260 L860,260" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="860" y="185" width="235" height="150" rx="18" fill="#10263d" stroke="#aa7cff" stroke-opacity=".7"/><rect x="860" y="185" width="235" height="7" rx="3" fill="#aa7cff"/><text x="882" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">External engines</text><text x="882" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">DFT · MD · FEM · CFD · instruments</text><path d="M1095,260 L1125,260" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="1125" y="185" width="235" height="150" rx="18" fill="#10263d" stroke="#ffb86b" stroke-opacity=".7"/><rect x="1125" y="185" width="235" height="7" rx="3" fill="#ffb86b"/><text x="1147" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">Human approval</text><text x="1147" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">medical · safety · patent · integrity</text><rect x="180" y="450" width="300" height="190" rx="18" fill="#10263d" stroke="#55e6a5" stroke-opacity=".7"/><rect x="180" y="450" width="300" height="7" rx="3" fill="#55e6a5"/><text x="202" y="488" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">Catalog coverage</text><text x="202" y="518" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">322 / 322 workbook slugs</text><text x="202" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">0 missing</text><text x="202" y="566" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">+19 runtime/core contracts</text><rect x="550" y="450" width="300" height="190" rx="18" fill="#10263d" stroke="#3dd9ff" stroke-opacity=".7"/><rect x="550" y="450" width="300" height="7" rx="3" fill="#3dd9ff"/><text x="572" y="488" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">Repository controls</text><text x="572" y="518" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">15 gated workflows</text><text x="572" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">19 JSON Schemas</text><text x="572" y="566" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">39 deterministic scripts</text><rect x="920" y="450" width="300" height="190" rx="18" fill="#10263d" stroke="#ff6f91" stroke-opacity=".7"/><rect x="920" y="450" width="300" height="7" rx="3" fill="#ff6f91"/><text x="942" y="488" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">Truth boundary</text><text x="942" y="518" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">contract ≠ installed engine</text><text x="942" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">handoff ≠ completed computation</text><text x="942" y="566" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">PASS ≠ scientific truth</text><text x="1360" y="792" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#6f8aa5">TsaoSciResearcher v0.7.0 · documentation diagram</text></svg>
