<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Human Approval &amp; Scientific Acceptance Boundary</title><desc id="desc">Completion, checking, validation, and scientific acceptance are separate states with different software and human responsibilities.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071629"/><stop offset="1" stop-color="#123a59"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38d9ff"/><stop offset="1" stop-color="#9b7cff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66ddff"/></marker></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="70" y="72" font-size="36" font-weight="700" fill="#f4fbff">Human Approval &amp; Scientific Acceptance Boundary</text>
<text x="70" y="108" font-size="18" fill="#b7cada">A passing workflow can establish software evidence; it cannot grant scientific authority.</text>
<rect x="70" y="170" width="220" height="120" rx="18" fill="#102d49" stroke="#3dd9ff" stroke-width="2"/><text x="94" y="210" font-size="21" font-weight="700" fill="#f4fbff">Proposed</text><text x="94" y="240" font-size="15" fill="#b7cada">question and plan</text><rect x="335" y="170" width="220" height="120" rx="18" fill="#102d49" stroke="#3dd9ff" stroke-width="2"/><text x="359" y="210" font-size="21" font-weight="700" fill="#f4fbff">Completed</text><text x="359" y="240" font-size="15" fill="#b7cada">external run or task</text><rect x="600" y="170" width="220" height="120" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="624" y="210" font-size="21" font-weight="700" fill="#f4fbff">Checked</text><text x="624" y="240" font-size="15" fill="#b7cada">files, logs, balances</text><rect x="865" y="170" width="220" height="120" rx="18" fill="#102d49" stroke="#ffbe65" stroke-width="2"/><text x="889" y="210" font-size="21" font-weight="700" fill="#f4fbff">Validated</text><text x="889" y="240" font-size="15" fill="#b7cada">model and evidence</text><rect x="1130" y="170" width="220" height="120" rx="18" fill="#102d49" stroke="#9b7cff" stroke-width="2"/><text x="1154" y="210" font-size="21" font-weight="700" fill="#f4fbff">Accepted</text><text x="1154" y="240" font-size="15" fill="#b7cada">qualified decision</text><path d="M290 230 L325 230" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M555 230 L590 230" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M820 230 L855 230" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1085 230 L1120 230" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="140" y="420" width="300" height="130" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="164" y="460" font-size="21" font-weight="700" fill="#f4fbff">Software can verify</text><text x="164" y="490" font-size="15" fill="#b7cada">schema · hashes · tests</text><text x="164" y="514" font-size="15" fill="#b7cada">convergence evidence · provenance</text><rect x="550" y="420" width="300" height="130" rx="18" fill="#102d49" stroke="#ffbe65" stroke-width="2"/><text x="574" y="460" font-size="21" font-weight="700" fill="#f4fbff">Domain review must judge</text><text x="574" y="490" font-size="15" fill="#b7cada">governing physics · validity</text><text x="574" y="514" font-size="15" fill="#b7cada">causal interpretation · uncertainty</text><rect x="960" y="420" width="300" height="130" rx="18" fill="#102d49" stroke="#ff7fa0" stroke-width="2"/><text x="984" y="460" font-size="21" font-weight="700" fill="#f4fbff">Qualified approval required</text><text x="984" y="490" font-size="15" fill="#b7cada">safety · medical · patent/FTO</text><text x="984" y="514" font-size="15" fill="#b7cada">high-impact scientific acceptance</text><path d="M440 485 L540 485" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M850 485 L950 485" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="682" width="1260" height="44" rx="14" fill="#0b2035" stroke="url(#accent)"/>
<text x="100" y="711" font-size="16" fill="#d7e8f5">executed ≠ checked ≠ validated ≠ accepted · rejection and supersession remain first-class outcomes</text>
</g></svg>
