<rect x="145" y="455" width="290" height="105" rx="18" fill="#163c5c" stroke="#55e6a5"/><rect x="555" y="435" width="290" height="125" rx="18" fill="#163c5c" stroke="#ffbe65"/><rect x="965" y="415" width="290" height="145" rx="18" fill="#163c5c" stroke="#ff7fa0"/>
<text x="170" y="492" font-size="21" font-weight="700" fill="#f4fbff">Minimum sufficient</text><text x="170" y="522" font-size="15" fill="#b7cada">analytical · reduced-order</text><text x="170" y="545" font-size="15" fill="#b7cada">testable assumptions</text><text x="580" y="474" font-size="21" font-weight="700" fill="#f4fbff">Resolved model</text><text x="580" y="506" font-size="15" fill="#b7cada">quantum · molecular · field</text><text x="580" y="529" font-size="15" fill="#b7cada">numerical/model convergence</text><text x="990" y="454" font-size="21" font-weight="700" fill="#f4fbff">Cross-scale escalation</text><text x="990" y="487" font-size="15" fill="#b7cada">measurable bridge variables</text><text x="990" y="510" font-size="15" fill="#b7cada">uncertainty propagation</text><text x="990" y="533" font-size="15" fill="#b7cada">independent closure tests</text>
