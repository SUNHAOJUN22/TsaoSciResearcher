<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">First-Principles Strategy Ladder</title><desc id="desc">A scientific question is reduced to observables, degrees of freedom, governing physics, scales, a minimum-sufficient method ladder, validation, uncertainty, and an external execution boundary.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071629"/><stop offset="1" stop-color="#123a59"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3dd9ff"/><stop offset="1" stop-color="#8c7cff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#62d9ff"/></marker></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/><text x="70" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#f4fbff">First-Principles Computation &amp; Simulation Strategy</text><text x="70" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b7cada">Reason from the observable and governing physics—never from software popularity.</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
