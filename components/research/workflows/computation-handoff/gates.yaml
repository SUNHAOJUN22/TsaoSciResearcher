entry:
- scientific question and decision-critical observable recorded
- system conditions, constraints, and available evidence classified
blocking:
- do not choose a solver before degrees of freedom, governing physics, and scales are stated
- do not claim unavailable execution
- do not collapse prepared, executed, checked, validated, and accepted states
- retain competing mechanisms, contradictory evidence, and null results
completion:
- first-principles frame and ranked method ladder exist
- validation, falsification, convergence, and uncertainty requirements are explicit
- external execution boundary and human review points are visible
