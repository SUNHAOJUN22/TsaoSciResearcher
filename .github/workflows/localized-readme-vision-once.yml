name: One-time localized README vision finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/localized-readme-vision.py

permissions:
  contents: write

concurrency:
  group: localized-readme-vision-researcher
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install exact documentation qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
      - name: Generate localized diagrams and refresh governed evidence
        run: |
          python .github/localized-readme-vision.py
          python scripts/build_readme_facts.py --write
          python scripts/build_validation_evidence.py --write --composite
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
          python scripts/build_readme_facts.py --check
          python scripts/build_validation_evidence.py --check
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          git diff --check
      - name: Remove one-time transport and publish
        run: |
          rm -f .github/localized-readme-vision.py
          rm -f .github/workflows/localized-readme-vision-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: add localized Chinese and English project vision'
          git push origin HEAD:main
