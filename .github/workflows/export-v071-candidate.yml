name: Export verified v0.7.1 candidate

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: export-v071-candidate
  cancel-in-progress: false

env:
  BASELINE: d9eca929fc39e329b1d94fdb2a08d2a75b577afa
  OVERLAY_SHA256: e7fb0bdae5b0dee605f9b84ea4361ef15a4b676831434a6e48a5aa3d53f0f036
  OVERLAY_PARTS: "16"
  SOURCE_ISSUE: "176"

jobs:
  export:
    if: >-
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] export v0.7.1 candidate' &&
      contains(github.event.issue.body, 'status=ready')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BASELINE }}
          fetch-depth: 0
      - name: Reconstruct and verify candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE"
          gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$SOURCE_ISSUE/comments" > /tmp/comments.json
          python - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path

          rows=json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          parts={}
          for row in rows:
              match=re.fullmatch(r'PART (\d{2})/(\d{2})\n([A-Za-z0-9+/=]+)', row.get('body',''))
              if match:
                  index,total,payload=match.groups()
                  assert int(total)==int(os.environ['OVERLAY_PARTS'])
                  assert index not in parts
                  parts[index]=payload
          count=int(os.environ['OVERLAY_PARTS'])
          keys=[f'{index:02d}' for index in range(count)]
          assert sorted(parts)==keys
          archive=base64.b64decode(''.join(parts[key] for key in keys), validate=True)
          assert hashlib.sha256(archive).hexdigest()==os.environ['OVERLAY_SHA256']
          Path('/tmp/overlay.tar.gz').write_bytes(archive)
          PY
          python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path, PurePosixPath

          target=Path('/tmp/overlay')
          target.mkdir()
          with tarfile.open('/tmp/overlay.tar.gz','r:gz') as archive:
              members=archive.getmembers()
              names=[member.name for member in members]
              assert 1 < len(members) <= 200
              assert len(names)==len(set(names)) and 'manifest.json' in names
              for member in members:
                  path=PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in member.name
                  assert member.isfile() and not member.issym() and not member.islnk()
              archive.extractall(target, filter='data')
          manifest=json.loads((target/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['base_commit']==os.environ['BASELINE']
          assert set(names)=={f"files/{row['path']}" for row in manifest['files']} | {'manifest.json'}
          for row in manifest['files']:
              relative=PurePosixPath(row['path'])
              source=target/'files'/Path(*relative.parts)
              data=source.read_bytes()
              assert len(data)==row['bytes']
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              destination=Path(row['path'])
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              destination.chmod(int(row['mode'],8))
          PY
          test "$(cat VERSION)" = 0.7.1
          python scripts/sync_runtime_data.py --write
          sed -i "s/assert tsao_researcher.__version__ == '0.7.0'/assert tsao_researcher.__version__ == '0.7.1'/" tests/test_import_isolation.py
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m ruff check --fix scripts tsao_researcher tests
          python -m ruff format scripts tsao_researcher tests
          tar --exclude=.git --exclude=.pytest_cache --exclude='*.pyc' --exclude='__pycache__' -czf /tmp/TsaoSciResearcher-v0.7.1-candidate.tar.gz .
          sha256sum /tmp/TsaoSciResearcher-v0.7.1-candidate.tar.gz > /tmp/TsaoSciResearcher-v0.7.1-candidate.tar.gz.sha256
      - name: Upload candidate source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsao-v071-candidate-source
          path: |
            /tmp/TsaoSciResearcher-v0.7.1-candidate.tar.gz
            /tmp/TsaoSciResearcher-v0.7.1-candidate.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Report export
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=exported\nworkflow-run=%s\nsource-issue=%s\noverlay-sha256=%s\n' "$GITHUB_RUN_ID" "$SOURCE_ISSUE" "$OVERLAY_SHA256" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
