name: Revalidate current main v4

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: revalidate-current-main-v4
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  validate:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] revalidate current main v4'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Mark validation running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=running\nworkflow-run=%s\n' "$GITHUB_RUN_ID" > /tmp/issue-body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.txt

      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Capture source and expose permanent workflow tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD)"
          base="$(git rev-parse HEAD^)"
          test "$parent" = "$(git rev-parse origin/main)"
          echo "parent=${parent}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          rm .github/workflows/revalidate-current-main-v4.yml
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l | tr -d ' ')" = "5"

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Refresh deterministic evidence for permanent tree
        run: |
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write

      - name: Repository and generated-artifact audit
        run: |
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          mkdocs build --strict

      - name: Complete regression and coverage
        run: |
          mkdir -p artifacts
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml

      - name: Order independence
        env:
          TSR_TEST_ORDER_SEED: "20260730"
        run: |
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin

      - name: Static type security and dependency gates
        run: |
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict -r artifacts/resolved-environment.lock --format cyclonedx-json --output artifacts/resolved-environment-sbom.json
          python scripts/build_sbom.py --check

      - name: Mutation performance and quality baseline
        run: |
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py

      - name: Verify checked-in README metrics
        id: metrics
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          quality = json.loads(Path("artifacts/quality-current.json").read_text(encoding="utf-8"))
          tests = quality["tests"]
          coverage = quality["coverage"]
          mutation = quality["mutation"]
          english = Path("README.md").read_text(encoding="utf-8")
          mirror = Path("README_EN.md").read_text(encoding="utf-8")
          chinese = Path("README.zh-CN.md").read_text(encoding="utf-8")
          if english != mirror:
              raise SystemExit("README_EN.md is not an exact mirror of README.md")

          expected_tests = int(tests["tests"])
          expected_line = float(coverage["line_percent"])
          expected_branch = float(coverage["branch_percent"])
          expected_mutation = (
              int(mutation["killed"]),
              int(mutation["total"]),
              int(mutation["survivors"]),
          )

          def one(pattern: str, text: str) -> re.Match[str]:
              match = re.search(pattern, text)
              if match is None:
                  raise SystemExit(f"README metric pattern missing: {pattern}")
              return match

          readme_tests = int(one(r"\| Tests \| \*\*(\d+) passed;", english).group(1))
          readme_line = float(one(r"\| Project line coverage \| \*\*([0-9.]+)%\*\*", english).group(1))
          readme_branch = float(one(r"\| Branch coverage \| \*\*([0-9.]+)%\*\*", english).group(1))
          readme_mutation = tuple(
              int(value)
              for value in one(
                  r"\| Critical mutation tests \| \*\*(\d+) / (\d+) killed; (\d+) survivors\*\*",
                  english,
              ).groups()
          )
          zh_tests = int(one(r"\| 测试 \| \*\*(\d+) 通过；", chinese).group(1))
          zh_line = float(one(r"\| 项目综合覆盖率 \| \*\*([0-9.]+)%\*\*", chinese).group(1))
          zh_branch = float(one(r"\| 分支覆盖率 \| \*\*([0-9.]+)%\*\*", chinese).group(1))

          if readme_tests != expected_tests or zh_tests != expected_tests:
              raise SystemExit("README test count is stale")
          if abs(readme_line - expected_line) > 0.0005 or abs(zh_line - expected_line) > 0.0005:
              raise SystemExit("README line coverage is stale")
          if abs(readme_branch - expected_branch) > 0.0005 or abs(zh_branch - expected_branch) > 0.0005:
              raise SystemExit("README branch coverage is stale")
          if readme_mutation != expected_mutation:
              raise SystemExit("README mutation result is stale")

          print(f"tests={expected_tests}")
          print(f"line={expected_line:.3f}")
          print(f"branch={expected_branch:.3f}")
          print(f"mutation={expected_mutation[0]}/{expected_mutation[1]}")
          print(f"survivors={expected_mutation[2]}")
          PY

      - name: Reconfirm permanent tree after complete gates
        run: |
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          mkdocs build --strict

      - name: Rebuild deterministic release and distributions
        run: |
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python

      - name: Commit refreshed generated evidence only
        id: publish
        env:
          PARENT: ${{ steps.source.outputs.parent }}
          BASE: ${{ steps.source.outputs.base }}
        run: |
          set -euo pipefail
          rm -rf .coverage .pytest_cache artifacts dist-a dist-b dist-python site build
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git checkout "$PARENT" -- .github/workflows
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git -c core.whitespace=-blank-at-eof diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo "commit=${BASE}" >> "$GITHUB_OUTPUT"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'chore: refresh deterministic evidence after re-audit'
            commit="$(git rev-parse HEAD)"
            git push origin HEAD:main
            echo "commit=${commit}" >> "$GITHUB_OUTPUT"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report validation result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMIT: ${{ steps.publish.outputs.commit }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
          TESTS: ${{ steps.metrics.outputs.tests }}
          LINE: ${{ steps.metrics.outputs.line }}
          BRANCH: ${{ steps.metrics.outputs.branch }}
          MUTATION: ${{ steps.metrics.outputs.mutation }}
          SURVIVORS: ${{ steps.metrics.outputs.survivors }}
        run: |
          cat > /tmp/issue-body.txt <<EOF
          status=validated
          source-commit=${COMMIT}
          workflow-run=${GITHUB_RUN_ID}
          evidence-updated=${PUBLISHED}
          tests=${TESTS}
          line-coverage=${LINE}
          branch-coverage=${BRANCH}
          mutation=${MUTATION}
          survivors=${SURVIVORS}
          all-gates=PASS
          EOF
          sed -i 's/^          //' /tmp/issue-body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.txt

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=validation-failed\nworkflow-run=%s\n' "$GITHUB_RUN_ID" > /tmp/issue-body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.txt
