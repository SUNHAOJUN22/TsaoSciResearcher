name: Diagnose repository checksum v5

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] diagnose repository checksum v5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark diagnosis running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=running\nworkflow-run=%s\n' "$GITHUB_RUN_ID" > /tmp/issue-body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.txt

      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Recompute checksum for permanent tree
        id: checksum
        run: |
          set -euo pipefail
          rm .github/workflows/revalidate-current-main-v5.yml
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l | tr -d ' ')" = "5"
          actual="$(cat SHA256SUMS)"
          python scripts/generate_checksums.py --write
          expected="$(cat SHA256SUMS)"
          printf 'actual=%s\n' "$actual" >> "$GITHUB_OUTPUT"
          printf 'expected=%s\n' "$expected" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from scripts.generate_checksums import source_files
          files = source_files()
          print(f"count={len(files)}")
          print("last=" + files[-1].as_posix())
          PY

      - name: Report diagnosis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTUAL: ${{ steps.checksum.outputs.actual }}
          EXPECTED: ${{ steps.checksum.outputs.expected }}
          COUNT: ${{ steps.checksum.outputs.count }}
          LAST: ${{ steps.checksum.outputs.last }}
        run: |
          printf 'status=diagnosed\nworkflow-run=%s\nactual=%s\nexpected=%s\nsource-files=%s\nlast-file=%s\n' "$GITHUB_RUN_ID" "$ACTUAL" "$EXPECTED" "$COUNT" "$LAST" > /tmp/issue-body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.txt
