name: Fix v0.7.1 overlay loader

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: fix-v071-overlay-loader
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] fix v0.7.1 overlay loader'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Replace loader with exact per-part verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-v071.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = "          expected=int(os.environ['OVERLAY_PARTS'])\n"
          end_marker = "          archive=base64.b64decode(encoded, validate=True)\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          lines = [
              "          expected=int(os.environ['OVERLAY_PARTS'])",
              "          keys=[f'{i:02d}' for i in range(expected)]",
              "          assert sorted(parts)==keys, sorted(parts)",
              "          expected_payloads={",
              "              '00':(6353,'823f0f2ceccf84cf7bf56e03198eb40e812b834aa48225473807ca62507e9a32'),",
              "              '01':(6353,'289c35321f3031a61622b085c1e989ce506f0107d998b0a73dc0a924b1ce360e'),",
              "              '02':(6353,'7a524f6c058fc935864080a7ce3d307b893cd1acbc169751e0818b419dbe240a'),",
              "              '03':(6353,'0a97ae9ffcc5f5b684893a57d520a1d678b629c0b8965eb3c0d395217333dc3d'),",
              "              '04':(6353,'f037bc6bcf0262e995c82c63ce3abd9f7f0c3af561022e32a41697bdd2ba7992'),",
              "              '05':(6353,'10da1e2c239b31ae273600d8d55ad51891b0cd62b758efc95c8c1fb9e71be768'),",
              "              '06':(6353,'9246c2940eb37b9f4007594995ce6e8e1bc7ba559c4b1ced9d7bd19c2cf78d64'),",
              "              '07':(6353,'70c5be48827c772c26b4ff3e6dd370374f86ca17c68f2d2eb4cf335422160030'),",
              "              '08':(6353,'9c6cd890e613afc78f30457a069f858b4be44f0d357a8d6d51dd49a73441ed38'),",
              "              '09':(6353,'4c8476e6c221fb276573c4bb8f79ccdcdf32c8e10a217d59d3986e5dc2bc3e94'),",
              "              '10':(6353,'40d61045edf3f1f5b14212c9c1d5fbdf09196483b9553dfb68e7af657e2cb7df'),",
              "              '11':(6353,'e8968a47fb71d184c4ed29befdd9c6358fa5ad1d35b583e2ee22cd4d27e6f1bc'),",
              "              '12':(6353,'cf409ba0de9a3f31033190cf8c993a671dd563f21011a733244601310863d9e8'),",
              "              '13':(6353,'019d8f9b51fb2e4a1eb750769bd4c9cabf5d7b59b3ad659e6396dff73187e4bc'),",
              "              '14':(6353,'76a570509947976de11ff9202075f8402be967836827c70f9f72f20dbbd4b6ed'),",
              "              '15':(6341,'088d103d1f1eb469442ab196c96591a307a16498d45776a6880755c44302ac9d'),",
              "          }",
              "          for key in keys:",
              "              payload=parts[key]",
              "              expected_length,expected_hash=expected_payloads[key]",
              "              assert len(payload)==expected_length, (key,len(payload),expected_length)",
              "              assert hashlib.sha256(payload.encode('ascii')).hexdigest()==expected_hash, key",
              "          encoded=''.join(parts[key] for key in keys)",
              "          assert len(encoded) % 4 == 0, len(encoded)",
              "          archive=base64.b64decode(encoded, validate=True)",
          ]
          replacement = '\n'.join(lines) + '\n'
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/fix-v071-loader.yml
          git -c core.whitespace=-blank-at-eof diff --check
          git config user.name 'SUNHAOJUN22 hardening automation'
          git config user.email 'SUNHAOJUN22@users.noreply.github.com'
          git add -A
          git commit -m 'fix: verify exact v0.7.1 overlay parts'
          git push origin HEAD:main
          printf 'status=loader-fixed\ncommit=%s\nsource-issue=176\n' "$(git rev-parse HEAD)" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
