name: Diagnose README visual static gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] finalize README visual atlas' &&
      github.event.comment.body == '[TSR] diagnose visual static command'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact validation toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Execute static gates one by one
        shell: bash
        run: |
          set -u
          mkdir -p artifacts

          report() {
            stage="$1"
            status="$2"
            {
              printf 'visual static diagnostic status=%s; stage=%s; run=%s\n\n' "$status" "$stage" "$GITHUB_RUN_ID"
              if [ -s /tmp/visual-static.log ]; then
                printf '```text\n'
                tail -n 100 /tmp/visual-static.log
                printf '\n```\n'
              fi
            } > /tmp/visual-static-body.md
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/visual-static-body.md
          }

          gate() {
            name="$1"
            shift
            : > /tmp/visual-static.log
            set +e
            "$@" > /tmp/visual-static.log 2>&1
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              report "$name" failure
              exit "$code"
            fi
            report "$name" pass
          }

          gate ruff-format python -m ruff format --check scripts tsao_researcher tests
          gate ruff-check python -m ruff check scripts tsao_researcher tests
          gate mypy python -m mypy scripts tsao_researcher
          gate bandit python -m bandit -q -lll -r scripts tsao_researcher
          gate pip-audit python -m pip_audit --strict
          gate mutation python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          gate performance python scripts/performance_smoke.py --json-out artifacts/performance.json
          gate quality-baseline python scripts/check_quality_baseline.py
          report all-static-gates success
