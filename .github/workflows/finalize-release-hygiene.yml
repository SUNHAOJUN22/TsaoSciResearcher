name: Finalize release hygiene

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue receiving the final candidate result
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: finalize-release-hygiene-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] finalize release hygiene')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Apply hygiene corrections and remove one-shot controls
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          (root / 'dist-a/TsaoSciResearcher-v0.5.3.zip.sha256').unlink(missing_ok=False)
          replacements = {
              'README.md': ('| Test modules | **32** |', '| Test modules | **33** |'),
              'README_EN.md': ('| Test modules | **32** |', '| Test modules | **33** |'),
              'README.zh-CN.md': ('| 测试模块 | **32** |', '| 测试模块 | **33** |'),
          }
          for name, (old, new) in replacements.items():
              path = root / name
              text = path.read_text(encoding='utf-8', errors='strict')
              if text.count(old) != 1:
                  raise SystemExit(f'README fact anchor mismatch: {name}')
              path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          for name in (
              '.github/workflows/finalize-release-hygiene.yml',
              '.github/workflows/dispatch-release-hygiene.yml',
          ):
              (root / name).unlink(missing_ok=True)
          PY
      - name: Regenerate deterministic repository evidence
        run: |
          python scripts/sync_version.py --write
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
      - name: Validate repository documentation and contracts
        run: |
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          mkdocs build --strict
      - name: Complete regression coverage and order independence
        run: |
          mkdir -p artifacts
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          TSR_TEST_ORDER_SEED=20260727 python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin
      - name: Static type source and dependency security
        run: |
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict -r artifacts/resolved-environment.lock --format cyclonedx-json --output artifacts/resolved-environment-sbom.json
      - name: Mutation performance quality and distributions
        run: |
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python
      - name: Create clean verified candidate
        id: candidate
        run: |
          rm -rf site build htmlcov .coverage .pytest_cache .mypy_cache .ruff_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: remove stale release sidecar and sync README facts'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build commit-bound external evidence
        run: |
          python scripts/record_quality_history.py --source-commit "${{ steps.candidate.outputs.sha }}" --workflow-run-id "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT" --evidence-date "$(date -u +%F)"
          python scripts/build_validation_evidence.py --write --attested --out artifacts/VALIDATION_EVIDENCE.json --source-commit "${{ steps.candidate.outputs.sha }}" --publication-parent "${{ steps.candidate.outputs.sha }}" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --evidence-date "$(date -u +%F)"
          python scripts/build_publication_attestation.py --commit "${{ steps.candidate.outputs.sha }}" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-hygiene-${{ steps.candidate.outputs.sha }}
          path: |
            artifacts
            docs/VALIDATION_EVIDENCE.json
            docs/SBOM.cdx.json
            docs/engineering-audit-report.pdf
            docs/test-dashboard.html
            docs/test-dashboard.svg
            docs/research-quality-dashboard.html
            docs/research-quality-dashboard.svg
            SHA256SUMS
            dist-a
            dist-python
          if-no-files-found: error
          retention-days: 30
      - name: Report successful candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "release hygiene status=success; run=${GITHUB_RUN_ID}; candidate=${CANDIDATE_SHA}; tests=185; line-coverage>=85; mutations=18/18; stale-sidecar=removed"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
