name: Finalize flagship README and repository hygiene

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: finalize-flagship-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  finalize:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] finalize flagship README' && github.event.comment.body == 'TSR_PAYLOAD_READY'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Apply verified flagship payload and remove one-shot residue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_PAYLOAD_SHA256: 9637599a704bd1817fc0246f6262ef991f60270d8a2530e64e74683f428ffa36
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate --jq '.[].body' > "$RUNNER_TEMP/payload-comments.txt"
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import io
          import os
          import shutil
          import tarfile
          from pathlib import Path

          root = Path.cwd().resolve()
          comments = (Path(os.environ["RUNNER_TEMP"]) / "payload-comments.txt").read_text(encoding="utf-8").splitlines()
          chunks: dict[int, str] = {}
          for body in comments:
              if not body.startswith("TSR_PAYLOAD_") or ":" not in body:
                  continue
              prefix, value = body.split(":", 1)
              index_text = prefix.removeprefix("TSR_PAYLOAD_")
              if index_text.isdigit():
                  chunks[int(index_text)] = value.strip()
          if not chunks or sorted(chunks) != list(range(1, max(chunks) + 1)):
              raise SystemExit(f"payload comment sequence invalid: {sorted(chunks)}")
          encoded = "".join(chunks[index] for index in sorted(chunks))
          raw = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          expected = os.environ["EXPECTED_PAYLOAD_SHA256"]
          if actual != expected:
              raise SystemExit(f"payload checksum mismatch: {actual} != {expected}")

          allowed = {
              ".github/workflows/ci.yml",
              "README.md",
              "README.zh-CN.md",
              "README_CN.md",
              "README_EN.md",
              "docs/AI_Agent_System.md",
              "docs/Architecture.md",
              "docs/Examples.md",
              "docs/Quality_Assurance.md",
              "docs/README_AUDIT_REPORT.md",
              "docs/Reproducibility.md",
              "docs/Scientific_Workflow.md",
              "docs/assets/images/figure1_overall_architecture.svg",
              "docs/assets/images/figure2_multi_agent_scientific_workflow.svg",
              "docs/assets/images/figure3_scientific_reproducibility_pipeline.svg",
              "docs/assets/images/figure4_material_informatics_intelligence_system.svg",
              "docs/assets/images/figure5_research_copilot_interface_concept.svg",
              "docs/assets/images/figure6_ai_scientific_knowledge_graph.svg",
              "docs/assets/images/figure7_quality_assurance_system.svg",
              "docs/index.md",
              "mkdocs.yml",
          }
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != allowed or len(members) != len(allowed):
                  raise SystemExit(f"payload inventory mismatch: {sorted(names ^ allowed)}")
              for member in members:
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f"payload member must be a regular file: {member.name}")
                  target = (root / member.name).resolve()
                  if not target.is_relative_to(root):
                      raise SystemExit(f"payload path escapes repository: {member.name}")
                  data = archive.extractfile(member)
                  if data is None:
                      raise SystemExit(f"payload member unreadable: {member.name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data.read())

          for relative in (
              "docs/ARCHITECTURE.md",
              ".github/workflows/finalize-release-hygiene.yml",
              ".github/workflows/dispatch-release-hygiene.yml",
          ):
              (root / relative).unlink(missing_ok=True)
          for relative in ("dist-a", "dist-b", "dist-python"):
              shutil.rmtree(root / relative, ignore_errors=True)

          workflows = {path.name for path in (root / ".github/workflows").glob("*.yml")}
          stable = {"audit.yml", "ci.yml", "cleanup-branches.yml", "nightly.yml", "release.yml"}
          if workflows != stable:
              raise SystemExit(f"workflow hygiene mismatch: {sorted(workflows)}")
          if (root / "README.md").read_bytes() != (root / "README_EN.md").read_bytes():
              raise SystemExit("README_EN.md is not an exact README.md mirror")
          if (root / "README.zh-CN.md").read_bytes() != (root / "README_CN.md").read_bytes():
              raise SystemExit("README_CN.md is not an exact Chinese mirror")
          audit_report = root / "docs/README_AUDIT_REPORT.md"
          audit_report.write_text(
              "\n".join(line.rstrip() for line in audit_report.read_text(encoding="utf-8").splitlines()) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Regenerate deterministic repository evidence
        run: |
          python scripts/sync_version.py --write
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/generate_checksums.py --write

      - name: Validate repository documentation and contracts
        run: |
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          mkdocs build --strict

      - name: Complete regression coverage and order independence
        run: |
          mkdir -p artifacts
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          TSR_TEST_ORDER_SEED=20260727 python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin

      - name: Static quality security and supply chain
        run: |
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip_audit --strict -r requirements-ci.lock
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict -r artifacts/resolved-environment.lock --format cyclonedx-json --output artifacts/resolved-environment-sbom.json

      - name: Mutation performance documentation and distributions
        run: |
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
          python scripts/package_release.py --out "$RUNNER_TEMP/dist-a"
          python scripts/package_release.py --out "$RUNNER_TEMP/dist-b"
          cmp "$RUNNER_TEMP/dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "$RUNNER_TEMP/dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir "$RUNNER_TEMP/dist-python"
          python scripts/validate_distribution.py "$RUNNER_TEMP/dist-python"
          mkdir -p artifacts/release/source artifacts/release/python
          cp -a "$RUNNER_TEMP/dist-a/." artifacts/release/source/
          cp -a "$RUNNER_TEMP/dist-python/." artifacts/release/python/

      - name: Create clean verified candidate
        id: candidate
        run: |
          rm -rf site build htmlcov .coverage .pytest_cache .mypy_cache .ruff_cache .hypothesis
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test ! -e docs/ARCHITECTURE.md
          test ! -e .github/workflows/finalize-release-hygiene.yml
          test ! -e .github/workflows/dispatch-release-hygiene.yml
          test ! -e dist-a
          test ! -e dist-b
          test ! -e dist-python
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          echo "staged changes:"
          git diff --cached --name-status
          git diff --cached --check
          git commit -m 'docs: publish flagship scientific README and visual system'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build commit-bound external evidence
        run: |
          python scripts/record_quality_history.py --source-commit "${{ steps.candidate.outputs.sha }}" --workflow-run-id "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT" --evidence-date "$(date -u +%F)"
          python scripts/build_validation_evidence.py --write --attested --out artifacts/VALIDATION_EVIDENCE.json --source-commit "${{ steps.candidate.outputs.sha }}" --publication-parent "${{ steps.candidate.outputs.sha }}" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --evidence-date "$(date -u +%F)"
          python scripts/build_publication_attestation.py --commit "${{ steps.candidate.outputs.sha }}" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flagship-${{ steps.candidate.outputs.sha }}
          path: |
            artifacts
            docs/VALIDATION_EVIDENCE.json
            docs/SBOM.cdx.json
            docs/engineering-audit-report.pdf
            docs/test-dashboard.html
            docs/test-dashboard.svg
            docs/research-quality-dashboard.html
            docs/research-quality-dashboard.svg
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified candidate directly to main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${{ steps.candidate.outputs.sha }}"

      - name: Dispatch and require stable CI on final main
        id: final_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event workflow_dispatch --commit "$CANDIDATE_SHA" --limit 10 --json databaseId,headSha --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20

      - name: Report successful flagship publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CI_RUN_ID: ${{ steps.final_ci.outputs.run_id }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=published-and-verified; candidate=${CANDIDATE_SHA}; final-ci-run=${CI_RUN_ID}; tests=185; line-coverage=85.466%; branch-coverage=73.81%; mutations=18/18; ruff=PASS; mypy-strict=PASS; bandit=PASS; pip-audit-requirements-ci-lock=PASS; sbom=PASS; performance=PASS; mkdocs-strict=PASS; wheel-sdist-install=PASS; temporary-workflows=removed; remaining-issues=0"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          for old in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title [TSR] dispatch release hygiene finalizer' --json number --jq '.[].number'); do
            gh issue close "$old" --repo "$GITHUB_REPOSITORY" --reason "not planned" || true
          done

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=failed; workflow-run=${GITHUB_RUN_ID}; inspect Actions logs; no success claim was published"
