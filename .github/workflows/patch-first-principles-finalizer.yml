name: Patch first-principles finalizer syntax

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] first-principles advisor development' &&
      github.event.comment.body == 'TSR_PATCH_FIRST_PRINCIPLES_FINALIZER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1

      - name: Correct embedded Python literals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/finalize-first-principles-advisor.yml')
          text = path.read_text(encoding='utf-8')
          old_false = '"human_approval": {"points": ["qualified method review before external execution"], "required": false}'
          old_null = 'tree.append({"path": relative, "mode": "100644", "type": "blob", "sha": null})'
          if text.count(old_false) != 1 or text.count(old_null) != 1:
              raise SystemExit('expected syntax anchors are missing or duplicated')
          text = text.replace(old_false, old_false.replace('false', 'False'))
          text = text.replace(old_null, old_null.replace('null', 'None'))
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Update finalizer through Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATH_NAME='.github/workflows/finalize-first-principles-advisor.yml'
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=main" --jq .sha)"
          CONTENT="$(base64 -w0 "$PATH_NAME")"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" \
            -f message='ci: correct first-principles finalizer Python literals' \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch='main' >/tmp/update.json
          test -n "$(python -c 'import json; print(json.load(open("/tmp/update.json"))["commit"]["sha"])')"

      - name: Report patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body 'status=finalizer-syntax-corrected; ready-for-payload-staging=true'

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=finalizer-syntax-patch-failed; workflow-run=${GITHUB_RUN_ID}"
