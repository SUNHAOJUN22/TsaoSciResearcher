name: Apply verified v0.7.1 optimization v2

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-v071-optimization-v2
  cancel-in-progress: false

env:
  BASELINE: d9eca929fc39e329b1d94fdb2a08d2a75b577afa
  OVERLAY_SHA256: e7fb0bdae5b0dee605f9b84ea4361ef15a4b676831434a6e48a5aa3d53f0f036
  OVERLAY_PARTS: "16"
  OPTIMIZATION_SHA256: 654b1db7f3e98e910f34e13681b1cc541b8d082fb7cc4b4770f261f501619cde
  OPTIMIZATION_PARTS: "9"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  apply:
    if: >-
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] apply v0.7.1 hardening' &&
      contains(github.event.issue.body, 'status=optimized-go')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Mark controlled v2 run active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=optimized-running\nworkflow-run=%s\nstaging=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt

      - name: Checkout exact staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Verify staging boundary and apply hash-bound archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASELINE" HEAD
          python - <<'PY'
          import os
          import subprocess

          allowed = {
              '.github/workflows/apply-v071.yml',
              '.github/workflows/apply-v071-v2.yml',
          } | {
              f'.github/v071-opt-part-{index:02d}.b64'
              for index in range(9)
          }
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', f"{os.environ['BASELINE']}..HEAD"],
                  text=True,
              ).splitlines()
          )
          assert changed == allowed, f'unexpected staging changes: {sorted(changed)}'
          PY
          gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" > /tmp/comments.json
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import tarfile
          from pathlib import Path, PurePosixPath

          rows = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))

          def collect_parts(prefix: str, total: int, expected: dict[str, tuple[int, str]]) -> bytes:
              pattern = re.compile(rf'{re.escape(prefix)} (\d{{2}})/(\d{{2}})\n([A-Za-z0-9+/=]+)')
              parts: dict[str, str] = {}
              for row in rows:
                  match = pattern.fullmatch(row.get('body', ''))
                  if not match:
                      continue
                  index, declared_total, payload = match.groups()
                  assert int(declared_total) == total
                  assert index not in parts, f'duplicate {prefix} part {index}'
                  parts[index] = payload
              keys = [f'{index:02d}' for index in range(total)]
              assert sorted(parts) == keys, (prefix, sorted(parts))
              for key in keys:
                  payload = parts[key]
                  expected_length, expected_hash = expected[key]
                  assert len(payload) == expected_length, (prefix, key, len(payload), expected_length)
                  assert hashlib.sha256(payload.encode('ascii')).hexdigest() == expected_hash, (prefix, key)
              return base64.b64decode(''.join(parts[key] for key in keys), validate=True)

          base_expected = {
              '00': (6353, '823f0f2ceccf84cf7bf56e03198eb40e812b834aa48225473807ca62507e9a32'),
              '01': (6353, '289c35321f3031a61622b085c1e989ce506f0107d998b0a73dc0a924b1ce360e'),
              '02': (6353, '7a524f6c058fc935864080a7ce3d307b893cd1acbc169751e0818b419dbe240a'),
              '03': (6353, '0a97ae9ffcc5f5b684893a57d520a1d678b629c0b8965eb3c0d395217333dc3d'),
              '04': (6353, 'f037bc6bcf0262e995c82c63ce3abd9f7f0c3af561022e32a41697bdd2ba7992'),
              '05': (6353, '10da1e2c239b31ae273600d8d55ad51891b0cd62b758efc95c8c1fb9e71be768'),
              '06': (6353, '9246c2940eb37b9f4007594995ce6e8e1bc7ba559c4b1ced9d7bd19c2cf78d64'),
              '07': (6353, '70c5be48827c772c26b4ff3e6dd370374f86ca17c68f2d2eb4cf335422160030'),
              '08': (6353, '9c6cd890e613afc78f30457a069f858b4be44f0d357a8d6d51dd49a73441ed38'),
              '09': (6353, '4c8476e6c221fb276573c4bb8f79ccdcdf32c8e10a217d59d3986e5dc2bc3e94'),
              '10': (6353, '40d61045edf3f1f5b14212c9c1d5fbdf09196483b9553dfb68e7af657e2cb7df'),
              '11': (6353, 'e8968a47fb71d184c4ed29befdd9c6358fa5ad1d35b583e2ee22cd4d27e6f1bc'),
              '12': (6353, 'cf409ba0de9a3f31033190cf8c993a671dd563f21011a733244601310863d9e8'),
              '13': (6353, '019d8f9b51fb2e4a1eb750769bd4c9cabf5d7b59b3ad659e6396dff73187e4bc'),
              '14': (6353, '76a570509947976de11ff9202075f8402be967836827c70f9f72f20dbbd4b6ed'),
              '15': (6341, '088d103d1f1eb469442ab196c96591a307a16498d45776a6880755c44302ac9d'),
          }
          opt_expected = {
              '00': (6000, 'c9d83432e24c395016808c23c631300b548c10c844eee720c5911490c3f7a486'),
              '01': (6000, 'b7a2442534148b00ed8603f7f50b6c84cb0b41e0c6deb1049bdb9b3167796f18'),
              '02': (6000, '8bdb40c03f0674c343367c83f4766a97e2866e7744d5da900333d40cde79a45c'),
              '03': (6000, '1c78eeb66358483ae967ec2d64a4b45a3d61ddf135f85936db8705f19960c6c4'),
              '04': (6000, '99bac40049170808cf2390fa1d91f8162355fcedebdd3f380317971f9012e74a'),
              '05': (6000, '8afa2d8074959e123c6303faeed844be2da41c8f8df1e12d88707da9df90dbca'),
              '06': (6000, 'eb5a62fbd17bb51c1695cfca4d331b8f19719e5dfaea24c22dbd27bd0f232977'),
              '07': (6000, '1bc03c0b4ab1a7fa16db16509f41c5673e6cef9a9fd47db0781340d806775c5f'),
              '08': (5492, 'e70e1cb7c2558e88325cefc8e40ac70672ee4090fcb0f21e3d15edf20c84b372'),
          }

          def verify_and_extract(data: bytes, expected_sha: str, target: Path, manifest_check) -> None:
              assert hashlib.sha256(data).hexdigest() == expected_sha
              archive_path = target.with_suffix('.tar.gz')
              archive_path.write_bytes(data)
              target.mkdir()
              with tarfile.open(archive_path, 'r:gz') as archive:
                  members = archive.getmembers()
                  names = [member.name for member in members]
                  assert 1 < len(members) <= 200
                  assert len(names) == len(set(names)) and 'manifest.json' in names
                  for member in members:
                      path = PurePosixPath(member.name)
                      assert not path.is_absolute() and '..' not in path.parts and '\\' not in member.name
                      assert member.isfile() and not member.issym() and not member.islnk()
                  archive.extractall(target, filter='data')
              manifest = json.loads((target / 'manifest.json').read_text(encoding='utf-8'))
              manifest_check(manifest)
              expected_names = {f"files/{row['path']}" for row in manifest['files']} | {'manifest.json'}
              assert set(names) == expected_names
              for row in manifest['files']:
                  relative = PurePosixPath(row['path'])
                  assert not relative.is_absolute() and '..' not in relative.parts and '\\' not in row['path']
                  source = target / 'files' / Path(*relative.parts)
                  payload = source.read_bytes()
                  assert len(payload) == row['bytes']
                  assert hashlib.sha256(payload).hexdigest() == row['sha256']
                  mode = int(row['mode'], 8)
                  assert mode in {0o644, 0o755}
                  destination = Path(row['path'])
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(payload)
                  destination.chmod(mode)

          base_data = collect_parts('PART', int(os.environ['OVERLAY_PARTS']), base_expected)
          verify_and_extract(
              base_data,
              os.environ['OVERLAY_SHA256'],
              Path('/tmp/v071-base'),
              lambda manifest: (
                  manifest['base_commit'] == os.environ['BASELINE']
                  or (_ for _ in ()).throw(AssertionError('base commit mismatch'))
              ),
          )
          assert Path('VERSION').read_text(encoding='utf-8').strip() == '0.7.1'
          path = Path('tests/test_import_isolation.py')
          source = path.read_text(encoding='utf-8')
          old = "assert tsao_researcher.__version__ == '0.7.0'"
          new = "assert tsao_researcher.__version__ == '0.7.1'"
          assert source.count(old) == 1
          path.write_text(source.replace(old, new), encoding='utf-8', newline='\n')

          opt_data = collect_parts('OPT2', int(os.environ['OPTIMIZATION_PARTS']), opt_expected)
          verify_and_extract(
              opt_data,
              os.environ['OPTIMIZATION_SHA256'],
              Path('/tmp/v071-opt-v2'),
              lambda manifest: (
                  manifest['base_overlay_sha256'] == os.environ['OVERLAY_SHA256']
                  or (_ for _ in ()).throw(AssertionError('optimization base mismatch'))
              ),
          )
          PY
          rm -f .github/v071-opt-part-*.b64
          rm -f .github/workflows/apply-v071.yml
          rm -f .github/workflows/apply-v071-v2.yml
          python scripts/sync_runtime_data.py --write

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Run complete quality, performance and release gates
        env:
          TSR_TEST_ORDER_SEED: "20260730"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python -m ruff check --fix scripts tsao_researcher tests
          python -m ruff format scripts tsao_researcher tests
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict -r artifacts/resolved-environment.lock --format cyclonedx-json --output artifacts/resolved-environment-sbom.json
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          mkdocs build --strict
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python
          git -c core.whitespace=-blank-at-eof diff --check

      - name: Prepare candidate commit with permanent workflow blobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          cp artifacts/quality-current.json /tmp/quality-current.json
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path

          paths = [
              '.github/workflows/audit.yml',
              '.github/workflows/ci.yml',
              '.github/workflows/main-attestation.yml',
              '.github/workflows/nightly.yml',
              '.github/workflows/release.yml',
          ]
          values = {}
          for path in paths:
              payload = json.dumps({
                  'content': base64.b64encode(Path(path).read_bytes()).decode(),
                  'encoding': 'base64',
              }).encode()
              result = subprocess.run(
                  ['gh', 'api', '--method', 'POST', f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs", '--input', '-'],
                  input=payload, check=True, capture_output=True,
              )
              values[path] = json.loads(result.stdout)['sha']
          Path('/tmp/workflow-blobs.json').write_text(json.dumps(values, sort_keys=True), encoding='utf-8')
          PY
          git checkout "$GITHUB_SHA" -- .github/workflows
          rm -rf artifacts dist-a dist-b dist-python site .coverage
          git config user.name 'SUNHAOJUN22 optimization automation'
          git config user.email 'SUNHAOJUN22@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git commit -m 'perf: optimize routing catalogs capsules and validation [skip ci]'
          git push origin HEAD:main
          code_commit="$(git rev-parse HEAD)"
          code_tree="$(git rev-parse HEAD^{tree})"
          export CODE_COMMIT="$code_commit"
          export CODE_TREE="$code_tree"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          blobs = json.loads(Path('/tmp/workflow-blobs.json').read_text(encoding='utf-8'))
          tree = [
              {'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha}
              for path, sha in sorted(blobs.items())
          ]
          tree.extend([
              {'path': '.github/workflows/apply-v071.yml', 'mode': '100644', 'type': 'blob', 'sha': None},
              {'path': '.github/workflows/apply-v071-v2.yml', 'mode': '100644', 'type': 'blob', 'sha': None},
          ])
          payload = json.dumps({'base_tree': os.environ['CODE_TREE'], 'tree': tree}).encode()
          result = subprocess.run(
              ['gh', 'api', '--method', 'POST', f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/trees", '--input', '-'],
              input=payload, check=True, capture_output=True,
          )
          final_tree = json.loads(result.stdout)['sha']
          payload = json.dumps({
              'message': 'perf: complete verified routing catalog capsule and validation optimization',
              'tree': final_tree,
              'parents': [os.environ['CODE_COMMIT']],
          }).encode()
          result = subprocess.run(
              ['gh', 'api', '--method', 'POST', f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/commits", '--input', '-'],
              input=payload, check=True, capture_output=True,
          )
          candidate = json.loads(result.stdout)['sha']
          Path('/tmp/candidate.json').write_text(json.dumps({
              'code_commit': os.environ['CODE_COMMIT'],
              'code_tree': os.environ['CODE_TREE'],
              'final_tree': final_tree,
              'candidate_commit': candidate,
          }, sort_keys=True), encoding='utf-8')
          PY

      - name: Report verified optimization candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/body.txt
          import json
          import os
          from pathlib import Path

          quality = json.loads(Path('/tmp/quality-current.json').read_text(encoding='utf-8'))
          candidate = json.loads(Path('/tmp/candidate.json').read_text(encoding='utf-8'))
          print('status=optimized-candidate-ready')
          print(f"workflow-run={os.environ['GITHUB_RUN_ID']}")
          for key in ('code_commit', 'code_tree', 'final_tree', 'candidate_commit'):
              print(f"{key.replace('_', '-')}={candidate[key]}")
          print(f"tests={quality['tests']['tests']}")
          print(f"line-coverage={quality['coverage']['line_percent']:.3f}")
          print(f"branch-coverage={quality['coverage']['branch_percent']:.3f}")
          print(f"mutation={quality['mutation']['killed']}/{quality['mutation']['total']}")
          print('all-prepublication-gates=PASS')
          PY
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt

      - name: Report controlled v2 failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=optimized-application-failed\nworkflow-run=%s\nstaging=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
