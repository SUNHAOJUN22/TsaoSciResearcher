name: Format code hardening test with locked Ruff

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  format:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] apply code hardening v0.6.0' &&
      github.event.comment.body == 'TSR_FORMAT_CODE_HARDENING_TEST'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.lock
      - name: Reconstruct candidate and format test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          import base64, hashlib, json, re, zipfile
          from pathlib import Path
          expected = '74ca1475dee6f6a4b50dfedb555082f071bc48776807e944755837d45c4de25a'
          comments = json.loads(Path('/tmp/comments.json').read_text())
          pieces = {}
          pattern = re.compile(r'TSR_CODE_PAYLOAD (\d+)/10')
          for row in comments:
              body = str(row.get('body', ''))
              if row.get('user', {}).get('login') != 'SUNHAOJUN22' or '\n' not in body:
                  continue
              header, data = body.split('\n', 1)
              match = pattern.fullmatch(header.strip())
              if match:
                  pieces[int(match.group(1))] = ''.join(data.split())
          if sorted(pieces) != list(range(1, 11)):
              raise SystemExit(f'incomplete chunks: {sorted(pieces)}')
          raw = base64.b64decode(''.join(pieces[i] for i in range(1, 11)), validate=True)
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit('payload checksum mismatch')
          Path('/tmp/payload.zip').write_bytes(raw)
          with zipfile.ZipFile('/tmp/payload.zip') as archive:
              Path('tests').mkdir(exist_ok=True)
              Path('tests/test_defensive_boundaries.py').write_bytes(
                  archive.read('tests/test_defensive_boundaries.py')
              )
          PY
          python -m ruff format tests/test_defensive_boundaries.py
          python -m ruff format --check tests/test_defensive_boundaries.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted-defensive-boundaries-${{ github.run_id }}
          path: tests/test_defensive_boundaries.py
          if-no-files-found: error
          retention-days: 7
      - name: Report formatter result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=code-hardening-test-formatted; workflow-run=${GITHUB_RUN_ID}; artifact=formatted-defensive-boundaries-${GITHUB_RUN_ID}; ruff-format=PASS"
      - name: Report formatter failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=code-hardening-format-failed; workflow-run=${GITHUB_RUN_ID}"
