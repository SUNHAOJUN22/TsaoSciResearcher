name: Finalize README implementation audit

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: finalize-readme-implementation-audit-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  verify-and-create-candidate:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] finalize README implementation audit' &&
      github.event.comment.body == 'TSR_FINALIZE_README_AUDIT'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact validation toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Verify and install checksum-bound README candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > /tmp/readme-audit-comments.json
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import json
          import re
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          comments = json.loads(Path("/tmp/readme-audit-comments.json").read_text(encoding="utf-8"))
          pattern = re.compile(r"TSR_README_PAYLOAD (\d+)/10")
          pieces: dict[int, str] = {}
          for row in comments:
              if row.get("user", {}).get("login") != "SUNHAOJUN22":
                  continue
              body = str(row.get("body", ""))
              if "\n" not in body:
                  continue
              header, data = body.split("\n", 1)
              match = pattern.fullmatch(header.strip())
              if not match:
                  continue
              index = int(match.group(1))
              if index in pieces:
                  raise SystemExit(f"duplicate payload chunk: {index}")
              pieces[index] = "".join(data.split())
          if sorted(pieces) != list(range(1, 11)):
              raise SystemExit(f"payload chunks incomplete: {sorted(pieces)}")
          expected_sha = "841e1e769c117165385b9dd2dc6f9986bb50c5de5ce0ffdef37438ca9e0ac0b4"
          expected_names = {
              "README.md",
              "README.zh-CN.md",
              "README_CN.md",
              "README_EN.md",
              "SHA256SUMS",
              "docs/ORIGINAL_REQUIREMENTS_AUDIT.json",
              "docs/ORIGINAL_REQUIREMENTS_AUDIT.md",
              "docs/ORIGINAL_REQUIREMENTS_AUDIT.zh-CN.md",
              "docs/VALIDATION_EVIDENCE.json",
              "docs/VISUAL_ATLAS.md",
              "docs/VISUAL_ATLAS.zh-CN.md",
              "docs/assets/ai/capability_implementation_levels.svg",
              "docs/assets/ai/evidence_citation_integrity_loop.svg",
              "docs/assets/ai/installation_compatibility_matrix.svg",
              "docs/assets/ai/original_requirements_coverage.svg",
              "docs/assets/ai/progressive_routing_loading.svg",
              "docs/assets/ai/project_ledgers_provenance.svg",
              "docs/assets/ai/research_production_pipeline.svg",
              "docs/assets/ai/supply_chain_release_attestation.svg",
              "docs/index.md",
              "mkdocs.yml",
          }
          encoded = "".join(pieces[index] for index in range(1, 11))
          raw = base64.b64decode(encoded, validate=True)
          actual_sha = hashlib.sha256(raw).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f"payload checksum mismatch: {actual_sha}")
          payload = Path("/tmp/readme-audit-payload.zip")
          payload.write_bytes(raw)
          with zipfile.ZipFile(payload) as archive:
              infos = [row for row in archive.infolist() if not row.is_dir()]
              names = {row.filename for row in infos}
              if names != expected_names:
                  raise SystemExit(f"payload inventory mismatch: {sorted(names)}")
              for info in infos:
                  pure = PurePosixPath(info.filename)
                  if pure.is_absolute() or any(part in {"", ".", ".."} for part in pure.parts):
                      raise SystemExit(f"unsafe payload path: {info.filename}")
                  if (info.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit(f"payload symbolic link forbidden: {info.filename}")
                  target = (root / pure).resolve(strict=False)
                  if not target.is_relative_to(root):
                      raise SystemExit(f"payload escapes repository: {info.filename}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(info.filename))
          PY
          rm .github/workflows/finalize-readme-audit.yml

      - name: Regenerate deterministic repository evidence
        run: |
          python scripts/sync_version.py --write
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write

      - name: Validate requirements audit and visual atlas
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import json

          root = Path.cwd()
          audit = json.loads((root / "docs/ORIGINAL_REQUIREMENTS_AUDIT.json").read_text(encoding="utf-8"))
          match = audit["catalog_match"]
          assert match["workbook_slugs"] == 322
          assert match["matched_slugs"] == 322
          assert match["missing_slugs"] == 0
          assert match["total_capability_contracts"] == 340
          svgs = sorted((root / "docs/assets/ai").glob("*.svg"))
          assert len(svgs) == 16, len(svgs)
          for svg in svgs:
              ET.parse(svg)
              text = svg.read_text(encoding="utf-8")
              assert 'role="img"' in text
              assert "<title" in text and "<desc" in text
          for readme in (root / "README.md", root / "README.zh-CN.md"):
              text = readme.read_text(encoding="utf-8")
              for svg in svgs:
                  assert f"docs/assets/ai/{svg.name}" in text
          print("requirements audit and 16-image visual atlas PASS")
          PY

      - name: Validate repository documentation and generated contracts
        run: |
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          mkdocs build --strict

      - name: Full regression coverage and order independence
        run: |
          mkdir -p artifacts
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          TSR_TEST_ORDER_SEED=20260728 python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin

      - name: Static type security mutation and performance gates
        run: |
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip_audit --strict -r requirements-ci.lock
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py

      - name: Deterministic release and distribution gates
        run: |
          python scripts/package_release.py --out artifacts/dist-a
          python scripts/package_release.py --out artifacts/dist-b
          VERSION="$(tr -d '\r\n' < VERSION)"
          cmp "artifacts/dist-a/TsaoSciResearcher-v${VERSION}.zip" "artifacts/dist-b/TsaoSciResearcher-v${VERSION}.zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir artifacts/dist-python
          python scripts/validate_distribution.py artifacts/dist-python

      - name: Create verified Git object candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          git diff --cached --check
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from __future__ import annotations
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          parent = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          parent_tree = subprocess.check_output(["git", "show", "-s", "--format=%T", "HEAD"], text=True).strip()
          changed = sorted(filter(None, subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--diff-filter=ACMRTUXB"], text=True
          ).splitlines()))
          deleted = sorted(filter(None, subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--diff-filter=D"], text=True
          ).splitlines()))
          required_deleted = {".github/workflows/finalize-readme-audit.yml"}
          if not required_deleted.issubset(deleted):
              raise SystemExit(f"temporary deletion missing: {sorted(required_deleted - set(deleted))}")

          def api(method: str, path: str, payload: dict) -> dict:
              data = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          tree = []
          for relative in changed:
              path = Path(relative)
              raw = path.read_bytes()
              blob = api("POST", "/git/blobs", {
                  "content": base64.b64encode(raw).decode("ascii"),
                  "encoding": "base64",
              })
              mode_row = subprocess.check_output(["git", "ls-files", "-s", "--", relative], text=True).strip()
              mode = mode_row.split()[0] if mode_row else "100644"
              tree.append({"path": relative, "mode": mode, "type": "blob", "sha": blob["sha"]})
          for relative in deleted:
              tree.append({"path": relative, "mode": "100644", "type": "blob", "sha": None})
          created_tree = api("POST", "/git/trees", {"base_tree": parent_tree, "tree": tree})
          commit = api("POST", "/git/commits", {
              "message": "docs: audit original requirements and expand bilingual visual atlas",
              "tree": created_tree["sha"],
              "parents": [parent],
          })
          print(f"sha={commit['sha']}")
          print(f"parent={parent}")
          print(f"changed={len(changed)}")
          print(f"deleted={len(deleted)}")
          PY

      - name: Report verified candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          PARENT_SHA: ${{ steps.candidate.outputs.parent }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=readme-audit-candidate-ready; candidate=${CANDIDATE_SHA}; parent=${PARENT_SHA}; catalog=322/322; capability-contracts=340; audit-requirements=18; visual-atlas=16-SVG; bilingual-readme=PASS; docs=PASS; tests=PASS; coverage=PASS; ruff=PASS; mypy=PASS; bandit=PASS; dependency-audit=PASS; mutation=21/21; performance=PASS; deterministic-release=PASS; distributions=PASS; temporary-controls=REMOVED"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=readme-audit-failed; workflow-run=${GITHUB_RUN_ID}; inspect failed step logs"
