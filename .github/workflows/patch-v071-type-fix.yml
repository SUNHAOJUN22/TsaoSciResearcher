name: Patch v0.7.1 capability type annotation

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: patch-v071-type-fix
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] apply v0.7.1 hardening' &&
      contains(github.event.issue.body, 'status=patch-type-fix')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Insert deterministic type correction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-v071.yml')
          source = path.read_text(encoding='utf-8')
          marker = "          rm -f .github/v071-opt-part-*.b64\n"
          lines = [
              "          python - <<'TYPE_FIX_PY'",
              "          from pathlib import Path",
              "",
              "          path = Path('tsao_researcher/capabilities.py')",
              "          source = path.read_text(encoding='utf-8')",
              "          import_line = 'from heapq import nsmallest\\n'",
              "          typed_import = 'from heapq import nsmallest\\nfrom typing import Any\\n'",
              "          old = '        kwargs = {}\\n'",
              "          new = '        kwargs: dict[str, Any] = {}\\n'",
              "          assert source.count(import_line) == 1",
              "          assert source.count(old) == 1",
              "          source = source.replace(import_line, typed_import, 1).replace(old, new, 1)",
              "          path.write_text(source, encoding='utf-8', newline='\\n')",
              "          TYPE_FIX_PY",
          ]
          block = '\n'.join(lines) + '\n'
          assert source.count(marker) == 1
          assert 'TYPE_FIX_PY' not in source
          path.write_text(source.replace(marker, block + marker), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/patch-v071-type-fix.yml
          git diff --check
          git config user.name 'SUNHAOJUN22 optimization automation'
          git config user.email 'SUNHAOJUN22@users.noreply.github.com'
          git add -A
          git commit -m 'ci: bind v0.7.1 capability type correction'
          git push origin HEAD:main
          printf 'status=type-fix-patched\ncommit=%s\nfailed-run=30714103674\n' "$(git rev-parse HEAD)" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
