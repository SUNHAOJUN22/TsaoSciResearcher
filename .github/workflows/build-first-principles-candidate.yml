name: Build first-principles 0.7.0 candidate

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: build-first-principles-0-7-0
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  build:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] first-principles advisor development' && github.event.comment.body == 'TSR_BUILD_FIRST_PRINCIPLES_0_7_0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Reconstruct and apply checksum-bound product patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import json
          from pathlib import Path

          expected_sha = "76a7a38ca35c126f4410a742473a90d3963a482339ec1c06fa87b3e8a465d0e8"
          comments = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          matches = []
          for row in comments:
              if row.get('user', {}).get('login') != 'SUNHAOJUN22':
                  continue
              body = str(row.get('body', ''))
              if body.startswith('TSR_FP_PATCH_PAYLOAD\n'):
                  matches.append(''.join(body.split('\n', 1)[1].split()))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one patch payload, found {len(matches)}')
          raw = base64.b64decode(matches[0], validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f'patch checksum mismatch: {actual}')
          Path('/tmp/first-principles.patch.xz').write_bytes(raw)
          PY
          xz --decompress --stdout /tmp/first-principles.patch.xz > /tmp/first-principles.patch
          git apply --check --binary /tmp/first-principles.patch
          git apply --binary /tmp/first-principles.patch
      - name: Remove all transport controls
        run: |
          rm -f .github/first-principles-advisor-plan.md
          rm -f .github/first-principles-development-session.txt
          rm -f .github/first-principles-patch.part-*
          rm -f .github/first-principles-payload.part-*
          rm -f .github/transport/finalize_first_principles_advisor.py
          rm -f .github/workflows/export-first-principles-source.yml
          rm -f .github/workflows/finalize-first-principles-advisor.yml
          rm -f .github/workflows/finalize-first-principles-advisor-v2.yml
          rm -f .github/workflows/finalize-first-principles-advisor-v3.yml
          rm -f .github/workflows/patch-first-principles-finalizer.yml
          rm -f .github/workflows/verify-first-principles-candidate.yml
          rm -f .github/workflows/build-first-principles-candidate.yml
          rmdir .github/transport 2>/dev/null || true
      - name: Install exact validation toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Validate candidate identity before object creation
        run: |
          test "$(cat VERSION)" = "0.7.0"
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/generate_checksums.py --check
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert manifest['capability_count'] == 341
          assert manifest['schema_count'] == 19
          assert not list(Path('.github').glob('first-principles-*'))
          assert not list(Path('.github/workflows').glob('*first-principles*'))
          assert not Path('.github/transport').exists()
          PY
      - name: Create clean Git candidate object without moving main
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          git diff --cached --check
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from __future__ import annotations
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          parent_tree = subprocess.check_output(['git', 'show', '-s', '--format=%T', 'HEAD'], text=True).strip()
          changed = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '--diff-filter=ACMRTUXB'], text=True
          ).splitlines()))
          deleted = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '--diff-filter=D'], text=True
          ).splitlines()))
          required = {
              'tsao_researcher/strategy.py',
              'schemas/v2/computation-strategy.schema.json',
              'tests/test_first_principles_strategy.py',
              'scripts/advise_computation_strategy.py',
          }
          if not required.issubset(changed):
              raise SystemExit(f'core product files absent: {sorted(required - set(changed))}')
          if not any(path.endswith('verify-first-principles-candidate.yml') for path in deleted):
              raise SystemExit('candidate verifier deletion missing')

          def api(method: str, path: str, payload: dict) -> dict:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  data=json.dumps(payload).encode('utf-8'),
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          tree = []
          for relative in changed:
              raw = Path(relative).read_bytes()
              blob = api('POST', '/git/blobs', {
                  'content': base64.b64encode(raw).decode('ascii'),
                  'encoding': 'base64',
              })
              mode_row = subprocess.check_output(['git', 'ls-files', '-s', '--', relative], text=True).strip()
              mode = mode_row.split()[0] if mode_row else '100644'
              tree.append({'path': relative, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          for relative in deleted:
              tree.append({'path': relative, 'mode': '100644', 'type': 'blob', 'sha': None})
          created_tree = api('POST', '/git/trees', {'base_tree': parent_tree, 'tree': tree})
          commit = api('POST', '/git/commits', {
              'message': 'feat: add first-principles computation strategy advisor',
              'tree': created_tree['sha'],
              'parents': [parent],
          })
          print(f"candidate={commit['sha']}")
          print(f'parent={parent}')
          print(f'changed={len(changed)}')
          print(f'deleted={len(deleted)}')
          PY
      - name: Report candidate object
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          PARENT: ${{ steps.candidate.outputs.parent }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
          DELETED: ${{ steps.candidate.outputs.deleted }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=first-principles-candidate-built
candidate=${CANDIDATE}
parent=${PARENT}
version=0.7.0
patch-sha256=76a7a38ca35c126f4410a742473a90d3963a482339ec1c06fa87b3e8a465d0e8
changed=${CHANGED}
deleted=${DELETED}
transport-controls=REMOVED
solver-execution=ABSENT"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=first-principles-candidate-build-failed
workflow-run=${GITHUB_RUN_ID}"
