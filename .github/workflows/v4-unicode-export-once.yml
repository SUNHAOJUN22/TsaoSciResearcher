name: V4 whole-tree Unicode exact export once

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - .github/workflows/v4-unicode-export-once.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: v4-unicode-export-once
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event_name == 'push' ||
      (github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/export-v4-unicode-candidate-v3'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Build controller-free Unicode-bound candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          generator = Path('scripts/refresh-current-main-readme.mjs')
          text = generator.read_text(encoding='utf-8')
          old = "const BAD = ['\\uFFFD', 'Ã', 'Â', 'â€', '锟斤拷'];\n"
          new = """const codepoints = (...values) => String.fromCodePoint(...values);
const BAD = [
  codepoints(0xfffd),
  codepoints(0x00c3),
  codepoints(0x00c2),
  codepoints(0x00e2, 0x20ac),
  codepoints(0x951f, 0x65a4, 0x62f7),
];
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one literal BAD marker array, found {text.count(old)}')
          generator.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python scripts/apply_v4_unicode_bindings.py
          git add -u .github/workflows
          python scripts/validate_unicode_integrity.py --normalize --write
          python -m ruff format scripts/validate_unicode_integrity.py scripts/apply_v4_unicode_bindings.py scripts/final_acceptance_preflight.py tests/test_unicode_integrity.py
          python scripts/validate_unicode_integrity.py --write
          python scripts/build_readme_facts.py --write
          python scripts/generate_checksums.py --write
          git diff --check
      - name: Commit exact candidate
        id: candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: enforce whole-tree Unicode integrity'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run complete Researcher qualification
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          python scripts/validate_unicode_integrity.py --check
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/validate_mathematical_contracts.py --check
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_dashboard.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/final_acceptance_preflight.py --root . --json
          python -m pytest -q -p hypothesis.extra.pytestplugin
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy tsao_researcher scripts
          python -m bandit -q -r tsao_researcher scripts -x tests -ll
          python -m mkdocs build --strict --clean --site-dir /tmp/tsao-researcher-site
          git diff --exit-code
          git diff --check
      - name: Prove sole remote main branch
        run: |
          set -euo pipefail
          git ls-remote --heads origin > /tmp/researcher-v4-branches.txt
          python - <<'PY'
          from pathlib import Path
          refs = [line.split()[1] for line in Path('/tmp/researcher-v4-branches.txt').read_text().splitlines() if line.strip()]
          if refs != ['refs/heads/main']:
              raise SystemExit(f'unexpected remote branches: {refs}')
          PY
      - name: Package exact candidate
        id: bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/researcher-v4-candidate"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          : > "$bundle/DELETE_PATHS.txt"
          while IFS=$'\t' read -r status path; do
            case "$status" in
              A|M)
                mkdir -p "$bundle/$(dirname "$path")"
                cp "$path" "$bundle/$path"
                ;;
              D)
                printf '%s\n' "$path" >> "$bundle/DELETE_PATHS.txt"
                ;;
              *) exit 2 ;;
            esac
          done < <(git diff-tree --no-commit-id --name-status -r HEAD)
          git rev-parse HEAD^ > "$bundle/PARENT_SHA.txt"
          git rev-parse HEAD > "$bundle/CANDIDATE_SHA.txt"
          git diff-tree --no-commit-id --name-status -r HEAD > "$bundle/CHANGES.tsv"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: researcher-v4-exact-candidate-${{ steps.candidate.outputs.sha }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: '213'
          OUTCOME: ${{ job.status }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          gh issue comment "$ISSUE" --body "V4_RESEARCHER_EXACT_EXPORT_V3 outcome=${OUTCOME} candidate=${CANDIDATE:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} bundle=uploaded unicode=whole-tree-strict mojibake_fixtures=runtime preflight=bound branch=main-only"
