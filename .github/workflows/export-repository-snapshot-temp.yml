name: One-time verified performance patch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: tsr-one-time-performance-patch
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  apply:
    if: >-
      github.event.issue.number == 198 &&
      github.event.issue.title == '[TSR] one-time repository snapshot export' &&
      github.event.comment.user.login == 'SUNHAOJUN22' &&
      github.event.comment.body == 'apply_token=TSR-20260805-perf-apply-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source ref and reconstruct payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          cat .github/tsr-perf-payload-temp-* > /tmp/tsr-perf-payload.b64
          base64 --decode /tmp/tsr-perf-payload.b64 > /tmp/tsr-perf-payload.zip
          echo "eb53b683255bfc840bd844ccc392bc508f292bc48ed1a9a1ab2324746fe50579  /tmp/tsr-perf-payload.zip" | sha256sum --check --strict

      - name: Validate and apply exact payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          archive = Path('/tmp/tsr-perf-payload.zip')
          expected = {
              'CHANGELOG.md': 'b9137debdc46830062e00bd8df950118b9f6b2d89dc556622df72649d78210c4',
              'SHA256SUMS': '5add991beaf668d0ae1cf68923635267b3c5a807b7e719edfb2650de09752a93',
              'docs/VALIDATION.md': 'c463ded41f9af5063e47da67d7803601eee67cbb3b61eaffa8400b1def3f2b82',
              'docs/VALIDATION_EVIDENCE.json': '9954979c212ded6d590c01fc2f1eecdb54a606ed81f8fd46820987c3b30cbbf1',
              'docs/engineering-audit-report.pdf': '1f940ed2c7b6011c9c45777ede8cae0397b3face101b83c337150910eeefe1d7',
              'docs/test-dashboard.html': '11ed61ffc078c7543d0b2aa17cabc718b69a6cf7f5f8b634c78d7c9b37c69c13',
              'docs/test-dashboard.svg': 'e7089a9ddb2fd7ef7d8bd5c76c84d939082074f56666698e7cdb05477f01f2d7',
              'scripts/capability_io.py': 'bc637a2c4a06064a9304e0df6504d4cc256f8b8b807cd7879ca651891c5cfa2a',
              'scripts/performance_smoke.py': '74af4d7d9d641e7ddd4c0b2efd9b3b4629a7aa5bb47a5fa8faa8eccfcafd0ca7',
              'scripts/route_task.py': '6ee9c2d997fdbfa75450a2a95ca3e7d3ad435b9a151f7e28e57056a01b4cbbf1',
              'tests/test_optimization_boundaries.py': '5899538a5d96ad54b39d4731d4a7f49da55af5773b7bc5450272d2e033b0ea4d',
              'tests/test_performance_contracts.py': '820cce75d8eca3361913d73cfbe6589255cc80b1a8e7ae963f48158902dd6a2a',
              'tests/test_runtime_v2.py': 'acae4d411b3cdff531ed95d9f355be09a2dffbe2227a80520e67269d72400a49',
              'tsao_researcher/capabilities.py': 'fc85a7b8a2e0effc5616efc2d3517539828f33f45ecdff9d253d595bcdf93d55',
              'tsao_researcher/router.py': 'f24bb3862ff685537d76590cd327610257ceabfacf131636ea02323de0b650c2',
              'tsao_researcher/strategy.py': '39b925013b7731aa13b43a2fc29b2a88ed8071684d3a629aa7c03da7a1c2ebcc',
          }
          executable = {'scripts/performance_smoke.py', 'scripts/route_task.py'}

          with zipfile.ZipFile(archive) as handle:
              infos = handle.infolist()
              names = [info.filename for info in infos]
              if len(names) != len(set(names)) or set(names) != set(expected):
                  raise SystemExit('payload inventory mismatch')
              for info in infos:
                  pure = PurePosixPath(info.filename)
                  if pure.is_absolute() or '..' in pure.parts or '\\' in info.filename:
                      raise SystemExit(f'unsafe payload path: {info.filename}')
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symbolic link rejected: {info.filename}')
                  data = handle.read(info)
                  digest = hashlib.sha256(data).hexdigest()
                  if digest != expected[info.filename]:
                      raise SystemExit(f'payload digest mismatch: {info.filename}')
                  target = (root / Path(*pure.parts)).resolve(strict=False)
                  if target != root and root not in target.parents:
                      raise SystemExit(f'payload target escapes repository: {info.filename}')
                  cursor = root
                  for part in pure.parts[:-1]:
                      cursor /= part
                      if cursor.is_symlink():
                          raise SystemExit(f'symbolic-link parent rejected: {info.filename}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  os.chmod(target, 0o755 if info.filename in executable else 0o644)
          PY

          rm -f \
            .github/workflows/export-repository-snapshot-temp.yml \
            .github/tsr-perf-payload-temp-* \
            docs/.snapshot-export-control-temp \
            docs/.snapshot-export-intent-temp \
            docs/.snapshot-export-issue-payload-temp \
            docs/.snapshot-export-marker-temp \
            docs/.snapshot-export-ready-temp \
            docs/.snapshot-export-request-temp \
            docs/.snapshot-export-trigger-temp

      - name: Verify exact working-tree scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-paths.txt <<'EOF'
          .github/tsr-perf-payload-temp-00
          .github/tsr-perf-payload-temp-01
          .github/tsr-perf-payload-temp-01a
          .github/tsr-perf-payload-temp-01b
          .github/tsr-perf-payload-temp-01c
          .github/tsr-perf-payload-temp-02
          .github/tsr-perf-payload-temp-03a
          .github/tsr-perf-payload-temp-03a1
          .github/tsr-perf-payload-temp-03a2
          .github/tsr-perf-payload-temp-03b
          .github/tsr-perf-payload-temp-04a
          .github/tsr-perf-payload-temp-04b
          .github/tsr-perf-payload-temp-05a
          .github/tsr-perf-payload-temp-05b
          .github/workflows/export-repository-snapshot-temp.yml
          CHANGELOG.md
          SHA256SUMS
          docs/.snapshot-export-control-temp
          docs/.snapshot-export-intent-temp
          docs/.snapshot-export-issue-payload-temp
          docs/.snapshot-export-marker-temp
          docs/.snapshot-export-ready-temp
          docs/.snapshot-export-request-temp
          docs/.snapshot-export-trigger-temp
          docs/VALIDATION.md
          docs/VALIDATION_EVIDENCE.json
          docs/engineering-audit-report.pdf
          docs/test-dashboard.html
          docs/test-dashboard.svg
          scripts/capability_io.py
          scripts/performance_smoke.py
          scripts/route_task.py
          tests/test_optimization_boundaries.py
          tests/test_performance_contracts.py
          tests/test_runtime_v2.py
          tsao_researcher/capabilities.py
          tsao_researcher/router.py
          tsao_researcher/strategy.py
          EOF
          git status --porcelain=v1 | cut -c4- | LC_ALL=C sort > /tmp/actual-paths.txt
          LC_ALL=C sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Run repository and generated-evidence gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          mkdocs build --strict

      - name: Run complete regression and static gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p hypothesis.extra.pytestplugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py

      - name: Run deterministic build and install gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python

      - name: Commit exact verified patch and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- \
            .github/tsr-perf-payload-temp-00 \
            .github/tsr-perf-payload-temp-01 \
            .github/tsr-perf-payload-temp-01a \
            .github/tsr-perf-payload-temp-01b \
            .github/tsr-perf-payload-temp-01c \
            .github/tsr-perf-payload-temp-02 \
            .github/tsr-perf-payload-temp-03a \
            .github/tsr-perf-payload-temp-03a1 \
            .github/tsr-perf-payload-temp-03a2 \
            .github/tsr-perf-payload-temp-03b \
            .github/tsr-perf-payload-temp-04a \
            .github/tsr-perf-payload-temp-04b \
            .github/tsr-perf-payload-temp-05a \
            .github/tsr-perf-payload-temp-05b \
            .github/workflows/export-repository-snapshot-temp.yml \
            CHANGELOG.md \
            SHA256SUMS \
            docs/.snapshot-export-control-temp \
            docs/.snapshot-export-intent-temp \
            docs/.snapshot-export-issue-payload-temp \
            docs/.snapshot-export-marker-temp \
            docs/.snapshot-export-ready-temp \
            docs/.snapshot-export-request-temp \
            docs/.snapshot-export-trigger-temp \
            docs/VALIDATION.md \
            docs/VALIDATION_EVIDENCE.json \
            docs/engineering-audit-report.pdf \
            docs/test-dashboard.html \
            docs/test-dashboard.svg \
            scripts/capability_io.py \
            scripts/performance_smoke.py \
            scripts/route_task.py \
            tests/test_optimization_boundaries.py \
            tests/test_performance_contracts.py \
            tests/test_runtime_v2.py \
            tsao_researcher/capabilities.py \
            tsao_researcher/router.py \
            tsao_researcher/strategy.py
          git diff --cached --name-only | LC_ALL=C sort > /tmp/staged-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/staged-paths.txt
          test -n "$(git diff --cached --name-only)"
          git commit -m "perf: optimize deterministic scientific routing and catalog paths"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main

      - name: Report final commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=performance-patch-applied final_commit=${final_sha} workflow_run_id=${GITHUB_RUN_ID} linux_precommit_gates=PASS"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=performance-patch-failed staged_source=${GITHUB_SHA} workflow_run_id=${GITHUB_RUN_ID}"
