name: One-time main tree coordinate

on:
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: tsr-main-tree-coordinate
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] one-time repository snapshot export' &&
      contains(github.event.issue.body, 'tree_token=TSR-20260805-atomic-main-write')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact issue-event main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Report commit and tree coordinates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          cat > /tmp/issue-body.txt <<EOF
          status=tree-ready
          source_commit=${GITHUB_SHA}
          source_tree=${tree_sha}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          EOF
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.txt
