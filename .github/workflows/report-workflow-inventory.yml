name: Report workflow inventory

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] report workflow inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Report exact workflow filenames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          inventory="$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | paste -sd, -)"
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=inventory-reported
          workflows=${inventory}"
