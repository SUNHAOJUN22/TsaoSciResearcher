name: Current main qualification once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/current-main-qualification-once.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: researcher-current-main-qualification-once
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Remove one-time controller from qualified tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/current-main-qualification-once.yml
      - name: Install exact validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Rebuild stale generated evidence on controller-free tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          python scripts/validate_unicode_integrity.py --check
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/validate_mathematical_contracts.py --check
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/generate_checksums.py --write
          git add -u
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/current-main-qualification-once.yml',
              'SHA256SUMS',
              'docs/SCIENTIFIC_QUALITY_EXAMPLES.json',
              'docs/research-quality-dashboard.html',
              'docs/research-quality-dashboard.svg',
              'docs/test-dashboard.html',
              'docs/test-dashboard.svg',
          }
          paths = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit(f'unexpected generated changes: {unexpected}')
          if '.github/workflows/current-main-qualification-once.yml' not in paths:
              raise SystemExit('one-time controller deletion is not staged')
          if 'docs/test-dashboard.html' not in paths:
              raise SystemExit('expected stale test dashboard was not regenerated')
          PY
      - name: Run complete qualification on regenerated exact tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/final_acceptance_preflight.py --root . --json
          python -m pytest -q -p hypothesis.extra.pytestplugin
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy tsao_researcher scripts
          python -m bandit -q -r tsao_researcher scripts -x tests -ll
          python -m mkdocs build --strict --clean --site-dir "$RUNNER_TEMP/tsao-researcher-site"
          git diff --exit-code
          git diff --check --cached
      - name: Publish exact qualified clean tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          parent="$GITHUB_SHA"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): bind dashboards to final clean tree'
          qualified="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$parent"
          git push origin HEAD:main
          echo "qualified=$qualified" >> "$GITHUB_OUTPUT"
      - name: Record machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          QUALIFIED: ${{ steps.publish.outputs.qualified }}
        shell: bash
        run: |
          gh issue comment 213 --body "CURRENT_MAIN_EXACT_QUALIFICATION outcome=${OUTCOME} tested_parent=${GITHUB_SHA} qualified=${QUALIFIED:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} unicode=whole-tree-strict dashboards=regenerated-exact-tree controller=self-removed"
