name: Finalize first-principles strategy advisor v3

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: finalize-first-principles-advisor-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  finalize:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] first-principles advisor development' &&
      github.event.comment.body == 'TSR_FINALIZE_FIRST_PRINCIPLES_ADVISOR_V3'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact validation toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Verify and apply checksum-bound Git patch
        run: |
          cat .github/first-principles-patch.part-* | tr -d '\n\r ' | base64 --decode > /tmp/first-principles.patch.xz
          test "$(sha256sum /tmp/first-principles.patch.xz | cut -d' ' -f1)" = "afc822bff1ddbfb35dbe05cf359ee121ef09e53bf63c3ab42fc4f731c99d69fe"
          xz --decompress --stdout /tmp/first-principles.patch.xz > /tmp/first-principles.patch
          git apply --check /tmp/first-principles.patch
          git apply /tmp/first-principles.patch
          rm -f .github/first-principles-patch.part-*
          rm -f .github/workflows/finalize-first-principles-advisor-v3.yml

      - name: Run complete finalizer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python .github/transport/finalize_first_principles_advisor.py

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=first-principles-v3-failed; workflow-run=${GITHUB_RUN_ID}; inspect failed step logs"
