name: Diagnose v0.7.1 base and optimization comments

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] diagnose v0.7.1 payloads' &&
      contains(github.event.issue.body, 'status=payload-diagnose')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read and report exact comment payloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_ISSUE: ${{ github.event.issue.number }}
          SOURCE_ISSUE: "176"
        run: |
          gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$SOURCE_ISSUE/comments" > /tmp/comments.json
          python - <<'PY'
          import base64,hashlib,json,re
          from pathlib import Path
          rows=json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          for prefix,total in [('PART',16),('OPT2',9)]:
              pattern=re.compile(rf'{prefix} (\d{{2}})/(\d{{2}})\n([A-Za-z0-9+/=]+)')
              parts={}
              for row in rows:
                  match=pattern.fullmatch(row.get('body',''))
                  if match:
                      index,declared,payload=match.groups()
                      assert int(declared)==total and index not in parts
                      parts[index]=payload
              keys=[f'{i:02d}' for i in range(total)]
              print(prefix+'_KEYS='+json.dumps(sorted(parts)))
              meta={key:{'length':len(parts[key]),'sha256':hashlib.sha256(parts[key].encode('ascii')).hexdigest()} for key in keys if key in parts}
              print(prefix+'_META='+json.dumps(meta,sort_keys=True))
              if sorted(parts)==keys:
                  data=base64.b64decode(''.join(parts[key] for key in keys),validate=True)
                  print(prefix+'_ARCHIVE_SHA='+hashlib.sha256(data).hexdigest())
          PY
          printf 'status=payload-diagnostic-complete\nworkflow-run=%s\nsource-issue=%s\n' "$GITHUB_RUN_ID" "$SOURCE_ISSUE" > /tmp/body.txt
          gh issue edit "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
