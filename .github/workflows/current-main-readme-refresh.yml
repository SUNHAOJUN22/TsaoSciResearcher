name: Current-main README and visual refresh

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: current-main-readme-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       github.event.comment.user.login == github.repository_owner &&
       contains(github.event.comment.body, '/refresh-current-main-readme-v2'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install exact CI dependencies and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Generate bilingual current-main design
        run: |
          node scripts/refresh-current-main-readme.mjs --write
          cp README.md README_EN.md
          node scripts/refresh-current-main-readme.mjs --check
          python scripts/generate_checksums.py --write
          git diff --check
      - name: Create local exact-tree candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            README_EN.md \
            README.zh-CN.md \
            docs/CURRENT_MAIN_ACCEPTANCE.md \
            docs/current-main \
            SHA256SUMS
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'docs: refresh current-main bilingual acceptance design'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Run research-control, mathematical and evidence gates
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/validate_mathematical_contracts.py --check
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/final_acceptance_preflight.py --root . --json
          python -m pytest -q -p hypothesis.extra.pytestplugin \
            tests/test_scientific_quality.py \
            tests/test_receipts_capsules.py \
            tests/test_mathematical_contracts.py \
            tests/test_readme_facts.py \
            tests/test_final_acceptance_preflight.py
      - name: Rebase and publish candidate
        if: steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Publish refresh result to issue
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
        run: |
          gh issue comment "$ISSUE" --body "CURRENT_MAIN_README_REFRESH_V2 outcome=${OUTCOME} changed=${CHANGED:-unknown} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} automatic_approval=false"
