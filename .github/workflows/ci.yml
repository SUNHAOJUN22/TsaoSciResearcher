name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: researcher-evidence-reseal-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  reseal:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'remediation/clause-scope-contracts-ci-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out exact Draft branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: remediation/clause-scope-contracts-ci-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact CI stack
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Remove one-shot workflows and restore permanent definitions
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f -name 'remediation-*.yml' -delete
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git show origin/main:.github/workflows/audit.yml > .github/workflows/audit.yml
          python -m ruff format scripts tsao_researcher tests
          python -m ruff check --fix scripts tsao_researcher tests
          python -m ruff format scripts tsao_researcher tests

      - name: Regenerate deterministic repository evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_runtime_data.py --write
          python scripts/build_readme_facts.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/validate_unicode_integrity.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write
          python scripts/build_test_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write

      - name: Run full deterministic qualification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_unicode_integrity.py --check
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/validate_mathematical_contracts.py --check
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/final_acceptance_preflight.py --root . --json
          python -m compileall -q scripts tsao_researcher tests
          python -m unittest tests.test_contracts_v17 -v
          python -m pytest -q -p hypothesis.extra.pytestplugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher

      - name: Enforce semantic coverage fixed point
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage erase
          python -m coverage run --branch -m pytest -q -p hypothesis.extra.pytestplugin \
            tests/test_contracts_v17.py \
            tests/test_runtime_v2.py \
            tests/test_scientific_contracts_v16.py \
            tests/test_scientific_quality.py \
            tests/test_semantic_fixed_point_v20.py
          python -m coverage report \
            --include='tsao_researcher/router.py,tsao_researcher/scientific_contracts_v16.py,tsao_researcher/semantic_scope.py,tsao_researcher/contracts_v17.py' \
            --fail-under=90
          rm -f .coverage
          test ! -e .coverage
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'remediation-*.yml' -print -quit)"
          git diff --check

      - name: Commit clean evidence tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(evidence): reseal clean Researcher qualification tree'
          git push origin HEAD:remediation/clause-scope-contracts-ci-v2
