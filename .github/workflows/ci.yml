name: TsaoScience integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tsao-science-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' psutil
      - run: python -m pip check
      - run: python tools/verify_workspace.py
      - run: python tools/qualify.py
      - run: python tools/verify_workspace.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integration-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  dft-strict-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' mypy==2.3.0
      - run: python components/dft/scripts/run_strict_type_checks.py
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/resindb
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run validate:ai-egress
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node ../../tools/test_ai_snapshot.cjs && node ../../tools/test_canonical.cjs
