name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  compatibility:
    name: compatibility-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Materialize first-principles 0.7.0 candidate
        id: materialize
        shell: bash
        run: |
          if [[ ! -f .github/fp-extension-finalize.trigger ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, lzma
          from pathlib import Path
          expected = "86be73fda535ed348f8d7270a3a7444b7fdfbbfea340e782c057acf03e3b88c1"
          parts = sorted(Path('.github').glob('fp-extension-patch.part-*'))
          if len(parts) != 5:
              raise SystemExit(f"expected 5 patch parts, found {len(parts)}")
          encoded = ''.join(''.join(path.read_text(encoding='ascii').split()) for path in parts)
          raw = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f"patch checksum mismatch: {actual}")
          Path('.github/fp-extension.patch.tmp').write_bytes(lzma.decompress(raw))
          PY
          git apply --check .github/fp-extension.patch.tmp
          git apply .github/fp-extension.patch.tmp
          rm -f .github/fp-extension.patch.tmp
          rm -f .github/fp-extension-patch.part-*
          rm -f .github/fp-extension-finalize.trigger
          rm -f .github/fp-finalize-trigger.txt
          rm -f .github/first-principles-advisor-plan.md
          rm -f .github/first-principles-development-session.txt
          rm -f .github/first-principles-patch.part-*
          rm -f .github/first-principles-payload.part-*
          rm -f .github/transport/finalize_first_principles_advisor.py
          rmdir .github/transport 2>/dev/null || true
          rm -f .github/workflows/build-first-principles-candidate.yml
          rm -f .github/workflows/export-first-principles-source.yml
          rm -f .github/workflows/finalize-first-principles-advisor.yml
          rm -f .github/workflows/finalize-first-principles-advisor-v2.yml
          rm -f .github/workflows/finalize-first-principles-advisor-v3.yml
          rm -f .github/workflows/patch-first-principles-finalizer.yml
          rm -f .github/workflows/verify-first-principles-candidate.yml
          rm -f .github/workflows/dispatch-release-hygiene.yml
          git show 4f79afe5a895bd04fc2cee095398b2bdddac5a41:.github/workflows/ci.yml > .github/workflows/ci.yml
          test "$(cat VERSION)" = "0.7.0"
          echo "active=true" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install exact CI dependencies and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Compile and run cross-platform contracts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/tsr-pycache
        run: |
          python -m compileall -q scripts tsao_researcher tests
          python -m pytest -q -p hypothesis.extra.pytestplugin tests/test_archive_safety.py tests/test_common.py tests/test_install.py tests/test_project_state.py tests/test_runtime_v2.py tests/test_scientific_quality.py tests/test_handoff_cli.py tests/test_receipts_capsules.py tests/test_named_capabilities.py tests/test_first_principles_strategy.py
          python -m tsao_researcher --version
          python -m tsao_researcher route "run an actual DFT calculation"
          python -m tsao_researcher search "polymer molecular dynamics" --limit 3
          python -m tsao_researcher strategy "polymer free-energy and morphology" --observable free-energy --condition "finite temperature"
          python -m tsao_researcher quality examples/scientific-quality-check.json
          python scripts/validate_schemas.py
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json

  full-validation:
    name: full-validation-and-release-evidence
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Materialize first-principles 0.7.0 candidate
        id: materialize
        shell: bash
        run: |
          if [[ ! -f .github/fp-extension-finalize.trigger ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, lzma
          from pathlib import Path
          expected = "86be73fda535ed348f8d7270a3a7444b7fdfbbfea340e782c057acf03e3b88c1"
          parts = sorted(Path('.github').glob('fp-extension-patch.part-*'))
          if len(parts) != 5:
              raise SystemExit(f"expected 5 patch parts, found {len(parts)}")
          encoded = ''.join(''.join(path.read_text(encoding='ascii').split()) for path in parts)
          raw = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f"patch checksum mismatch: {actual}")
          Path('.github/fp-extension.patch.tmp').write_bytes(lzma.decompress(raw))
          PY
          git apply --check .github/fp-extension.patch.tmp
          git apply .github/fp-extension.patch.tmp
          rm -f .github/fp-extension.patch.tmp
          rm -f .github/fp-extension-patch.part-*
          rm -f .github/fp-extension-finalize.trigger
          rm -f .github/fp-finalize-trigger.txt
          rm -f .github/first-principles-advisor-plan.md
          rm -f .github/first-principles-development-session.txt
          rm -f .github/first-principles-patch.part-*
          rm -f .github/first-principles-payload.part-*
          rm -f .github/transport/finalize_first_principles_advisor.py
          rmdir .github/transport 2>/dev/null || true
          rm -f .github/workflows/build-first-principles-candidate.yml
          rm -f .github/workflows/export-first-principles-source.yml
          rm -f .github/workflows/finalize-first-principles-advisor.yml
          rm -f .github/workflows/finalize-first-principles-advisor-v2.yml
          rm -f .github/workflows/finalize-first-principles-advisor-v3.yml
          rm -f .github/workflows/patch-first-principles-finalizer.yml
          rm -f .github/workflows/verify-first-principles-candidate.yml
          rm -f .github/workflows/dispatch-release-hygiene.yml
          git show 4f79afe5a895bd04fc2cee095398b2bdddac5a41:.github/workflows/ci.yml > .github/workflows/ci.yml
          test "$(cat VERSION)" = "0.7.0"
          echo "active=true" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install exact CI dependencies and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Repository, metadata, schema and generated-artifact audit
        run: |
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          mkdocs build --strict
      - name: Complete regression
        run: |
          mkdir -p artifacts
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
      - name: Line and branch coverage
        run: |
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
      - name: Reverse and seeded-random order
        env:
          TSR_TEST_ORDER_SEED: "20260724"
        run: |
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin
      - name: Static, type and source security
        run: |
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
      - name: Dependency audit and deterministic SBOM
        run: |
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict -r artifacts/resolved-environment.lock --format cyclonedx-json --output artifacts/resolved-environment-sbom.json
          python scripts/build_sbom.py --check
      - name: Mutation, performance and quality baseline
        run: |
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
          python scripts/record_quality_history.py --source-commit "$GITHUB_SHA" --workflow-run-id "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT" --evidence-date "$(date -u +%F)"
          python scripts/build_validation_evidence.py --write --attested --out artifacts/VALIDATION_EVIDENCE.json --source-commit "$GITHUB_SHA" --publication-parent "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --evidence-date "$(date -u +%F)"
      - name: Deterministic source release
        run: |
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
      - name: Build and install wheel and sdist
        run: |
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python
      - name: Build external publication attestation
        run: python scripts/build_publication_attestation.py
      - name: Upload complete validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-evidence-${{ github.sha }}
          path: |
            artifacts
            artifacts/QUALITY_HISTORY.json
            docs/VALIDATION_EVIDENCE.json
            docs/SBOM.cdx.json
            docs/engineering-audit-report.pdf
            docs/test-dashboard.html
            docs/test-dashboard.svg
            docs/research-quality-dashboard.html
            docs/research-quality-dashboard.svg
            SHA256SUMS
            dist-a
            dist-python
            site
          if-no-files-found: error
          retention-days: 14
      - name: Create verified first-principles candidate object
        id: candidate
        if: steps.materialize.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          git diff --cached --check
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from __future__ import annotations
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          parent = os.environ['GITHUB_SHA']
          parent_tree = subprocess.check_output(['git', 'show', '-s', '--format=%T', parent], text=True).strip()
          changed = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '--diff-filter=ACMRTUXB'], text=True
          ).splitlines()))
          deleted = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '--diff-filter=D'], text=True
          ).splitlines()))
          required = {'tsao_researcher/strategy.py', 'schemas/v2/computation-strategy.schema.json', 'capabilities/v2/extensions.json'}
          if not required.issubset(changed):
              raise SystemExit(f"missing product files: {sorted(required - set(changed))}")
          if any(path.startswith('.github/fp-') or 'first-principles' in path for path in changed):
              raise SystemExit('temporary first-principles control survived candidate cleanup')
          def api(method: str, path: str, payload: dict) -> dict:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  data=json.dumps(payload).encode('utf-8'), method=method,
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          tree = []
          for relative in changed:
              raw = Path(relative).read_bytes()
              blob = api('POST', '/git/blobs', {'content': base64.b64encode(raw).decode('ascii'), 'encoding': 'base64'})
              mode_row = subprocess.check_output(['git', 'ls-files', '-s', '--', relative], text=True).strip()
              mode = mode_row.split()[0] if mode_row else '100644'
              tree.append({'path': relative, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          for relative in deleted:
              tree.append({'path': relative, 'mode': '100644', 'type': 'blob', 'sha': None})
          created_tree = api('POST', '/git/trees', {'base_tree': parent_tree, 'tree': tree})
          commit = api('POST', '/git/commits', {
              'message': 'feat: add first-principles computation strategy advisor',
              'tree': created_tree['sha'], 'parents': [parent],
          })
          print(f"sha={commit['sha']}")
          print(f"changed={len(changed)}")
          print(f"deleted={len(deleted)}")
          PY
      - name: Report verified first-principles candidate
        if: steps.materialize.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
          DELETED: ${{ steps.candidate.outputs.deleted }}
        run: |
          gh issue edit 69 --repo "$GITHUB_REPOSITORY" --body "status=first-principles-0.7.0-candidate-ready; candidate=${CANDIDATE_SHA}; parent=${GITHUB_SHA}; version=0.7.0; changed=${CHANGED}; deleted=${DELETED}; compatibility=PASS; full-tests=PASS; coverage=PASS; ruff=PASS; mypy=PASS; bandit=PASS; dependency-audit=PASS; mutation=PASS; performance=PASS; deterministic-release=PASS; wheel-sdist=PASS; solver-execution=ABSENT; temporary-controls=REMOVED"
