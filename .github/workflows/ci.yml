name: TsaoSci exact audit repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tsao-sci-audit-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
          persist-credentials: true
      - name: Patch audit and restore final CI
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          audit_path = Path("scripts/audit_repository.py")
          text = audit_path.read_text(encoding="utf-8")
          replacements = (
              (
                  '    "capability-invocation.schema.json",\n    "execution-receipt.schema.json",',
                  '    "capability-invocation.schema.json",\n    "computation-strategy.schema.json",\n    "execution-receipt.schema.json",',
              ),
              (
                  '    "handoff.schema.json",\n    "project.schema.json",',
                  '    "handoff.schema.json",\n    "mathematical-contract-registry.schema.json",\n    "project.schema.json",',
              ),
              (
                  '        "windows-latest",\n        "macos-latest",',
                  '        "windows-latest",\n        "ubuntu-latest",',
              ),
              ('        "schema_count": 19,', '        "schema_count": 20,'),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"audit replacement anchor missing: {old!r}")
              text = text.replace(old, new, 1)
          anchor = (
              "    missing_markers = sorted(marker for marker in required_ci_markers "
              "if marker not in ci_text)\n"
          )
          guard = (
              '    if "macos-latest" in ci_text:\n'
              '        errors.append("macOS is outside the Windows/Linux delivery qualification contract")\n'
              + anchor
          )
          if anchor not in text:
              raise SystemExit("CI marker anchor missing")
          text = text.replace(anchor, guard, 1)
          audit_path.write_text(text, encoding="utf-8", newline="\n")

          manifest_path = Path("manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["compatibility"]["macos"] = False
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          parent_ci = subprocess.check_output(
              ["git", "show", "HEAD^:.github/workflows/ci.yml"],
              text=True,
          )
          export_block = '''      - name: Export exact audit patch inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsao-sci-audit-sources-${{ github.sha }}
          path: |
            scripts/audit_repository.py
            manifest.json
          if-no-files-found: error
          retention-days: 1
'''
          if export_block not in parent_ci:
              raise SystemExit("temporary audit export block missing")
          final_ci = parent_ci.replace(export_block, "", 1)
          Path(".github/workflows/ci.yml").write_text(
              final_ci,
              encoding="utf-8",
              newline="\n",
          )
          PY
          python -m py_compile scripts/audit_repository.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_repository.py manifest.json .github/workflows/ci.yml
          git commit -m "fix: align audit with Windows Linux and 20-schema contract"
          git push origin HEAD:"$BRANCH"
