name: Acceptance development toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/acceptance-development-toolchain.yml]

permissions:
  contents: read

jobs:
  python-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Download repository-pinned tools and record package hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/toolchain"
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/toolchain" \
            ruff==0.15.22 hypothesis==6.157.2 sortedcontainers==2.4.0 \
            mypy==1.20.2 types-PyYAML==6.0.12.20260518
          (cd "$RUNNER_TEMP/toolchain" && sha256sum *.whl > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: acceptance-python-toolchain-${{ github.run_id }}
          path: ${{ runner.temp }}/toolchain
          retention-days: 7
          if-no-files-found: error
  resindb-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: SUNHAOJUN22/ResinDB-Pro-by-SunHJ
          ref: e416d4431b2f1228f5c1420c46dec745db286e15
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Preserve the exact declared development dependency installation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ls --all > "$RUNNER_TEMP/dependency-tree.txt"
          mkdir -p "$RUNNER_TEMP/toolchain"
          tar -czf "$RUNNER_TEMP/toolchain/node_modules.tar.gz" node_modules
          cp package-lock.json "$RUNNER_TEMP/toolchain/package-lock.json"
          cp "$RUNNER_TEMP/dependency-tree.txt" "$RUNNER_TEMP/toolchain/dependency-tree.txt"
          (cd "$RUNNER_TEMP/toolchain" && sha256sum node_modules.tar.gz package-lock.json > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: acceptance-resindb-toolchain-${{ github.run_id }}
          path: ${{ runner.temp }}/toolchain
          retention-days: 7
          if-no-files-found: error
