name: Verify or finalize v0.6.0 clean main

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: verify-finalize-v060-clean-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  verify-finalize:
    if: github.event.issue.title == '[TSR] verify or finalize v0.6.0 main v2'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize v0.6.0 when current main is still in transport state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_ARCHIVE_SHA256: f16ca6d03228d0adf29141b9b3952033d7855feba2e159e026584d52e4cd91da
          EXPECTED_ARCHIVE_BYTES: "134517"
          EXPECTED_ENCODED_BYTES: "179356"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import re
          import shutil
          import stat
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          current_version = (root / "VERSION").read_text(encoding="utf-8").strip()
          transport_path = root / ".github/v060-clean-transport.json"

          if current_version != "0.6.0":
              if not transport_path.is_file():
                  raise SystemExit("main is not v0.6.0 and canonical transport metadata is missing")
              transport = json.loads(transport_path.read_text(encoding="utf-8"))
              sha_pattern = re.compile(r"^[0-9a-f]{40}$")

              def candidates(value: object) -> list[list[str]]:
                  found: list[list[str]] = []
                  if isinstance(value, list) and len(value) == 79 and all(
                      isinstance(item, str) and sha_pattern.fullmatch(item) for item in value
                  ):
                      found.append(list(value))
                  elif isinstance(value, dict):
                      for item in value.values():
                          found.extend(candidates(item))
                  elif isinstance(value, list):
                      for item in value:
                          found.extend(candidates(item))
                  return found

              rows = candidates(transport)
              if len(rows) != 1:
                  raise SystemExit(f"expected one ordered 79-blob sequence, found {len(rows)}")
              token = os.environ["GH_TOKEN"]
              repository = os.environ["GITHUB_REPOSITORY"]
              chunks: list[bytes] = []
              for index, sha in enumerate(rows[0]):
                  request = urllib.request.Request(
                      f"https://api.github.com/repos/{repository}/git/blobs/{sha}",
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      value = json.load(response)
                  raw = base64.b64decode(value["content"], validate=True)
                  actual = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
                  if actual != sha:
                      raise SystemExit(f"Git blob identity mismatch at {index}: {actual} != {sha}")
                  chunks.append(raw)

              encoded = b"".join(chunks)
              if len(encoded) != int(os.environ["EXPECTED_ENCODED_BYTES"]):
                  raise SystemExit(f"encoded payload size mismatch: {len(encoded)}")
              archive_bytes = base64.b64decode(b"".join(encoded.split()), validate=True)
              if len(archive_bytes) != int(os.environ["EXPECTED_ARCHIVE_BYTES"]):
                  raise SystemExit(f"archive size mismatch: {len(archive_bytes)}")
              digest = hashlib.sha256(archive_bytes).hexdigest()
              if digest != os.environ["EXPECTED_ARCHIVE_SHA256"]:
                  raise SystemExit(f"archive digest mismatch: {digest}")

              archive_path = root / ".github/v060-delta.zip"
              archive_path.write_bytes(archive_bytes)
              with zipfile.ZipFile(archive_path) as archive:
                  names = [info.filename for info in archive.infolist()]
                  if len(names) != len(set(names)) or "manifest.json" not in names:
                      raise SystemExit("payload inventory is invalid")
                  manifest = json.loads(archive.read("manifest.json"))
                  manifest_rows = manifest.get("files") if isinstance(manifest, dict) else None
                  if manifest.get("schema_version") != "1.0" or not isinstance(manifest_rows, list):
                      raise SystemExit("payload manifest contract is invalid")
                  expected_members = {"manifest.json"}
                  validated: list[tuple[Path, bytes, str]] = []
                  for row in manifest_rows:
                      if not isinstance(row, dict):
                          raise SystemExit("payload row is not an object")
                      relative = str(row.get("path", ""))
                      pure = PurePosixPath(relative)
                      if not relative or pure.is_absolute() or any(part in {"", ".", ".."} for part in pure.parts):
                          raise SystemExit(f"unsafe payload path: {relative}")
                      member = "payload/" + pure.as_posix()
                      expected_members.add(member)
                      info = archive.getinfo(member)
                      mode = (info.external_attr >> 16) & 0o170000
                      if info.is_dir() or mode == stat.S_IFLNK or info.file_size > 64 * 1024 * 1024:
                          raise SystemExit(f"unsafe payload member: {member}")
                      payload = archive.read(member)
                      if len(payload) != int(row.get("size", -1)):
                          raise SystemExit(f"payload size mismatch: {relative}")
                      if hashlib.sha256(payload).hexdigest() != row.get("sha256"):
                          raise SystemExit(f"payload checksum mismatch: {relative}")
                      target = (root / relative).resolve()
                      if not target.is_relative_to(root):
                          raise SystemExit(f"payload escaped repository: {relative}")
                      validated.append((target, payload, str(row.get("mode"))))
                  if set(names) != expected_members or len(validated) != 79:
                      raise SystemExit("payload member inventory differs from manifest")
                  for target, payload, mode in validated:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(payload)
                      target.chmod(0o755 if mode == "100755" else 0o644)
              archive_path.unlink()

          # PDF header remains valid PDF syntax but uses an ASCII deterministic marker.
          report_builder = root / "scripts/build_engineering_report.py"
          if report_builder.is_file():
              text = report_builder.read_text(encoding="utf-8")
              old = 'output = bytearray(b"%PDF-1.4\\n%\\xe2\\xe3\\xcf\\xd3\\n")'
              new = 'output = bytearray(b"%PDF-1.4\\n%TsaoSciResearcher deterministic report\\n")'
              if old in text:
                  report_builder.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          # Remove every v0.6.0 transport, diagnostic and one-shot control, including this workflow.
          github = root / ".github"
          for path in sorted(github.rglob("*"), key=lambda item: len(item.parts), reverse=True):
              relative = path.relative_to(github)
              remove = any(part.startswith("v060") for part in relative.parts)
              remove = remove or (
                  path.parent.name == "workflows"
                  and (
                      path.name in {"apply-v060-deep.yml", "finalize-v060-issue.yml", "verify-finalize-v060.yml"}
                      or path.name.startswith("finalize-v060")
                  )
              )
              if remove:
                  if path.is_dir() and not path.is_symlink():
                      shutil.rmtree(path, ignore_errors=True)
                  else:
                      path.unlink(missing_ok=True)
          PY
          git status --short

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact validation and distribution toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Regenerate and verify deterministic repository artifacts
        run: |
          python scripts/sync_version.py --write
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          mkdocs build --strict

      - name: Create local candidate commit before testing
        id: candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'feat: release v0.6.0 research reproducibility hardening'
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Complete regression, coverage and order independence
        run: |
          mkdir -p artifacts
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          TSR_TEST_ORDER_SEED=20260724 python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin

      - name: Static, type, source and dependency security
        run: |
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip freeze --all | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict --format cyclonedx-json --output artifacts/resolved-environment-sbom.json

      - name: Mutation, performance, quality history and attestation
        run: |
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
          python scripts/record_quality_history.py --source-commit "${{ steps.candidate.outputs.sha }}" --workflow-run-id "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT" --evidence-date "$(date -u +%F)"
          python scripts/build_validation_evidence.py --write --attested --out artifacts/VALIDATION_EVIDENCE.json --source-commit "${{ steps.candidate.outputs.sha }}" --publication-parent "${{ steps.candidate.outputs.sha }}" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --evidence-date "$(date -u +%F)"
          python scripts/build_publication_attestation.py --commit "${{ steps.candidate.outputs.sha }}" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Deterministic source and Python distribution validation
        run: |
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python

      - name: Upload verified evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v060-verification-${{ steps.candidate.outputs.sha }}
          path: |
            artifacts
            docs/VALIDATION_EVIDENCE.json
            docs/QUALITY_HISTORY.json
            docs/SBOM.cdx.json
            docs/engineering-audit-report.pdf
            docs/test-dashboard.html
            docs/test-dashboard.svg
            docs/research-quality-dashboard.html
            docs/research-quality-dashboard.svg
            SHA256SUMS
            dist-a
            dist-python
            site
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified candidate directly to main when changed
        if: steps.candidate.outputs.changed == 'true'
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${{ steps.candidate.outputs.sha }}"

      - name: Report explicit verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then verdict=SUCCESS; else verdict=FAIL; fi
          gh issue comment "$ISSUE_NUMBER" --body "TSR_V060_VERDICT=${verdict}; run=${GITHUB_RUN_ID}; attempt=${GITHUB_RUN_ATTEMPT}; candidate=${CANDIDATE_SHA:-not-created}; changed=${CHANGED:-unknown}"
          if [ "$JOB_STATUS" = success ]; then gh issue close "$ISSUE_NUMBER" --reason completed; fi
