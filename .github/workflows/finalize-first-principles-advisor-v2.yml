name: Finalize first-principles strategy advisor v2

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: finalize-first-principles-advisor-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  finalize:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] first-principles advisor development' &&
      github.event.comment.body == 'TSR_FINALIZE_FIRST_PRINCIPLES_ADVISOR_V2'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact validation toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Verify and install checksum-bound feature payload
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          parts = [root / f".github/first-principles-payload.part-{index:02d}" for index in range(1, 21)]
          encoded = "".join("".join(path.read_text(encoding="ascii").split()) for path in parts)
          raw = base64.b64decode(encoded, validate=True)
          expected_sha = "05aeda511bb04285c9849a1557d5289094703e91222cd7c250718cb70393deba"
          actual_sha = hashlib.sha256(raw).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f"payload checksum mismatch: {actual_sha}")
          payload = Path("/tmp/first-principles-advisor-payload.zip")
          payload.write_bytes(raw)
          with zipfile.ZipFile(payload) as archive:
              manifest = json.loads(archive.read("manifest.json"))
              if manifest.get("source_commit") != "104be8e0f4d6f0414389858f67c4c73ef6c083de":
                  raise SystemExit("payload source commit mismatch")
              expected = {f"files/{name}" for name in manifest["changed"]} | {"manifest.json"}
              actual = {row.filename for row in archive.infolist() if not row.is_dir()}
              if actual != expected:
                  raise SystemExit("payload inventory mismatch")
              for info in archive.infolist():
                  if info.is_dir() or info.filename == "manifest.json":
                      continue
                  pure = PurePosixPath(info.filename)
                  if pure.parts[0] != "files" or pure.is_absolute() or any(part in {"", ".", ".."} for part in pure.parts):
                      raise SystemExit(f"unsafe payload path: {info.filename}")
                  if (info.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit(f"payload symbolic link forbidden: {info.filename}")
                  relative = PurePosixPath(*pure.parts[1:])
                  target = (root / relative).resolve(strict=False)
                  if not target.is_relative_to(root):
                      raise SystemExit(f"payload escapes repository: {info.filename}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(info.filename))
          PY

      - name: Run complete finalizer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python .github/transport/finalize_first_principles_advisor.py

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=first-principles-v2-failed; workflow-run=${GITHUB_RUN_ID}; inspect failed step logs"
