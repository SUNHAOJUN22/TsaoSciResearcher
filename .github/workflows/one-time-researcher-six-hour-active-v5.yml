name: Researcher six-hour active qualification v5

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  stage-1:
    if: github.event.issue.number == 212 && github.event.comment.body == '/run-researcher-six-hour-active-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    outputs:
      active_ns: ${{ steps.soak.outputs.active_ns }}
      cycles: ${{ steps.soak.outputs.cycles }}
      tested_sha: ${{ steps.target.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ca227bdc2b8091536e3c6b4cd0656f0d43e98fbb
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact accepted source
        id: target
        shell: bash
        run: |
          set -euo pipefail
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "ca227bdc2b8091536e3c6b4cd0656f0d43e98fbb"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"

      - name: Record six-hour run start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 212 --repo "$GITHUB_REPOSITORY" --body "Researcher six-hour active qualification v5: RUNNING; run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID; source=ca227bdc2b8091536e3c6b4cd0656f0d43e98fbb; required_active_ns=21600000000000; duration_basis=MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact CI environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Write deterministic qualification cycle
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/researcher-six-hour-cycle.sh" <<'CYCLE'
          set -euo pipefail
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/validate_mathematical_contracts.py --check
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/final_acceptance_preflight.py --root . --json
          python -m pytest -q -p hypothesis.extra.pytestplugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python scripts/run_mutation_smoke.py --json-out "$RUNNER_TEMP/researcher-mutation.json"
          python scripts/performance_smoke.py --json-out "$RUNNER_TEMP/researcher-performance.json"
          git diff --exit-code
          CYCLE
          chmod +x "$RUNNER_TEMP/researcher-six-hour-cycle.sh"

      - name: Accumulate active qualification runtime
        id: soak
        shell: bash
        env:
          ACTIVE_INITIAL_NS: "0"
          ACTIVE_TARGET_NS: "9000000000000"
          STAGE_NUMBER: "1"
          TESTED_SHA: ${{ steps.target.outputs.tested_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/researcher-six-hour-evidence"
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          evidence_dir = Path(os.environ['RUNNER_TEMP']) / 'researcher-six-hour-evidence'
          stage = int(os.environ['STAGE_NUMBER'])
          active_ns = int(os.environ['ACTIVE_INITIAL_NS'])
          target_ns = int(os.environ['ACTIVE_TARGET_NS'])
          tested_sha = os.environ['TESTED_SHA']
          cycle = 0
          ledger = evidence_dir / f'stage-{stage}.ndjson'
          ledger.write_text('', encoding='utf-8')
          while active_ns < target_ns:
              cycle += 1
              started_epoch = int(time.time())
              started_active = time.monotonic_ns()
              log = evidence_dir / f'stage-{stage}-current.log'
              with log.open('w', encoding='utf-8') as stream:
                  completed = subprocess.run(
                      ['bash', os.path.join(os.environ['RUNNER_TEMP'], 'researcher-six-hour-cycle.sh')],
                      stdout=stream,
                      stderr=subprocess.STDOUT,
                      text=True,
                      check=False,
                  )
              ended_active = time.monotonic_ns()
              ended_epoch = int(time.time())
              cycle_active_ns = ended_active - started_active
              active_ns += cycle_active_ns
              row = {
                  'stage': stage,
                  'cycle': cycle,
                  'tested_sha': tested_sha,
                  'started_epoch': started_epoch,
                  'ended_epoch': ended_epoch,
                  'cycle_active_ns': cycle_active_ns,
                  'cumulative_active_ns': active_ns,
                  'target_active_ns': target_ns,
                  'returncode': completed.returncode,
              }
              with ledger.open('a', encoding='utf-8') as stream:
                  stream.write(json.dumps(row, sort_keys=True) + '\n')
              if completed.returncode != 0:
                  print(log.read_text(encoding='utf-8', errors='replace')[-30000:])
                  raise SystemExit(f'stage {stage} cycle {cycle} failed')
              print(f'stage={stage} cycle={cycle} PASS active={active_ns / 3_600_000_000_000:.6f} h', flush=True)
          summary = {
              'schema': 'SUNHJ-SIX-HOUR-ACTIVE-QUALIFICATION-1',
              'stage': stage,
              'pass': True,
              'tested_sha': tested_sha,
              'stage_cycles': cycle,
              'cumulative_active_ns': active_ns,
              'cumulative_active_hours': active_ns / 3_600_000_000_000,
              'required_active_ns': target_ns,
              'duration_basis': 'MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY',
          }
          (evidence_dir / f'stage-{stage}-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'active_ns={active_ns}\n')
              stream.write(f'cycles={cycle}\n')
          PY

      - name: Upload stage 1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: researcher-six-hour-stage-1-${{ github.run_id }}
          path: ${{ runner.temp }}/researcher-six-hour-evidence/
          if-no-files-found: error
          retention-days: 30

  stage-2:
    needs: stage-1
    if: github.event.issue.number == 212 && github.event.comment.body == '/run-researcher-six-hour-active-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      active_ns: ${{ steps.soak.outputs.active_ns }}
      cycles: ${{ steps.soak.outputs.cycles }}
      tested_sha: ${{ needs.stage-1.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.stage-1.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact CI environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Write deterministic qualification cycle
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/researcher-six-hour-cycle.sh" <<'CYCLE'
          set -euo pipefail
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/validate_mathematical_contracts.py --check
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/final_acceptance_preflight.py --root . --json
          python -m pytest -q -p hypothesis.extra.pytestplugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python scripts/run_mutation_smoke.py --json-out "$RUNNER_TEMP/researcher-mutation.json"
          python scripts/performance_smoke.py --json-out "$RUNNER_TEMP/researcher-performance.json"
          git diff --exit-code
          CYCLE
          chmod +x "$RUNNER_TEMP/researcher-six-hour-cycle.sh"

      - name: Accumulate active qualification runtime
        id: soak
        shell: bash
        env:
          ACTIVE_INITIAL_NS: ${{ needs.stage-1.outputs.active_ns }}
          ACTIVE_TARGET_NS: "21600000000000"
          STAGE_NUMBER: "2"
          TESTED_SHA: ${{ needs.stage-1.outputs.tested_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/researcher-six-hour-evidence"
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          evidence_dir = Path(os.environ['RUNNER_TEMP']) / 'researcher-six-hour-evidence'
          stage = int(os.environ['STAGE_NUMBER'])
          active_ns = int(os.environ['ACTIVE_INITIAL_NS'])
          target_ns = int(os.environ['ACTIVE_TARGET_NS'])
          tested_sha = os.environ['TESTED_SHA']
          cycle = 0
          ledger = evidence_dir / f'stage-{stage}.ndjson'
          ledger.write_text('', encoding='utf-8')
          while active_ns < target_ns:
              cycle += 1
              started_epoch = int(time.time())
              started_active = time.monotonic_ns()
              log = evidence_dir / f'stage-{stage}-current.log'
              with log.open('w', encoding='utf-8') as stream:
                  completed = subprocess.run(
                      ['bash', os.path.join(os.environ['RUNNER_TEMP'], 'researcher-six-hour-cycle.sh')],
                      stdout=stream,
                      stderr=subprocess.STDOUT,
                      text=True,
                      check=False,
                  )
              ended_active = time.monotonic_ns()
              ended_epoch = int(time.time())
              cycle_active_ns = ended_active - started_active
              active_ns += cycle_active_ns
              row = {
                  'stage': stage,
                  'cycle': cycle,
                  'tested_sha': tested_sha,
                  'started_epoch': started_epoch,
                  'ended_epoch': ended_epoch,
                  'cycle_active_ns': cycle_active_ns,
                  'cumulative_active_ns': active_ns,
                  'target_active_ns': target_ns,
                  'returncode': completed.returncode,
              }
              with ledger.open('a', encoding='utf-8') as stream:
                  stream.write(json.dumps(row, sort_keys=True) + '\n')
              if completed.returncode != 0:
                  print(log.read_text(encoding='utf-8', errors='replace')[-30000:])
                  raise SystemExit(f'stage {stage} cycle {cycle} failed')
              print(f'stage={stage} cycle={cycle} PASS active={active_ns / 3_600_000_000_000:.6f} h', flush=True)
          summary = {
              'schema': 'SUNHJ-SIX-HOUR-ACTIVE-QUALIFICATION-1',
              'stage': stage,
              'pass': True,
              'tested_sha': tested_sha,
              'stage_cycles': cycle,
              'cumulative_active_ns': active_ns,
              'cumulative_active_hours': active_ns / 3_600_000_000_000,
              'required_active_ns': target_ns,
              'duration_basis': 'MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY',
          }
          (evidence_dir / f'stage-{stage}-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'active_ns={active_ns}\n')
              stream.write(f'cycles={cycle}\n')
          PY

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: researcher-six-hour-final-${{ github.run_id }}
          path: ${{ runner.temp }}/researcher-six-hour-evidence/
          if-no-files-found: error
          retention-days: 30

  duration-gate:
    needs: [stage-1, stage-2]
    if: always() && github.event.issue.number == 212 && github.event.comment.body == '/run-researcher-six-hour-active-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce six active hours
        shell: bash
        env:
          STAGE1_RESULT: ${{ needs.stage-1.result }}
          STAGE2_RESULT: ${{ needs.stage-2.result }}
          ACTIVE_NS: ${{ needs.stage-2.outputs.active_ns }}
          TESTED_SHA: ${{ needs.stage-2.outputs.tested_sha }}
        run: |
          set -euo pipefail
          test "$STAGE1_RESULT" = success
          test "$STAGE2_RESULT" = success
          test "${ACTIVE_NS:-0}" -ge 21600000000000
          test -n "$TESTED_SHA"

      - name: Record six-hour machine ledger
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE1_RESULT: ${{ needs.stage-1.result }}
          STAGE2_RESULT: ${{ needs.stage-2.result }}
          ACTIVE_NS: ${{ needs.stage-2.outputs.active_ns }}
          TESTED_SHA: ${{ needs.stage-2.outputs.tested_sha }}
          STAGE1_CYCLES: ${{ needs.stage-1.outputs.cycles }}
          STAGE2_CYCLES: ${{ needs.stage-2.outputs.cycles }}
        run: |
          set -euo pipefail
          verdict=FAIL
          if [[ "$STAGE1_RESULT" == success && "$STAGE2_RESULT" == success ]] && [[ "${ACTIVE_NS:-0}" -ge 21600000000000 ]]; then
            verdict=PASS
          fi
          gh issue comment 212 --repo "$GITHUB_REPOSITORY" --body "Researcher six-hour active qualification v5: $verdict; run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID; stage1=$STAGE1_RESULT; stage2=$STAGE2_RESULT; active_ns=${ACTIVE_NS:-0}; required_active_ns=21600000000000; source=${TESTED_SHA:-UNRESOLVED}; cycles=${STAGE1_CYCLES:-0}+${STAGE2_CYCLES:-0}; duration_basis=MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY"
          test "$verdict" = PASS
