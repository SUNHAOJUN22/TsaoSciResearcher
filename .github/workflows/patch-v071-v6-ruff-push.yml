# activation: 1
name: Patch v0.7.1 Ruff gate on push

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-v071-v6-ruff-push.yml

permissions:
  contents: write

concurrency:
  group: patch-v071-v6-ruff-push
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Apply deterministic root fix and self-clean
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-v071-v6.yml')
          source = path.read_text(encoding='utf-8')
          unverified = 'b56bf27d9893a44720e5bc4f6b7a2cba13a349c484e451c3317bc46966b014b6'
          verified = '6d7f1ebadac996773217ed2305556658d874afe9c9f26364a42c132a515e5ad9'
          assert source.count(unverified) == 1
          source = source.replace(unverified, verified)
          needle = """          apply_archive(
              optimized,
              lambda manifest: manifest['base_overlay_sha256'] == os.environ['BASE_ARCHIVE_SHA']
              or (_ for _ in ()).throw(AssertionError('optimization manifest mismatch')),
          )
"""
          patch = needle + """          fullwidth = \"\\uff21\\uff2c\\uff30\\uff28\\uff21\"
          escaped = r\"\\uff21\\uff2c\\uff30\\uff28\\uff21\"
          for test_name in (
              'tests/test_optimization_boundaries.py',
              'tests/test_performance_contracts.py',
          ):
              test_path = Path(test_name)
              test_source = test_path.read_text(encoding='utf-8')
              assert test_source.count(fullwidth) == 1, test_name
              test_path.write_text(
                  test_source.replace(fullwidth, escaped),
                  encoding='utf-8',
                  newline='\\n',
              )
"""
          assert source.count(needle) == 1
          path.write_text(source.replace(needle, patch), encoding='utf-8', newline='\n')
          PY
          rm -f .github/workflows/patch-v071-v6-ruff.yml
          rm -f .github/workflows/patch-v071-v6-ruff-push.yml
          git config user.name 'SUNHAOJUN22 optimization automation'
          git config user.email 'SUNHAOJUN22@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci: apply deterministic Ruff root fix to v0.7.1 gate'
          git push origin HEAD:main
