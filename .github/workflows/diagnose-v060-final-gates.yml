name: Diagnose v0.6.0 final quality gates

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] diagnose v0.6.0 final gates'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct candidate and apply security corrections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path.cwd().resolve()
          spec = importlib.util.spec_from_file_location('finalize_v060_ci', root / 'scripts/finalize_v060_ci.py')
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load finalizer')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.main()

          history = Path('scripts/record_quality_history.py')
          text = history.read_text(encoding='utf-8')
          old = (
              '    if not all(isinstance(item, dict) for item in (coverage, mutation, tests, performance)):\n'
              '        raise ValueError("quality-current sections must be objects")\n'
          )
          new = (
              '    if not isinstance(coverage, dict):\n'
              '        raise ValueError("quality-current coverage must be an object")\n'
              '    if not isinstance(mutation, dict):\n'
              '        raise ValueError("quality-current mutation must be an object")\n'
              '    if not isinstance(tests, dict):\n'
              '        raise ValueError("quality-current tests must be an object")\n'
              '    if not isinstance(performance, dict):\n'
              '        raise ValueError("quality-current performance must be an object")\n'
          )
          history.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          capsule = Path('tsao_researcher/capsule.py')
          text = capsule.read_text(encoding='utf-8')
          capsule.write_text(
              text.replace(
                  '        "total_bytes": sum(int(record["size_bytes"]) for record in records),\n',
                  '        "total_bytes": sum(path.stat().st_size for path in files),\n',
                  1,
              ),
              encoding='utf-8',
              newline='\n',
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
          python -m ruff format scripts tsao_researcher tests
          python -m ruff check --fix --exit-zero scripts tsao_researcher tests
          python -m ruff check --fix --unsafe-fixes --select C408 tests/test_receipts_capsules.py
          python -m ruff format scripts tsao_researcher tests

      - name: Generate candidate repository artifacts
        run: |
          python scripts/sync_version.py --write
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
          rm -rf site build htmlcov .coverage .pytest_cache .mypy_cache .ruff_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'diagnostic v0.6.0 candidate'
          git rev-parse HEAD > /tmp/v060-candidate-sha.txt

      - name: Produce regression and coverage inputs
        run: |
          mkdir -p artifacts
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml

      - name: Run final gates one by one
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from __future__ import annotations
          import subprocess
          from pathlib import Path

          sha = Path('/tmp/v060-candidate-sha.txt').read_text().strip()
          run_id = '${{ github.run_id }}'
          attempt = '${{ github.run_attempt }}'
          commands = [
              "python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json",
              "python scripts/performance_smoke.py --json-out artifacts/performance.json",
              "python scripts/check_quality_baseline.py",
              f"python scripts/record_quality_history.py --source-commit {sha} --workflow-run-id {run_id} --workflow-attempt {attempt} --evidence-date 2026-07-25",
              f"python scripts/build_validation_evidence.py --write --attested --out artifacts/VALIDATION_EVIDENCE.json --source-commit {sha} --publication-parent {sha} --run-id {run_id} --run-attempt {attempt} --evidence-date 2026-07-25",
              f"python scripts/build_publication_attestation.py --commit {sha} --run-id {run_id} --run-attempt {attempt}",
              "python scripts/package_release.py --out dist-a",
              "python scripts/package_release.py --out dist-b",
              "cmp dist-a/TsaoSciResearcher-v0.6.0.zip dist-b/TsaoSciResearcher-v0.6.0.zip",
              "python scripts/validate_release.py",
              "python -m build --sdist --wheel --outdir dist-python",
              "python scripts/validate_distribution.py dist-python",
          ]
          lines = []
          status = 0
          for index, command in enumerate(commands, 1):
              proc = subprocess.run(command, shell=True, text=True, capture_output=True)
              lines.append(f"[{index:02d}] rc={proc.returncode} {command}")
              if proc.stdout:
                  lines.extend(proc.stdout.rstrip().splitlines()[-120:])
              if proc.stderr:
                  lines.extend(proc.stderr.rstrip().splitlines()[-120:])
              if proc.returncode:
                  status = proc.returncode
                  lines.append('FINAL_GATE_DIAGNOSTIC=FAIL')
                  break
          else:
              lines.append('FINAL_GATE_DIAGNOSTIC=PASS')
          Path('/tmp/v060-final-gates.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          raise SystemExit(status)
          PY

      - name: Report exact final-gate result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f /tmp/v060-final-gates.txt ]; then
            BODY="$(tail -n 260 /tmp/v060-final-gates.txt | sed 's/`/\\`/g')"
          else
            BODY='diagnostic did not reach the final-gate command loop'
          fi
          gh issue comment "$ISSUE_NUMBER" --body "\`\`\`text
          ${BODY}
          \`\`\`"
          if grep -q '^FINAL_GATE_DIAGNOSTIC=PASS$' /tmp/v060-final-gates.txt 2>/dev/null; then
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi
