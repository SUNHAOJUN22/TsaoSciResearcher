name: Finalize README visual atlas

on:
  push:
    branches: [main]
    paths:
      - "docs/assets/ai/visual-atlas.zip"
      - "README.md"
      - "README_EN.md"
      - "README.zh-CN.md"

permissions:
  contents: write

concurrency:
  group: finalize-readme-visual-atlas-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout staged main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact validation toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Verify and unpack the staged visual atlas
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import zipfile
          from pathlib import Path, PurePosixPath

          archive_path = Path("docs/assets/ai/visual-atlas.zip")
          expected_sha = "3442234d59c78fd38cefe0413bb36c07d116f1e76643f2a2ad1c4de1d60c8070"
          expected_names = {
              "capability_landscape.svg",
              "computation_handoff_boundary.svg",
              "evidence_claim_graph.svg",
              "multi_agent_orchestration.svg",
              "multiscale_science_pipeline.svg",
              "project_state_machine.svg",
              "reproducibility_quality_gates.svg",
              "research_os_architecture.svg",
          }
          actual_sha = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f"visual archive checksum mismatch: {actual_sha}")

          target = archive_path.parent
          with zipfile.ZipFile(archive_path) as archive:
              names = {info.filename for info in archive.infolist() if not info.is_dir()}
              if names != expected_names:
                  raise SystemExit(f"visual inventory mismatch: {sorted(names)}")
              for name in sorted(names):
                  pure = PurePosixPath(name)
                  if pure.is_absolute() or len(pure.parts) != 1 or pure.suffix != ".svg":
                      raise SystemExit(f"unsafe visual path: {name}")
                  data = archive.read(name)
                  text = data.decode("utf-8")
                  if "<svg" not in text or "<title" not in text or "<desc" not in text:
                      raise SystemExit(f"invalid accessible SVG: {name}")
                  (target / name).write_bytes(data)
          PY
          rm docs/assets/ai/visual-atlas.zip
          git rm .github/workflows/finalize-readme-visuals.yml

      - name: Regenerate deterministic repository evidence
        run: |
          python scripts/sync_version.py --write
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write

      - name: Validate repository documentation and contracts
        run: |
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          mkdocs build --strict

      - name: Full regression coverage and order independence
        run: |
          mkdir -p artifacts
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          TSR_TEST_ORDER_SEED=20260726 python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin

      - name: Static quality security mutation and performance
        run: |
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip_audit --strict
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py

      - name: Deterministic release and distribution gates
        run: |
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          VERSION="$(tr -d '\r\n' < VERSION)"
          cmp "dist-a/TsaoSciResearcher-v${VERSION}.zip" "dist-b/TsaoSciResearcher-v${VERSION}.zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python

      - name: Create verified main candidate
        id: candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: add AI-generated scientific capability visual atlas'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload final validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: readme-visual-atlas-${{ steps.candidate.outputs.sha }}
          path: |
            artifacts
            docs/assets/ai
            docs/VALIDATION_EVIDENCE.json
            docs/engineering-audit-report.pdf
            SHA256SUMS
            dist-a
            dist-python
            site
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified candidate directly to main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${{ steps.candidate.outputs.sha }}"
