name: One-time Scientific Passport finalization

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: tsr-scientific-passport-finalization
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  compatibility:
    if: >-
      github.event.issue.number == 199 &&
      github.event.issue.title == '[TSR] Scientific Passport and integrity-gate finalization' &&
      github.event.comment.user.login == 'SUNHAOJUN22' &&
      github.event.comment.body == 'finalize_token=TSR-20260805-passport-v2'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
      - name: Checkout exact staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install exact dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Apply candidate upgrade
        run: |
          python scripts/apply_scientific_passport_temp.py
          python -m ruff format tsao_researcher/strategy.py tests/test_strategy_passport.py
      - name: Cross-platform scientific contracts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/tsr-pycache
        run: |
          python -m compileall -q scripts tsao_researcher tests
          python -m pytest -q -p hypothesis.extra.pytestplugin tests/test_first_principles_strategy.py tests/test_first_principles_strategy_boundaries.py tests/test_strategy_passport.py tests/test_runtime_v2.py tests/test_scientific_quality.py tests/test_v071_hardening.py
          python scripts/validate_schemas.py
          python -m tsao_researcher strategy "How do trap states control plant product quality?" --observable "product quality" --evidence "independent experiment measurement"

  finalize:
    if: >-
      github.event.issue.number == 199 &&
      github.event.issue.title == '[TSR] Scientific Passport and integrity-gate finalization' &&
      github.event.comment.user.login == 'SUNHAOJUN22' &&
      github.event.comment.body == 'finalize_token=TSR-20260805-passport-v2'
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Apply upgrade and refresh deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_scientific_passport_temp.py
          python -m ruff format tsao_researcher/strategy.py tests/test_strategy_passport.py
          python -m tsao_researcher strategy \
            "How do interfacial trap states control charge transport and breakdown?" \
            --observable "trap energy distribution" \
            --observable "space-charge density" \
            --condition "applied electric field" \
            --evidence "TSDC and PEA experiment measurements" \
            --output examples/first-principles-strategy.json
          rm -f \
            .github/workflows/scientific-passport-finalize-temp.yml \
            scripts/apply_scientific_passport_temp.py
          python scripts/build_readme_facts.py --write
          python scripts/build_validation_evidence.py --write --preflight --evidence-date 2026-08-05
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
      - name: Repository, schema, README, and documentation gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          mkdocs build --strict
      - name: Complete regression, coverage, order, static, security, and performance gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov \
            --ignore=tests/test_import_isolation.py \
            --cov=tsao_researcher --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:artifacts/coverage.json
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          TSR_TEST_ORDER_SEED=20260805 python -m pytest -q \
            -p hypothesis.extra.pytestplugin -p tests.random_order_plugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict \
            -r artifacts/resolved-environment.lock \
            --format cyclonedx-json \
            --output artifacts/resolved-environment-sbom.json
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
      - name: Deterministic package, build, and isolated-install gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python
      - name: Verify exact scope, commit, and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            .coverage .coverage.* .hypothesis .mypy_cache .pytest_cache .ruff_cache \
            artifacts build dist dist-a dist-b dist-python site \
            ./*.egg-info tsao_researcher/*.egg-info
          cat > /tmp/allowed-paths.txt <<'EOF'
          .github/workflows/ci.yml
          .github/workflows/scientific-passport-finalize-temp.yml
          CHANGELOG.md
          README.md
          README_CN.md
          README_EN.md
          README.zh-CN.md
          SHA256SUMS
          docs/README_FACTS.json
          docs/SCIENTIFIC_QUALITY_EXAMPLES.json
          docs/VALIDATION.md
          docs/VALIDATION_EVIDENCE.json
          docs/engineering-audit-report.pdf
          docs/research-quality-dashboard.html
          docs/research-quality-dashboard.svg
          docs/test-dashboard.html
          docs/test-dashboard.svg
          examples/first-principles-strategy.json
          schemas/v2/computation-strategy.schema.json
          scripts/apply_scientific_passport_temp.py
          tests/test_strategy_passport.py
          tsao_researcher/strategy.py
          EOF
          git status --porcelain=v1 | cut -c4- | LC_ALL=C sort > /tmp/actual-paths.txt
          LC_ALL=C sort -o /tmp/allowed-paths.txt /tmp/allowed-paths.txt
          comm -23 /tmp/actual-paths.txt /tmp/allowed-paths.txt > /tmp/unexpected-paths.txt
          test ! -s /tmp/unexpected-paths.txt || { cat /tmp/unexpected-paths.txt; exit 1; }
          test -s /tmp/actual-paths.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- $(cat /tmp/actual-paths.txt)
          git commit -m "feat: add Scientific Passport and integrity gates"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
      - name: Report final commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          final_sha="$(git rev-parse HEAD)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "status=passport-finalized final_commit=${final_sha} workflow_run_id=${GITHUB_RUN_ID} matrix_and_full_gates=PASS"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "status=passport-finalization-failed staged_source=${GITHUB_SHA} workflow_run_id=${GITHUB_RUN_ID}"
