name: Finalize V6 generated artifacts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v6-remediation.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-v6-generated-artifacts
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact triggering main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Make final tree and regenerate deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/six-repository-acceptance.yml")
          text = path.read_text(encoding="utf-8")
          anchor = "  cancel-in-progress: false\n"
          if text.count(anchor) != 1:
              raise SystemExit("unexpected six-repository concurrency contract")
          path.write_text(
              text.replace(anchor, "  cancel-in-progress: true\n", 1),
              encoding="utf-8",
              newline="\n",
          )
          PY
          git rm .github/workflows/finalize-v6-remediation.yml
          python scripts/validate_unicode_integrity.py --write
          python scripts/build_validation_evidence.py --write
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write

      - name: Verify final deterministic fixed point
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/validate_unicode_integrity.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          git diff --check

      - name: Commit final fixed point
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close final generated-artifact fixed point"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch final exact-tree validations
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            remote=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$remote" = "$FINAL_SHA" ]; then
              break
            fi
            sleep 2
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$FINAL_SHA"
          gh workflow run main-attestation.yml --ref main
          gh workflow run ci.yml --ref main
          gh workflow run six-repository-acceptance.yml --ref main
