name: Decision dispatcher status probe
on:
  issue_comment:
    types: [created]
permissions:
  actions: read
  issues: write
jobs:
  status:
    if: github.event.issue.number == 200 && github.event.comment.body == 'dispatcher_status_token=TSR-20260805'
    runs-on: ubuntu-latest
    steps:
      - name: Report dispatcher runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow issue-probe-temp.yml --limit 6 --json databaseId,status,conclusion,headSha,event,createdAt,displayTitle)"
          gh issue comment 200 --repo "$GITHUB_REPOSITORY" --body "status=dispatcher-run-query data=${run_json}"
