name: Decision finalizer dispatcher
on:
  issue_comment:
    types: [created]
permissions:
  actions: write
  contents: write
  issues: write
jobs:
  patch-dispatch:
    if: github.event.issue.number == 200 && github.event.comment.body == 'patch_dispatch_token=TSR-20260805-readiness-v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Make mutable-fact test migrations separately reviewable
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          python - <<'PY'
          from __future__ import annotations

          import ast
          import base64
          import gzip
          import re
          from pathlib import Path

          path = Path("scripts/apply_decision_readiness_temp.py")
          bootstrap = path.read_text(encoding="utf-8")
          match = re.search(r"_PAYLOAD = (.+)\nexec\(", bootstrap)
          if match is None:
              raise SystemExit("compressed payload anchor missing")
          payload = ast.literal_eval(match.group(1))
          source = gzip.decompress(base64.b64decode(payload)).decode("utf-8")
          if "import subprocess\n" not in source:
              source = source.replace("import json\nimport textwrap\n", "import json\nimport subprocess\nimport textwrap\n", 1)
          if "def commit_versioned_test_fixes()" not in source:
              anchor = "\ndef main() -> None:\n"
              function = '''\ndef commit_versioned_test_fixes() -> None:\n    \"\"\"Keep mutable-fact test repairs as a separate, reviewable local commit.\"\"\"\n\n    paths = [\"tests/test_import_isolation.py\", \"tests/test_supply_chain.py\"]\n    changed = subprocess.run(\n        [\"git\", \"diff\", \"--quiet\", \"--\", *paths],\n        cwd=ROOT,\n        check=False,\n    ).returncode\n    if changed == 0:\n        return\n    if changed != 1:\n        raise SystemExit(\"unable to inspect versioned test fixes\")\n    subprocess.run([\"git\", \"config\", \"user.name\", \"github-actions[bot]\"], cwd=ROOT, check=True)\n    subprocess.run(\n        [\n            \"git\",\n            \"config\",\n            \"user.email\",\n            \"41898282+github-actions[bot]@users.noreply.github.com\",\n        ],\n        cwd=ROOT,\n        check=True,\n    )\n    subprocess.run([\"git\", \"add\", \"--\", *paths], cwd=ROOT, check=True)\n    subprocess.run(\n        [\"git\", \"commit\", \"-m\", \"test: derive mutable facts from canonical metadata\"],\n        cwd=ROOT,\n        check=True,\n    )\n\n'''
              if anchor not in source:
                  raise SystemExit("payload main anchor missing")
              source = source.replace(anchor, function + anchor, 1)
          call = "    commit_versioned_test_fixes()\n"
          if call not in source:
              anchor = "    update_versioned_test_contracts()\n    print(\"decision readiness upgrade applied\")\n"
              replacement = "    update_versioned_test_contracts()\n" + call + "    print(\"decision readiness upgrade applied\")\n"
              if anchor not in source:
                  raise SystemExit("payload call anchor missing")
              source = source.replace(anchor, replacement, 1)
          encoded = base64.b64encode(gzip.compress(source.encode("utf-8"), compresslevel=9, mtime=0)).decode()
          rendered = '''#!/usr/bin/env python3\n\"\"\"One-time compressed payload for the decision-readiness upgrade.\"\"\"\nfrom __future__ import annotations\nimport base64\nimport gzip\n\n_PAYLOAD = %r\nexec(compile(gzip.decompress(base64.b64decode(_PAYLOAD)).decode(\"utf-8\"), __file__, \"exec\"))\n''' % encoded
          path.write_text(rendered, encoding="utf-8", newline="\n")
          PY
          python -m py_compile scripts/apply_decision_readiness_temp.py
          test "$(git status --porcelain=v1 | cut -c4-)" = "scripts/apply_decision_readiness_temp.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_decision_readiness_temp.py
          git commit -m "ci: make mutable-fact test migrations reviewable [skip ci]"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$source_head"
          git push origin HEAD:main
      - name: Dispatch finalizer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run decision-readiness-finalize-temp.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh issue comment 200 --repo "$GITHUB_REPOSITORY" --body "status=readiness-v4-dispatched payload_commit=$(git rev-parse HEAD) dispatcher_run_id=${GITHUB_RUN_ID}"
  dispatch:
    if: github.event.issue.number == 200 && github.event.comment.body == 'dispatch_token=TSR-20260805-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch finalizer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run decision-readiness-finalize-temp.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh issue comment 200 --repo "$GITHUB_REPOSITORY" --body "status=readiness-dispatch-requested dispatcher_run_id=${GITHUB_RUN_ID}"
  status:
    if: github.event.issue.number == 200 && github.event.comment.body == 'status_token=TSR-20260805-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Report finalizer status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow decision-readiness-finalize-temp.yml --event workflow_dispatch --limit 1 --json databaseId,status,conclusion,headSha,event,createdAt)"
          gh issue comment 200 --repo "$GITHUB_REPOSITORY" --body "status=readiness-run-query data=${run_json}"
