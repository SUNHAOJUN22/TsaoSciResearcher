name: Decision payload installer and dispatcher
on:
  issue_comment:
    types: [created]
permissions:
  actions: write
  contents: write
  issues: write
jobs:
  install-dispatch:
    if: github.event.issue.number == 200 && github.event.comment.body == 'install_payload_token=TSR-20260805-readiness-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild checksummed payload from repaired issue parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/200/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          from pathlib import Path

          comments = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          prefixes = (
              'PAYLOAD_V4_PART_001:',
              'PAYLOAD_V4_PART_002:',
              'PAYLOAD_V4_FIX_003:',
              'PAYLOAD_V4_FIX_004:',
          )
          expected = (
              '8eb1537762752addbbc9402aecd1b84cc8702856c0ee8be99922ea6a6bd00008',
              '6824654e6895e115d9a61522fac71221bb1e603b7087afbcde8ac07b0948339b',
              'bc69e929e4476f4c65118823eb790261cf291a1f7c81462e12f96c5dae49e5c0',
              '442f14cda4aeb36686e8b5adbfc86e035ae37f326a8e5aeaf74fc73a62de2367',
          )
          chunks: list[str] = []
          for prefix, digest in zip(prefixes, expected, strict=True):
              matches = [item['body'] for item in comments if item.get('body', '').startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f'{prefix} expected exactly once, found {len(matches)}')
              chunk = matches[0][len(prefix):]
              actual = hashlib.sha256(chunk.encode('ascii')).hexdigest()
              print(prefix, len(chunk), actual)
              if actual != digest:
                  raise SystemExit(f'{prefix} checksum mismatch')
              chunks.append(chunk)
          encoded = ''.join(chunks)
          raw = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(raw).hexdigest() != '3e07762f70f6198d6450746ab21aaf0794aae40ea0e7a48bba6bebd807344b65':
              raise SystemExit('combined payload checksum mismatch')
          Path('scripts/apply_decision_readiness_temp.py').write_bytes(raw)
          PY
          python -m py_compile scripts/apply_decision_readiness_temp.py
          test "$(git status --porcelain=v1 | cut -c4-)" = "scripts/apply_decision_readiness_temp.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_decision_readiness_temp.py
          git commit -m "ci: restore checksummed decision-readiness payload [skip ci]"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$source_head"
          git push origin HEAD:main
      - name: Dispatch finalizer from repaired main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run decision-readiness-finalize-temp.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh issue comment 200 --repo "$GITHUB_REPOSITORY" \
            --body "status=checksummed-payload-dispatched payload_commit=$(git rev-parse HEAD) dispatcher_run_id=${GITHUB_RUN_ID}"
  status:
    if: github.event.issue.number == 200 && github.event.comment.body == 'status_token=TSR-20260805-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Report installer and finalizer status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          installer_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow issue-probe-temp.yml --limit 4 --json databaseId,status,conclusion,headSha,event,createdAt,displayTitle)"
          finalizer_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow decision-readiness-finalize-temp.yml --event workflow_dispatch --limit 2 --json databaseId,status,conclusion,headSha,event,createdAt)"
          gh issue comment 200 --repo "$GITHUB_REPOSITORY" --body "status=readiness-run-query installer=${installer_json} finalizer=${finalizer_json}"
