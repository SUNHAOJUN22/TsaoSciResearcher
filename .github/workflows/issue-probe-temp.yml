name: Decision finalizer dispatcher
on:
  issue_comment:
    types: [created]
permissions:
  actions: write
  contents: write
  issues: write
env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
jobs:
  patch-dispatch:
    if: github.event.issue.number == 200 && github.event.comment.body == 'patch_dispatch_token=TSR-20260805-readiness-v5'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install exact dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Patch and validate mutable-fact tests
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          python - <<'PY'
          from pathlib import Path

          import_path = Path("tests/test_import_isolation.py")
          text = import_path.read_text(encoding="utf-8")
          old = '''def test_top_level_package_import_is_dependency_light() -> None:
              code = """
          import builtins
          original = builtins.__import__
          def guarded(name, *args, **kwargs):
              if name.split('.', 1)[0] in {'yaml', 'jsonschema'}:
                  raise AssertionError(f'unexpected eager dependency import: {name}')
              return original(name, *args, **kwargs)
          builtins.__import__ = guarded
          import tsao_researcher
          assert tsao_researcher.__version__ == '0.7.1'
          assert 'route' in dir(tsao_researcher)
          """
              result = run_python(["-c", code])
          '''
          new = '''def test_top_level_package_import_is_dependency_light() -> None:
              expected_version = (ROOT / "VERSION").read_text(encoding="utf-8").strip()
              code = f"""
          import builtins
          original = builtins.__import__
          def guarded(name, *args, **kwargs):
              if name.split('.', 1)[0] in {{'yaml', 'jsonschema'}}:
                  raise AssertionError(f'unexpected eager dependency import: {{name}}')
              return original(name, *args, **kwargs)
          builtins.__import__ = guarded
          import tsao_researcher
          assert tsao_researcher.__version__ == {expected_version!r}
          assert 'route' in dir(tsao_researcher)
          """
              result = run_python(["-c", code])
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'expected_version = (ROOT / "VERSION").read_text' not in text:
              raise SystemExit("import-isolation canonical version anchor missing")
          import_path.write_text(text, encoding="utf-8", newline="\n")

          supply_path = Path("tests/test_supply_chain.py")
          supply = supply_path.read_text(encoding="utf-8")
          old_count = '    assert facts["repository_assets"]["ai_diagrams"] == 25\n'
          new_count = (
              '    diagram_count = facts["repository_assets"]["ai_diagrams"]\n'
              '    assert diagram_count == len(build_readme_facts.VISUAL_ATLAS_ASSETS)\n'
              '    assert diagram_count >= 29\n'
          )
          if old_count in supply:
              supply = supply.replace(old_count, new_count, 1)
          elif 'assert diagram_count == len(build_readme_facts.VISUAL_ATLAS_ASSETS)' not in supply:
              raise SystemExit("visual-atlas dynamic count anchor missing")
          supply_path.write_text(supply, encoding="utf-8", newline="\n")
          PY
          python -m ruff format tests/test_import_isolation.py tests/test_supply_chain.py
          python -m pytest -q -p hypothesis.extra.pytestplugin tests/test_import_isolation.py tests/test_supply_chain.py tests/test_versioning.py
          test "$(git status --porcelain=v1 | cut -c4- | LC_ALL=C sort | tr '\n' ' ')" = "tests/test_import_isolation.py tests/test_supply_chain.py "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_import_isolation.py tests/test_supply_chain.py
          git commit -m "test: derive mutable facts from canonical metadata"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$source_head"
          git push origin HEAD:main
      - name: Dispatch finalizer from repaired main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run decision-readiness-finalize-temp.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh issue comment 200 --repo "$GITHUB_REPOSITORY" --body "status=readiness-v5-dispatched test_fix_commit=$(git rev-parse HEAD) dispatcher_run_id=${GITHUB_RUN_ID}"
  dispatch:
    if: github.event.issue.number == 200 && github.event.comment.body == 'dispatch_token=TSR-20260805-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch finalizer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run decision-readiness-finalize-temp.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh issue comment 200 --repo "$GITHUB_REPOSITORY" --body "status=readiness-dispatch-requested dispatcher_run_id=${GITHUB_RUN_ID}"
  status:
    if: github.event.issue.number == 200 && github.event.comment.body == 'status_token=TSR-20260805-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Report finalizer status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow decision-readiness-finalize-temp.yml --event workflow_dispatch --limit 1 --json databaseId,status,conclusion,headSha,event,createdAt)"
          gh issue comment 200 --repo "$GITHUB_REPOSITORY" --body "status=readiness-run-query data=${run_json}"
