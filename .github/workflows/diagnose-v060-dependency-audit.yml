name: Diagnose v0.6.0 dependency audit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] diagnose v0.6.0 dependency audit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct candidate requirements
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path.cwd().resolve()
          spec = importlib.util.spec_from_file_location('finalize_v060_ci', root / 'scripts/finalize_v060_ci.py')
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load finalizer')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.main()
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Test strict dependency audit modes
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          {
            echo '=== environment skip editable'
            python -m pip_audit --strict --skip-editable --format cyclonedx-json --output artifacts/environment-sbom.json
            echo "environment_rc=$?"
            echo '=== exact lock file'
            python -m pip_audit --strict -r requirements-ci.lock --format cyclonedx-json --output artifacts/lock-sbom.json
            echo "lock_rc=$?"
          } > /tmp/v060-dependency-audit.txt 2>&1
          cat /tmp/v060-dependency-audit.txt

      - name: Report audit result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BODY="$(tail -n 120 /tmp/v060-dependency-audit.txt | sed 's/`/\\`/g')"
          gh issue comment "$ISSUE_NUMBER" --body "\`\`\`text
          ${BODY}
          \`\`\`"
          if grep -q '^environment_rc=0$' /tmp/v060-dependency-audit.txt || grep -q '^lock_rc=0$' /tmp/v060-dependency-audit.txt; then
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi
