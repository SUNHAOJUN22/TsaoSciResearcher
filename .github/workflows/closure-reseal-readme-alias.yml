name: One-shot Researcher README evidence reseal

on:
  push:
    branches:
      - closure/readme-alias-dedup-20260831
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: researcher-readme-evidence-reseal
  cancel-in-progress: false

jobs:
  reseal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: closure/readme-alias-dedup-20260831
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact CI stack
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Apply the governed alias contract and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          python .github/closure/researcher_readme_alias.py
          rm .github/workflows/closure-reseal-readme-alias.yml
          python -m ruff format scripts/build_readme_facts.py tests/test_readme_alias_contract.py
          python -m ruff check --fix scripts/build_readme_facts.py tests/test_readme_alias_contract.py
          python -m ruff format scripts/build_readme_facts.py tests/test_readme_alias_contract.py

      - name: Regenerate deterministic evidence in dependency order
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_runtime_data.py --write
          python scripts/build_readme_facts.py --write
          git add -A
          python scripts/validate_unicode_integrity.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write

      - name: Run complete deterministic qualification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_unicode_integrity.py --check
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/validate_mathematical_contracts.py --check
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/final_acceptance_preflight.py --root . --json
          python -m compileall -q scripts tsao_researcher tests
          python -m pytest -q -p hypothesis.extra.pytestplugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'closure-reseal-readme-alias.yml' -print -quit)"
          test ! -e .github/closure/researcher_readme_alias.py
          git diff --check

      - name: Commit tested evidence without modifying workflow files
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows/closure-reseal-readme-alias.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No evidence changes produced' >&2; exit 1; } || true
          git commit -m 'chore(evidence): reseal README alias qualification artifacts'
          git push origin HEAD:closure/readme-alias-dedup-20260831
