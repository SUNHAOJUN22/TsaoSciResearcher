name: Patch v0.7.1 Ruff gate

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: patch-v071-v6-ruff
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] patch v0.7.1 Ruff gate' &&
      contains(github.event.issue.body, 'status=patch-go')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Apply deterministic Ruff root fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-v071-v6.yml')
          source = path.read_text(encoding='utf-8')
          new_sha = 'b56bf27d9893a44720e5bc4f6b7a2cba13a349c484e451c3317bc46966b014b6'
          verified_sha = '6d7f1ebadac996773217ed2305556658d874afe9c9f26364a42c132a515e5ad9'
          assert source.count(new_sha) == 1
          source = source.replace(new_sha, verified_sha)
          needle = """          apply_archive(
              optimized,
              lambda manifest: manifest['base_overlay_sha256'] == os.environ['BASE_ARCHIVE_SHA']
              or (_ for _ in ()).throw(AssertionError('optimization manifest mismatch')),
          )
"""
          patch = needle + """          fullwidth = \"\\uff21\\uff2c\\uff30\\uff28\\uff21\"
          escaped = r\"\\uff21\\uff2c\\uff30\\uff28\\uff21\"
          for test_name in (
              'tests/test_optimization_boundaries.py',
              'tests/test_performance_contracts.py',
          ):
              test_path = Path(test_name)
              test_source = test_path.read_text(encoding='utf-8')
              assert test_source.count(fullwidth) == 1, test_name
              test_path.write_text(
                  test_source.replace(fullwidth, escaped),
                  encoding='utf-8',
                  newline='\\n',
              )
"""
          assert source.count(needle) == 1
          source = source.replace(needle, patch)
          path.write_text(source, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/patch-v071-v6-ruff.yml
          git config user.name 'SUNHAOJUN22 optimization automation'
          git config user.email 'SUNHAOJUN22@users.noreply.github.com'
          git add .github/workflows/apply-v071-v6.yml .github/workflows/patch-v071-v6-ruff.yml
          git diff --cached --check
          git commit -m 'ci: apply deterministic Ruff root fix to v0.7.1 gate'
          git push origin HEAD:main
          printf 'status=patch-complete\ncommit=%s\n' "$(git rev-parse HEAD)" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
