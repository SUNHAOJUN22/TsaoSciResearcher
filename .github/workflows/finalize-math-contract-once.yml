name: One-time mathematical-contract finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tsao-researcher-math-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/final-acceptance-20260807'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/final-acceptance-20260807
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install exact CI dependencies and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Apply minimal portable Traversable patch and remove transport
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tsao_researcher/mathematical_contracts.py')
          text = path.read_text(encoding='utf-8')
          old = '''    resource = files("tsao_researcher").joinpath(*_SCHEMA_RESOURCE)\n    value = json.loads(resource.read_text(encoding="utf-8", errors="strict"))\n'''
          new = '''    resource = files("tsao_researcher")\n    for part in _SCHEMA_RESOURCE:\n        resource = resource.joinpath(part)\n    value = json.loads(resource.read_text(encoding="utf-8"))\n'''
          if old not in text:
              raise SystemExit('expected packaged-schema loading block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          rm -f .github/workflows/finalize-math-contract-once.yml
          python -m ruff format tsao_researcher/mathematical_contracts.py
      - name: Refresh focused source identity and governed validation evidence
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from datetime import date
          from pathlib import Path

          module = Path('tsao_researcher/mathematical_contracts.py')
          record_path = Path('docs/CURRENT_CHANGE_REGRESSION.json')
          record = json.loads(record_path.read_text(encoding='utf-8'))
          record['evidence_date'] = date.today().isoformat()
          rows = record.get('changed_files')
          if not isinstance(rows, list) or len(rows) != 1:
              raise SystemExit('focused changed_files contract is not the expected singleton')
          rows[0]['path'] = module.as_posix()
          rows[0]['sha256'] = hashlib.sha256(module.read_bytes()).hexdigest()
          record_path.write_text(
              json.dumps(record, ensure_ascii=False, indent=2, sort_keys=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          python scripts/build_validation_evidence.py --write --composite
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
      - name: Qualify complete clean tree
        run: |
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/validate_mathematical_contracts.py --check
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/final_acceptance_preflight.py --root . --json
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy tsao_researcher scripts
          python -m pytest -q
          mkdocs build --strict
      - name: Publish exact clean acceptance tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: restore and qualify complete mathematical contract API'
          git push origin HEAD:agent/final-acceptance-20260807
