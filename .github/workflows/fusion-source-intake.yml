name: Fusion source intake
on:
  push:
    branches: [fusion/astra-pro-1]
    paths: [.github/workflows/fusion-source-intake.yml]
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read immutable source snapshots for the authorized consolidation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fusion-intake"
          cd "$RUNNER_TEMP/fusion-intake"
          python - <<'PY'
          import json, subprocess, pathlib
          pins = {
            'AspenOps-Agent':'e3755c89a1650622d1d8c6a2c008c11d2c8676c9',
            'TsaoSciComputation':'295a89d28fcb6704374d56421ce77bc4a1d7cc45',
            'TsaoDFT_skill':'c407a2f384ef62a4db7dedd07827a9be37712da6',
            'ResinDB-Pro-by-SunHJ':'044a67e3b2de8c351abfad2458d768dc268e5b85',
            'TsaoSciResearcher':'81cae02986cabf7bd742dddfb1aff5ea5db44484',
            'TSAO-PROCESSING-SKILL':'2ae9ce4ff46528def5bd4d187dced642f200da9f',
            'OpenDeepMind_skill':'670222c2c9aae953cbe09f82bea50dce70480309',
          }
          for name, sha in pins.items():
              subprocess.run(['git','clone','--filter=blob:none','--no-checkout',f'https://github.com/SUNHAOJUN22/{name}.git',name],check=True,timeout=180)
              subprocess.run(['git','-C',name,'checkout','--detach',sha],check=True,timeout=180)
              actual=subprocess.check_output(['git','-C',name,'rev-parse','HEAD'],text=True).strip()
              if actual!=sha: raise RuntimeError('source identity mismatch')
          pathlib.Path('source-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          pathlib.Path('INTAKE_SCOPE.txt').write_text('Authorized migration audit copy, not a public release or scientific qualification. Original licenses and CONTROLLED classification remain unchanged. No solver or scientific engine was run.\n')
          PY
          tar --exclude='*/.git' -czf "$RUNNER_TEMP/fusion-intake.tar.gz" .
      - name: Store short-lived audit intake
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fusion-audit-intake-${{ github.run_id }}
          path: ${{ runner.temp }}/fusion-intake.tar.gz
          retention-days: 1
          if-no-files-found: error
