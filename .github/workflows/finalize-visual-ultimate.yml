name: Ultimate README visual atlas finalizer

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ultimate-readme-visual-atlas-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  finalize:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] ultimate README visual atlas finalization'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Build fully validated self-cleaning candidate
        id: candidate
        run: python scripts/finalize_visual_atlas_once.py
      - name: Upload complete validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ultimate-readme-visual-${{ steps.candidate.outputs.sha }}
          path: |
            artifacts
            docs/assets/ai
            docs/VALIDATION_EVIDENCE.json
            docs/SBOM.cdx.json
            docs/QUALITY_BASELINE.json
            docs/QUALITY_HISTORY.json
            docs/engineering-audit-report.pdf
            docs/test-dashboard.html
            docs/test-dashboard.svg
            docs/research-quality-dashboard.html
            docs/research-quality-dashboard.svg
            SHA256SUMS
            dist-a
            dist-python
          if-no-files-found: error
          retention-days: 30
      - name: Publish candidate directly to main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${{ steps.candidate.outputs.sha }}"
      - name: Report outcome
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "ultimate README visual finalization status=${JOB_STATUS}; run=${GITHUB_RUN_ID}; attempt=${GITHUB_RUN_ATTEMPT}; candidate=${CANDIDATE_SHA:-not-created}"
          if [ "$JOB_STATUS" = success ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
