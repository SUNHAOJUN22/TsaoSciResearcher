          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/patch-v071-v2-base-meta.yml
          git -c core.whitespace=-blank-at-eof diff --check
          git config user.name 'SUNHAOJUN22 optimization automation'
