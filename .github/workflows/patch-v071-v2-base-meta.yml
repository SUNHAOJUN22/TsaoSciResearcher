          git push origin HEAD:main
          printf 'status=base-meta-patched\ncommit=%s\nsource-run=30736604826\n' "$(git rev-parse HEAD)" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
