name: Patch v0.7.1 v2 base part metadata

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: patch-v071-v2-base-part-metadata
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] patch v0.7.1 v2 base metadata' &&
      contains(github.event.issue.body, 'status=patch-base-meta')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Patch exact observed base part hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-v071-v2.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '823f0f2ceccf84cf7bf56e03198eb40e812b834aa48225473807ca62507e9a32': '823f5d8aeef013dc201a54d6aca4dff8a275d8b6c837ed4b2ca351bbbbed45de',
