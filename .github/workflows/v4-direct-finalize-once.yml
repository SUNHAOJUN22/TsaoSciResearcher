name: V4 direct Unicode finalizer once

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: v4-direct-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind gates, normalize tracked text, remove migration scaffolding
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ci_path = Path('.github/workflows/ci.yml')
          text = ci_path.read_text(encoding='utf-8')
          lines = text.splitlines()

          def insert_before(command: str, new_command: str) -> None:
              indices = [i for i, line in enumerate(lines) if line.strip() == command]
              if len(indices) != 1:
                  raise SystemExit(f'anchor {command!r} count={len(indices)}')
              i = indices[0]
              if i > 0 and lines[i - 1].strip() == new_command:
                  return
              indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
              lines.insert(i, indent + new_command)

          insert_before(
              'python -m compileall -q scripts tsao_researcher tests',
              'python scripts/validate_unicode_integrity.py --check',
          )
          insert_before(
              'python scripts/sync_version.py --check',
              'python scripts/validate_unicode_integrity.py --check',
          )
          ci_path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY

          rm -f \
            .github/v4-unicode-export-trigger \
            .github/v4-direct-finalize-trigger \
            .github/workflows/v4-unicode-export-once.yml \
            .github/workflows/v4-unicode-hardening-once.yml \
            scripts/apply_v4_unicode_bindings.py \
            scripts/apply_v4_unicode_bindings_v2.py
          git add -u

          python scripts/validate_unicode_integrity.py --normalize --write
          python scripts/validate_unicode_integrity.py --check
          python scripts/build_readme_facts.py --write
          python scripts/generate_checksums.py --write

          git rm .github/workflows/v4-direct-finalize-once.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(unicode): enforce whole-tree integrity on permanent CI'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prove exact parent and package candidate
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          bundle="$RUNNER_TEMP/researcher-v4-direct-candidate"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          : > "$bundle/DELETE_PATHS.txt"
          while IFS=$'\t' read -r status path; do
            case "$status" in
              A|M)
                mkdir -p "$bundle/$(dirname "$path")"
                cp "$path" "$bundle/$path"
                ;;
              D)
                printf '%s\n' "$path" >> "$bundle/DELETE_PATHS.txt"
                ;;
              *) exit 2 ;;
            esac
          done < <(git diff-tree --no-commit-id --name-status -r HEAD)
          git rev-parse HEAD^ > "$bundle/PARENT_SHA.txt"
          git rev-parse HEAD > "$bundle/CANDIDATE_SHA.txt"
          git diff-tree --no-commit-id --name-status -r HEAD > "$bundle/CHANGES.tsv"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: researcher-v4-direct-${{ steps.candidate.outputs.sha }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          gh issue comment 213 --body "V4_RESEARCHER_DIRECT_EXPORT outcome=${OUTCOME} candidate=${CANDIDATE:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} source=${GITHUB_SHA} bundle=uploaded finalizer=self-delete"
