name: V4 nonworkflow normalization publisher once

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: v4-nonworkflow-normalization-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Decide whether this is the one-time publisher trigger
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --format=%s)" = 'ci: run nonworkflow normalizer from git-state gate' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Normalize tracked text and remove non-workflow migration scaffolding
        if: steps.gate.outputs.run == 'true'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/v4-unicode-export-trigger \
            .github/v4-direct-finalize-trigger \
            scripts/apply_v4_unicode_bindings.py \
            scripts/apply_v4_unicode_bindings_v2.py
          git add -u
          python scripts/validate_unicode_integrity.py --normalize --write
          python scripts/validate_unicode_integrity.py --check
          python scripts/build_readme_facts.py --write
          python scripts/generate_checksums.py --write
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(unicode): normalize tracked text and reports'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Exact-parent publish non-workflow changes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git push origin HEAD:main
      - name: Publish machine result
        if: always() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          PUBLISHED: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          gh issue comment 213 --body "V4_RESEARCHER_NONWORKFLOW_PUBLISH outcome=${OUTCOME} published=${PUBLISHED:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} source=${GITHUB_SHA} unicode=whole-tree-strict workflows=unchanged"
