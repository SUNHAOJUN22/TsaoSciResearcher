name: Apply verified v0.7.1 hardening

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-v071-hardening
  cancel-in-progress: false

env:
  BASELINE: d9eca929fc39e329b1d94fdb2a08d2a75b577afa
  OVERLAY_SHA256: e7fb0bdae5b0dee605f9b84ea4361ef15a4b676831434a6e48a5aa3d53f0f036
  OVERLAY_PARTS: "16"
  OPTIMIZATION_SHA256: 00c833041d70bf02daf5d5e98c84e336d7dc133f4b8b5f8074d3ca1b9f4df6e1
  OPTIMIZATION_PARTS: "9"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  apply:
    if: >-
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] apply v0.7.1 hardening' &&
      contains(github.event.issue.body, 'status=ready')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Mark controlled application running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=running\nworkflow-run=%s\nbase=%s\noptimization=%s\n' "$GITHUB_RUN_ID" "$BASELINE" "$OPTIMIZATION_SHA256" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
      - name: Checkout staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Verify staging boundary and reconstruct source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASELINE" HEAD
          python - <<'PY'
          import os
          import subprocess

          allowed = {'.github/workflows/apply-v071.yml'} | {
              f'.github/v071-opt-part-{index:02d}.b64'
              for index in range(int(os.environ['OPTIMIZATION_PARTS']))
          }
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', f"{os.environ['BASELINE']}..HEAD"],
                  text=True,
              ).splitlines()
          )
          assert changed == allowed, f'unexpected staging changes: {sorted(changed)}'
          PY
          gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" > /tmp/comments.json
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          rows = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          parts = {}
          for row in rows:
              match = re.fullmatch(r'PART (\d{2})/(\d{2})\n([A-Za-z0-9+/=]+)', row.get('body', ''))
              if match:
                  index, total, payload = match.groups()
                  assert int(total) == int(os.environ['OVERLAY_PARTS'])
                  assert index not in parts
                  parts[index] = payload
          count = int(os.environ['OVERLAY_PARTS'])
          keys = [f'{index:02d}' for index in range(count)]
          assert sorted(parts) == keys, sorted(parts)
          archive = base64.b64decode(''.join(parts[key] for key in keys), validate=True)
          assert hashlib.sha256(archive).hexdigest() == os.environ['OVERLAY_SHA256']
          Path('/tmp/overlay.tar.gz').write_bytes(archive)
          PY
          python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          target = Path('/tmp/overlay')
          target.mkdir()
          with tarfile.open('/tmp/overlay.tar.gz', 'r:gz') as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              assert 1 < len(members) <= 200
              assert len(names) == len(set(names)) and 'manifest.json' in names
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in member.name
                  assert member.isfile() and not member.issym() and not member.islnk()
              archive.extractall(target, filter='data')
          manifest = json.loads((target / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['base_commit'] == os.environ['BASELINE']
          expected = {f"files/{row['path']}" for row in manifest['files']} | {'manifest.json'}
          assert set(names) == expected
          for row in manifest['files']:
              relative = PurePosixPath(row['path'])
              assert not relative.is_absolute() and '..' not in relative.parts and '\\' not in row['path']
              source = target / 'files' / Path(*relative.parts)
              data = source.read_bytes()
              assert len(data) == row['bytes']
              assert hashlib.sha256(data).hexdigest() == row['sha256']
              mode = int(row['mode'], 8)
              assert mode in {0o644, 0o755}
              destination = Path(row['path'])
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              destination.chmod(mode)
          PY
          rm .github/workflows/apply-v071.yml
          test -f .github/workflows/main-attestation.yml
          test "$(cat VERSION)" = 0.7.1
          python scripts/sync_runtime_data.py --write
          sed -i "s/assert tsao_researcher.__version__ == '0.7.0'/assert tsao_researcher.__version__ == '0.7.1'/" tests/test_import_isolation.py
          grep -Fq "assert tsao_researcher.__version__ == '0.7.1'" tests/test_import_isolation.py
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          expected_parts = {
              '00': (6000, 'da02bf105b2bc1ce3ef172fea4b561df670291df7c272df3c228dcb3bb33a9e9'),
              '01': (6000, '9474d9870b98ed56803e5df4004567c44f1afeefc36b871f741795debf52a599'),
              '02': (6000, '036d59314cf8bf817797cd8d26f7d05adafbd5cd3df309674e0121886c1fbfe0'),
              '03': (6000, '90266188937239c6ad41cf1607a40d9ceeec8a02b48ca6dba0d9a3d2c0922fd2'),
              '04': (6000, '53997bdce7b5fdd8f25889cbeadcafe0e5859e2479b7188c15f60fd056199f05'),
              '05': (6000, '411f7b880703e4599c325de3d46dfeb3bc1da3893de1044bae5ca12ea18e70fe'),
              '06': (6000, 'fcea7b450fd807063464d226ca2b4e5b43cdfd793cb984e088f97285201f65ea'),
              '07': (6000, '316ab7fb84d8113f7e381bb1245c9ac7d8a4be683115c96bdbf52ca4aea4a2e3'),
              '08': (5516, '0b2d6f061c7125f276027d30dbd784d7d235b7ddbb62587f560d1c78209f8a4c'),
          }
          encoded = bytearray()
          for key in sorted(expected_parts):
              path = Path(f'.github/v071-opt-part-{key}.b64')
              data = path.read_bytes()
              expected_length, expected_hash = expected_parts[key]
              assert len(data) == expected_length, (key, len(data), expected_length)
              assert hashlib.sha256(data).hexdigest() == expected_hash, key
              encoded.extend(data)
          archive_bytes = base64.b64decode(bytes(encoded), validate=True)
          assert hashlib.sha256(archive_bytes).hexdigest() == os.environ['OPTIMIZATION_SHA256']
          archive_path = Path('/tmp/v071-optimization-supplement.tar.gz')
          archive_path.write_bytes(archive_bytes)
          target = Path('/tmp/v071-optimization-supplement')
          target.mkdir()
          with tarfile.open(archive_path, 'r:gz') as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              assert 1 < len(members) <= 50
              assert len(names) == len(set(names)) and 'manifest.json' in names
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in member.name
                  assert member.isfile() and not member.issym() and not member.islnk()
              archive.extractall(target, filter='data')
          manifest = json.loads((target / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['base_overlay_sha256'] == os.environ['OVERLAY_SHA256']
          expected_names = {f"files/{row['path']}" for row in manifest['files']} | {'manifest.json'}
          assert set(names) == expected_names
          for row in manifest['files']:
              relative = PurePosixPath(row['path'])
              assert not relative.is_absolute() and '..' not in relative.parts and '\\' not in row['path']
              source = target / 'files' / Path(*relative.parts)
              data = source.read_bytes()
              assert len(data) == row['bytes']
              assert hashlib.sha256(data).hexdigest() == row['sha256']
              mode = int(row['mode'], 8)
              assert mode in {0o644, 0o755}
              destination = Path(row['path'])
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              destination.chmod(mode)
          for key in expected_parts:
              Path(f'.github/v071-opt-part-{key}.b64').unlink()
          PY
          python scripts/sync_runtime_data.py --write
          tar --exclude=.git --exclude=.pytest_cache --exclude='*.pyc' --exclude='__pycache__' -czf /tmp/TsaoSciResearcher-v0.7.1-optimized-candidate.tar.gz .
          sha256sum /tmp/TsaoSciResearcher-v0.7.1-optimized-candidate.tar.gz > /tmp/TsaoSciResearcher-v0.7.1-optimized-candidate.tar.gz.sha256
      - name: Upload verified optimized candidate source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsao-v071-optimized-candidate-${{ github.run_id }}
          path: |
            /tmp/TsaoSciResearcher-v0.7.1-optimized-candidate.tar.gz
            /tmp/TsaoSciResearcher-v0.7.1-optimized-candidate.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Run complete code, static, performance and release gates
        env:
          TSR_TEST_ORDER_SEED: "20260730"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python -m ruff check --fix scripts tsao_researcher tests
          python -m ruff format scripts tsao_researcher tests
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict -r artifacts/resolved-environment.lock --format cyclonedx-json --output artifacts/resolved-environment-sbom.json
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          mkdocs build --strict
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python
      - name: Prepare final workflow blobs and commit non-workflow tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          paths=[
              '.github/workflows/audit.yml',
              '.github/workflows/ci.yml',
              '.github/workflows/main-attestation.yml',
              '.github/workflows/nightly.yml',
              '.github/workflows/release.yml',
          ]
          values={}
          for path in paths:
              payload=json.dumps({'content':base64.b64encode(Path(path).read_bytes()).decode(),'encoding':'base64'}).encode()
              result=subprocess.run(['gh','api','--method','POST',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--input','-'],input=payload,check=True,capture_output=True)
              values[path]=json.loads(result.stdout)['sha']
          Path('/tmp/workflow-blobs.json').write_text(json.dumps(values,sort_keys=True))
          PY
          git checkout "$GITHUB_SHA" -- .github/workflows
          git config user.name 'SUNHAOJUN22 hardening automation'
          git config user.email 'SUNHAOJUN22@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git commit -m 'perf: optimize routing catalogs capsules and validation [skip ci]'
          git push origin HEAD:main
          code_commit="$(git rev-parse HEAD)"
          code_tree="$(git rev-parse HEAD^{tree})"
          export CODE_COMMIT="$code_commit"
          export CODE_TREE="$code_tree"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          blobs=json.loads(Path('/tmp/workflow-blobs.json').read_text())
          tree=[{'path':path,'mode':'100644','type':'blob','sha':sha} for path,sha in sorted(blobs.items())]
          tree.append({'path':'.github/workflows/apply-v071.yml','mode':'100644','type':'blob','sha':None})
          payload=json.dumps({'base_tree':os.environ['CODE_TREE'],'tree':tree}).encode()
          result=subprocess.run(['gh','api','--method','POST',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/trees",'--input','-'],input=payload,check=True,capture_output=True)
          final_tree=json.loads(result.stdout)['sha']
          payload=json.dumps({'message':'perf: complete v0.7.1 optimization and hardening','tree':final_tree,'parents':[os.environ['CODE_COMMIT']]}).encode()
          result=subprocess.run(['gh','api','--method','POST',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/commits",'--input','-'],input=payload,check=True,capture_output=True)
          candidate=json.loads(result.stdout)['sha']
          Path('/tmp/candidate.json').write_text(json.dumps({'code_commit':os.environ['CODE_COMMIT'],'code_tree':os.environ['CODE_TREE'],'final_tree':final_tree,'candidate_commit':candidate},sort_keys=True))
          PY
      - name: Report candidate commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' >/tmp/body.txt
          import json, os
          from pathlib import Path
          value=json.loads(Path('/tmp/candidate.json').read_text())
          quality=json.loads(Path('artifacts/quality-current.json').read_text())
          print('status=candidate-ready')
          print(f"workflow-run={os.environ['GITHUB_RUN_ID']}")
          print(f"optimization-sha256={os.environ['OPTIMIZATION_SHA256']}")
          for key in ('code_commit','code_tree','final_tree','candidate_commit'):
              print(f"{key.replace('_','-')}={value[key]}")
          print(f"tests={quality['tests']['tests']}")
          print(f"line-coverage={quality['coverage']['line_percent']:.3f}")
          print(f"branch-coverage={quality['coverage']['branch_percent']:.3f}")
          print(f"mutation={quality['mutation']['killed']}/{quality['mutation']['total']}")
          print('all-precommit-gates=PASS')
          PY
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
      - name: Report controlled application failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=application-failed\nworkflow-run=%s\nbase=%s\noptimization=%s\n' "$GITHUB_RUN_ID" "$BASELINE" "$OPTIMIZATION_SHA256" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
