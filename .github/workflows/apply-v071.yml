name: Apply verified v0.7.1 hardening

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-v071-hardening
  cancel-in-progress: false

env:
  BASELINE: d9eca929fc39e329b1d94fdb2a08d2a75b577afa
  OVERLAY_SHA256: e7fb0bdae5b0dee605f9b84ea4361ef15a4b676831434a6e48a5aa3d53f0f036
  OVERLAY_PARTS: "16"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  apply:
    if: >-
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] apply v0.7.1 hardening' &&
      contains(github.event.issue.body, 'status=ready')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Mark controlled application running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=running\nworkflow-run=%s\nbase=%s\n' "$GITHUB_RUN_ID" "$BASELINE" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt

      - name: Checkout staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Verify staging boundary and reconstruct overlay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASELINE" HEAD
          python - <<'PY'
          import subprocess
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{__import__('os').environ['BASELINE']}..HEAD"],
                  text=True,
              ).splitlines()
          )
          assert changed == {".github/workflows/apply-v071.yml"}, sorted(changed)
          PY
          gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" > /tmp/comments.json
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          rows = json.loads(Path("/tmp/comments.json").read_text(encoding="utf-8"))
          parts = {}
          for row in rows:
              match = re.fullmatch(r"PART (\d{2})/(\d{2})\n([A-Za-z0-9+/=]+)", row.get("body", ""))
              if match:
                  index, total, payload = match.groups()
                  assert int(total) == int(os.environ["OVERLAY_PARTS"])
                  assert index not in parts
                  parts[index] = payload
          count = int(os.environ["OVERLAY_PARTS"])
          keys = [f"{index:02d}" for index in range(count)]
          assert sorted(parts) == keys, sorted(parts)
          archive = base64.b64decode("".join(parts[key] for key in keys), validate=True)
          assert hashlib.sha256(archive).hexdigest() == os.environ["OVERLAY_SHA256"]
          Path("/tmp/overlay.tar.gz").write_bytes(archive)
          PY
          python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          target = Path("/tmp/overlay")
          target.mkdir()
          with tarfile.open("/tmp/overlay.tar.gz", "r:gz") as archive:
              members = archive.getmembers()
              assert 1 < len(members) <= 200
              names = [member.name for member in members]
              assert len(names) == len(set(names)) and "manifest.json" in names
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and ".." not in path.parts and "\\" not in member.name
                  assert member.isfile() and not member.issym() and not member.islnk()
              archive.extractall(target, filter="data")
          manifest = json.loads((target / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["base_commit"] == os.environ["BASELINE"]
          expected = {f"files/{row['path']}" for row in manifest["files"]} | {"manifest.json"}
          assert set(names) == expected
          for row in manifest["files"]:
              relative = PurePosixPath(row["path"])
              assert not relative.is_absolute() and ".." not in relative.parts and "\\" not in row["path"]
              source = target / "files" / Path(*relative.parts)
              data = source.read_bytes()
              assert len(data) == row["bytes"]
              assert hashlib.sha256(data).hexdigest() == row["sha256"]
              mode = int(row["mode"], 8)
              assert mode in {0o644, 0o755}
              destination = Path(row["path"])
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              destination.chmod(mode)
          PY
          rm .github/workflows/apply-v071.yml
          test "$(cat VERSION)" = 0.7.1
          test -f .github/workflows/main-attestation.yml
          python scripts/sync_runtime_data.py --write
          sed -i "s/assert tsao_researcher.__version__ == '0.7.0'/assert tsao_researcher.__version__ == '0.7.1'/" tests/test_import_isolation.py
          grep -Fq "assert tsao_researcher.__version__ == '0.7.1'" tests/test_import_isolation.py

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Run complete code, static, performance and release gates
        env:
          TSR_TEST_ORDER_SEED: "20260730"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python -m ruff check --fix scripts tsao_researcher tests
          python -m ruff format scripts tsao_researcher tests
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict -r artifacts/resolved-environment.lock --format cyclonedx-json --output artifacts/resolved-environment-sbom.json
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          mkdocs build --strict
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python
          git -c core.whitespace=-blank-at-eof diff --check

      - name: Commit verified v0.7.1 directly to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'SUNHAOJUN22 hardening automation'
          git config user.email 'SUNHAOJUN22@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete v0.7.1 integrity and performance hardening [skip ci]'
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/final-sha

      - name: Report applied commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/body.txt
          import json
          import os
          from pathlib import Path

          quality = json.loads(Path("artifacts/quality-current.json").read_text(encoding="utf-8"))
          print("status=applied")
          print(f"workflow-run={os.environ['GITHUB_RUN_ID']}")
          print(f"final-commit={Path('/tmp/final-sha').read_text().strip()}")
          print(f"tests={quality['tests']['tests']}")
          print(f"line-coverage={quality['coverage']['line_percent']:.3f}")
          print(f"branch-coverage={quality['coverage']['branch_percent']:.3f}")
          print(f"mutation={quality['mutation']['killed']}/{quality['mutation']['total']}")
          print("all-gates=PASS")
          PY
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt

      - name: Report controlled application failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=application-failed\nworkflow-run=%s\nbase=%s\n' "$GITHUB_RUN_ID" "$BASELINE" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
