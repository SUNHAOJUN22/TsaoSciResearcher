name: One-time test dashboard refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-test-dashboard-once.yml

permissions:
  contents: write

concurrency:
  group: one-time-test-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor == 'SUNHAOJUN22'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Verify immutable refresh base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7daebfba7d99eaff2a4d1ef588330bdae8ba9c16"
          test "$GITHUB_REF" = "refs/heads/main"
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install exact validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip check
      - name: Remove one-time workflow and rebuild deterministic dashboard
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-test-dashboard-once.yml
          python scripts/build_test_dashboard.py --write
          python scripts/generate_checksums.py --write
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/generate_checksums.py --check
          python scripts/validate_unicode_integrity.py --check
          python scripts/audit_repository.py
      - name: Publish one atomic generated-artifact commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test-dashboard.html docs/test-dashboard.svg SHA256SUMS
          test "$(git status --short | wc -l)" -eq 4
          git commit -m "docs(validation): refresh test dashboard for lock regression"
          git push origin HEAD:main
