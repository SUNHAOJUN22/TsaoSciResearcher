name: Diagnose code hardening static gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: diagnose-code-hardening-static
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  diagnose:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] apply code hardening v0.6.0' &&
      github.event.comment.body == 'TSR_DIAGNOSE_CODE_HARDENING_STATIC'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Reconstruct checksum-bound candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, re, zipfile
          from pathlib import Path, PurePosixPath

          expected_sha = "74ca1475dee6f6a4b50dfedb555082f071bc48776807e944755837d45c4de25a"
          comments = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          pattern = re.compile(r'TSR_CODE_PAYLOAD (\d+)/10')
          pieces: dict[int, str] = {}
          for comment in comments:
              if comment.get('user', {}).get('login') != 'SUNHAOJUN22':
                  continue
              body = str(comment.get('body', ''))
              if '\n' not in body:
                  continue
              header, data = body.split('\n', 1)
              match = pattern.fullmatch(header.strip())
              if match:
                  index = int(match.group(1))
                  if index in pieces:
                      raise SystemExit(f'duplicate chunk {index}')
                  pieces[index] = ''.join(data.split())
          if sorted(pieces) != list(range(1, 11)):
              raise SystemExit(f'incomplete chunks: {sorted(pieces)}')
          raw = base64.b64decode(''.join(pieces[i] for i in range(1, 11)), validate=True)
          if hashlib.sha256(raw).hexdigest() != expected_sha:
              raise SystemExit('payload checksum mismatch')
          payload = Path('/tmp/code-hardening-payload.zip')
          payload.write_bytes(raw)
          root = Path.cwd().resolve()
          with zipfile.ZipFile(payload) as archive:
              for info in archive.infolist():
                  if info.is_dir():
                      continue
                  pure = PurePosixPath(info.filename)
                  if pure.is_absolute() or any(part in {'', '.', '..'} for part in pure.parts):
                      raise SystemExit(f'unsafe payload path: {info.filename}')
                  target = (root / pure).resolve(strict=False)
                  if not target.is_relative_to(root):
                      raise SystemExit(f'payload escapes repository: {info.filename}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(info.filename))
          PY

      - name: Run each quality gate and report first failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          run_gate() {
            local stage="$1"
            shift
            set +e
            "$@" > /tmp/gate.log 2>&1
            local rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              {
                echo "status=code-hardening-static-failed"
                echo
                echo "stage=${stage}"
                echo "workflow-run=${GITHUB_RUN_ID}"
                echo
                echo '```text'
                tail -n 100 /tmp/gate.log
                echo '```'
              } > /tmp/issue-body.md
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.md
              exit "$rc"
            fi
          }
          run_gate ruff-format python -m ruff format --check scripts tsao_researcher tests
          run_gate ruff-check python -m ruff check scripts tsao_researcher tests
          run_gate mypy python -m mypy scripts tsao_researcher
          run_gate bandit python -m bandit -q -lll -r scripts tsao_researcher
          run_gate dependency-audit python -m pip_audit --strict -r requirements-ci.lock
          run_gate mutation python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          run_gate performance python scripts/performance_smoke.py --json-out artifacts/performance.json
          run_gate coverage python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=json:artifacts/coverage.json
          run_gate quality-baseline python scripts/check_quality_baseline.py
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=code-hardening-static-pass; workflow-run=${GITHUB_RUN_ID}; ruff=PASS; mypy=PASS; bandit=PASS; dependency-audit=PASS; mutation=21/21; performance=PASS; coverage=PASS; quality-baseline=PASS"
