name: Patch v3 Ruff policy simple

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] patch v3 Ruff policy simple'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Inject persistent per-file policy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/finalize-first-principles-070-v3.yml')
          text = path.read_text(encoding='utf-8')
          anchor = '          router_path = Path("tests/test_router.py")\n'
          block = (
              '          pyproject_path = Path("pyproject.toml")\n'
              '          pyproject_text = pyproject_path.read_text(encoding="utf-8")\n'
              '          per_file = \'[tool.ruff.lint.per-file-ignores]\\\\n"tests/test_import_isolation.py" = ["B018"]\\\\n\\\\n\'\n'
              '          if "[tool.ruff.lint.per-file-ignores]" not in pyproject_text:\n'
              '              pyproject_text = pyproject_text.replace(\n'
              '                  "[tool.ruff.format]", per_file + "[tool.ruff.format]", 1\n'
              '              )\n'
              '          pyproject_path.write_text(pyproject_text, encoding="utf-8")\n\n'
          )
          if block not in text:
              if anchor not in text:
                  raise SystemExit('v3 anchor missing')
              text = text.replace(anchor, block + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit and push patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/finalize-first-principles-070-v3.yml
          git commit -m "ci: persist narrow Ruff policy in v3"
          git push origin HEAD:main

      - name: Report success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=patch-applied
          commit=$(git rev-parse HEAD)"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=patch-failed
          workflow-run=${GITHUB_RUN_ID}"
