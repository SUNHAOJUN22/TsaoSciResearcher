name: Apply verified v0.7.1 optimization v6

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

env:
  BASELINE: d9eca929fc39e329b1d94fdb2a08d2a75b577afa
  BASE_ARCHIVE_SHA: e7fb0bdae5b0dee605f9b84ea4361ef15a4b676831434a6e48a5aa3d53f0f036
  OPT_ARCHIVE_SHA: b56bf27d9893a44720e5bc4f6b7a2cba13a349c484e451c3317bc46966b014b6
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

concurrency:
  group: apply-v071-optimization-v6
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] apply v0.7.1 hardening' &&
      contains(github.event.issue.body, 'status=optimized-v6-go')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Mark v6 running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=optimized-v6-running\nworkflow-run=%s\nstaging=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt

      - name: Checkout exact staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Verify archives and apply manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASELINE" HEAD
          python - <<'PY'
          import os
          import subprocess

          allowed_workflows = {
              '.github/workflows/apply-v071.yml',
              '.github/workflows/apply-v071-v2.yml',
              '.github/workflows/apply-v071-v3.yml',
              '.github/workflows/apply-v071-v5.yml',
              '.github/workflows/apply-v071-v6.yml',
              '.github/workflows/diagnose-v071-v4.yml',
          }
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', f"{os.environ['BASELINE']}..HEAD"],
                  text=True,
              ).splitlines()
          )
          assert changed, 'staging diff is empty'
          assert len(changed) <= 30, sorted(changed)
          unexpected = {
              path
              for path in changed
              if path not in allowed_workflows and not path.startswith('.github/v071-opt-')
          }
          assert not unexpected, sorted(unexpected)
          PY
          gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" > /tmp/comments.json
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import tarfile
          from pathlib import Path, PurePosixPath

          def checked_archive(encoded: str, expected_sha: str, label: str) -> bytes:
              data = base64.b64decode(encoded, validate=True)
              actual = hashlib.sha256(data).hexdigest()
              assert actual == expected_sha, (label, actual, expected_sha)
              return data

          def comment_archive(prefix: str, total: int, expected_sha: str) -> bytes:
              rows = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
              pattern = re.compile(rf'{prefix} (\d{{2}})/(\d{{2}})\n([A-Za-z0-9+/=]+)')
              parts = {}
              for row in rows:
                  match = pattern.fullmatch(row.get('body', ''))
                  if not match:
                      continue
                  index, declared, payload = match.groups()
                  assert int(declared) == total and index not in parts
                  parts[index] = payload
              keys = [f'{index:02d}' for index in range(total)]
              assert sorted(parts) == keys, (prefix, sorted(parts))
              return checked_archive(''.join(parts[key] for key in keys), expected_sha, prefix)

          def apply_archive(data: bytes, guard) -> None:
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
                  members = archive.getmembers()
                  names = [member.name for member in members]
                  assert 1 < len(members) <= 250
                  assert len(names) == len(set(names))
                  assert 'manifest.json' in names
                  for member in members:
                      path = PurePosixPath(member.name)
                      assert not path.is_absolute() and '..' not in path.parts
                      assert '\\' not in member.name
                      assert member.isfile() and not member.issym() and not member.islnk()
                  manifest_member = archive.getmember('manifest.json')
                  manifest_stream = archive.extractfile(manifest_member)
                  assert manifest_stream is not None
                  manifest = json.loads(manifest_stream.read().decode('utf-8', errors='strict'))
                  guard(manifest)
                  rows = manifest['files']
                  assert isinstance(rows, list) and rows
                  expected = {f"files/{row['path']}" for row in rows} | {'manifest.json'}
                  assert set(names) == expected
                  for row in rows:
                      rel = PurePosixPath(row['path'])
                      assert not rel.is_absolute() and '..' not in rel.parts
                      assert '\\' not in row['path']
                      mode = int(row['mode'], 8)
                      assert mode in {0o644, 0o755}
                      member = archive.getmember(f"files/{row['path']}")
                      stream = archive.extractfile(member)
                      assert stream is not None
                      payload = stream.read()
                      assert len(payload) == row['bytes']
                      assert hashlib.sha256(payload).hexdigest() == row['sha256']
                      destination = Path(row['path'])
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(payload)
                      destination.chmod(mode)

          base = comment_archive('PART', 16, os.environ['BASE_ARCHIVE_SHA'])
          apply_archive(
              base,
              lambda manifest: manifest['base_commit'] == os.environ['BASELINE']
              or (_ for _ in ()).throw(AssertionError('base manifest mismatch')),
          )
          assert Path('VERSION').read_text(encoding='utf-8').strip() == '0.7.1'
          path = Path('tests/test_import_isolation.py')
          source = path.read_text(encoding='utf-8')
          old = "assert tsao_researcher.__version__ == '0.7.0'"
          new = "assert tsao_researcher.__version__ == '0.7.1'"
          assert source.count(old) == 1
          path.write_text(source.replace(old, new), encoding='utf-8', newline='\n')

          encoded = ''.join(
              Path(f'.github/v071-opt-part-{index:02d}.b64')
              .read_text(encoding='ascii')
              .strip()
              for index in range(8)
          )
          encoded += Path('.github/v071-opt-part-08a.b64').read_text(encoding='ascii').strip()
          encoded += Path('.github/v071-opt-part-08b.b64').read_text(encoding='ascii').strip()
          optimized = checked_archive(encoded, os.environ['OPT_ARCHIVE_SHA'], 'OPT-V6')
          apply_archive(
              optimized,
              lambda manifest: manifest['base_overlay_sha256'] == os.environ['BASE_ARCHIVE_SHA']
              or (_ for _ in ()).throw(AssertionError('optimization manifest mismatch')),
          )
          PY
          rm -f .github/v071-opt-part-*.b64 .github/v071-opt-v6.b64
          rm -f \
            .github/workflows/apply-v071.yml \
            .github/workflows/apply-v071-v2.yml \
            .github/workflows/apply-v071-v3.yml \
            .github/workflows/apply-v071-v5.yml \
            .github/workflows/apply-v071-v6.yml \
            .github/workflows/diagnose-v071-v4.yml
          python scripts/sync_runtime_data.py --write

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Run complete quality and release gates
        env:
          TSR_TEST_ORDER_SEED: "20260730"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python -m ruff check --fix scripts tsao_researcher tests
          python -m ruff format scripts tsao_researcher tests
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov \
            --ignore=tests/test_import_isolation.py \
            --cov=tsao_researcher --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:artifacts/coverage.json \
            --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict -r artifacts/resolved-environment.lock \
            --format cyclonedx-json --output artifacts/resolved-environment-sbom.json
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          mkdocs build --strict
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" \
              "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python
          git -c core.whitespace=-blank-at-eof diff --check

      - name: Commit verified production source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          cp artifacts/quality-current.json /tmp/quality.json
          cp artifacts/performance.json /tmp/performance.json
          rm -rf artifacts dist-a dist-b dist-python site .coverage
          test ! -e .github/v071-opt-v6.b64
          test -z "$(find .github -maxdepth 1 -name 'v071-opt-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 \
            \( -name 'apply-v071*.yml' -o -name 'diagnose-v071*.yml' \) -print -quit)"
          git config user.name 'SUNHAOJUN22 optimization automation'
          git config user.email 'SUNHAOJUN22@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git -c core.whitespace=-blank-at-eof diff --cached --check
          git commit -m 'perf: optimize routing catalogs capsules and scientific strategy'
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/final-sha.txt

      - name: Report verified commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/body.txt
          import json
          import os
          from pathlib import Path

          quality = json.loads(Path('/tmp/quality.json').read_text())
          performance = json.loads(Path('/tmp/performance.json').read_text())
          print('status=optimized-v6-committed')
          print(f"workflow-run={os.environ['GITHUB_RUN_ID']}")
          print(f"commit={Path('/tmp/final-sha.txt').read_text().strip()}")
          print(f"tests={quality['tests']['tests']}")
          print(f"line-coverage={quality['coverage']['line_percent']:.3f}")
          print(f"branch-coverage={quality['coverage']['branch_percent']:.3f}")
          print(f"mutation={quality['mutation']['killed']}/{quality['mutation']['total']}")
          print(f"performance={performance['status']}")
          print('all-prepublication-gates=PASS')
          PY
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=optimized-v6-failed\nworkflow-run=%s\nstaging=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
