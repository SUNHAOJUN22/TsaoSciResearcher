name: Inspect integration-only overlay
on:
  push:
    branches: [fusion/astra-pro-2]
    paths: [.github/workflows/fusion-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: 22a6e0bcc901bca3561366f7717004df4978075e
      - name: Collect only integration code and previously declared code patches
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path.cwd()
          source=json.loads((root/'migration/source-map.json').read_text())
          inherited={f['target_path'] for s in source['sources'] for f in s['files']}
          patches=json.loads((root/'migration/patches.json').read_text())['changes']
          modified={f['target_path'] for f in patches}
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          selected=[p for p in paths if p and (p not in inherited or p in modified)]
          allowed={'.py','.toml','.yaml','.yml','.json','.md','.ts','.tsx','.cjs','.mjs','.txt','.ps1','.sh'}
          manifest={}
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'integration-overlay.zip'
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as out:
              for p in selected:
                  f=root/p
                  if f.is_symlink() or not f.is_file(): raise RuntimeError('unsupported file')
                  if f.suffix not in allowed and f.name not in {'.gitattributes','.gitignore','LICENSE','VERSION','CODEOWNERS'}: raise RuntimeError('unexpected integration artifact: '+p)
                  data=f.read_bytes()
                  if len(data)>4000000: raise RuntimeError('oversize integration artifact')
                  manifest[p]=hashlib.sha256(data).hexdigest()
                  out.writestr(p,data)
              out.writestr('OVERLAY-ID.json',json.dumps({'source_sha':'22a6e0bcc901bca3561366f7717004df4978075e','files':manifest},sort_keys=True))
          print('Integration-only files:',len(manifest))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-overlay-${{ github.run_id }}
          path: ${{ runner.temp }}/integration-overlay.zip
          if-no-files-found: error
          retention-days: 1
