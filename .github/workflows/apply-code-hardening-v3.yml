name: Verify code hardening candidate v3

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-code-hardening-main-v3
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  verify-and-export:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] apply code hardening v0.6.0' &&
      github.event.comment.body == 'TSR_APPLY_CODE_HARDENING_V3'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install exact validation toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Reconstruct candidate and apply locked formatting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, re, zipfile
          from pathlib import Path, PurePosixPath
          expected_sha = "74ca1475dee6f6a4b50dfedb555082f071bc48776807e944755837d45c4de25a"
          expected_names = {
              "CHANGELOG.md", "README.md", "README.zh-CN.md", "README_EN.md",
              "docs/QUALITY_BASELINE.json", "docs/README_AUDIT_REPORT.md",
              "scripts/build_validation_evidence.py", "scripts/run_mutation_smoke.py",
              "tests/test_defensive_boundaries.py", "tsao_researcher/capsule.py",
              "tsao_researcher/handoff.py", "tsao_researcher/io.py",
              "tsao_researcher/receipts.py", "tsao_researcher/state.py",
          }
          comments = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          pieces: dict[int, str] = {}
          pattern = re.compile(r'TSR_CODE_PAYLOAD (\d+)/10')
          for row in comments:
              if row.get('user', {}).get('login') != 'SUNHAOJUN22':
                  continue
              body = str(row.get('body', ''))
              if '\n' not in body:
                  continue
              header, data = body.split('\n', 1)
              match = pattern.fullmatch(header.strip())
              if match:
                  index = int(match.group(1))
                  if index in pieces:
                      raise SystemExit(f'duplicate payload chunk: {index}')
                  pieces[index] = ''.join(data.split())
          if sorted(pieces) != list(range(1, 11)):
              raise SystemExit(f'payload chunks incomplete: {sorted(pieces)}')
          raw = base64.b64decode(''.join(pieces[i] for i in range(1, 11)), validate=True)
          actual_sha = hashlib.sha256(raw).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'payload checksum mismatch: {actual_sha}')
          payload = Path('/tmp/code-hardening-v3.zip')
          payload.write_bytes(raw)
          root = Path.cwd().resolve()
          with zipfile.ZipFile(payload) as archive:
              infos = [item for item in archive.infolist() if not item.is_dir()]
              names = {item.filename for item in infos}
              if names != expected_names:
                  raise SystemExit(f'payload inventory mismatch: {sorted(names)}')
              for info in infos:
                  pure = PurePosixPath(info.filename)
                  if pure.is_absolute() or any(part in {'', '.', '..'} for part in pure.parts):
                      raise SystemExit(f'unsafe payload path: {info.filename}')
                  target = (root / pure).resolve(strict=False)
                  if not target.is_relative_to(root):
                      raise SystemExit(f'payload escapes repository: {info.filename}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(info.filename))
          PY
          python -m ruff format tests/test_defensive_boundaries.py
          rm -f .github/workflows/apply-code-hardening.yml
          rm -f .github/workflows/apply-code-hardening-v2.yml
          rm -f .github/workflows/apply-code-hardening-v3.yml
          rm -f .github/workflows/diagnose-code-hardening-static.yml
          rm -f .github/workflows/format-code-hardening-test.yml
      - name: Regenerate deterministic repository evidence
        run: |
          python scripts/sync_version.py --write
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
      - name: Validate repository documentation and contracts
        run: |
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          mkdocs build --strict
      - name: Full regression coverage and order independence
        run: |
          mkdir -p artifacts
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          TSR_TEST_ORDER_SEED=20260728 python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin
      - name: Ruff formatting and lint
        run: |
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
      - name: Strict typing and source security
        run: |
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
      - name: Dependency audit
        run: python -m pip_audit --strict -r requirements-ci.lock
      - name: Mutation performance and quality baseline
        run: |
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
      - name: Deterministic release and distribution gates
        run: |
          python scripts/package_release.py --out artifacts/dist-a
          python scripts/package_release.py --out artifacts/dist-b
          VERSION="$(tr -d '\r\n' < VERSION)"
          cmp "artifacts/dist-a/TsaoSciResearcher-v${VERSION}.zip" "artifacts/dist-b/TsaoSciResearcher-v${VERSION}.zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir artifacts/dist-python
          python scripts/validate_distribution.py artifacts/dist-python
      - name: Build checksum-bound verified patch
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          root = Path.cwd().resolve()
          base_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          changed = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMRTUXB', 'HEAD'], text=True
          ).splitlines()))
          deleted = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=D', 'HEAD'], text=True
          ).splitlines()))
          required_deleted = {
              '.github/workflows/apply-code-hardening.yml',
              '.github/workflows/apply-code-hardening-v2.yml',
              '.github/workflows/apply-code-hardening-v3.yml',
              '.github/workflows/diagnose-code-hardening-static.yml',
              '.github/workflows/format-code-hardening-test.yml',
          }
          if not required_deleted.issubset(deleted):
              raise SystemExit(f'temporary workflow deletions missing: {sorted(required_deleted - set(deleted))}')
          records = []
          output = root / 'artifacts/code-hardening-final-patch.zip'
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for relative in changed:
                  pure = PurePosixPath(relative)
                  if pure.is_absolute() or any(part in {'', '.', '..'} for part in pure.parts):
                      raise SystemExit(f'unsafe changed path: {relative}')
                  path = root / relative
                  data = path.read_bytes()
                  mode_row = subprocess.run(
                      ['git', 'ls-files', '-s', '--', relative], text=True, capture_output=True, check=True
                  ).stdout.strip()
                  mode = mode_row.split()[0] if mode_row else '100644'
                  records.append({'path': relative, 'mode': mode, 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
                  archive.writestr(f'files/{relative}', data)
              manifest = {'schema_version': '1.0', 'base_commit': base_commit, 'changed': records, 'deleted': deleted}
              archive.writestr('manifest.json', json.dumps(manifest, ensure_ascii=False, sort_keys=True, indent=2).encode() + b'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-hardening-final-v3-${{ github.run_id }}
          path: |
            artifacts/code-hardening-final-patch.zip
            artifacts/junit.xml
            artifacts/coverage.json
            artifacts/mutation-results.json
            artifacts/performance.json
            artifacts/dist-a
            artifacts/dist-python
          if-no-files-found: error
          retention-days: 30
      - name: Report verified candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=code-hardening-v3-ready; workflow-run=${GITHUB_RUN_ID}; artifact=code-hardening-final-v3-${GITHUB_RUN_ID}; tests=PASS; line-coverage>=95; branch-coverage>=90; ruff=PASS; mypy=PASS; bandit=PASS; dependency-audit=PASS; mutation=21/21; performance=PASS; deterministic-release=PASS; distributions=PASS; temporary-workflows=REMOVED-IN-PATCH"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=code-hardening-v3-failed; workflow-run=${GITHUB_RUN_ID}; inspect failed step logs"
