name: One-shot Researcher clean-tree reseal v2

on:
  push:
    branches:
      - remediation/clause-scope-contracts-ci-v2

permissions:
  contents: write

concurrency:
  group: researcher-clean-tree-reseal
  cancel-in-progress: true

jobs:
  reseal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: remediation/clause-scope-contracts-ci-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact CI dependencies and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Replace fixed-point regressions and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/remediation-reseal-researcher.yml
          rm .github/workflows/remediation-reseal-researcher-v2.yml
          cat > tests/test_semantic_fixed_point_v20.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from dataclasses import replace
          from pathlib import Path

          import pytest

          from tsao_researcher.contracts_v17 import (
              EvidenceAssessment,
              canonical_event_hash,
              make_event,
              replay_state,
          )
          from tsao_researcher.errors import ValidationError
          from tsao_researcher.router import Trigger, load_rules, normalize
          from tsao_researcher.scientific_contracts_v16 import (
              ContractError,
              causal_clauses,
              claim_readiness,
              compare_quantities,
              verify_event_chain,
          )
          from tsao_researcher.semantic_scope import (
              normalize_semantic_text,
              split_clauses,
              trigger_is_negated,
          )


          def _record(
              sequence: int,
              previous_hash: str,
              event_type: str,
              **fields: object,
          ) -> dict[str, object]:
              record: dict[str, object] = {
                  "sequence": sequence,
                  "prev_hash": previous_hash,
                  "type": event_type,
                  **fields,
              }
              body = json.dumps(
                  record,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")
              record["record_hash"] = hashlib.sha256(body).hexdigest()
              return record


          def _write_rules(tmp_path: Path, name: str, payload: object) -> Path:
              path = tmp_path / f"{name}.json"
              path.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
              return path


          def test_evidence_contract_rejects_invalid_enums_and_sequence() -> None:
              with pytest.raises(ValueError):
                  EvidenceAssessment("INVALID", "SUPPORTS")
              with pytest.raises(ValueError):
                  EvidenceAssessment("QUALIFIED", "INVALID")
              with pytest.raises(ValueError):
                  canonical_event_hash(-1, "GENESIS", "EVIDENCE_ADDED", {})


          def test_replay_contract_covers_states_and_integrity_failures() -> None:
              reviewed = make_event(
                  0,
                  "GENESIS",
                  "EVIDENCE_REVIEWED",
                  {"independent": True},
              )
              with pytest.raises(ValueError):
                  replay_state([replace(reviewed, sequence=1)])
              with pytest.raises(ValueError):
                  replay_state([replace(reviewed, previous_hash="WRONG")])
              with pytest.raises(ValueError):
                  replay_state([replace(reviewed, event_hash="0" * 64)])

              executed = make_event(
                  0,
                  "GENESIS",
                  "EXTERNAL_EXECUTED",
                  {"signed_receipt": True},
              )
              assert replay_state([executed]) == "EXTERNAL_EXECUTION_VERIFIED"

              added = make_event(
                  0,
                  "GENESIS",
                  "EVIDENCE_ADDED",
                  {"artifact": "sha256:abc"},
              )
              assert replay_state([added]) == "EVIDENCE_AVAILABLE"

              unknown = make_event(0, "GENESIS", "UNKNOWN_EVENT", {})
              with pytest.raises(ValueError):
                  replay_state([unknown])


          def test_semantic_scope_type_boundary_and_local_negation() -> None:
              with pytest.raises(TypeError):
                  normalize_semantic_text(None)  # type: ignore[arg-type]
              with pytest.raises(TypeError):
                  split_clauses(None)  # type: ignore[arg-type]

              assert split_clauses(" ; ， 但 \n ") == ()
              with pytest.raises(ValueError):
                  trigger_is_negated("dft", -1)
              with pytest.raises(ValueError):
                  trigger_is_negated("dft", 4)

              assert trigger_is_negated("dft", 0) is False
              double = "not only dft"
              assert trigger_is_negated(double, double.index("dft")) is False
              english = "do not use dft"
              assert trigger_is_negated(english, english.index("dft")) is True
              chinese = "不要使用 dft"
              assert trigger_is_negated(chinese, chinese.index("dft")) is True


          def test_causal_quantity_and_event_error_branches() -> None:
              with pytest.raises(TypeError):
                  causal_clauses(None)  # type: ignore[arg-type]

              assert causal_clauses("The sample changed after heating.") == []
              affirmed = causal_clauses("C causes D.")
              assert affirmed and affirmed[0]["polarity"] == "AFFIRMED"
              negated = causal_clauses("This cannot establish causality.")
              assert negated and negated[0]["polarity"] == "NEGATED"

              assert claim_readiness([]) == "HOLD_NO_SUPPORTING_EVIDENCE"
              assert (
                  claim_readiness(
                      [
                          {
                              "verification_status": "VERIFIED",
                              "relation_to_claim": "SUPPORTS",
                          }
                      ]
                  )
                  == "READY_FOR_REVIEW"
              )

              with pytest.raises(ContractError):
                  compare_quantities(True, "MPa", ">", 1.0, "MPa")
              with pytest.raises(ContractError):
                  compare_quantities(float("nan"), "MPa", ">", 1.0, "MPa")
              with pytest.raises(ContractError):
                  compare_quantities(1.0, "MPa", ">", 300.0, "K")
              with pytest.raises(ContractError):
                  compare_quantities(1.0, "MPa", "!=", 1.0, "MPa")

              valid = _record(0, "0" * 64, "transition", to="checked")
              bad_sequence = dict(valid)
              bad_sequence["sequence"] = 1
              with pytest.raises(ContractError):
                  verify_event_chain([bad_sequence])

              bad_hash = dict(valid)
              bad_hash["record_hash"] = "0" * 64
              with pytest.raises(ContractError):
                  verify_event_chain([bad_hash])


          def test_router_trigger_and_rule_validation_branches(tmp_path: Path) -> None:
              with pytest.raises(TypeError):
                  normalize(None)  # type: ignore[arg-type]

              trigger = Trigger("实验", None)
              assert trigger.spans("实验实验") == ((0, 2), (2, 4))
              assert trigger.spans("无匹配") == ()

              invalid_cases = {
                  "non_object": [],
                  "invalid_entry": {"broken": []},
                  "zero_weight": {
                      "broken": {"weight": 0, "positive": ["alpha"]}
                  },
                  "no_positive": {"broken": {"weight": 1, "positive": []}},
                  "overlap": {
                      "broken": {
                          "weight": 1,
                          "positive": ["alpha"],
                          "negative": ["alpha"],
                      }
                  },
              }
              for name, payload in invalid_cases.items():
                  with pytest.raises(ValidationError):
                      load_rules(_write_rules(tmp_path, name, payload))
          PY
          python -m ruff format scripts tsao_researcher tests
          python -m ruff check --fix scripts tsao_researcher tests
          python -m ruff format scripts tsao_researcher tests
          git add -A

      - name: Regenerate deterministic repository evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_runtime_data.py --write
          python scripts/build_readme_facts.py --write
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          git add -A
          python scripts/validate_unicode_integrity.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write
          python scripts/generate_checksums.py --write

      - name: Run full deterministic qualification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_unicode_integrity.py --check
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/validate_mathematical_contracts.py --check
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/final_acceptance_preflight.py --root . --json
          python -m compileall -q scripts tsao_researcher tests
          python -m unittest tests.test_contracts_v17 -v
          python -m pytest -q -p hypothesis.extra.pytestplugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher

      - name: Enforce semantic coverage fixed point
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage erase
          python -m coverage run --branch -m pytest -q -p hypothesis.extra.pytestplugin \
            tests/test_contracts_v17.py \
            tests/test_runtime_v2.py \
            tests/test_scientific_contracts_v16.py \
            tests/test_scientific_quality.py \
            tests/test_semantic_fixed_point_v20.py
          python -m coverage report \
            --include='tsao_researcher/router.py,tsao_researcher/scientific_contracts_v16.py,tsao_researcher/semantic_scope.py,tsao_researcher/contracts_v17.py' \
            --fail-under=90
          rm -f .coverage
          test ! -e .coverage
          git diff --check

      - name: Verify bounded final diff and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          required = {
              '.github/workflows/remediation-reseal-researcher-v2.yml',
              '.github/workflows/remediation-reseal-researcher.yml',
              'SHA256SUMS',
              'docs/VALIDATION_EVIDENCE.json',
              'reports/UNICODE_INTEGRITY_REPORT.json',
              'tests/test_semantic_fixed_point_v20.py',
          }
          allowed = required | {
              'docs/README_FACTS.json',
              'docs/SBOM.cdx.json',
              'docs/SCIENTIFIC_QUALITY_EXAMPLES.json',
              'docs/engineering-audit-report.pdf',
              'docs/research-quality-dashboard.html',
              'docs/research-quality-dashboard.svg',
              'docs/test-dashboard.html',
              'docs/test-dashboard.svg',
              'routing/router-rules-v2.json',
              'scripts/build_research_quality_dashboard.py',
              'scripts/build_test_dashboard.py',
              'tests/test_contracts_v17.py',
              'tests/test_runtime_v2.py',
              'tests/test_scientific_contracts_v16.py',
              'tests/test_scientific_quality.py',
              'tsao_researcher/contracts_v17.py',
              'tsao_researcher/data/routing/router-rules-v2.json',
              'tsao_researcher/router.py',
              'tsao_researcher/scientific_contracts_v16.py',
              'tsao_researcher/scientific_quality.py',
              'tsao_researcher/semantic_scope.py',
          }
          actual = set(
              subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines()
          )
          missing = required - actual
          unexpected = actual - allowed
          if missing or unexpected:
              raise SystemExit(
                  f'unexpected final diff: missing={sorted(missing)!r} '
                  f'unexpected={sorted(unexpected)!r} actual={sorted(actual)!r}'
              )
          if '.coverage' in actual:
              raise SystemExit('runtime .coverage file must not be committed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(evidence): reseal clean Researcher qualification tree"
          git push origin HEAD:remediation/clause-scope-contracts-ci-v2
