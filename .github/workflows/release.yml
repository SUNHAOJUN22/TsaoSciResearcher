name: Immutable v0.7.0 release controller

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  BASELINE: 716b0bc30d7ce34b478173b77c56e548a631aee7
  TAG_NAME: v0.7.0
  ATTESTATION_RUN: "30598726544"
  ATTESTATION_ARTIFACT_ID: "8781135259"
  ATTESTATION_ARTIFACT_SHA256: a8790b1df8b990dce94ab9590a0070899814bf3fcc59334ab5ccb83403b0a1be
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"

concurrency:
  group: immutable-release-v0.7.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] publish immutable v0.7.0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Mark running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=running\nsource-commit=%s\nworkflow-run=%s\n' "$BASELINE" "$GITHUB_RUN_ID" > /tmp/body.txt
          python - <<'PY' > /tmp/payload.json
          import json
          from pathlib import Path
          print(json.dumps({'body': Path('/tmp/body.txt').read_text()}))
          PY
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" --input /tmp/payload.json

      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BASELINE }}
          fetch-depth: 0

      - name: Verify controlled context and version facts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE"
          test "$(git status --porcelain)" = ""
          main_sha="$(git rev-parse origin/main)"
          test "$main_sha" = "$GITHUB_SHA"
          test "$(git rev-parse "${main_sha}^")" = "$BASELINE"
          test "$(git diff --name-only "$BASELINE" "$main_sha")" = ".github/workflows/release.yml"
          python - <<'PY'
          import json, re
          from pathlib import Path
          assert Path('VERSION').read_text().strip() == '0.7.0'
          assert re.search(r'^version\s*=\s*"0\.7\.0"$', Path('pyproject.toml').read_text(), re.M)
          assert 'version: 0.7.0' in Path('SKILL.md').read_text()
          assert 'version: 0.7.0' in Path('agents/openai.yaml').read_text()
          assert 'version: 0.7.0' in Path('CITATION.cff').read_text()
          assert json.loads(Path('manifest.json').read_text())['version'] == '0.7.0'
          readme = Path('README.md').read_text()
          assert 'release 0.7.0 quality baseline' in readme
          assert 'Exact main attestation workflow' in readme
          assert 'scientific acceptance' in readme
          PY

      - name: Verify tag and release preflight
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" > /tmp/tag-ref.json 2>/dev/null; then
            python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          ref = json.loads(Path('/tmp/tag-ref.json').read_text())
          assert ref['object']['type'] == 'tag', 'existing v0.7.0 is not annotated'
          tag = json.loads(subprocess.check_output(['gh','api',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/tags/{ref['object']['sha']}"]))
          assert tag['object']['type'] == 'commit'
          assert tag['object']['sha'] == os.environ['BASELINE']
          PY
            echo 'tag_state=existing-correct' >> "$GITHUB_OUTPUT"
          else
            echo 'tag_state=absent' >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url >/tmp/release-before.json 2>/dev/null; then
            python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('/tmp/release-before.json').read_text())
          assert value['tagName']=='v0.7.0' and not value['isDraft'] and not value['isPrerelease']
          PY
            echo 'release_state=existing' >> "$GITHUB_OUTPUT"
          else
            echo 'release_state=absent' >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify exact-main evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p exact release-assets
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ATTESTATION_ARTIFACT_ID" > /tmp/artifact-meta.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path('/tmp/artifact-meta.json').read_text())
          assert value['expired'] is False
          assert value['workflow_run']['head_sha']==os.environ['BASELINE']
          assert value['workflow_run']['id']==int(os.environ['ATTESTATION_RUN'])
          assert value['digest']=='sha256:'+os.environ['ATTESTATION_ARTIFACT_SHA256']
          PY
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ATTESTATION_ARTIFACT_ID/zip" > /tmp/exact.zip
          test "$(sha256sum /tmp/exact.zip | cut -d' ' -f1)" = "$ATTESTATION_ARTIFACT_SHA256"
          unzip -q /tmp/exact.zip -d exact
          python - <<'PY'
          import json, os
          from pathlib import Path
          pub=json.loads(Path('exact/artifacts/publication-attestation.json').read_text())
          ev=json.loads(Path('exact/artifacts/VALIDATION_EVIDENCE.json').read_text())
          q=json.loads(Path('exact/artifacts/quality-current.json').read_text())
          assert pub['published_commit']==os.environ['BASELINE']
          assert ev['status']=='PASS'
          assert ev['provenance']['evidence_generated_from_commit']==os.environ['BASELINE']
          assert q['tests']['tests']==240
          assert round(q['coverage']['line_percent'],3)==95.726
          assert round(q['coverage']['branch_percent'],3)==92.708
          assert q['mutation']['killed']==24 and q['mutation']['total']==24 and q['mutation']['survivors']==0
          PY

      - name: Assemble immutable release assets
        run: |
          set -euo pipefail
          cp exact/dist-a/TsaoSciResearcher-v0.7.0.zip release-assets/
          cp exact/dist-a/TsaoSciResearcher-v0.7.0.zip.sha256 release-assets/
          cp exact/dist-python/tsao_sci_researcher-0.7.0-py3-none-any.whl release-assets/
          cp exact/dist-python/tsao_sci_researcher-0.7.0.tar.gz release-assets/
          cp exact/SHA256SUMS release-assets/SHA256SUMS
          cp exact/docs/SBOM.cdx.json release-assets/SBOM.cdx.json
          cp exact/artifacts/VALIDATION_EVIDENCE.json release-assets/VALIDATION_EVIDENCE.json
          cp exact/artifacts/QUALITY_HISTORY.json release-assets/QUALITY_HISTORY.json
          cp exact/artifacts/quality-current.json release-assets/quality-current.json
          cp exact/artifacts/junit.xml exact/artifacts/coverage.json exact/artifacts/coverage.xml release-assets/
          cp exact/artifacts/mutation-results.json exact/artifacts/performance.json release-assets/
          cp exact/artifacts/resolved-environment.lock exact/artifacts/resolved-environment-sbom.json release-assets/
          cp exact/artifacts/publication-attestation.json release-assets/publication-attestation.json
          cp exact/site/engineering-audit-report.pdf release-assets/engineering-audit-report.pdf
          cp LICENSE NOTICE THIRD_PARTY.md release-assets/
          cat > release-assets/EXACT-MAIN-ATTESTATION.txt <<'EOF'
          source-commit=716b0bc30d7ce34b478173b77c56e548a631aee7
          exact-attestation-run=30598726544
          exact-attestation-artifact=exact-main-attestation-716b0bc30d7ce34b478173b77c56e548a631aee7
          exact-attestation-artifact-id=8781135259
          exact-attestation-artifact-sha256=a8790b1df8b990dce94ab9590a0070899814bf3fcc59334ab5ccb83403b0a1be
          EOF
          cat > release-assets/INSTALL-VERIFY.md <<'EOF'
          # Install and verify v0.7.0
          Install the wheel or sdist in a fresh virtual environment, run `pip check`, verify `python -m tsao_researcher --version`, and run route/strategy examples. Strategy, handoff and receipts do not mean that external DFT, MD, FEM, CFD, HPC, instrument or laboratory execution has occurred, and they do not grant scientific acceptance.
          EOF
          cat > release-assets/RELEASE_NOTES.md <<'EOF'
          # TsaoSciResearcher v0.7.0 — First-Principles Research Control Platform
          Immutable source: `716b0bc30d7ce34b478173b77c56e548a631aee7`.

          Core capabilities include research routing and capability search; evidence, claim, state and approval controls; computation handoff, execution receipt and reproducibility capsule contracts; first-principles strategy; scientific-integrity and causal safeguards; 25 AI-generated architecture/scientific workflow diagrams; bilingual README and Visual Atlas; deterministic release, SBOM, checksums and exact-commit attestation.

          Method reasoning follows: scientific question → decision observable → degrees of freedom/state variables → conservation, symmetry, boundaries and constraints → quantum mechanics/statistical physics/thermodynamics/continuum mechanics → length/time/energy scales → minimum-sufficient model → escalation criteria → validation/falsification/UQ → external handoff → result review and human acceptance.

          Candidate methods include DFT, TDDFT, GW/BSE, NEB, MD, free-energy methods, SCFT, phase field, CFD, FEM, population-balance models, UQ and multiscale coupling. The package recommends and controls workflows; it does not claim external solver, instrument or laboratory execution.

          Verified: 240 tests; 0 failures/errors/skips; 95.726% line and 92.708% branch coverage; 24/24 mutations killed; Ruff, strict Mypy, Bandit and exact-lock vulnerability audit PASS; four-platform compatibility PASS; deterministic ZIP PASS; wheel/sdist isolated installation PASS.
          EOF
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('release-assets')
          assets=[]
          for p in sorted(x for x in root.iterdir() if x.is_file() and x.name not in {'RELEASE-ASSET-MANIFEST.json','RELEASE-SHA256SUMS'}):
              data=p.read_bytes(); assets.append({'name':p.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          value={'schema_version':'1.0','release':'v0.7.0','source_commit':'716b0bc30d7ce34b478173b77c56e548a631aee7','scientific_truth_boundary':'Software strategy, handoff and receipts do not prove external execution or scientific acceptance.','assets':assets}
          (root/'RELEASE-ASSET-MANIFEST.json').write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY
          (cd release-assets && find . -maxdepth 1 -type f ! -name RELEASE-SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > RELEASE-SHA256SUMS)

      - name: Create annotated tag and release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_STATE: ${{ steps.preflight.outputs.tag_state }}
          RELEASE_STATE: ${{ steps.preflight.outputs.release_state }}
        run: |
          set -euo pipefail
          git config user.name 'SUNHAOJUN22 release automation'
          git config user.email 'SUNHAOJUN22@users.noreply.github.com'
          if [ "$TAG_STATE" = absent ]; then
            git tag -a "$TAG_NAME" "$BASELINE" -m 'TsaoSciResearcher v0.7.0 immutable release baseline'
            git push origin "refs/tags/$TAG_NAME"
          fi
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" > /tmp/tag-ref-final.json
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          ref=json.loads(Path('/tmp/tag-ref-final.json').read_text()); assert ref['object']['type']=='tag'
          tag=json.loads(subprocess.check_output(['gh','api',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/tags/{ref['object']['sha']}"]))
          assert tag['object']['type']=='commit' and tag['object']['sha']==os.environ['BASELINE']
          Path('/tmp/tag-object.txt').write_text(ref['object']['sha'])
          PY
          if [ "$RELEASE_STATE" = existing ]; then
            rm -rf /tmp/existing && mkdir /tmp/existing
            gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir /tmp/existing
            (cd /tmp/existing && sha256sum -c RELEASE-SHA256SUMS)
            diff -u release-assets/RELEASE-SHA256SUMS /tmp/existing/RELEASE-SHA256SUMS
          else
            gh release create "$TAG_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$BASELINE" --title 'TsaoSciResearcher v0.7.0 — First-Principles Research Control Platform' --notes-file release-assets/RELEASE_NOTES.md --verify-tag
          fi
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url > /tmp/release-final.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/release-final.json').read_text())
          assert v['tagName']=='v0.7.0' and not v['isDraft'] and not v['isPrerelease']
          assert v['targetCommitish'] in {'v0.7.0','716b0bc30d7ce34b478173b77c56e548a631aee7'}
          PY
          echo "tag_object=$(cat /tmp/tag-object.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify official assets and installations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf downloaded /tmp/wheel-venv /tmp/sdist-venv /tmp/source && mkdir downloaded /tmp/source
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir downloaded
          required=(TsaoSciResearcher-v0.7.0.zip TsaoSciResearcher-v0.7.0.zip.sha256 tsao_sci_researcher-0.7.0-py3-none-any.whl tsao_sci_researcher-0.7.0.tar.gz SHA256SUMS SBOM.cdx.json VALIDATION_EVIDENCE.json publication-attestation.json quality-current.json mutation-results.json performance.json RELEASE_NOTES.md LICENSE NOTICE THIRD_PARTY.md INSTALL-VERIFY.md RELEASE-ASSET-MANIFEST.json RELEASE-SHA256SUMS)
          for f in "${required[@]}"; do test -s "downloaded/$f"; done
          (cd downloaded && sha256sum -c RELEASE-SHA256SUMS && sha256sum -c TsaoSciResearcher-v0.7.0.zip.sha256)
          python - <<'PY'
          import json,stat,zipfile
          from pathlib import Path,PurePosixPath
          with zipfile.ZipFile('downloaded/TsaoSciResearcher-v0.7.0.zip') as z:
              names=z.namelist(); assert len(names)==len(set(names))
              for i in z.infolist():
                  p=PurePosixPath(i.filename); assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(i.external_attr>>16)
              z.extractall('/tmp/source')
          root=Path('/tmp/source/TsaoSciResearcher'); assert (root/'VERSION').read_text().strip()=='0.7.0'
          pub=json.loads(Path('downloaded/publication-attestation.json').read_text()); assert pub['published_commit']=='716b0bc30d7ce34b478173b77c56e548a631aee7'
          ev=json.loads(Path('downloaded/VALIDATION_EVIDENCE.json').read_text()); assert ev['status']=='PASS' and ev['provenance']['evidence_generated_from_commit']=='716b0bc30d7ce34b478173b77c56e548a631aee7'
          PY
          (cd /tmp/source/TsaoSciResearcher && python scripts/generate_checksums.py --check)
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --disable-pip-version-check downloaded/tsao_sci_researcher-0.7.0-py3-none-any.whl
          /tmp/wheel-venv/bin/python -m pip check
          test "$(/tmp/wheel-venv/bin/python -m tsao_researcher --version)" = 0.7.0
          /tmp/wheel-venv/bin/python -m tsao_researcher route 'run an actual DFT calculation' >/tmp/route.json
          /tmp/wheel-venv/bin/python -m tsao_researcher strategy 'Which excited state controls optical absorption?' --observable 'absorption spectrum' --condition '300 K' >/tmp/strategy.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/route.json').read_text()); s=json.loads(Path('/tmp/strategy.json').read_text())
          assert r['primary_workflow']=='computation-handoff'
          assert s['execution_boundary']['solver_executed'] is False and s['execution_boundary']['external_execution_required'] is True
          PY
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/python -m pip install --disable-pip-version-check downloaded/tsao_sci_researcher-0.7.0.tar.gz
          /tmp/sdist-venv/bin/python -m pip check
          test "$(/tmp/sdist-venv/bin/python -m tsao_researcher --version)" = 0.7.0

      - name: Report completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TAG_OBJECT: ${{ steps.publish.outputs.tag_object }}
        run: |
          python - <<'PY' >/tmp/body.txt
          import hashlib,json,os
          from pathlib import Path
          release=json.loads(Path('/tmp/release-final.json').read_text()); manifest=json.loads(Path('downloaded/RELEASE-ASSET-MANIFEST.json').read_text())
          print('status=v0.7.0-immutable-release-complete')
          print('tag=v0.7.0'); print(f"tag-object={os.environ['TAG_OBJECT']}"); print('tag-target=716b0bc30d7ce34b478173b77c56e548a631aee7')
          print(f"release-url={release['url']}"); print(f"workflow-run={os.environ['GITHUB_RUN_ID']}")
          print('draft=false\nprerelease=false\nwheel-install=PASS\nsdist-install=PASS\nsource-zip-safety=PASS\nrelease-asset-checksums=PASS\nscientific-truth-boundary=PASS')
          print('assets:')
          for a in manifest['assets']: print(f"- {a['name']} | {a['bytes']} bytes | sha256:{a['sha256']}")
          print(f"- RELEASE-SHA256SUMS | sha256:{hashlib.sha256(Path('downloaded/RELEASE-SHA256SUMS').read_bytes()).hexdigest()}")
          print('all-gates=PASS')
          PY
          python - <<'PY' >/tmp/payload.json
          import json
          from pathlib import Path
          print(json.dumps({'body':Path('/tmp/body.txt').read_text(),'state':'closed','state_reason':'completed'}))
          PY
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" --input /tmp/payload.json

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=v0.7.0-release-failed\nsource-commit=%s\nworkflow-run=%s\n' "$BASELINE" "$GITHUB_RUN_ID" >/tmp/body.txt
          python - <<'PY' >/tmp/payload.json
          import json
          from pathlib import Path
          print(json.dumps({'body':Path('/tmp/body.txt').read_text()}))
          PY
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" --input /tmp/payload.json
