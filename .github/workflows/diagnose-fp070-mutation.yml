name: Diagnose TsaoSciResearcher 0.7.0 mutation anchor

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] diagnose first-principles mutation anchor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct candidate and inspect anchor
        shell: bash
        run: |
          set -euo pipefail
          cat .github/fp070-final-patch.part-* | tr -d '\n\r ' | base64 --decode > /tmp/tsr070.patch.xz
          test "$(sha256sum /tmp/tsr070.patch.xz | cut -d' ' -f1)" = "fddecd88a05637a47bbdd308a1cd030ce5ff53e7a50418373a637f45c5c6136a"
          xz --decompress --stdout /tmp/tsr070.patch.xz > /tmp/tsr070.patch
          test "$(sha256sum /tmp/tsr070.patch | cut -d' ' -f1)" = "620d2af0a11b8c4c4267efba93dde50129b72dc6980d4461f0661191dcee648a"
          git read-tree --reset -u 4f79afe5a895bd04fc2cee095398b2bdddac5a41
          git apply /tmp/tsr070.patch
          python - <<'PY'
          from pathlib import Path

          before = '("mass conservation", "momentum balance", "energy balance", "species conservation", "constitutive laws")'
          strategy_path = Path("tsao_researcher/strategy.py")
          strategy = strategy_path.read_text(encoding="utf-8")
          print("strategy exact anchor count:", strategy.count(before))
          cursor = 0
          occurrence = 0
          while True:
              index = strategy.find(before, cursor)
              if index < 0:
                  break
              occurrence += 1
              print(f"=== STRATEGY OCCURRENCE {occurrence} ===")
              print(strategy[max(0, index - 800):min(len(strategy), index + len(before) + 800)])
              cursor = index + len(before)

          mutation_lines = Path("scripts/run_mutation_smoke.py").read_text(encoding="utf-8").splitlines()
          matches = [index for index, line in enumerate(mutation_lines) if "strategy-continuum-mass-conservation" in line]
          print("mutation definition count:", len(matches))
          for occurrence, index in enumerate(matches, start=1):
              print(f"=== MUTATION DEFINITION {occurrence} ===")
              for offset in range(max(0, index - 4), min(len(mutation_lines), index + 18)):
                  print(f"{offset + 1}: {mutation_lines[offset]}")
          PY

      - name: Mark diagnostic complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=diagnostic-complete
          workflow-run=${GITHUB_RUN_ID}"

      - name: Mark diagnostic failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=diagnostic-failed
          workflow-run=${GITHUB_RUN_ID}"
