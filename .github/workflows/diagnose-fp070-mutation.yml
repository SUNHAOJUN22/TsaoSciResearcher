name: Diagnose TsaoSciResearcher 0.7.0 uncovered strategy branches

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] diagnose first-principles coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps

      - name: Reconstruct format and inspect uncovered strategy code
        shell: bash
        run: |
          set -euo pipefail
          cat .github/fp070-final-patch.part-* | tr -d '\n\r ' | base64 --decode > /tmp/tsr070.patch.xz
          test "$(sha256sum /tmp/tsr070.patch.xz | cut -d' ' -f1)" = "fddecd88a05637a47bbdd308a1cd030ce5ff53e7a50418373a637f45c5c6136a"
          xz --decompress --stdout /tmp/tsr070.patch.xz > /tmp/tsr070.patch
          test "$(sha256sum /tmp/tsr070.patch | cut -d' ' -f1)" = "620d2af0a11b8c4c4267efba93dde50129b72dc6980d4461f0661191dcee648a"
          git read-tree --reset -u 4f79afe5a895bd04fc2cee095398b2bdddac5a41
          git apply /tmp/tsr070.patch
          python -m ruff format tsao_researcher/strategy.py tests/test_first_principles_strategy.py
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov tests/test_first_principles_strategy.py --cov=tsao_researcher.strategy --cov-branch --cov-report=json:/tmp/strategy-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path

          coverage = json.loads(Path("/tmp/strategy-coverage.json").read_text(encoding="utf-8"))
          row = coverage["files"]["tsao_researcher/strategy.py"]
          print("=== COVERAGE SUMMARY ===")
          print(json.dumps(row["summary"], sort_keys=True))
          print("missing_lines=", row.get("missing_lines"))
          print("missing_branches=", row.get("missing_branches"))
          lines = Path("tsao_researcher/strategy.py").read_text(encoding="utf-8").splitlines()
          interesting = sorted(
              set(row.get("missing_lines", []))
              | {value for pair in row.get("missing_branches", []) for value in pair if value > 0}
          )
          windows: list[tuple[int, int]] = []
          for number in interesting:
              start = max(1, number - 8)
              end = min(len(lines), number + 8)
              if windows and start <= windows[-1][1] + 1:
                  windows[-1] = (windows[-1][0], max(windows[-1][1], end))
              else:
                  windows.append((start, end))
          for start, end in windows:
              print(f"=== STRATEGY LINES {start}-{end} ===")
              for number in range(start, end + 1):
                  marker = "*" if number in interesting else " "
                  print(f"{marker}{number:04d}: {lines[number - 1]}")
          PY

      - name: Mark diagnostic complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=diagnostic-complete
          workflow-run=${GITHUB_RUN_ID}"

      - name: Mark diagnostic failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=diagnostic-failed
          workflow-run=${GITHUB_RUN_ID}"
