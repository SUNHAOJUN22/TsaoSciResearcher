name: Diagnose TsaoSciResearcher 0.7.0 mutation anchor

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] diagnose formatted first-principles mutation anchor'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact formatter
        run: python -m pip install --disable-pip-version-check -r requirements-ci.lock

      - name: Reconstruct format and inspect anchor
        shell: bash
        run: |
          set -euo pipefail
          cat .github/fp070-final-patch.part-* | tr -d '\n\r ' | base64 --decode > /tmp/tsr070.patch.xz
          test "$(sha256sum /tmp/tsr070.patch.xz | cut -d' ' -f1)" = "fddecd88a05637a47bbdd308a1cd030ce5ff53e7a50418373a637f45c5c6136a"
          xz --decompress --stdout /tmp/tsr070.patch.xz > /tmp/tsr070.patch
          test "$(sha256sum /tmp/tsr070.patch | cut -d' ' -f1)" = "620d2af0a11b8c4c4267efba93dde50129b72dc6980d4461f0661191dcee648a"
          git read-tree --reset -u 4f79afe5a895bd04fc2cee095398b2bdddac5a41
          git apply /tmp/tsr070.patch
          python -m ruff format tsao_researcher/strategy.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tsao_researcher/strategy.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(lines):
              if 'slug="continuum-transport"' in line:
                  print("=== FORMATTED CONTINUUM REGIME ===")
                  for offset in range(index, min(len(lines), index + 45)):
                      print(f"{offset + 1}: {lines[offset]}")
                  break
          else:
              raise SystemExit("continuum regime missing")

          mutation_lines = Path("scripts/run_mutation_smoke.py").read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(mutation_lines):
              if "strategy-continuum-mass-conservation" in line:
                  print("=== CURRENT MUTATION DEFINITION ===")
                  for offset in range(max(0, index - 2), min(len(mutation_lines), index + 10)):
                      print(f"{offset + 1}: {mutation_lines[offset]}")
                  break
          else:
              raise SystemExit("mutation definition missing")
          PY

      - name: Mark diagnostic complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=diagnostic-complete
          workflow-run=${GITHUB_RUN_ID}"

      - name: Mark diagnostic failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=diagnostic-failed
          workflow-run=${GITHUB_RUN_ID}"
