name: One-shot Researcher clause-scope convergence v2

on:
  push:
    branches:
      - remediation/clause-scope-contracts-ci-v2

permissions:
  contents: write

concurrency:
  group: researcher-clause-scope-convergence-v2
  cancel-in-progress: false

jobs:
  apply-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: remediation/clause-scope-contracts-ci-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Reassemble and apply the exact source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/remediation/researcher.patch.b64.* | tr -d '\r\n' > /tmp/researcher.patch.gz.b64
          printf '%s  %s\n' '1aeb9f87e16141b165d4e0cd5eeff3c00be982856eef88a87b4d1f7ea618e527' /tmp/researcher.patch.gz.b64 | sha256sum --check
          base64 --decode /tmp/researcher.patch.gz.b64 | gzip --decompress > /tmp/researcher.patch
          printf '%s  %s\n' '7df9fab913e72c75cacee64af930dc108396305239f0a770b2fc86d23abdc5c0' /tmp/researcher.patch | sha256sum --check
          git apply --check /tmp/researcher.patch
          git apply /tmp/researcher.patch
          rm -f .github/remediation/researcher.patch.b64.*
          rmdir .github/remediation
          rm .github/workflows/remediation-apply-clause-scope-v2.yml
          git add -A

      - name: Install exact CI dependencies and patched package
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Canonical formatting and deterministic evidence rebuild
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path('tests/test_runtime_v2.py'),
              Path('tests/test_scientific_contracts_v16.py'),
              Path('tests/test_scientific_quality.py'),
              Path('tsao_researcher/semantic_scope.py'),
          )
          ambiguous = set('，；！？')
          for path in paths:
              output: list[str] = []
              for line in path.read_text(encoding='utf-8').splitlines(keepends=True):
                  if any(mark in line for mark in ambiguous) and 'noqa: RUF001' not in line:
                      newline = '\n' if line.endswith('\n') else ''
                      body = line[:-1] if newline else line
                      line = f'{body}  # noqa: RUF001{newline}'
                  output.append(line)
              path.write_text(''.join(output), encoding='utf-8')
          PY
          python -m ruff check --fix --unsafe-fixes \
            scripts/build_research_quality_dashboard.py \
            scripts/build_test_dashboard.py \
            tests/test_contracts_v17.py \
            tests/test_runtime_v2.py \
            tests/test_scientific_contracts_v16.py \
            tests/test_scientific_quality.py \
            tsao_researcher/contracts_v17.py \
            tsao_researcher/router.py \
            tsao_researcher/scientific_contracts_v16.py \
            tsao_researcher/scientific_quality.py \
            tsao_researcher/semantic_scope.py
          python -m ruff format \
            scripts/build_research_quality_dashboard.py \
            scripts/build_test_dashboard.py \
            tests/test_contracts_v17.py \
            tests/test_runtime_v2.py \
            tests/test_scientific_contracts_v16.py \
            tests/test_scientific_quality.py \
            tsao_researcher/contracts_v17.py \
            tsao_researcher/router.py \
            tsao_researcher/scientific_contracts_v16.py \
            tsao_researcher/scientific_quality.py \
            tsao_researcher/semantic_scope.py
          python scripts/sync_runtime_data.py --write
          python scripts/build_readme_facts.py --write
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          git add -A
          python scripts/validate_unicode_integrity.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write
          python scripts/generate_checksums.py --write

      - name: Full deterministic qualification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_unicode_integrity.py --check
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/validate_mathematical_contracts.py --check
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          python scripts/final_acceptance_preflight.py --root . --json
          python -m compileall -q scripts tsao_researcher tests
          python -m unittest tests.test_contracts_v17 -v
          python -m pytest -q -p hypothesis.extra.pytestplugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          git diff --check

      - name: Verify bounded final diff and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          required = {
              '.github/remediation/researcher.patch.b64.00',
              '.github/remediation/researcher.patch.b64.01',
              '.github/remediation/researcher.patch.b64.02',
              '.github/remediation/researcher.patch.b64.03',
              '.github/workflows/contracts-v17.yml',
              '.github/workflows/exact-tree-export.yml',
              '.github/workflows/remediation-apply-clause-scope-v2.yml',
              '.github/workflows/v19-skill-contract.yml',
              'routing/router-rules-v2.json',
              'scripts/build_research_quality_dashboard.py',
              'scripts/build_test_dashboard.py',
              'tests/test_contracts_v17.py',
              'tests/test_runtime_v2.py',
              'tests/test_scientific_contracts_v16.py',
              'tests/test_scientific_quality.py',
              'tsao_researcher/contracts/contracts_v17.py',
              'tsao_researcher/contracts/scientific_contracts_v16.py',
              'tsao_researcher/contracts_v17.py',
              'tsao_researcher/data/routing/router-rules-v2.json',
              'tsao_researcher/router.py',
              'tsao_researcher/scientific_contracts_v16.py',
              'tsao_researcher/scientific_quality.py',
              'tsao_researcher/semantic_scope.py',
          }
          generated = {
              'SHA256SUMS',
              'docs/README_FACTS.json',
              'docs/SBOM.cdx.json',
              'docs/SCIENTIFIC_QUALITY_EXAMPLES.json',
              'docs/VALIDATION_EVIDENCE.json',
              'docs/engineering-audit-report.pdf',
              'docs/research-quality-dashboard.html',
              'docs/research-quality-dashboard.svg',
              'docs/test-dashboard.html',
              'docs/test-dashboard.svg',
              'reports/UNICODE_INTEGRITY_REPORT.json',
          }
          actual = set(
              subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines()
          )
          missing = required - actual
          unexpected = actual - required - generated
          if missing or unexpected:
              raise SystemExit(
                  f'unexpected final diff: missing={sorted(missing)!r} '
                  f'unexpected={sorted(unexpected)!r} actual={sorted(actual)!r}'
              )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(routing): enforce clause-local EN/ZH negation scope"
          git push origin HEAD:remediation/clause-scope-contracts-ci-v2
