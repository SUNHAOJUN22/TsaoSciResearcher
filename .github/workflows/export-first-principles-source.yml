name: Finalize first-principles strategy advisor 0.7.0

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: finalize-first-principles-0-7-0
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  full_validation:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] first-principles advisor development' && github.event.comment.body == 'TSR_EXPORT_FIRST_PRINCIPLES_SOURCE'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      tests: ${{ steps.metrics.outputs.tests }}
      line: ${{ steps.metrics.outputs.line }}
      branch: ${{ steps.metrics.outputs.branch }}
      mutations: ${{ steps.metrics.outputs.mutations }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Apply checksum-bound product patch and remove transport controls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > comments.json
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          expected = "76a7a38ca35c126f4410a742473a90d3963a482339ec1c06fa87b3e8a465d0e8"
          comments = json.loads(Path('comments.json').read_text(encoding='utf-8'))
          payloads = [
              ''.join(str(row.get('body', '')).split('\n', 1)[1].split())
              for row in comments
              if row.get('user', {}).get('login') == 'SUNHAOJUN22'
              and str(row.get('body', '')).startswith('TSR_FP_PATCH_PAYLOAD\n')
          ]
          if len(payloads) != 1:
              raise SystemExit(f'expected one patch payload, found {len(payloads)}')
          compressed = base64.b64decode(payloads[0], validate=True)
          actual = hashlib.sha256(compressed).hexdigest()
          if actual != expected:
              raise SystemExit(f'patch checksum mismatch: {actual}')
          Path('candidate.patch').write_bytes(lzma.decompress(compressed))
          PY
          git apply --check --binary candidate.patch
          git apply --binary candidate.patch
          rm -f candidate.patch comments.json
          rm -f .github/first-principles-advisor-plan.md .github/first-principles-development-session.txt
          rm -f .github/first-principles-patch.part-* .github/first-principles-payload.part-*
          rm -f .github/transport/finalize_first_principles_advisor.py
          rm -f .github/workflows/export-first-principles-source.yml
          rm -f .github/workflows/finalize-first-principles-advisor.yml
          rm -f .github/workflows/finalize-first-principles-advisor-v2.yml
          rm -f .github/workflows/finalize-first-principles-advisor-v3.yml
          rm -f .github/workflows/patch-first-principles-finalizer.yml
          rm -f .github/workflows/verify-first-principles-candidate.yml
          rm -f .github/workflows/build-first-principles-candidate.yml
          rmdir .github/transport 2>/dev/null || true
      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Product identity and first-principles contracts
        run: |
          test "$(cat VERSION)" = "0.7.0"
          python -m tsao_researcher --version
          python -m tsao_researcher strategy "How do defect states control dielectric breakdown?" --observable trap-depth --condition "finite temperature" --out /tmp/strategy.json
          python scripts/validate_computation_strategy.py /tmp/strategy.json
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert manifest['capability_count'] == 341
          assert manifest['schema_count'] == 19
          rows = json.loads(Path('capabilities/v2/capabilities.json').read_text(encoding='utf-8'))
          assert len(rows) == 341
          assert any(row.get('slug') == 'first-principles-strategy-advisor' for row in rows)
          strategy = json.loads(Path('/tmp/strategy.json').read_text(encoding='utf-8'))
          assert strategy['status'] == 'advisory-only'
          assert strategy['execution_boundary']['solver_executed'] is False
          assert strategy['method_ladder']
          assert not list(Path('.github').glob('first-principles-*'))
          assert not list(Path('.github/workflows').glob('*first-principles*'))
          PY
      - name: Repository documentation and generated-artifact audit
        run: |
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          mkdocs build --strict
      - name: Complete regression coverage and order independence
        run: |
          mkdir -p artifacts
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          TSR_TEST_ORDER_SEED=20260728 python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin
      - name: Static type security dependency mutation and performance gates
        run: |
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict -r artifacts/resolved-environment.lock --format cyclonedx-json --output artifacts/resolved-environment-sbom.json
          python scripts/build_sbom.py --check
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
      - name: Deterministic release and Python distributions
        run: |
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python
      - name: Capture exact metrics
        id: metrics
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse('artifacts/junit.xml').getroot()
          suites = root.findall('testsuite') if root.tag == 'testsuites' else [root]
          tests = sum(int(float(node.attrib.get('tests', 0))) for node in suites)
          coverage = json.loads(Path('artifacts/coverage.json').read_text(encoding='utf-8'))['totals']
          branches = int(coverage.get('num_branches', 0))
          covered = int(coverage.get('covered_branches', 0))
          mutations = json.loads(Path('artifacts/mutation-results.json').read_text(encoding='utf-8'))
          killed = sum(bool(row.get('killed')) for row in mutations)
          print(f'tests={tests}')
          print(f"line={float(coverage['percent_covered']):.3f}")
          print(f"branch={(100.0 if branches == 0 else covered * 100.0 / branches):.3f}")
          print(f'mutations={killed}/{len(mutations)}')
          PY

  compatibility:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] first-principles advisor development' && github.event.comment.body == 'TSR_EXPORT_FIRST_PRINCIPLES_SOURCE'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Apply product patch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > comments.json
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          expected = "76a7a38ca35c126f4410a742473a90d3963a482339ec1c06fa87b3e8a465d0e8"
          comments = json.loads(Path('comments.json').read_text(encoding='utf-8'))
          payloads = [''.join(str(row.get('body', '')).split('\n', 1)[1].split()) for row in comments if row.get('user', {}).get('login') == 'SUNHAOJUN22' and str(row.get('body', '')).startswith('TSR_FP_PATCH_PAYLOAD\n')]
          if len(payloads) != 1:
              raise SystemExit(f'expected one patch payload, found {len(payloads)}')
          compressed = base64.b64decode(payloads[0], validate=True)
          if hashlib.sha256(compressed).hexdigest() != expected:
              raise SystemExit('patch checksum mismatch')
          Path('candidate.patch').write_bytes(lzma.decompress(compressed))
          PY
          git apply --check --binary candidate.patch
          git apply --binary candidate.patch
          rm -f candidate.patch comments.json
          rm -f .github/first-principles-advisor-plan.md .github/first-principles-development-session.txt
          rm -f .github/first-principles-patch.part-* .github/first-principles-payload.part-*
          rm -f .github/transport/finalize_first_principles_advisor.py
          rm -f .github/workflows/export-first-principles-source.yml
          rm -f .github/workflows/finalize-first-principles-advisor.yml
          rm -f .github/workflows/finalize-first-principles-advisor-v2.yml
          rm -f .github/workflows/finalize-first-principles-advisor-v3.yml
          rm -f .github/workflows/patch-first-principles-finalizer.yml
          rm -f .github/workflows/verify-first-principles-candidate.yml
          rm -f .github/workflows/build-first-principles-candidate.yml
          rmdir .github/transport 2>/dev/null || true
      - name: Install and exercise compatibility contracts
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
          python -m compileall -q scripts tsao_researcher tests
          python -m pytest -q -p hypothesis.extra.pytestplugin tests/test_first_principles_strategy.py tests/test_runtime_v2.py tests/test_named_capabilities.py tests/test_schemas.py tests/test_handoff_cli.py tests/test_receipts_capsules.py
          python -m tsao_researcher strategy "Recommend a simulation strategy for polymer morphology evolution" --observable domain-size --condition "finite temperature"
          python scripts/validate_schemas.py

  publish_candidate:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] first-principles advisor development' && github.event.comment.body == 'TSR_EXPORT_FIRST_PRINCIPLES_SOURCE'
    needs: [full_validation, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Apply product patch and remove transport controls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > comments.json
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          expected = "76a7a38ca35c126f4410a742473a90d3963a482339ec1c06fa87b3e8a465d0e8"
          comments = json.loads(Path('comments.json').read_text(encoding='utf-8'))
          payloads = [''.join(str(row.get('body', '')).split('\n', 1)[1].split()) for row in comments if row.get('user', {}).get('login') == 'SUNHAOJUN22' and str(row.get('body', '')).startswith('TSR_FP_PATCH_PAYLOAD\n')]
          if len(payloads) != 1:
              raise SystemExit(f'expected one patch payload, found {len(payloads)}')
          compressed = base64.b64decode(payloads[0], validate=True)
          if hashlib.sha256(compressed).hexdigest() != expected:
              raise SystemExit('patch checksum mismatch')
          Path('candidate.patch').write_bytes(lzma.decompress(compressed))
          PY
          git apply --check --binary candidate.patch
          git apply --binary candidate.patch
          rm -f candidate.patch comments.json
          rm -f .github/first-principles-advisor-plan.md .github/first-principles-development-session.txt
          rm -f .github/first-principles-patch.part-* .github/first-principles-payload.part-*
          rm -f .github/transport/finalize_first_principles_advisor.py
          rm -f .github/workflows/export-first-principles-source.yml
          rm -f .github/workflows/finalize-first-principles-advisor.yml
          rm -f .github/workflows/finalize-first-principles-advisor-v2.yml
          rm -f .github/workflows/finalize-first-principles-advisor-v3.yml
          rm -f .github/workflows/patch-first-principles-finalizer.yml
          rm -f .github/workflows/verify-first-principles-candidate.yml
          rm -f .github/workflows/build-first-principles-candidate.yml
          rmdir .github/transport 2>/dev/null || true
      - name: Create verified Git object candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          git diff --cached --check
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          parent_tree = subprocess.check_output(['git', 'show', '-s', '--format=%T', 'HEAD'], text=True).strip()
          changed = sorted(filter(None, subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=ACMRTUXB'], text=True).splitlines()))
          deleted = sorted(filter(None, subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=D'], text=True).splitlines()))
          required = {'tsao_researcher/strategy.py', 'schemas/v2/computation-strategy.schema.json', 'tests/test_first_principles_strategy.py'}
          if not required.issubset(changed):
              raise SystemExit(f'missing product files: {sorted(required - set(changed))}')
          if not any(path.endswith('export-first-principles-source.yml') for path in deleted):
              raise SystemExit('finalizer self-deletion missing')
          def api(method, path, payload):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', data=json.dumps(payload).encode(), method=method, headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          tree = []
          for relative in changed:
              raw = Path(relative).read_bytes()
              blob = api('POST', '/git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              row = subprocess.check_output(['git', 'ls-files', '-s', '--', relative], text=True).strip()
              mode = row.split()[0] if row else '100644'
              tree.append({'path': relative, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          for relative in deleted:
              tree.append({'path': relative, 'mode': '100644', 'type': 'blob', 'sha': None})
          created_tree = api('POST', '/git/trees', {'base_tree': parent_tree, 'tree': tree})
          commit = api('POST', '/git/commits', {'message': 'feat: add first-principles computation strategy advisor', 'tree': created_tree['sha'], 'parents': [parent]})
          print(f"candidate={commit['sha']}")
          print(f'parent={parent}')
          print(f'changed={len(changed)}')
          print(f'deleted={len(deleted)}')
          PY
      - name: Report verified candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          PARENT: ${{ steps.candidate.outputs.parent }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
          DELETED: ${{ steps.candidate.outputs.deleted }}
          TESTS: ${{ needs.full_validation.outputs.tests }}
          LINE: ${{ needs.full_validation.outputs.line }}
          BRANCH: ${{ needs.full_validation.outputs.branch }}
          MUTATIONS: ${{ needs.full_validation.outputs.mutations }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=first-principles-candidate-verified
candidate=${CANDIDATE}
parent=${PARENT}
version=0.7.0
changed=${CHANGED}
deleted=${DELETED}
tests=${TESTS}
line-coverage=${LINE}
branch-coverage=${BRANCH}
mutation=${MUTATIONS}
compatibility=PASS
ruff=PASS
mypy=PASS
bandit=PASS
dependency-audit=PASS
performance=PASS
deterministic-release=PASS
wheel-and-sdist=PASS
transport-controls=REMOVED
solver-execution=ABSENT
advisory-boundary=PASS"

  report_failure:
    if: always() && github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] first-principles advisor development' && github.event.comment.body == 'TSR_EXPORT_FIRST_PRINCIPLES_SOURCE' && (needs.full_validation.result != 'success' || needs.compatibility.result != 'success' || needs.publish_candidate.result != 'success')
    needs: [full_validation, compatibility, publish_candidate]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          FULL: ${{ needs.full_validation.result }}
          COMPAT: ${{ needs.compatibility.result }}
          PUBLISH: ${{ needs.publish_candidate.result }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=first-principles-finalization-failed
full-validation=${FULL}
compatibility=${COMPAT}
publish=${PUBLISH}
workflow-run=${GITHUB_RUN_ID}"
