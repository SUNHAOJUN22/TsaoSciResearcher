name: One-time v0.7.3 quantitative integrity finalization

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: tsr-v073-quantitative-integrity-finalization
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  compatibility:
    if: >-
      github.event.issue.number == 202 &&
      github.event.issue.title == '[TSR] v0.7.3 quantitative integrity finalization' &&
      github.event.comment.user.login == 'SUNHAOJUN22' &&
      github.event.comment.body == 'finalize_token=TSR-20260806-quant-v7'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Apply exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_staged_quantitative_payload_temp.py
          printf '0.7.3\n' > VERSION
          cp README.md README_EN.md
          cp README.zh-CN.md README_CN.md
          python scripts/sync_version.py --write
          cp README.md README_EN.md
          cp README.zh-CN.md README_CN.md
          rm -rf .tsr-finalize .tsr-finalize-v2
          rm -f \
            .github/workflows/quantitative-integrity-finalize-temp.yml \
            .github/workflows/snapshot-export-temp.yml \
            scripts/apply_quantitative_integrity_temp.py \
            scripts/apply_staged_quantitative_payload_temp.py
          python -m ruff format \
            tsao_researcher/strategy.py \
            tests/test_strategy_passport.py \
            tests/test_strategy_quantitative_integrity.py \
            scripts/build_readme_facts.py
          python scripts/sync_runtime_data.py --write
          python scripts/build_readme_facts.py --write
          python -m pip install --disable-pip-version-check -e . --no-deps --force-reinstall
          python -m pip check

      - name: Cross-platform scientific contracts
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/tsr-pycache
        run: |
          set -euo pipefail
          python -m compileall -q scripts tsao_researcher tests
          python -m pytest -q -p hypothesis.extra.pytestplugin \
            tests/test_first_principles_strategy.py \
            tests/test_first_principles_strategy_boundaries.py \
            tests/test_strategy_passport.py \
            tests/test_strategy_quantitative_integrity.py \
            tests/test_readme_facts.py \
            tests/test_runtime_v2.py \
            tests/test_scientific_quality.py \
            tests/test_v071_hardening.py
          python scripts/validate_schemas.py
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/build_readme_facts.py --check
          python -m ruff check \
            tsao_researcher/strategy.py \
            tests/test_strategy_passport.py \
            tests/test_strategy_quantitative_integrity.py \
            scripts/build_readme_facts.py
          python -m tsao_researcher strategy \
            "Can a 1.0 eV trap measurement predict industrial product quality by extrapolation?" \
            --observable "trap energy 1.0 eV" \
            --condition "303 K" \
            --evidence "independent experiment measurement"

  report-compatibility-failure:
    if: >-
      always() &&
      github.event.issue.number == 202 &&
      github.event.issue.title == '[TSR] v0.7.3 quantitative integrity finalization' &&
      github.event.comment.user.login == 'SUNHAOJUN22' &&
      github.event.comment.body == 'finalize_token=TSR-20260806-quant-v7' &&
      needs.compatibility.result != 'success'
    needs: compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Report compatibility failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh issue comment 202 --repo "$GITHUB_REPOSITORY" \
            --body "status=quantitative-integrity-compatibility-failed staged_source=${GITHUB_SHA} workflow_run_id=${GITHUB_RUN_ID}"

  finalize:
    if: >-
      github.event.issue.number == 202 &&
      github.event.issue.title == '[TSR] v0.7.3 quantitative integrity finalization' &&
      github.event.comment.user.login == 'SUNHAOJUN22' &&
      github.event.comment.body == 'finalize_token=TSR-20260806-quant-v7'
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Apply candidate and regenerate evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_staged_quantitative_payload_temp.py
          printf '0.7.3\n' > VERSION
          cp README.md README_EN.md
          cp README.zh-CN.md README_CN.md
          python scripts/sync_version.py --write
          cp README.md README_EN.md
          cp README.zh-CN.md README_CN.md
          rm -rf .tsr-finalize .tsr-finalize-v2
          rm -f \
            .github/workflows/quantitative-integrity-finalize-temp.yml \
            .github/workflows/snapshot-export-temp.yml \
            scripts/apply_quantitative_integrity_temp.py \
            scripts/apply_staged_quantitative_payload_temp.py
          python -m ruff format \
            tsao_researcher/strategy.py \
            tests/test_strategy_passport.py \
            tests/test_strategy_quantitative_integrity.py \
            scripts/build_readme_facts.py
          python scripts/sync_runtime_data.py --write
          python -m tsao_researcher strategy \
            "How do interfacial trap states control charge transport and breakdown under a possible scale extrapolation?" \
            --observable "trap energy distribution 1.0 eV" \
            --observable "space-charge density 20 C/m3" \
            --condition "303 K" \
            --condition "20 kV/mm" \
            --evidence "peer-reviewed literature analysis" \
            --evidence "converged DFT simulation calculation" \
            --evidence "independent TSDC and PEA experiment measurements" \
            --output examples/first-principles-strategy.json
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write --preflight --evidence-date 2026-08-06
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
          python -m pip install --disable-pip-version-check -e . --no-deps --force-reinstall
          python -m pip check

      - name: Repository schema README and documentation gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          mkdocs build --strict

      - name: Full regression coverage order static security mutation and performance
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov \
            --ignore=tests/test_import_isolation.py \
            --cov=tsao_researcher --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:artifacts/coverage.json
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          TSR_TEST_ORDER_SEED=20260806 \
            python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort \
            > artifacts/resolved-environment.lock
          python -m pip_audit --strict \
            -r artifacts/resolved-environment.lock \
            --format cyclonedx-json \
            --output artifacts/resolved-environment-sbom.json
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py

      - name: Deterministic build and isolated installation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" \
              "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python

      - name: Verify exact final scope and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            .coverage .coverage.* .hypothesis .mypy_cache .pytest_cache .ruff_cache \
            artifacts build dist dist-a dist-b dist-python site \
            ./*.egg-info tsao_researcher/*.egg-info
          python - <<'PY'
          from pathlib import Path
          import subprocess

          payload_paths = {
              line.strip()
              for line in (Path('/tmp') / 'tsr_payload_paths.txt').read_text(encoding='utf-8').splitlines()
              if line.strip()
          }
          staging = {
              *(f'.tsr-finalize/part-{index:03d}.b64' for index in range(5)),
              *(f'.tsr-finalize-v2/part-{index:03d}.b64' for index in range(12)),
              '.github/workflows/quantitative-integrity-finalize-temp.yml',
              '.github/workflows/snapshot-export-temp.yml',
              'scripts/apply_quantitative_integrity_temp.py',
              'scripts/apply_staged_quantitative_payload_temp.py',
          }
          generated = {
              'CITATION.cff', 'README_CN.md', 'README_EN.md', 'SHA256SUMS',
              'SKILL.md', 'VERSION', 'agents/openai.yaml', 'manifest.json',
              'pyproject.toml', 'docs/README_FACTS.json', 'docs/SBOM.cdx.json',
              'docs/SCIENTIFIC_QUALITY_EXAMPLES.json', 'docs/VALIDATION_EVIDENCE.json',
              'docs/engineering-audit-report.pdf', 'docs/research-quality-dashboard.html',
              'docs/research-quality-dashboard.svg', 'docs/test-dashboard.html',
              'docs/test-dashboard.svg', 'examples/first-principles-strategy.json',
          }
          allowed = payload_paths | staging | generated
          output = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True)
          actual = set()
          for line in output.splitlines():
              if line:
                  path = line[3:].split(' -> ', 1)[-1].strip('"')
                  actual.add(path)
          unexpected = sorted(actual - allowed)
          if unexpected:
              raise SystemExit('unexpected changed paths: ' + ', '.join(unexpected))
          if not actual:
              raise SystemExit('candidate produced no changes')
          for path in ('.tsr-finalize', '.tsr-finalize-v2'):
              if Path(path).exists():
                  raise SystemExit(f'{path} was not removed')
          print(f'exact final scope PASS ({len(actual)} paths)')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add quantitative scientific integrity gates"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main

      - name: Report final commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh issue comment 202 --repo "$GITHUB_REPOSITORY" \
            --body "status=quantitative-integrity-finalized final_commit=$(git rev-parse HEAD) workflow_run_id=${GITHUB_RUN_ID} windows_linux_and_full_gates=PASS"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh issue comment 202 --repo "$GITHUB_REPOSITORY" \
            --body "status=quantitative-integrity-finalization-failed staged_source=${GITHUB_SHA} workflow_run_id=${GITHUB_RUN_ID}"
