name: Finalize first-principles strategy advisor

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: finalize-first-principles-advisor-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  verify-and-create-candidate:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] first-principles advisor development' &&
      github.event.comment.body == 'TSR_FINALIZE_FIRST_PRINCIPLES_ADVISOR'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact validation toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Verify and install checksum-bound candidate
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          parts = [root / f".github/first-principles-payload.part-{index:02d}" for index in range(1, 21)]
          expected_sha = "05aeda511bb04285c9849a1557d5289094703e91222cd7c250718cb70393deba"
          encoded = "".join("".join(path.read_text(encoding="ascii").split()) for path in parts)
          raw = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"payload checksum mismatch: {actual}")
          payload = Path("/tmp/first-principles-advisor-payload.zip")
          payload.write_bytes(raw)
          with zipfile.ZipFile(payload) as archive:
              manifest = json.loads(archive.read("manifest.json"))
              if manifest.get("source_commit") != "104be8e0f4d6f0414389858f67c4c73ef6c083de":
                  raise SystemExit("payload source commit mismatch")
              expected = {f"files/{name}" for name in manifest["changed"]} | {"manifest.json"}
              actual_names = {row.filename for row in archive.infolist() if not row.is_dir()}
              if actual_names != expected:
                  raise SystemExit("payload inventory mismatch")
              for info in archive.infolist():
                  if info.is_dir() or info.filename == "manifest.json":
                      continue
                  pure = PurePosixPath(info.filename)
                  if pure.parts[0] != "files" or pure.is_absolute() or any(part in {"", ".", ".."} for part in pure.parts):
                      raise SystemExit(f"unsafe payload path: {info.filename}")
                  if (info.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit(f"payload symlink forbidden: {info.filename}")
                  relative = PurePosixPath(*pure.parts[1:])
                  target = (root / relative).resolve(strict=False)
                  if not target.is_relative_to(root):
                      raise SystemExit(f"payload escapes repository: {info.filename}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(info.filename))
          PY
          rm -f .github/first-principles-payload.part-*
          rm -f .github/first-principles-advisor-plan.md
          rm -f .github/first-principles-development-session.txt
          rm -f .github/workflows/export-first-principles-source.yml
          rm -f .github/workflows/finalize-first-principles-advisor.yml
          rm -f dist-b/TsaoSciResearcher-v0.5.3.zip.sha256
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("capabilities/v2/capabilities.json")
          rows = json.loads(path.read_text(encoding="utf-8"))
          record = {
              "category": "vNext核心能力",
              "computation_handoff": {"mode": "optional", "profile": "first-principles-strategy"},
              "data_egress": "none",
              "description": "从可观测量、自由度、守恒律、量子与统计物理、尺度分离和证伪要求出发，提出最低充分的计算或仿真策略，不执行求解器。",
              "domains": ["general", "computational-chemistry-materials", "molecular-dynamics-multiscale", "catalysis-polymers-composites", "fem-multiphysics", "cfd-particles-processing", "process-kinetics-digital-twin"],
              "failure_modes": ["observable undefined", "scale ambiguity", "method chosen without governing-physics rationale", "validation absent"],
              "human_approval": {"points": ["qualified method review before external execution"], "required": false},
              "id": "TSR-A019",
              "implementation_level": "native-research",
              "input_schema": "schemas/v2/capability-invocation.schema.json",
              "maturity": "beta",
              "name_en": "First-Principles Computation Strategy Advisor",
              "name_zh": "第一性原理计算与仿真策略顾问",
              "negative_triggers": ["声称已完成计算", "伪造仿真结果"],
              "output_schema": "schemas/v2/artifact.schema.json",
              "positive_triggers": ["第一性原理计算策略", "仿真策略", "计算方案", "method selection", "first-principles strategy", "statistical mechanics", "quantum mechanics"],
              "recovery": ["return unresolved first-principles questions", "start from analytical bounds", "request validation observables", "remain in planned state"],
              "references": ["references/computation/first-principles-strategy.md", "references/computation/handoff-protocol.md", "references/project-governance/scientific-validation.md"],
              "schema_version": "2.0",
              "slug": "first-principles-strategy-advisor",
              "source_lineage": [{"feature": "first-principles-strategy-advisor", "source": "vNext-original"}],
              "validators": ["strategy", "schema", "state", "provenance", "truth-boundary"],
              "workflow": "computation-handoff"
          }
          rows = [row for row in rows if row.get("id") != "TSR-A019" and row.get("slug") != record["slug"]]
          rows.append(record)
          rows.sort(key=lambda row: row["id"])
          path.write_text(json.dumps(rows, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          Path("examples/first-principles-strategy.json").write_bytes(Path("templates/computation-handoff/first-principles-strategy.json").read_bytes())
          PY

      - name: Regenerate deterministic repository evidence
        run: |
          python scripts/sync_version.py --write
          cp README.zh-CN.md README_CN.md
          cp README.md README_EN.md
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write

      - name: Validate first-principles strategy feature
        run: |
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from tsao_researcher.strategy import advise_computation_strategy

          index = json.loads(Path("capabilities/v2/index.json").read_text(encoding="utf-8"))
          assert index["total"] == 341
          assert index["core_added"] == 19
          assert index["by_workflow"]["computation-handoff"] == 169
          assert len(list(Path("schemas").rglob("*.schema.json"))) == 19
          assert len(list(Path("scripts").glob("*.py"))) == 39
          svgs = list(Path("docs/assets/ai").glob("*.svg"))
          assert len(svgs) == 17
          for svg in svgs:
              ET.parse(svg)
              text = svg.read_text(encoding="utf-8")
              assert 'role="img"' in text and "<title" in text and "<desc" in text
          continuum = advise_computation_strategy(
              "Which simulation strategy should predict pressure drop and mixing in a non-Newtonian channel?",
              observables=["pressure drop", "mixing time"],
          )
          assert continuum["method_candidates"][0]["slug"] == "continuum-conservation-model"
          assert all(row["slug"] != "periodic-dft" for row in continuum["method_candidates"])
          assert continuum["external_execution_boundary"]["execution_performed"] is False
          print("first-principles feature PASS")
          PY

      - name: Validate repository documentation and contracts
        run: |
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          mkdocs build --strict

      - name: Full regression coverage and order independence
        run: |
          mkdir -p artifacts
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          TSR_TEST_ORDER_SEED=20260728 python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin

      - name: Static type security dependency mutation and performance gates
        run: |
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict -r artifacts/resolved-environment.lock --format cyclonedx-json --output artifacts/resolved-environment-sbom.json
          python scripts/build_sbom.py --check
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py

      - name: Deterministic release and distribution gates
        run: |
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          VERSION="$(tr -d '\r\n' < VERSION)"
          cmp "dist-a/TsaoSciResearcher-v${VERSION}.zip" "dist-b/TsaoSciResearcher-v${VERSION}.zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python

      - name: Create verified Git object candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp artifacts/quality-current.json /tmp/quality-current.json
          rm -rf site build htmlcov .coverage .pytest_cache .mypy_cache .ruff_cache .hypothesis artifacts dist dist-a dist-b dist-python
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          git diff --cached --check
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from __future__ import annotations
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          parent = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          parent_tree = subprocess.check_output(["git", "show", "-s", "--format=%T", "HEAD"], text=True).strip()
          changed = sorted(filter(None, subprocess.check_output(["git", "diff", "--cached", "--name-only", "--diff-filter=ACMRTUXB"], text=True).splitlines()))
          deleted = sorted(filter(None, subprocess.check_output(["git", "diff", "--cached", "--name-only", "--diff-filter=D"], text=True).splitlines()))
          forbidden = [path for path in changed if "first-principles-payload" in path or path.endswith("finalize-first-principles-advisor.yml") or path in {".github/first-principles-advisor-plan.md", ".github/first-principles-development-session.txt"}]
          if forbidden:
              raise SystemExit(f"temporary controls remain: {forbidden}")
          required = {"tsao_researcher/strategy.py", "schemas/v2/computation-strategy.schema.json", "scripts/advise_computation_strategy.py", "scripts/validate_computation_strategy.py", "tests/test_first_principles_strategy.py", "docs/FIRST_PRINCIPLES_STRATEGY.md", "docs/assets/ai/first_principles_strategy_ladder.svg"}
          if not required.issubset(set(changed)):
              raise SystemExit(f"required feature files missing: {sorted(required - set(changed))}")

          def api(method: str, path: str, payload: dict) -> dict:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  data=json.dumps(payload).encode(), method=method,
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          tree = []
          for relative in changed:
              path = Path(relative)
              raw = path.read_bytes()
              blob = api("POST", "/git/blobs", {"content": base64.b64encode(raw).decode(), "encoding": "base64"})
              mode_row = subprocess.run(["git", "ls-files", "-s", "--", relative], text=True, capture_output=True, check=True).stdout.strip()
              mode = mode_row.split()[0] if mode_row else ("100755" if relative.startswith("scripts/") and raw.startswith(b"#!") else "100644")
              tree.append({"path": relative, "mode": mode, "type": "blob", "sha": blob["sha"]})
          for relative in deleted:
              tree.append({"path": relative, "mode": "100644", "type": "blob", "sha": null})
          created_tree = api("POST", "/git/trees", {"base_tree": parent_tree, "tree": tree})
          commit = api("POST", "/git/commits", {"message": "feat: add first-principles strategy advisor", "tree": created_tree["sha"], "parents": [parent]})
          quality = json.loads(Path("/tmp/quality-current.json").read_text(encoding="utf-8")) if Path("/tmp/quality-current.json").exists() else {}
          print(f"sha={commit['sha']}")
          print(f"parent={parent}")
          print(f"changed={len(changed)}")
          print(f"deleted={len(deleted)}")
          print(f"tests={quality.get('tests',{}).get('tests','unknown')}")
          print(f"line={quality.get('coverage',{}).get('line_percent','unknown')}")
          print(f"branch={quality.get('coverage',{}).get('branch_percent','unknown')}")
          print(f"mutation={quality.get('mutation',{}).get('killed','unknown')}/{quality.get('mutation',{}).get('total','unknown')}")
          PY

      - name: Report verified candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          PARENT_SHA: ${{ steps.candidate.outputs.parent }}
          TESTS: ${{ steps.candidate.outputs.tests }}
          LINE: ${{ steps.candidate.outputs.line }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
          MUTATION: ${{ steps.candidate.outputs.mutation }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=first-principles-candidate-ready; candidate=${CANDIDATE_SHA}; parent=${PARENT_SHA}; version=0.7.0; capability-contracts=341; runtime-core=19; schemas=19; scripts=39; visual-atlas=17; tests=${TESTS}; line-coverage=${LINE}; branch-coverage=${BRANCH}; mutation=${MUTATION}; strategy-schema=PASS; route=PASS; docs=PASS; ruff=PASS; mypy=PASS; bandit=PASS; dependency-audit=PASS; performance=PASS; deterministic-release=PASS; wheel-and-sdist=PASS; execution-boundary=PRESERVED; temporary-controls=REMOVED"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=first-principles-finalization-failed; workflow-run=${GITHUB_RUN_ID}; inspect failed step logs"
