name: Diagnose v0.7.1 overlay parts

on:
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: diagnose-v071-parts-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] apply v0.7.1 hardening' &&
      contains(github.event.issue.body, 'status=diagnose')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose exact comment payloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" > /tmp/comments.json
          python - <<'PY' > /tmp/body.txt
          import hashlib
          import json
          import re
          from pathlib import Path

          expected = {
              '00': (6353, 'd1009524b373b48ea963bec6c635eb8f34589d824adaf3a3e0144a8cb0cccd60'),
              '01': (6353, 'c052d6a3f1e0658483b7a047270bc960099122cb8efe449bb2a49b7565cfee68'),
              '02': (6353, '9005b22c5399220342e145b53163369f952a2e3601b42389615d73bf0be96edb'),
              '03': (6353, 'a000f80305dc8ae20b6bc832796a9a1daf3cd6f65b78d2101edd76756787941e'),
              '04': (6353, '05fe3f3cd9c292a54e97b413ba8dfa45b07bbb03a0ab804fd65b7903639116a9'),
              '05': (6353, 'e8efd9a7f34e36f2e7a69e020098715750f086424530bd57f48bfdd8bccf3074'),
              '06': (6353, 'd254f0a12322edb0827ca1a4d3f22a09aa8f023adae3c785494ca5c63d37c183'),
              '07': (6353, 'bc992135c28a2cc95035a2812b687a8a7c569ac05770f2988d3b41f93e9cf2bd'),
              '08': (6353, '967005e627e3d759633551edc21e66274d850f5aa13942109b317986145a7c10'),
              '09': (6353, '643166b386df907bfd4fe1429d67fc6fbfa595fd676a4066432cb15d3afb568b'),
              '10': (6353, 'e3255fa353ceeca2e00cc8948beb7c140f728436267892a3df86c2ea454122ae'),
              '11': (6353, '10c5e173ca80dfdf52ceb002e56fc11483e9ec6a9af7433a569fd8b7ccb4b518'),
              '12': (6353, '972b82200a016cf9281ccfe632f063916dda4e10c4af7c78c0de94b9a4393cab'),
              '13': (6353, '8af1bb82299f92ccf24f80623888581818abca94d68d9ca1e75605e53b111f5'),
              '14': (6353, '8a52fdd6d8780a799674f7396a17e45d181d4b3471ecd22448f5d8eb02b173c8'),
              '15': (6352, '02392b87ea25d672c83fb119803cca864e6499654d652306c640e4b751c979d8'),
          }
          rows = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          found = {}
          malformed = []
          for row in rows:
              body = row.get('body', '')
              match = re.fullmatch(r'PART (\d{2})/(\d{2})\n([A-Za-z0-9+/=]+)', body)
              if not match:
                  malformed.append(str(row.get('id')))
                  continue
              index, total, payload = match.groups()
              found.setdefault(index, []).append((row['id'], total, payload))
          print('status=diagnostic-complete')
          print('expected-parts=16')
          print(f'comment-count={len(rows)}')
          print(f'malformed-comment-ids={",".join(malformed) or "none"}')
          mismatches = 0
          for index in sorted(expected):
              entries = found.get(index, [])
              if len(entries) != 1:
                  mismatches += 1
                  print(f'part-{index}=count:{len(entries)} ids:{",".join(str(e[0]) for e in entries) or "none"}')
                  continue
              comment_id, total, payload = entries[0]
              actual_hash = hashlib.sha256(payload.encode('ascii')).hexdigest()
              expected_len, expected_hash = expected[index]
              ok = total == '16' and len(payload) == expected_len and actual_hash == expected_hash
              mismatches += int(not ok)
              pads = ','.join(str(i) for i, char in enumerate(payload) if char == '=') or 'none'
              print(f'part-{index}={"PASS" if ok else "FAIL"} id:{comment_id} len:{len(payload)} sha:{actual_hash} pads:{pads}')
          extras = sorted(set(found) - set(expected))
          print(f'extra-parts={",".join(extras) or "none"}')
          print(f'mismatches={mismatches}')
          PY
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
