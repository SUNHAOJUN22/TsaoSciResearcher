name: One-time correct Researcher six-hour harness

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  correct:
    if: >-
      github.event.issue.number == 212 &&
      github.event.comment.body == '/fix-six-hour-active-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Correct plugin and source-tree isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/one-time-six-hour-active.yml')
          text = path.read_text(encoding='utf-8')

          replacements = (
              ("/run-six-hour-active-v1", "/run-six-hour-active-v2", 3),
              (
                  "mkdir -p six-hour-evidence",
                  'mkdir -p "$RUNNER_TEMP/six-hour-evidence"',
                  2,
              ),
              (
                  'evidence_dir = Path("six-hour-evidence")',
                  'evidence_dir = Path(os.environ["RUNNER_TEMP"]) / "six-hour-evidence"',
                  2,
              ),
              (
                  'python -m pytest -q -p hypothesis.extra.pytestplugin',
                  'python -m pytest -q',
                  2,
              ),
          )
          for old, new, expected in replacements:
              observed = text.count(old)
              if observed != expected:
                  raise SystemExit(
                      f'harness source drift for {old!r}: expected {expected}, observed {observed}'
                  )
              text = text.replace(old, new)

          old_upload = 'path: six-hour-evidence/'
          if text.count(old_upload) != 2:
              raise SystemExit('upload path count drifted')
          expression = '$' + '{{ runner.temp }}'
          text = text.replace(
              old_upload,
              f'path: {expression}/six-hour-evidence/',
          )

          forbidden = (
              'mkdir -p six-hour-evidence',
              'Path("six-hour-evidence")',
              'path: six-hour-evidence/',
              '/run-six-hour-active-v1',
              '-p hypothesis.extra.pytestplugin',
          )
          remaining = [token for token in forbidden if token in text]
          if remaining:
              raise SystemExit(f'uncorrected harness tokens: {remaining}')
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/one-time-fix-six-hour-active.yml').unlink()
          PY
          git diff --check
      - name: Publish corrected harness
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: correct Researcher soak plugin and evidence isolation"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record correction result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          gh issue comment 212 --repo "$GITHUB_REPOSITORY" --body "Researcher six-hour harness correction: **${{ job.status }}**.

- published harness commit: \`${PUBLISHED_SHA:-UNPUBLISHED}\`
- next exact command: \`/run-six-hour-active-v2\`
- duplicate Hypothesis plugin registration removed; automatic discovery remains enabled
- evidence directory moved outside the audited source tree
- previous failed run contributes \`0 ns\`

No source-code, scientific, coverage, security or approval threshold was changed."
