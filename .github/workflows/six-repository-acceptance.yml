name: Seven repository acceptance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/six-repository-acceptance.yml
      - .github/acceptance/**
      - .github/workflows/acceptance-segment.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: seven-repository-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Test the regression executor, including negative controls
        run: |
          python -m pip install pytest==9.0.3
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s .github/acceptance -v
      - name: Validate seven exact repository identities
        id: plan
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          python - <<'PYTHON'
          import json, os, pathlib, re, sys
          sys.path.insert(0, '.github/acceptance')
          from regression_segment import REPOSITORIES
          if os.environ['SOURCE_REF'] != 'refs/heads/main':
              raise SystemExit('Acceptance must run from main')
          plan = json.loads(pathlib.Path('.github/acceptance/repositories.json').read_text())
          if set(plan) != set(REPOSITORIES):
              raise SystemExit('Exactly seven approved repositories are required')
          for repo, sha in plan.items():
              if not isinstance(sha, str) or not (re.fullmatch('[0-9a-f]{40}', sha) or (repo == 'TsaoSciResearcher' and sha == 'SELF')):
                  raise SystemExit('Invalid source identity')
          matrix = {'include': [{'repo': repo, 'sha': plan[repo]} for repo in REPOSITORIES]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PYTHON
  baseline:
    needs: plan
    name: baseline-${{ matrix.repo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET_REPOSITORY: SUNHAOJUN22/${{ matrix.repo }}
      TARGET_SHA: ${{ matrix.sha == 'SELF' && github.sha || matrix.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - name: Check out the exact target commit without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: SUNHAOJUN22/${{ matrix.repo }}
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source identity before installing dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p "$RUNNER_TEMP/source-evidence" "$RUNNER_TEMP/test-evidence"
          git ls-tree -r --full-tree HEAD > "$RUNNER_TEMP/source-evidence/git-tree.txt"
          git ls-remote --heads origin > "$RUNNER_TEMP/source-evidence/remote-branches.txt"
          python - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-evidence'
          record = {
              'schema': 'tsao.seven-repository-baseline/v2',
              'repository': os.environ['TARGET_REPOSITORY'],
              'sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'recorded_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'qualification': 'NOT_RUN',
              'active_test_seconds': 0,
              'scope': 'Linux baseline; not six-hour or licensed-solver qualification',
          }
          (root / 'identity.json').write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          PY
          # The processing registry currently blocks public distributions.
          # Preserve that boundary: record identity, but do not publish its source archive.
          if [ "$TARGET_REPOSITORY" != 'SUNHAOJUN22/TSAO-PROCESSING-SKILL' ]; then
            git archive --format=zip --output="$RUNNER_TEMP/source-evidence/source.zip" HEAD
            (cd "$RUNNER_TEMP/source-evidence" && sha256sum source.zip > source.sha256)
          fi
      - name: Preserve source identity independently of test success
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-${{ matrix.repo }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up Node for ResinDB
        if: matrix.repo == 'ResinDB-Pro-by-SunHJ'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Create isolated baseline environment outside source
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/baseline-env"
          echo "$RUNNER_TEMP/baseline-env/bin" >> "$GITHUB_PATH"
      - name: Install scientific display fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC'
      - name: Install the target repository's declared dependencies
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_REPOSITORY" in
            SUNHAOJUN22/AspenOps-Agent)
              python -m pip install uv==0.11.16
              uv lock --check
              uv sync --frozen --extra dev --extra agent --extra signing
              ;;
            SUNHAOJUN22/TsaoSciComputation)
              python -m pip install -e '.[validation,quality,security]'
              python -m pip check
              ;;
            SUNHAOJUN22/TSAO-PROCESSING-SKILL)
              python -m pip install --require-hashes -r requirements.lock
              python -m pip install --no-deps --no-build-isolation -e .
              python -m pip check
              ;;
            SUNHAOJUN22/ResinDB-Pro-by-SunHJ)
              npm ci
              npm ls --all
              ;;
            SUNHAOJUN22/TsaoDFT_skill)
              python -m pip install -c constraints/py312.txt -r requirements-dev.txt
              python -m pip check
              ;;
            SUNHAOJUN22/TsaoSciResearcher)
              python -m pip install -r requirements-ci.lock
              python -m pip install -e . --no-deps
              python -m pip check
              ;;
            SUNHAOJUN22/OpenDeepMind_skill)
              python -m pip install pytest==9.0.3
              ;;
            *) exit 2 ;;
          esac
      - name: Execute actual baseline gates with failure propagation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/test-evidence/baseline.log") 2>&1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          case "$TARGET_REPOSITORY" in
            SUNHAOJUN22/AspenOps-Agent)
              uv run pytest -W error::ResourceWarning --cov=aspenops_nexus --cov-branch --cov-fail-under=95 --junitxml="$RUNNER_TEMP/test-evidence/junit.xml"
              uv run ruff check .
              uv run ruff format --check .
              uv run mypy src
              uv run python scripts/verify_delivery.py
              ;;
            SUNHAOJUN22/TsaoSciComputation)
              python scripts/verify_all.py --profile core
              python scripts/verify_all.py --profile quality
              python scripts/verify_native_core.py
              ;;
            SUNHAOJUN22/TSAO-PROCESSING-SKILL)
              python scripts/run_ci.py
              ;;
            SUNHAOJUN22/ResinDB-Pro-by-SunHJ)
              export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
              test -x "$PUPPETEER_EXECUTABLE_PATH"
              export CHROME_BIN="$PUPPETEER_EXECUTABLE_PATH"
              node --test scripts/tests/validation-receipt-contract.node.mjs scripts/tests/readme-image-contract.node.mjs
              node scripts/validate-repository-unicode.mjs --write
              npm run validate:ci
              npm run audit:prod
              ;;
            SUNHAOJUN22/TsaoDFT_skill)
              python scripts/quality_gate.py --report-dir "$RUNNER_TEMP/test-evidence/dft"
              ;;
            SUNHAOJUN22/TsaoSciResearcher)
              export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
              mkdir -p artifacts
              for script in validate_unicode_integrity sync_version sync_runtime_data validate_mathematical_contracts build_readme_facts build_sbom build_validation_evidence build_test_dashboard build_research_quality_dashboard build_engineering_report generate_checksums build_capability_index; do
                python "scripts/$script.py" --check
              done
              python scripts/validate_schemas.py
              python scripts/audit_repository.py
              python scripts/validate_structure.py
              python scripts/route_task.py --self-test
              python scripts/validate_figure.py examples/figure-contract.json
              python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
              python scripts/final_acceptance_preflight.py --root . --json
              python -m tsao_researcher math --schema
              python -m tsao_researcher math --contract uncertainty-budget --language both --output artifacts/math-contract.json
              python -m mkdocs build --strict
              python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml="$RUNNER_TEMP/test-evidence/junit.xml"
              python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
              python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
              TSR_TEST_ORDER_SEED=20260806 python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin
              python -m ruff format --check scripts tsao_researcher tests .github/acceptance
              python -m ruff check scripts tsao_researcher tests .github/acceptance
              python -m mypy scripts tsao_researcher
              python -m bandit -q -lll -r scripts tsao_researcher
              python -m unittest discover -s .github/acceptance -p test_regression_segment.py -v
              python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
              python -m pip_audit --strict -r artifacts/resolved-environment.lock --format cyclonedx-json --output artifacts/resolved-environment-sbom.json
              python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
              python scripts/performance_smoke.py --json-out artifacts/performance.json
              python scripts/check_quality_baseline.py --junit "$RUNNER_TEMP/test-evidence/junit.xml"
              python scripts/package_release.py --out dist-a
              python scripts/package_release.py --out dist-b
              cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
              python scripts/validate_release.py
              python -m build --sdist --wheel --outdir dist-python
              python scripts/validate_distribution.py dist-python
              ;;
            SUNHAOJUN22/OpenDeepMind_skill)
              python open-deep-mind/first-philosophy/scripts/validate_module.py
              python open-deep-mind/first-principles/scripts/validate_module.py
              python open-deep-mind/triz/scripts/validate_triz_module.py
              python open-deep-mind/evals/scripts/validate_evals.py
              python open-deep-mind/scripts/validate_repository.py .
              python open-deep-mind/scripts/validate_ledger.py open-deep-mind/assets/example-ledger.json
              python open-deep-mind/triz/scripts/lookup_matrix.py --improve 1 --worsen 3 --json
              python open-deep-mind/triz/scripts/lookup_standard_solution.py 1.2.1 --json
              python -m unittest discover -s open-deep-mind/tests -p 'test_*.py' -v
              PYTHONPYCACHEPREFIX="$RUNNER_TEMP/opendeep-pycache" python -m compileall -q open-deep-mind
              python -m pytest -q --import-mode=importlib open-deep-mind/tests --junitxml="$RUNNER_TEMP/test-evidence/junit.xml"
              git diff --check
              ;;
            *) exit 2 ;;
          esac
          git diff --exit-code
          git diff --cached --exit-code
      - name: Record final job outcome without manufacturing qualification
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'test-evidence'
          output.mkdir(parents=True, exist_ok=True)
          (output / 'job-result.json').write_text(json.dumps({
              'repository': os.environ['TARGET_REPOSITORY'],
              'sha': os.environ['TARGET_SHA'],
              'job_status': os.environ['JOB_STATUS'],
              'six_hour_status': 'NOT_RUN',
              'active_test_seconds': 0,
              'note': 'Baseline outcome only. See logs; no six-hour or commercial-solver claim.',
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Preserve baseline success or failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baseline-${{ matrix.repo }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-evidence
          if-no-files-found: error
          retention-days: 14

  phase-one:
    needs: [plan, baseline]
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/acceptance-segment.yml
    with:
      repository: ${{ matrix.repo }}
      sha: ${{ matrix.sha == 'SELF' && github.sha || matrix.sha }}
      phase: 1

  phase-two:
    needs: [plan, phase-one]
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/acceptance-segment.yml
    with:
      repository: ${{ matrix.repo }}
      sha: ${{ matrix.sha == 'SELF' && github.sha || matrix.sha }}
      phase: 2

  verify-six-hours:
    if: always()
    needs: [plan, baseline, phase-one, phase-two]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Retrieve the original segment receipts and test witnesses
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: regression-segment-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/all-segments
          merge-multiple: false
      - name: Independently verify fourteen segments and live source identities
        if: always()
        run: |
          python .github/acceptance/verify_segments.py \
            --root "$RUNNER_TEMP/all-segments" \
            --plan .github/acceptance/repositories.json \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --orchestration-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/six-hour-summary.json"
      - name: Preserve an explicit complete or incomplete conclusion
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: six-hour-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/six-hour-summary.json
          if-no-files-found: error
          retention-days: 14
