name: Diagnose issue event delivery

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report issue event
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "issue-event-probe=PASS; run=${GITHUB_RUN_ID}; actor=${GITHUB_ACTOR}; sha=${GITHUB_SHA}"
