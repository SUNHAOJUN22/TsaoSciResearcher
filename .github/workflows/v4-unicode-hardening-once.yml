name: V4 whole-tree Unicode hardening once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: v4-unicode-hardening-once
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/run-v4-unicode-hardening')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check
      - name: Build strict Unicode implementation and acceptance bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          unicode_script = r'''#!/usr/bin/env python3
"""Deterministic whole-tree Unicode integrity gate.

The gate validates repository-owned text only. It never repairs semantic
mojibake or fabricates content. ``--normalize --write`` is restricted to
mechanical UTF-8 BOM removal, NFC normalization, LF conversion, and exactly
one terminal LF before the resulting tree is audited fail closed.
"""

from __future__ import annotations

import argparse
import json
import os
import stat
import subprocess
import tempfile
import unicodedata
from pathlib import Path
from typing import Any

SCHEMA = "tsao.unicode-integrity/v1"
TEXT_EXTENSIONS = frozenset(
    {
        ".cfg",
        ".cjs",
        ".css",
        ".csv",
        ".html",
        ".ini",
        ".js",
        ".jsx",
        ".json",
        ".jsonl",
        ".md",
        ".mdx",
        ".mjs",
        ".ps1",
        ".py",
        ".pyi",
        ".scss",
        ".sh",
        ".sql",
        ".svg",
        ".toml",
        ".ts",
        ".tsx",
        ".tsv",
        ".txt",
        ".xml",
        ".yaml",
        ".yml",
    }
)
EXCLUDED_PARTS = frozenset(
    {
        ".git",
        ".hypothesis",
        ".mypy_cache",
        ".pytest_cache",
        ".ruff_cache",
        ".tsao-research",
        "__pycache__",
        "artifacts",
        "build",
        "dist",
        "site",
    }
)
CATEGORY_KEYS = (
    "unsafe_paths",
    "invalid_utf8",
    "replacement_characters",
    "bom_files",
    "line_ending_failures",
    "nfc_failures",
    "control_character_failures",
    "mojibake_failures",
)


def _marker(codepoints: tuple[int, ...]) -> str:
    return "".join(chr(value) for value in codepoints)


def mojibake_markers() -> tuple[tuple[str, str], ...]:
    """Build suspect tokens without embedding corrupt glyphs in source."""

    return (
        ("latin1-replacement", _marker((0x00EF, 0x00BF, 0x00BD))),
        ("smart-apostrophe", _marker((0x00E2, 0x20AC, 0x2122))),
        ("smart-quote", _marker((0x00E2, 0x20AC, 0x0153))),
        ("utf8-cjk-wen", _marker((0x00E6, 0x2013, 0x2021))),
        ("utf8-cjk-zhong", _marker((0x00E4, 0x00B8, 0x00AD))),
        ("utf8-cjk-tu", _marker((0x00E5, 0x203A, 0x00BE))),
        ("gbk-replacement", _marker((0x951F, 0x65A4, 0x62F7))),
        ("debug-fill-hot", _marker((0x70EB, 0x70EB, 0x70EB))),
        ("debug-fill-tun", _marker((0x5C6F, 0x5C6F, 0x5C6F))),
        ("latin1-degree", _marker((0x00C2, 0x00B0))),
    )


def _safe_relative(root: Path, path: Path) -> str:
    resolved_root = root.resolve()
    resolved = path.resolve()
    try:
        relative = resolved.relative_to(resolved_root)
    except ValueError as exc:
        raise ValueError(f"path escapes repository root: {path}") from exc
    return relative.as_posix()


def _tracked_paths(root: Path) -> list[Path]:
    try:
        result = subprocess.run(
            ["git", "-C", str(root), "ls-files", "-z"],
            check=True,
            capture_output=True,
            timeout=60,
        )
    except (OSError, subprocess.SubprocessError):
        paths = [path for path in root.rglob("*") if path.is_file()]
    else:
        paths = [root / raw.decode("utf-8", errors="strict") for raw in result.stdout.split(b"\0") if raw]
    selected: list[Path] = []
    for path in paths:
        try:
            relative = path.relative_to(root)
        except ValueError:
            continue
        if any(part in EXCLUDED_PARTS or part.endswith(".egg-info") for part in relative.parts):
            continue
        if path.suffix.casefold() not in TEXT_EXTENSIONS:
            continue
        selected.append(path)
    return sorted(selected, key=lambda item: item.relative_to(root).as_posix())


def text_files(root: Path, *, output: Path | None = None) -> list[Path]:
    root = root.resolve()
    excluded = output.resolve() if output is not None else None
    return [path for path in _tracked_paths(root) if excluded is None or path.resolve() != excluded]


def _atomic_write_bytes(path: Path, data: bytes, mode: int) -> None:
    path.parent.mkdir(parents=True, exist_ok=True)
    with tempfile.NamedTemporaryFile("wb", dir=path.parent, delete=False) as stream:
        stream.write(data)
        temporary = Path(stream.name)
    os.chmod(temporary, stat.S_IMODE(mode))
    os.replace(temporary, path)


def normalize_file(path: Path) -> bool:
    if path.is_symlink() or not path.is_file():
        raise ValueError(f"text path is missing, unsafe, or not regular: {path}")
    original = path.read_bytes()
    text = original.decode("utf-8", errors="strict")
    if text.startswith(chr(0xFEFF)):
        text = text[1:]
    normalized = unicodedata.normalize("NFC", text.replace("\r\n", "\n").replace("\r", "\n"))
    rendered = (normalized.rstrip("\n") + "\n").encode("utf-8")
    if rendered == original:
        return False
    _atomic_write_bytes(path, rendered, path.stat().st_mode)
    return True


def _append(categories: dict[str, list[dict[str, str]]], key: str, path: str, detail: str) -> None:
    categories[key].append({"path": path, "detail": detail})


def audit_repository(root: Path, *, output: Path | None = None) -> dict[str, Any]:
    root = root.resolve()
    categories = {key: [] for key in CATEGORY_KEYS}
    paths = text_files(root, output=output)
    for path in paths:
        try:
            relative = _safe_relative(root, path)
        except ValueError as exc:
            _append(categories, "unsafe_paths", str(path), str(exc))
            continue
        if path.is_symlink() or not path.is_file():
            _append(categories, "unsafe_paths", relative, "tracked text path is not a regular file")
            continue
        data = path.read_bytes()
        if data.startswith(b"\xef\xbb\xbf"):
            _append(categories, "bom_files", relative, "UTF-8 BOM is forbidden")
        if b"\r" in data:
            _append(categories, "line_ending_failures", relative, "CR or CRLF line endings are forbidden")
        if not data.endswith(b"\n"):
            _append(categories, "line_ending_failures", relative, "text file must end with LF")
        elif data.endswith(b"\n\n"):
            _append(categories, "line_ending_failures", relative, "text file must end with exactly one LF")
        try:
            text = data.decode("utf-8", errors="strict")
        except UnicodeDecodeError as exc:
            _append(categories, "invalid_utf8", relative, f"strict UTF-8 decode failed at byte {exc.start}")
            continue
        if chr(0xFFFD) in text:
            _append(categories, "replacement_characters", relative, "Unicode replacement character is forbidden")
        if unicodedata.normalize("NFC", text) != text:
            _append(categories, "nfc_failures", relative, "text is not NFC-normalized")
        controls = sorted({f"U+{ord(character):04X}" for character in text if unicodedata.category(character) == "Cc" and character not in {"\n", "\t"}})
        if controls:
            _append(categories, "control_character_failures", relative, ", ".join(controls))
        found = [label for label, token in mojibake_markers() if token in text]
        if found:
            _append(categories, "mojibake_failures", relative, ", ".join(found))
    for values in categories.values():
        values.sort(key=lambda item: (item["path"], item["detail"]))
    failures = [
        {"category": key, **item}
        for key in CATEGORY_KEYS
        for item in categories[key]
    ]
    return {
        "schema_version": SCHEMA,
        "verdict": "PASS" if not failures else "FAIL",
        "scanned_text_files": len(paths),
        **categories,
        "failures": failures,
    }


def render_report(report: dict[str, Any]) -> str:
    return json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False) + "\n"


def _atomic_write_text(path: Path, text: str) -> None:
    path.parent.mkdir(parents=True, exist_ok=True)
    with tempfile.NamedTemporaryFile("w", encoding="utf-8", newline="\n", dir=path.parent, delete=False) as stream:
        stream.write(text)
        temporary = Path(stream.name)
    os.replace(temporary, path)


def main(argv: list[str] | None = None) -> int:
    parser = argparse.ArgumentParser(description=__doc__)
    parser.add_argument("--root", type=Path, default=Path(__file__).resolve().parents[1])
    parser.add_argument("--output", type=Path)
    mode = parser.add_mutually_exclusive_group(required=True)
    mode.add_argument("--write", action="store_true")
    mode.add_argument("--check", action="store_true")
    parser.add_argument("--normalize", action="store_true")
    args = parser.parse_args(argv)
    root = args.root.resolve()
    output = (args.output or root / "reports" / "UNICODE_INTEGRITY_REPORT.json").resolve()
    if args.normalize and not args.write:
        parser.error("--normalize is only valid with --write")
    normalized = 0
    if args.normalize:
        for path in text_files(root, output=output):
            normalized += int(normalize_file(path))
    report = audit_repository(root, output=output)
    rendered = render_report(report)
    if args.write:
        _atomic_write_text(output, rendered)
    else:
        if not output.is_file() or output.is_symlink():
            raise SystemExit(f"Unicode report is missing or unsafe: {output}")
        if output.read_text(encoding="utf-8", errors="strict") != rendered:
            raise SystemExit("Unicode report is stale; run with --write")
    print(rendered, end="")
    if args.normalize:
        print(f"normalized_text_files={normalized}")
    return 0 if report["verdict"] == "PASS" else 1


if __name__ == "__main__":
    raise SystemExit(main())
'''
