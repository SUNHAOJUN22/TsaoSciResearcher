name: Finalize verified v0.6.0 clean main

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: finalize-v060-fixed-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  finalize:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] finalize v0.6.0 fixed main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct checksum-bound payload and clean transport
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import importlib.util
          from pathlib import Path

          root = Path.cwd().resolve()
          source = root / "scripts/finalize_v060_ci.py"
          spec = importlib.util.spec_from_file_location("finalize_v060_ci", source)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load canonical finalizer")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          original_decode = base64.b64decode

          def clean_decode(data, altchars=None, validate=False):
              if isinstance(data, str):
                  data = "".join(data.split())
              else:
                  data = b"".join(data.split())
              return original_decode(data, altchars=altchars, validate=validate)

          module.base64.b64decode = clean_decode
          module.main()
          (root / "scripts/finalize_v060_ci_v3.py").unlink(missing_ok=True)
          PY
          git status --short

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact validation and distribution toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Regenerate and verify repository artifacts
        run: |
          python scripts/sync_version.py --write
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          python -m tsao_researcher --version
          python -m tsao_researcher quality examples/scientific-quality-check.json
          mkdocs build --strict

      - name: Create local candidate commit
        id: candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: release v0.6.0 research reproducibility hardening'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Complete regression coverage and order independence
        run: |
          mkdir -p artifacts
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          TSR_TEST_ORDER_SEED=20260724 python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin

      - name: Static type source and dependency security
        run: |
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip freeze --all | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict --format cyclonedx-json --output artifacts/resolved-environment-sbom.json

      - name: Mutation performance quality and distributions
        run: |
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
          python scripts/record_quality_history.py --source-commit "${{ steps.candidate.outputs.sha }}" --workflow-run-id "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT" --evidence-date "$(date -u +%F)"
          python scripts/build_validation_evidence.py --write --attested --out artifacts/VALIDATION_EVIDENCE.json --source-commit "${{ steps.candidate.outputs.sha }}" --publication-parent "${{ steps.candidate.outputs.sha }}" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --evidence-date "$(date -u +%F)"
          python scripts/build_publication_attestation.py --commit "${{ steps.candidate.outputs.sha }}" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          VERSION="$(tr -d '\r\n' < VERSION)"
          cmp "dist-a/TsaoSciResearcher-v${VERSION}.zip" "dist-b/TsaoSciResearcher-v${VERSION}.zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python

      - name: Upload final evidence before publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v060-fixed-final-${{ steps.candidate.outputs.sha }}
          path: |
            artifacts
            docs/VALIDATION_EVIDENCE.json
            docs/QUALITY_HISTORY.json
            docs/SBOM.cdx.json
            docs/engineering-audit-report.pdf
            docs/test-dashboard.html
            docs/test-dashboard.svg
            docs/research-quality-dashboard.html
            docs/research-quality-dashboard.svg
            SHA256SUMS
            dist-a
            dist-python
            site
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified candidate directly to main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${{ steps.candidate.outputs.sha }}"

      - name: Report workflow outcome
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "fixed v0.6.0 finalizer status=${JOB_STATUS}; run=${GITHUB_RUN_ID}; attempt=${GITHUB_RUN_ATTEMPT}; candidate=${CANDIDATE_SHA:-not-created}"
          if [ "$JOB_STATUS" = success ]; then
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi
