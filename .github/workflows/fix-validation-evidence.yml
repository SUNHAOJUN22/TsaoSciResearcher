name: Build verified flagship clean-tree patch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: build-flagship-clean-tree-patch
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  verify-and-export:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] finalize flagship README' && github.event.comment.body == 'TSR_BUILD_FLAGSHIP_PATCH'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact validation toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Remove one-shot controls and regenerate deterministic evidence
        run: |
          rm -f .github/workflows/fix-validation-evidence.yml
          rm -f .github/workflows/finalize-release-hygiene.yml
          python scripts/sync_version.py --write
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write

      - name: Validate repository documentation and generated contracts
        run: |
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          mkdocs build --strict

      - name: Full regression coverage and order independence
        run: |
          mkdir -p artifacts
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          TSR_TEST_ORDER_SEED=20260728 python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin

      - name: Static type security mutation and performance gates
        run: |
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip_audit --strict -r requirements-ci.lock
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py

      - name: Deterministic source and Python distribution gates
        run: |
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          VERSION="$(tr -d '\r\n' < VERSION)"
          cmp "dist-a/TsaoSciResearcher-v${VERSION}.zip" "dist-b/TsaoSciResearcher-v${VERSION}.zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python

      - name: Build checksum-bound final-tree patch
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          base_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          changed = sorted(
              line for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=ACMRTUXB", "HEAD"], text=True
              ).splitlines() if line
          )
          deleted = sorted(
              line for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=D", "HEAD"], text=True
              ).splitlines() if line
          )
          if not changed or not deleted:
              raise SystemExit(f"expected changed and deleted paths, got changed={changed}, deleted={deleted}")
          required_deleted = {
              ".github/workflows/fix-validation-evidence.yml",
              ".github/workflows/finalize-release-hygiene.yml",
          }
          if not required_deleted.issubset(deleted):
              raise SystemExit(f"temporary workflow deletions missing: {sorted(required_deleted - set(deleted))}")

          records = []
          output = root / "artifacts/final-tree-patch.zip"
          output.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for relative in changed:
                  pure = PurePosixPath(relative)
                  if pure.is_absolute() or any(part in {"", ".", ".."} for part in pure.parts):
                      raise SystemExit(f"unsafe changed path: {relative}")
                  path = root / relative
                  data = path.read_bytes()
                  mode_result = subprocess.run(
                      ["git", "ls-files", "-s", "--", relative], text=True, capture_output=True, check=True
                  ).stdout.strip()
                  mode = mode_result.split()[0] if mode_result else "100644"
                  records.append(
                      {
                          "path": relative,
                          "mode": mode,
                          "size": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                      }
                  )
                  archive.writestr(f"files/{relative}", data)
              manifest = {
                  "schema_version": "1.0",
                  "base_commit": base_commit,
                  "changed": records,
                  "deleted": deleted,
              }
              archive.writestr(
                  "manifest.json",
                  json.dumps(manifest, ensure_ascii=False, sort_keys=True, indent=2).encode("utf-8") + b"\n",
              )
          print(f"patch={output} changed={len(changed)} deleted={len(deleted)}")
          PY

      - name: Upload verified patch and gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flagship-clean-tree-${{ github.run_id }}
          path: |
            artifacts/final-tree-patch.zip
            artifacts/junit.xml
            artifacts/coverage.json
            artifacts/mutation-results.json
            artifacts/performance.json
            dist-a
            dist-python
          if-no-files-found: error
          retention-days: 30

      - name: Report verified patch ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=verified-clean-tree-patch-ready; workflow-run=${GITHUB_RUN_ID}; workflow-attempt=${GITHUB_RUN_ATTEMPT}; artifact=flagship-clean-tree-${GITHUB_RUN_ID}; repository=PASS; docs=PASS; tests=PASS; coverage=PASS; order=PASS; ruff=PASS; mypy=PASS; bandit=PASS; dependency-audit=PASS; mutation=18/18; performance=PASS; deterministic-release=PASS; distributions=PASS; temporary-workflows=REMOVED-IN-PATCH"

      - name: Report failed patch build
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=verified-patch-build-failed; workflow-run=${GITHUB_RUN_ID}; workflow-attempt=${GITHUB_RUN_ATTEMPT}; inspect failed step logs"
