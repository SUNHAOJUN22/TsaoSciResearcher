name: Repair deterministic validation evidence

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: repair-validation-evidence-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  repair:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] finalize flagship README' && github.event.comment.body == 'TSR_FIX_VALIDATION_READY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Regenerate final-tree evidence without the one-shot workflow
        run: |
          rm .github/workflows/fix-validation-evidence.yml
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/generate_checksums.py --write
          python scripts/build_validation_evidence.py --check
          python scripts/generate_checksums.py --check
          python scripts/audit_repository.py
          python scripts/validate_structure.py

      - name: Commit and publish evidence repair
        id: repair_commit
        run: |
          git checkout HEAD -- .github/workflows/fix-validation-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/VALIDATION_EVIDENCE.json SHA256SUMS
          git diff --cached --check
          git commit -m 'chore: synchronize final validation evidence'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"

      - name: Report evidence repair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPAIR_SHA: ${{ steps.repair_commit.outputs.sha }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=validation-fixed-awaiting-workflow-cleanup; candidate=${REPAIR_SHA}; validation-evidence=PASS; checksums=PASS"

      - name: Report repair failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=validation-repair-failed; workflow-run=${GITHUB_RUN_ID}; inspect Actions logs"
