name: Diagnose deterministic validation evidence

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: diagnose-validation-evidence-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  diagnose:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] finalize flagship README' && github.event.comment.body == 'TSR_DIAGNOSE_VALIDATION_V2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Run evidence commands one by one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set +e
          rm .github/workflows/fix-validation-evidence.yml
          commands=(
            'python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"'
            'python scripts/generate_checksums.py --write'
            'python scripts/build_validation_evidence.py --check'
            'python scripts/generate_checksums.py --check'
            'python scripts/audit_repository.py'
            'python scripts/validate_structure.py'
          )
          stage=0
          for command in "${commands[@]}"; do
            stage=$((stage + 1))
            bash -lc "$command" > /tmp/validation-command.log 2>&1
            rc=$?
            if [ "$rc" -ne 0 ]; then
              {
                echo "status=validation-diagnostic-failed"
                echo
                echo "stage=${stage}"
                echo "command=${command}"
                echo "workflow-run=${GITHUB_RUN_ID}"
                echo
                echo '```text'
                tail -n 180 /tmp/validation-command.log | sed 's/`/\`/g'
                echo '```'
              } > /tmp/issue-body.md
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.md
              exit "$rc"
            fi
          done
          {
            echo "status=validation-diagnostic-pass"
            echo "stages=6/6"
            echo "workflow-run=${GITHUB_RUN_ID}"
            echo "validation-evidence=PASS"
            echo "checksums=PASS"
            echo "repository-audit=PASS"
            echo "structure=PASS"
          } > /tmp/issue-body.md
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.md
