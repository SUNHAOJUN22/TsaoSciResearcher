name: V19 generate Unicode integrity report

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v19-generate-unicode-report.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Generate report for the final tree without this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm --cached .github/workflows/v19-generate-unicode-report.yml
          python scripts/validate_unicode_integrity.py --write
          python scripts/validate_unicode_integrity.py --check
      - name: Create detached report blob and publish locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 reports/UNICODE_INTEGRITY_REPORT.json)"
          blob_sha="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/git/blobs" \
            -f encoding=base64 \
            -f content="$encoded" \
            --jq .sha)"
          gh issue create \
            --title 'Temporary Researcher V19 Unicode report blob ${{ github.run_id }}' \
            --body "run=${{ github.run_id }} commit=${{ github.sha }} unicode_report_blob=${blob_sha}"
