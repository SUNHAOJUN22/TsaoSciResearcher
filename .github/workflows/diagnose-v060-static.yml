name: Diagnose v0.6.0 static gates

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] diagnose v0.6.0 static'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and clean candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path.cwd().resolve()
          spec = importlib.util.spec_from_file_location('finalize_v060_ci', root / 'scripts/finalize_v060_ci.py')
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load finalizer')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.main()
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Run static gates one by one
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          python - <<'PY'
          from __future__ import annotations
          import subprocess
          from pathlib import Path

          commands = [
              "python -m ruff format --check scripts tsao_researcher tests",
              "python -m ruff check scripts tsao_researcher tests",
              "python -m mypy scripts tsao_researcher",
              "python -m bandit -q -lll -r scripts tsao_researcher",
              "python -m pip freeze --all",
              "python -m pip_audit --strict --format cyclonedx-json --output artifacts/resolved-environment-sbom.json",
          ]
          lines = []
          status = 0
          for index, command in enumerate(commands, 1):
              proc = subprocess.run(command, shell=True, text=True, capture_output=True)
              lines.append(f"[{index:02d}] rc={proc.returncode} {command}")
              if proc.stdout:
                  lines.extend(proc.stdout.rstrip().splitlines()[-40:])
              if proc.stderr:
                  lines.extend(proc.stderr.rstrip().splitlines()[-40:])
              if proc.returncode:
                  status = proc.returncode
                  lines.append("STATIC_DIAGNOSTIC=FAIL")
                  break
          else:
              lines.append("STATIC_DIAGNOSTIC=PASS")
          Path('/tmp/v060-static-diagnostic.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          raise SystemExit(status)
          PY

      - name: Report exact static result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BODY="$(tail -n 90 /tmp/v060-static-diagnostic.txt | sed 's/`/\\`/g')"
          gh issue comment "$ISSUE_NUMBER" --body "\`\`\`text
          ${BODY}
          \`\`\`"
          if grep -q '^STATIC_DIAGNOSTIC=PASS$' /tmp/v060-static-diagnostic.txt; then
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi
