name: Checksum diagnosis v6

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] checksum diagnosis v6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Recompute and report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          rm .github/workflows/checksum-diagnose-v6.yml
          actual="$(cat SHA256SUMS)"
          python scripts/generate_checksums.py --write
          expected="$(cat SHA256SUMS)"
          count="$(python -c 'from scripts.generate_checksums import source_files; print(len(source_files()))')"
          printf 'status=diagnosed\nworkflow-run=%s\nactual=%s\nexpected=%s\nsource-files=%s\n' "$GITHUB_RUN_ID" "$actual" "$expected" "$count" > /tmp/issue-body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.txt
