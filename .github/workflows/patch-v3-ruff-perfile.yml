name: Patch v3 Ruff per-file policy

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] patch v3 Ruff per-file policy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Inject narrow persistent Ruff policy into v3
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/finalize-first-principles-070-v3.yml')
          text = path.read_text(encoding='utf-8')
          anchor = '          router_path = Path("tests/test_router.py")\n'
          insertion = '''          pyproject_path = Path("pyproject.toml")
          pyproject_text = pyproject_path.read_text(encoding="utf-8")
          per_file = '[tool.ruff.lint.per-file-ignores]\\n"tests/test_import_isolation.py" = ["B018"]\\n\\n'
          if "[tool.ruff.lint.per-file-ignores]" not in pyproject_text:
              if "[tool.ruff.format]" not in pyproject_text:
                  raise SystemExit("Ruff format section missing")
              pyproject_text = pyproject_text.replace(
                  "[tool.ruff.format]", per_file + "[tool.ruff.format]", 1
              )
          pyproject_path.write_text(pyproject_text, encoding="utf-8")

'''
          if insertion not in text:
              if anchor not in text:
                  raise SystemExit('v3 injection anchor missing')
              text = text.replace(anchor, insertion + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Create remote patch commit object
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          parent_tree = subprocess.check_output(
              ['git', 'show', '-s', '--format=%T', parent], text=True
          ).strip()
          raw = Path('.github/workflows/finalize-first-principles-070-v3.yml').read_bytes()

          def api(endpoint, payload):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{endpoint}',
                  data=json.dumps(payload).encode('utf-8'),
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          blob = api('/git/blobs', {
              'content': base64.b64encode(raw).decode('ascii'),
              'encoding': 'base64',
          })
          tree = api('/git/trees', {
              'base_tree': parent_tree,
              'tree': [{
                  'path': '.github/workflows/finalize-first-principles-070-v3.yml',
                  'mode': '100644',
                  'type': 'blob',
                  'sha': blob['sha'],
              }],
          })
          commit = api('/git/commits', {
              'message': 'ci: persist narrow Ruff policy in v3 candidate',
              'tree': tree['sha'],
              'parents': [parent],
          })
          print(f"candidate={commit['sha']}")
          print(f"parent={parent}")
          PY

      - name: Report patch candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE: ${{ steps.commit.outputs.candidate }}
          PARENT: ${{ steps.commit.outputs.parent }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=patch-candidate-ready
          candidate=${CANDIDATE}
          parent=${PARENT}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=patch-failed
          workflow-run=${GITHUB_RUN_ID}"
