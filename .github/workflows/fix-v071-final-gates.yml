name: Fix v0.7.1 final gates

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: fix-v071-final-gates
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] fix v0.7.1 final gates' &&
      contains(github.event.issue.body, 'status=ready')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Patch deterministic lint and candidate-tree handling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-v071.yml')
          text = path.read_text(encoding='utf-8')

          format_line = "          python -m ruff format scripts/package_release.py scripts/validate_distribution.py tsao_researcher/capabilities.py tsao_researcher/receipts.py tsao_researcher/router.py\n"
          fix_line = "          python -m ruff check --fix tests/test_v071_hardening.py tsao_researcher/io.py\n"
          assert text.count(format_line) == 1
          assert fix_line not in text
          text = text.replace(format_line, format_line + fix_line)

          bad_commit_prep = "          git checkout \"$GITHUB_SHA\" -- .github/workflows\n          rm -f .github/workflows/apply-v071.yml\n"
          good_commit_prep = "          git checkout \"$GITHUB_SHA\" -- .github/workflows\n"
          assert text.count(bad_commit_prep) == 1
          text = text.replace(bad_commit_prep, good_commit_prep)

          tree_line = "          tree=[{'path':path,'mode':'100644','type':'blob','sha':sha} for path,sha in sorted(blobs.items())]\n"
          delete_line = "          tree.append({'path':'.github/workflows/apply-v071.yml','mode':'100644','type':'blob','sha':None})\n"
          assert text.count(tree_line) == 1
          assert delete_line not in text
          text = text.replace(tree_line, tree_line + delete_line)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/fix-v071-final-gates.yml
          git -c core.whitespace=-blank-at-eof diff --check
          git config user.name 'SUNHAOJUN22 hardening automation'
          git config user.email 'SUNHAOJUN22@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close v0.7.1 lint and candidate gates'
          git push origin HEAD:main
          printf 'status=fixed\ncommit=%s\nfailed-run=30711184288\n' "$(git rev-parse HEAD)" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
