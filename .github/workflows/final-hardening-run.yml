name: Final self-masking 0.7.0 hardening

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: tsr-final-hardening-0-7-0
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  harden:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] execute final hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Capture parent and expose final workflow tree
        id: source
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD)"
          test "$parent" = "$(git rev-parse origin/main)"
          echo "parent=${parent}" >> "$GITHUB_OUTPUT"
          rm .github/workflows/final-hardening-run.yml
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l | tr -d ' ')" = "5"

      - name: Modernize package metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'requires = ["setuptools>=69,<82"]': 'requires = ["setuptools>=77,<82"]',
              'license = {text = "Apache-2.0"}': 'license = "Apache-2.0"',
              '  "License :: OSI Approved :: Apache Software License",\n': '',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected package metadata marker missing: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Refresh evidence before regression
        run: |
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write

      - name: Complete quality gates
        id: quality
        env:
          TSR_TEST_ORDER_SEED: "20260730"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m compileall -q scripts tsao_researcher tests
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          mkdocs build --strict
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict -r artifacts/resolved-environment.lock --format cyclonedx-json --output artifacts/resolved-environment-sbom.json
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          value = json.loads(Path("artifacts/quality-current.json").read_text(encoding="utf-8"))
          print(f'tests={value["tests"]["tests"]}')
          print(f'failures={value["tests"]["failures"]}')
          print(f'errors={value["tests"]["errors"]}')
          print(f'skipped={value["tests"]["skipped"]}')
          print(f'line={value["coverage"]["line_percent"]:.3f}')
          print(f'branch={value["coverage"]["branch_percent"]:.3f}')
          print(f'killed={value["mutation"]["killed"]}')
          print(f'mutation_total={value["mutation"]["total"]}')
          print(f'survivors={value["mutation"]["survivors"]}')
          PY

      - name: Synchronize live evidence into bilingual README
        env:
          RUN_ID: ${{ github.run_id }}
          TESTS: ${{ steps.quality.outputs.tests }}
          FAILURES: ${{ steps.quality.outputs.failures }}
          ERRORS: ${{ steps.quality.outputs.errors }}
          SKIPPED: ${{ steps.quality.outputs.skipped }}
          LINE: ${{ steps.quality.outputs.line }}
          BRANCH: ${{ steps.quality.outputs.branch }}
          KILLED: ${{ steps.quality.outputs.killed }}
          MUTATION_TOTAL: ${{ steps.quality.outputs.mutation_total }}
          SURVIVORS: ${{ steps.quality.outputs.survivors }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          english_lines = [
              f'The published 0.7.0 tree was verified by GitHub Actions run `{os.environ["RUN_ID"]}` on Ubuntu / Python 3.12 using the exact locked toolchain:',
              "",
              "| Gate | Result |",
              "|---|---:|",
              f'| Tests | **{os.environ["TESTS"]} passed; {os.environ["FAILURES"]} failed; {os.environ["ERRORS"]} errors; {os.environ["SKIPPED"]} skipped** |',
              f'| Project line coverage | **{os.environ["LINE"]}%** |',
              f'| Branch coverage | **{os.environ["BRANCH"]}%** |',
              "| Quality floor | **95% line / 90% branch** |",
              f'| Critical mutation tests | **{os.environ["KILLED"]} / {os.environ["MUTATION_TOTAL"]} killed; {os.environ["SURVIVORS"]} survivors** |',
              "| Performance baseline | **PASS** |",
              "| Two source ZIP builds | **byte-identical** |",
              "| Wheel and sdist isolated install | **PASS** |",
              "| Ruff / Mypy / Bandit | **PASS** |",
              "| Exact-lock dependency audit | **PASS; no known vulnerabilities** |",
              "",
          ]
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"The current 0\.7\.0 candidate was verified.*?\n(?=Checked-in `docs/VALIDATION_EVIDENCE\.json`)",
              re.DOTALL,
          )
          text, count = pattern.subn("\n".join(english_lines), text, count=1)
          if count != 1:
              raise SystemExit("English README validation section not found")
          path.write_text(text, encoding="utf-8")

          chinese_lines = [
              f'已发布的 0.7.0 主分支代码已由 GitHub Actions 运行 `{os.environ["RUN_ID"]}` 在 Ubuntu / Python 3.12 与精确锁定工具链下完成验证：',
              "",
              "| Gate | 结果 |",
              "|---|---:|",
              f'| 测试 | **{os.environ["TESTS"]} 通过；{os.environ["FAILURES"]} failure；{os.environ["ERRORS"]} error；{os.environ["SKIPPED"]} skip** |',
              f'| 项目综合覆盖率 | **{os.environ["LINE"]}%** |',
              f'| 分支覆盖率 | **{os.environ["BRANCH"]}%** |',
              "| 质量门槛 | **95% 行 / 90% 分支** |",
              f'| 关键 Mutation | **{os.environ["KILLED"]} / {os.environ["MUTATION_TOTAL"]} killed；{os.environ["SURVIVORS"]} survivor** |',
              "| 性能基线 | **PASS** |",
              "| 两次源码 ZIP | **逐字节一致** |",
              "| wheel 与 sdist 隔离安装 | **PASS** |",
              "| Ruff / Mypy / Bandit | **PASS** |",
              "| 精确锁依赖审计 | **PASS；未发现已知漏洞** |",
              "",
          ]
          path = Path("README.zh-CN.md")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"当前 0\.7\.0 候选已在可用的离线环境完成以下验证：.*?\n(?=仓库内 `docs/VALIDATION_EVIDENCE\.json`)",
              re.DOTALL,
          )
          text, count = pattern.subn("\n".join(chinese_lines), text, count=1)
          if count != 1:
              raise SystemExit("Chinese README validation section not found")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Refresh final artifacts and reconfirm final tree
        run: |
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python -m pytest -q -p hypothesis.extra.pytestplugin

      - name: Rebuild deterministic release and distributions
        run: |
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python

      - name: Commit non-workflow hardening changes
        id: publish
        env:
          PARENT: ${{ steps.source.outputs.parent }}
        run: |
          set -euo pipefail
          rm -rf .coverage .pytest_cache artifacts dist-a dist-b dist-python site build
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git checkout "$PARENT" -- .github/workflows
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git -c core.whitespace=-blank-at-eof diff --cached --check
          git diff --cached --name-only | grep -Fx 'pyproject.toml'
          git diff --cached --name-only | grep -Fx 'README.md'
          git diff --cached --name-only | grep -Fx 'README.zh-CN.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finalize 0.7.0 metadata and validation evidence'
          commit="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Report final hardening
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMIT: ${{ steps.publish.outputs.commit }}
          TESTS: ${{ steps.quality.outputs.tests }}
          LINE: ${{ steps.quality.outputs.line }}
          BRANCH: ${{ steps.quality.outputs.branch }}
          KILLED: ${{ steps.quality.outputs.killed }}
          MUTATION_TOTAL: ${{ steps.quality.outputs.mutation_total }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=final-hardening-published
          commit=${COMMIT}
          workflow-run=${GITHUB_RUN_ID}
          tests=${TESTS}
          line-coverage=${LINE}
          branch-coverage=${BRANCH}
          mutation=${KILLED}/${MUTATION_TOTAL}
          all-gates=PASS"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=final-hardening-failed
          workflow-run=${GITHUB_RUN_ID}"
