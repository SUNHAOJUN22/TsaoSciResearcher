name: Diagnose v0.6.0 candidate commit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] diagnose v0.6.0 candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and clean candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path.cwd().resolve()
          spec = importlib.util.spec_from_file_location('finalize_v060_ci', root / 'scripts/finalize_v060_ci.py')
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load finalizer')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.main()
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Regenerate candidate artifacts
        run: |
          python scripts/sync_version.py --write
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
          python scripts/audit_repository.py

      - name: Diagnose staged candidate and local commit
        id: candidate
        shell: bash
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          {
            echo '=== status'
            git status --short
            echo '=== diff stat'
            git diff --cached --stat
            echo '=== diff check'
            git diff --cached --check
            echo "diff_check_rc=$?"
            echo '=== commit'
            git commit -m 'feat: release v0.6.0 research reproducibility hardening'
            echo "commit_rc=$?"
            echo '=== head'
            git log -1 --oneline
          } > /tmp/v060-candidate-diagnostic.txt 2>&1
          cat /tmp/v060-candidate-diagnostic.txt

      - name: Report candidate result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BODY="$(tail -n 80 /tmp/v060-candidate-diagnostic.txt | sed 's/`/\\`/g')"
          gh issue comment "$ISSUE_NUMBER" --body "\`\`\`text
          ${BODY}
          \`\`\`"
          if grep -q '^commit_rc=0$' /tmp/v060-candidate-diagnostic.txt; then
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi
