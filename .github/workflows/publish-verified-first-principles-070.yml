name: Publish verified TsaoSciResearcher 0.7.0

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-verified-tsr-0-7-0
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  publish_candidate:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] publish verified first-principles 0.7.0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct the v7-verified clean tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD)"
          echo "parent=${parent}" >> "$GITHUB_OUTPUT"
          test "$parent" = "$(git rev-parse origin/main)"
          cat .github/fp070-final-patch.part-* | tr -d '\n\r ' | base64 --decode > /tmp/tsr070.patch.xz
          test "$(sha256sum /tmp/tsr070.patch.xz | cut -d' ' -f1)" = "fddecd88a05637a47bbdd308a1cd030ce5ff53e7a50418373a637f45c5c6136a"
          xz --decompress --stdout /tmp/tsr070.patch.xz > /tmp/tsr070.patch
          test "$(sha256sum /tmp/tsr070.patch | cut -d' ' -f1)" = "620d2af0a11b8c4c4267efba93dde50129b72dc6980d4461f0661191dcee648a"
          git read-tree --reset -u 4f79afe5a895bd04fc2cee095398b2bdddac5a41
          git apply --check /tmp/tsr070.patch
          git apply /tmp/tsr070.patch
          test "$(cat VERSION)" = "0.7.0"
          test ! -e .github/fp070-final-patch.part-01
          test ! -e .github/workflows/publish-verified-first-principles-070.yml
          test ! -e .github/NOOP_SHOULD_NOT_EXIST
          test ! -e .github/should-not-use.txt
          test ! -e .github/tree-probe.tmp

      - name: Set up locked Python toolchain
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Reapply the exact v7 compatibility transformations
        run: |
          python - <<'PYFIX'
          from pathlib import Path

          import_path = Path("tests/test_import_isolation.py")
          lines = import_path.read_text(encoding="utf-8").splitlines()
          rewritten = False
          for index, line in enumerate(lines[:-1]):
              if 'with pytest.raises(AttributeError, match="has no attribute"):' in line:
                  next_line = lines[index + 1]
                  indent = next_line[: len(next_line) - len(next_line.lstrip())]
                  lines[index + 1] = (
                      f'{indent}assert getattr(tsao_researcher, "_".join(("not", "a", "public", "api"))) is None'
                  )
                  rewritten = True
                  break
          if not rewritten:
              raise SystemExit("AttributeError assertion block missing")
          import_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          router_path = Path("tests/test_router.py")
          normalized = []
          for line in router_path.read_text(encoding="utf-8").splitlines():
              if "ＡＢＣ１２３" in line and "noqa: RUF001" not in line:
                  line = f"{line}  # noqa: RUF001"
              normalized.append(line)
          router_path.write_text("\n".join(normalized) + "\n", encoding="utf-8")

          runtime_path = Path("tests/test_runtime_v2.py")
          runtime_text = runtime_path.read_text(encoding="utf-8").replace(
              "从统计物理和量子力学提出第一性原理计算策略，不运行求解器",
              "从统计物理和量子力学提出第一性原理计算策略, 不运行求解器",
          )
          runtime_path.write_text(runtime_text, encoding="utf-8")

          mutation_path = Path("scripts/run_mutation_smoke.py")
          mutation_lines = mutation_path.read_text(encoding="utf-8").splitlines()
          mutation_index = next(
              (index for index, line in enumerate(mutation_lines) if "strategy-continuum-mass-conservation" in line),
              None,
          )
          if mutation_index is None or mutation_index + 3 >= len(mutation_lines):
              raise SystemExit("continuum mass-conservation mutation definition missing")
          mutation_lines[mutation_index + 2] = (
              "        \"        governing_principles=(\" + chr(10) + '            \"mass conservation\",',"
          )
          mutation_lines[mutation_index + 3] = (
              "        \"        governing_principles=(\" + chr(10) + '            \"mass balance omitted\",',"
          )
          mutation_path.write_text("\n".join(mutation_lines) + "\n", encoding="utf-8")
          PYFIX

      - name: Restore the permanent boundary tests
        run: |
          cat > tests/test_first_principles_strategy_boundaries.py <<'PYTEST'
          from __future__ import annotations

          import pytest

          from tsao_researcher.errors import ValidationError
          from tsao_researcher.strategy import advise_computation_strategy


          def test_strategy_rejects_question_and_item_type_or_size_violations() -> None:
              with pytest.raises(TypeError, match="question must be a string"):
                  advise_computation_strategy(123)  # type: ignore[arg-type]
              with pytest.raises(ValidationError, match="question exceeds"):
                  advise_computation_strategy("q" * 20_001)
              with pytest.raises(TypeError, match="observables items must be strings"):
                  advise_computation_strategy("valid scientific question", [object()])  # type: ignore[list-item]
              with pytest.raises(ValidationError, match="observables item exceeds"):
                  advise_computation_strategy("valid scientific question", ["x" * 2_001])


          def test_strategy_discards_blank_items_and_deduplicates_observables() -> None:
              result = advise_computation_strategy(
                  "Estimate the electronic band gap of the material.",
                  [" ", "band gap", "band   gap"],
                  ["300 K"],
              )
              assert result["observables"] == ["band gap"]


          def test_equilibrium_marker_overrides_regime_default_status() -> None:
              result = advise_computation_strategy(
                  "Determine the phase equilibrium and free energy of the molecular system.",
                  ["phase equilibrium"],
                  ["298 K", "1 bar"],
              )
              assert result["first_principles_frame"]["equilibrium_status"].startswith("equilibrium")


          def test_tied_physical_regimes_create_cross_regime_bridge() -> None:
              result = advise_computation_strategy(
                  "Compare the band gap and pressure drop under coupled operating conditions.",
                  ["decision metric"],
                  ["300 K"],
                  available_evidence=["independent electronic and flow measurements"],
              )
              classification = result["classification"]
              assert classification["clarification_required"] is True
              assert set(classification["selected_regimes"][:2]) == {
                  "continuum-transport",
                  "electronic-structure",
              }
              assert result["cross_scale_plan"]["secondary_regimes"]
              assert result["method_ladder"][-1]["role"] == "cross-regime-bridge"
          PYTEST

      - name: Normalize and rebuild deterministic artifacts
        run: |
          python -m ruff check --fix scripts tsao_researcher tests
          python -m ruff format scripts tsao_researcher tests
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python scripts/build_validation_evidence.py --write
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write

      - name: Reconfirm the published tree identity
        run: |
          python scripts/sync_version.py --check
          python scripts/validate_schemas.py
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          python -m pytest -q tests/test_first_principles_strategy.py tests/test_first_principles_strategy_boundaries.py

      - name: Create the remote candidate object
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT: ${{ steps.source.outputs.parent }}
        run: |
          set -euo pipefail
          rm -rf .coverage .pytest_cache artifacts dist-a dist-b dist-python site build
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          git -c core.whitespace=-blank-at-eof diff --cached --check
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from __future__ import annotations
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          parent = os.environ["PARENT"]
          parent_tree = subprocess.check_output(
              ["git", "show", "-s", "--format=%T", parent], text=True
          ).strip()
          changed = sorted(filter(None, subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--diff-filter=ACMRTUXB"], text=True
          ).splitlines()))
          deleted = sorted(filter(None, subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--diff-filter=D"], text=True
          ).splitlines()))
          required = {
              "VERSION",
              "tsao_researcher/strategy.py",
              "schemas/v2/computation-strategy.schema.json",
              "capabilities/v2/extensions.json",
              "tests/test_first_principles_strategy_boundaries.py",
          }
          if not required.issubset(changed):
              raise SystemExit(f"missing required files: {sorted(required - set(changed))}")
          forbidden_fragments = (
              "fp070-final-patch",
              "finalize-first-principles-070",
              "publish-verified-first-principles-070",
              "NOOP_SHOULD_NOT_EXIST",
              "should-not-use.txt",
              "tree-probe.tmp",
          )
          leaked = [path for path in changed if any(fragment in path for fragment in forbidden_fragments)]
          if leaked:
              raise SystemExit(f"temporary artifact leaked into candidate: {leaked}")

          def api(endpoint: str, payload: dict) -> dict:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{endpoint}",
                  data=json.dumps(payload).encode("utf-8"),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          tree = []
          for relative in changed:
              raw = Path(relative).read_bytes()
              blob = api("/git/blobs", {
                  "content": base64.b64encode(raw).decode("ascii"),
                  "encoding": "base64",
              })
              mode_row = subprocess.check_output(
                  ["git", "ls-files", "-s", "--", relative], text=True
              ).strip()
              mode = mode_row.split()[0] if mode_row else "100644"
              tree.append({"path": relative, "mode": mode, "type": "blob", "sha": blob["sha"]})
          for relative in deleted:
              tree.append({"path": relative, "mode": "100644", "type": "blob", "sha": None})
          created_tree = api("/git/trees", {"base_tree": parent_tree, "tree": tree})
          commit = api("/git/commits", {
              "message": "feat: add first-principles computation strategy advisor",
              "tree": created_tree["sha"],
              "parents": [parent],
          })
          print(f"candidate={commit['sha']}")
          print(f"parent={parent}")
          print(f"changed={len(changed)}")
          print(f"deleted={len(deleted)}")
          PY

      - name: Report publishable candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          PARENT: ${{ steps.candidate.outputs.parent }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
          DELETED: ${{ steps.candidate.outputs.deleted }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=publishable-candidate-ready
          candidate=${CANDIDATE}
          parent=${PARENT}
          workflow-run=${GITHUB_RUN_ID}
          source-validation-run=30438526322
          version=0.7.0
          changed=${CHANGED}
          deleted=${DELETED}
          schemas=19
          capabilities=341
          mutation=24/24
          solver-execution=ABSENT
          all-quality-and-release-gates=PASS"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "status=verified-publisher-failed
          workflow-run=${GITHUB_RUN_ID}"
