name: Fix v0.7.1 version test contract

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: fix-v071-version-contract
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] fix v0.7.1 version contract'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Add checksum-bound version test correction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-v071.yml')
          text = path.read_text(encoding='utf-8')
          marker = "          python scripts/sync_runtime_data.py --write\n"
          block_lines = [
              "          python - <<'VERSION_CONTRACT_PY'",
              "          import hashlib",
              "          from pathlib import Path",
              "",
              "          path = Path('tests/test_import_isolation.py')",
              "          data = path.read_bytes()",
              "          assert hashlib.sha256(data).hexdigest() == 'decc1d267102f9c508effd03a03d9ca6db022eb9115cb4e95ddcbfbf82025e12'",
              "          old = \"assert tsao_researcher.__version__ == '0.7.0'\"",
              "          new = \"assert tsao_researcher.__version__ == '0.7.1'\"",
              "          source = data.decode('utf-8')",
              "          assert source.count(old) == 1",
              "          path.write_text(source.replace(old, new), encoding='utf-8', newline='\\n')",
              "          assert hashlib.sha256(path.read_bytes()).hexdigest() == '39c03756f1a696249f5042df8b0f2fea149aa41dec7f51c5de3041354f48bfe8'",
              "          VERSION_CONTRACT_PY",
          ]
          block = '\n'.join(block_lines) + '\n'
          if text.count(marker) != 1:
              raise SystemExit('runtime synchronization marker not found exactly once')
          if 'VERSION_CONTRACT_PY' in text:
              raise SystemExit('version contract correction already present')
          path.write_text(text.replace(marker, marker + block), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/fix-v071-version-contract.yml
          git -c core.whitespace=-blank-at-eof diff --check
          git config user.name 'SUNHAOJUN22 hardening automation'
          git config user.email 'SUNHAOJUN22@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bind v0.7.1 import version contract'
          git push origin HEAD:main
          printf 'status=version-contract-fixed\ncommit=%s\nfailed-run=30696099188\n' "$(git rev-parse HEAD)" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
