name: Diagnose v0.6.0 artifact gates

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.actor == 'SUNHAOJUN22' && github.event.issue.title == '[TSR] diagnose v0.6.0 artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct verified candidate tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import importlib.util
          from pathlib import Path
          root = Path.cwd().resolve()
          spec = importlib.util.spec_from_file_location('finalize_v060_ci', root / 'scripts/finalize_v060_ci.py')
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load finalizer')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          original = base64.b64decode
          def clean(data, altchars=None, validate=False):
              data = ''.join(data.split()) if isinstance(data, str) else b''.join(data.split())
              return original(data, altchars=altchars, validate=validate)
          module.base64.b64decode = clean
          module.main()
          (root / 'scripts/finalize_v060_ci_v3.py').unlink(missing_ok=True)
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Run artifact gates one by one
        id: gates
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from __future__ import annotations
          import subprocess
          from pathlib import Path

          commands = [
              "python scripts/sync_version.py --write",
              "python scripts/build_readme_facts.py --write",
              "python scripts/build_sbom.py --write",
              "python scripts/build_validation_evidence.py --write --preflight --evidence-date 2026-07-25",
              "python scripts/build_test_dashboard.py --write",
              "python scripts/build_research_quality_dashboard.py --write",
              "python scripts/build_engineering_report.py --write",
              "python scripts/generate_checksums.py --write",
              "python -m compileall -q scripts tsao_researcher tests",
              "python scripts/sync_version.py --check",
              "python scripts/validate_schemas.py",
              "python scripts/audit_repository.py",
              "python scripts/validate_structure.py",
              "python scripts/build_readme_facts.py --check",
              "python scripts/build_sbom.py --check",
              "python scripts/build_validation_evidence.py --check",
              "python scripts/build_test_dashboard.py --check",
              "python scripts/build_research_quality_dashboard.py --check",
              "python scripts/build_engineering_report.py --check",
              "python scripts/generate_checksums.py --check",
              "python scripts/build_capability_index.py --check",
              "python scripts/route_task.py --self-test",
              "python scripts/validate_figure.py examples/figure-contract.json",
              "python -m tsao_researcher --version",
              "python -m tsao_researcher quality examples/scientific-quality-check.json",
              "mkdocs build --strict",
          ]
          lines = []
          status = 0
          for index, command in enumerate(commands, 1):
              proc = subprocess.run(command, shell=True, text=True, capture_output=True)
              lines.append(f"[{index:02d}] rc={proc.returncode} {command}")
              if proc.stdout:
                  lines.extend(proc.stdout.rstrip().splitlines()[-12:])
              if proc.stderr:
                  lines.extend(proc.stderr.rstrip().splitlines()[-12:])
              if proc.returncode:
                  status = proc.returncode
                  lines.append("ARTIFACT_DIAGNOSTIC=FAIL")
                  break
          else:
              lines.append("ARTIFACT_DIAGNOSTIC=PASS")
          Path('/tmp/v060-artifact-diagnostic.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          raise SystemExit(status)
          PY

      - name: Report exact artifact result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BODY="$(tail -n 35 /tmp/v060-artifact-diagnostic.txt | sed 's/`/\\`/g')"
          gh issue comment "$ISSUE_NUMBER" --body "\`\`\`text
          ${BODY}
          \`\`\`"
          if grep -q '^ARTIFACT_DIAGNOSTIC=PASS$' /tmp/v060-artifact-diagnostic.txt; then
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi
