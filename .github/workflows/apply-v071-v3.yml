name: Apply verified v0.7.1 optimization v3

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-v071-optimization-v3
  cancel-in-progress: false

env:
  BASELINE: d9eca929fc39e329b1d94fdb2a08d2a75b577afa
  BASE_ARCHIVE_SHA: e7fb0bdae5b0dee605f9b84ea4361ef15a4b676831434a6e48a5aa3d53f0f036
  OPT_ARCHIVE_SHA: 654b1db7f3e98e910f34e13681b1cc541b8d082fb7cc4b4770f261f501619cde
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  apply:
    if: >-
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == '[TSR] apply v0.7.1 hardening' &&
      contains(github.event.issue.body, 'status=optimized-v3-go')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Mark v3 running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=optimized-v3-running\nworkflow-run=%s\nstaging=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt

      - name: Checkout exact staged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and apply both archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASELINE" HEAD
          python - <<'PY'
          import os, subprocess
          allowed={'.github/workflows/apply-v071.yml','.github/workflows/apply-v071-v2.yml','.github/workflows/apply-v071-v3.yml'} | {f'.github/v071-opt-part-{i:02d}.b64' for i in range(9)}
          changed=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['BASELINE']}..HEAD"],text=True).splitlines())
          assert changed==allowed, sorted(changed)
          PY
          gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" > /tmp/comments.json
          python - <<'PY'
          import base64, hashlib, json, os, re, tarfile
          from pathlib import Path, PurePosixPath

          rows=json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          base_meta={
          '00':(6353,'823f5d8aeef013dc201a54d6aca4dff8a275d8b6c837ed4b2ca351bbbbed45de'),'01':(6353,'9077faaeb0aa315a7a01299b1e24419c3162681cdfe6ac888de2490462bae15d'),'02':(6353,'870647b834896772ad470c98589c145ea1f88b6fc3d21254a2b65372d55e62ba'),'03':(6353,'3b9a4a9e3837cb86f959d6ab418c6362d03edb2e39cd7955bc0cc2ec1d399dd9'),'04':(6353,'0d950f169508f5b8d79ed712211c726a1b6e8881f46365715f6358e1d2f9b023'),'05':(6353,'10da3e2f6ab8ca6e2d5b558e7717ad0edd21fa3edc147707286ddd3fb1294654'),'06':(6353,'8e37f9f739c27884229552547e7b2ff847d160ffaf342a0f4da53e95fab8d3ab'),'07':(6353,'b0cdf3e9d89496bf89b051f1e8c88ac1b6ad7c6eb732b7b92fb6622c3ff540b9'),'08':(6353,'a39c10eb0b3f14c9227402ef239f22c3b33dbfd294a04c13fbc783768f9c3aec'),'09':(6353,'4c84f7b4b4698bc2c77054ad2447e7ebaba46b22ab287842900e5896a2dd788d'),'10':(6353,'2896151c7c17c9737de456e7c8d2ab2f2069922c133ade260ca73b968dc9e3c4'),'11':(6353,'df3be0b4ca61185ce4f37d19ecf1123cdd1c0cc528c710b59f23826eb55f6778'),'12':(6353,'f9a796c15defc01fecefd621109c4499b00cbd9a045903957948cdef982af268'),'13':(6353,'f815174ef9413810b94b95b1691f2b227daac98f17a7709274d17772baf8bbdc'),'14':(6353,'7526152fab02f53beffa77a060707795c31e67149e83209360c7269ffcd8e93c'),'15':(6341,'088d536ac404926810b58494b06bf41e3c5dd70ac61bd631367d5ec3ff0a1f2b')}
          opt_meta={
          '00':(6000,'c9d83432e24c395016808c23c631300b548c10c844eee720c5911490c3f7a486'),'01':(6000,'b7a2442534148b00ed8603f7f50b6c84cb0b41e0c6deb1049bdb9b3167796f18'),'02':(6000,'8bdb40c03f0674c343367c83f4766a97e2866e7744d5da900333d40cde79a45c'),'03':(6000,'1c78eeb66358483ae967ec2d64a4b45a3d61ddf135f85936db8705f19960c6c4'),'04':(6000,'99bac40049170808cf2390fa1d91f8162355fcedebdd3f380317971f9012e74a'),'05':(6000,'8afa2d8074959e123c6303faeed844be2da41c8f8df1e12d88707da9df90dbca'),'06':(6000,'eb5a62fbd17bb51c1695cfca4d331b8f19719e5dfaea24c22dbd27bd0f232977'),'07':(6000,'1bc03c0b4ab1a7fa16db16509f41c5673e6cef9a9fd47db0781340d806775c5f'),'08':(5492,'e70e1cb7c2558e88325cefc8e40ac70672ee4090fcb0f21e3d15edf20c84b372')}

          def collect(prefix,meta,archive_sha):
              pattern=re.compile(rf'{prefix} (\d{{2}})/(\d{{2}})\n([A-Za-z0-9+/=]+)')
              parts={}
              for row in rows:
                  match=pattern.fullmatch(row.get('body',''))
                  if match:
                      index,total,payload=match.groups()
                      assert int(total)==len(meta) and index not in parts
                      parts[index]=payload
              assert sorted(parts)==sorted(meta), (prefix,sorted(parts))
              for key,(length,digest) in meta.items():
                  assert len(parts[key])==length
                  assert hashlib.sha256(parts[key].encode('ascii')).hexdigest()==digest
              data=base64.b64decode(''.join(parts[f'{i:02d}'] for i in range(len(meta))),validate=True)
              assert hashlib.sha256(data).hexdigest()==archive_sha
              return data

          def extract(data,target,manifest_guard):
              archive_path=Path('/tmp')/(target.name+'.tar.gz')
              archive_path.write_bytes(data)
              target.mkdir()
              with tarfile.open(archive_path,'r:gz') as archive:
                  members=archive.getmembers(); names=[m.name for m in members]
                  assert 1<len(members)<=200 and len(names)==len(set(names)) and 'manifest.json' in names
                  for member in members:
                      path=PurePosixPath(member.name)
                      assert not path.is_absolute() and '..' not in path.parts and '\\' not in member.name
                      assert member.isfile() and not member.issym() and not member.islnk()
                  archive.extractall(target,filter='data')
              manifest=json.loads((target/'manifest.json').read_text(encoding='utf-8'))
              manifest_guard(manifest)
              assert set(names)=={f"files/{row['path']}" for row in manifest['files']}|{'manifest.json'}
              for row in manifest['files']:
                  rel=PurePosixPath(row['path']); assert not rel.is_absolute() and '..' not in rel.parts and '\\' not in row['path']
                  payload=(target/'files'/Path(*rel.parts)).read_bytes()
                  assert len(payload)==row['bytes'] and hashlib.sha256(payload).hexdigest()==row['sha256']
                  mode=int(row['mode'],8); assert mode in {0o644,0o755}
                  destination=Path(row['path']); destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(payload); destination.chmod(mode)

          extract(collect('PART',base_meta,os.environ['BASE_ARCHIVE_SHA']),Path('/tmp/base'),lambda m: m['base_commit']==os.environ['BASELINE'] or (_ for _ in ()).throw(AssertionError('base')))
          assert Path('VERSION').read_text().strip()=='0.7.1'
          path=Path('tests/test_import_isolation.py'); source=path.read_text(encoding='utf-8')
          old="assert tsao_researcher.__version__ == '0.7.0'"; new="assert tsao_researcher.__version__ == '0.7.1'"
          assert source.count(old)==1; path.write_text(source.replace(old,new),encoding='utf-8',newline='\n')
          extract(collect('OPT2',opt_meta,os.environ['OPT_ARCHIVE_SHA']),Path('/tmp/opt'),lambda m: m['base_overlay_sha256']==os.environ['BASE_ARCHIVE_SHA'] or (_ for _ in ()).throw(AssertionError('opt')))
          PY
          rm -f .github/v071-opt-part-*.b64
          rm -f .github/workflows/apply-v071.yml .github/workflows/apply-v071-v2.yml .github/workflows/apply-v071-v3.yml
          python scripts/sync_runtime_data.py --write

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install exact toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Run complete quality and release gates
        env:
          TSR_TEST_ORDER_SEED: "20260730"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/sync_version.py --check
          python scripts/sync_runtime_data.py --check
          python scripts/validate_schemas.py
          python scripts/build_readme_facts.py --write
          python scripts/build_sbom.py --write
          python -m ruff check --fix scripts tsao_researcher tests
          python -m ruff format scripts tsao_researcher tests
          python -m pytest -q -p hypothesis.extra.pytestplugin --junitxml=artifacts/junit.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p pytest_cov --ignore=tests/test_import_isolation.py --cov=tsao_researcher --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.reverse_order_plugin
          python -m pytest -q -p hypothesis.extra.pytestplugin -p tests.random_order_plugin
          python -m ruff format --check scripts tsao_researcher tests
          python -m ruff check scripts tsao_researcher tests
          python -m mypy scripts tsao_researcher
          python -m bandit -q -lll -r scripts tsao_researcher
          python -m pip list --format=freeze --exclude-editable | LC_ALL=C sort > artifacts/resolved-environment.lock
          python -m pip_audit --strict -r artifacts/resolved-environment.lock --format cyclonedx-json --output artifacts/resolved-environment-sbom.json
          python scripts/run_mutation_smoke.py --json-out artifacts/mutation-results.json
          python scripts/performance_smoke.py --json-out artifacts/performance.json
          python scripts/check_quality_baseline.py
          python scripts/build_validation_evidence.py --write --preflight --evidence-date "$(date -u +%F)"
          python scripts/build_test_dashboard.py --write
          python scripts/build_research_quality_dashboard.py --write
          python scripts/build_engineering_report.py --write
          python scripts/generate_checksums.py --write
          python scripts/audit_repository.py
          python scripts/validate_structure.py
          python scripts/build_readme_facts.py --check
          python scripts/build_sbom.py --check
          python scripts/build_validation_evidence.py --check
          python scripts/build_test_dashboard.py --check
          python scripts/build_research_quality_dashboard.py --check
          python scripts/build_engineering_report.py --check
          python scripts/generate_checksums.py --check
          python scripts/build_capability_index.py --check
          python scripts/route_task.py --self-test
          python scripts/validate_figure.py examples/figure-contract.json
          python scripts/validate_computation_strategy.py examples/first-principles-strategy.json
          mkdocs build --strict
          python scripts/package_release.py --out dist-a
          python scripts/package_release.py --out dist-b
          cmp "dist-a/TsaoSciResearcher-v$(cat VERSION).zip" "dist-b/TsaoSciResearcher-v$(cat VERSION).zip"
          python scripts/validate_release.py
          python -m build --sdist --wheel --outdir dist-python
          python scripts/validate_distribution.py dist-python
          git -c core.whitespace=-blank-at-eof diff --check

      - name: Build verified candidate commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          cp artifacts/quality-current.json /tmp/quality.json
          python - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          paths=['.github/workflows/audit.yml','.github/workflows/ci.yml','.github/workflows/main-attestation.yml','.github/workflows/nightly.yml','.github/workflows/release.yml']
          blobs={}
          for path in paths:
              payload=json.dumps({'content':base64.b64encode(Path(path).read_bytes()).decode(),'encoding':'base64'}).encode()
              result=subprocess.run(['gh','api','--method','POST',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--input','-'],input=payload,check=True,capture_output=True)
              blobs[path]=json.loads(result.stdout)['sha']
          Path('/tmp/blobs.json').write_text(json.dumps(blobs,sort_keys=True))
          PY
          git checkout "$GITHUB_SHA" -- .github/workflows
          rm -rf artifacts dist-a dist-b dist-python site .coverage
          git config user.name 'SUNHAOJUN22 optimization automation'
          git config user.email 'SUNHAOJUN22@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git commit -m 'perf: optimize routing catalogs capsules and validation [skip ci]'
          git push origin HEAD:main
          export CODE_COMMIT="$(git rev-parse HEAD)" CODE_TREE="$(git rev-parse HEAD^{tree})"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          blobs=json.loads(Path('/tmp/blobs.json').read_text())
          tree=[{'path':p,'mode':'100644','type':'blob','sha':s} for p,s in sorted(blobs.items())]
          for path in ('.github/workflows/apply-v071.yml','.github/workflows/apply-v071-v2.yml','.github/workflows/apply-v071-v3.yml'):
              tree.append({'path':path,'mode':'100644','type':'blob','sha':None})
          payload=json.dumps({'base_tree':os.environ['CODE_TREE'],'tree':tree}).encode()
          result=subprocess.run(['gh','api','--method','POST',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/trees",'--input','-'],input=payload,check=True,capture_output=True)
          final_tree=json.loads(result.stdout)['sha']
          payload=json.dumps({'message':'perf: complete verified routing catalog capsule and validation optimization','tree':final_tree,'parents':[os.environ['CODE_COMMIT']]}).encode()
          result=subprocess.run(['gh','api','--method','POST',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/commits",'--input','-'],input=payload,check=True,capture_output=True)
          candidate=json.loads(result.stdout)['sha']
          Path('/tmp/candidate.json').write_text(json.dumps({'code_commit':os.environ['CODE_COMMIT'],'candidate_commit':candidate,'final_tree':final_tree},sort_keys=True))
          PY

      - name: Report candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/body.txt
          import json,os
          from pathlib import Path
          q=json.loads(Path('/tmp/quality.json').read_text()); c=json.loads(Path('/tmp/candidate.json').read_text())
          print('status=optimized-v3-candidate-ready')
          print(f"workflow-run={os.environ['GITHUB_RUN_ID']}")
          print(f"code-commit={c['code_commit']}")
          print(f"candidate-commit={c['candidate_commit']}")
          print(f"final-tree={c['final_tree']}")
          print(f"tests={q['tests']['tests']}")
          print(f"line-coverage={q['coverage']['line_percent']:.3f}")
          print(f"branch-coverage={q['coverage']['branch_percent']:.3f}")
          print(f"mutation={q['mutation']['killed']}/{q['mutation']['total']}")
          print('all-prepublication-gates=PASS')
          PY
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=optimized-v3-failed\nworkflow-run=%s\nstaging=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
