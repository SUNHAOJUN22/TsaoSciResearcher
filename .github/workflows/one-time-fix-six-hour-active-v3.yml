name: One-time repair Researcher six-hour harness v3

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: >-
      github.event.issue.number == 212 &&
      github.event.comment.body == '/fix-six-hour-active-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Repair active qualification workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          active_path = Path('.github/workflows/one-time-six-hour-active.yml')
          text = active_path.read_text(encoding='utf-8')

          replacements = (
              ('/run-six-hour-active-v1', '/run-six-hour-active-v3', 3),
              (
                  'python -m pytest -q -p hypothesis.extra.pytestplugin',
                  'python -m pytest -q',
                  2,
              ),
              (
                  'mkdir -p six-hour-evidence',
                  'mkdir -p "$RUNNER_TEMP/six-hour-evidence"',
                  2,
              ),
              (
                  'evidence_dir = Path("six-hour-evidence")',
                  'evidence_dir = Path(os.environ["RUNNER_TEMP"]) / "six-hour-evidence"',
                  2,
              ),
          )
          for old, new, expected in replacements:
              observed = text.count(old)
              if observed != expected:
                  raise SystemExit(
                      f'active workflow drift for {old!r}: '
                      f'expected {expected}, observed {observed}'
                  )
              text = text.replace(old, new)

          old_upload = 'path: six-hour-evidence/'
          if text.count(old_upload) != 2:
              raise SystemExit('active workflow upload-path count drifted')
          runner_temp = '$' + '{{ runner.temp }}'
          text = text.replace(
              old_upload,
              f'path: {runner_temp}/six-hour-evidence/',
          )

          forbidden = (
              '/run-six-hour-active-v1',
              '-p hypothesis.extra.pytestplugin',
              'mkdir -p six-hour-evidence',
              'Path("six-hour-evidence")',
              'path: six-hour-evidence/',
          )
          remaining = [token for token in forbidden if token in text]
          if remaining:
              raise SystemExit(f'uncorrected tokens remain: {remaining}')

          active_path.write_text(text, encoding='utf-8')
          for relative in (
              '.github/workflows/one-time-fix-six-hour-active.yml',
              '.github/workflows/one-time-fix-six-hour-active-v3.yml',
          ):
              path = Path(relative)
              if path.exists():
                  path.unlink()
          PY
          git diff --check

      - name: Publish repaired harness
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: isolate Researcher soak evidence and plugin loading"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record repair result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          gh issue comment 212 --repo "$GITHUB_REPOSITORY" --body "RESEARCHER_SIX_HOUR_REPAIR_V3: **${{ job.status }}**

- published harness commit: \`${PUBLISHED_SHA:-UNPUBLISHED}\`
- next exact command: \`/run-six-hour-active-v3\`
- duplicate Hypothesis plugin registration removed
- soak evidence moved to runner-temporary storage
- previous failed runs contribute \`0 ns\`

No scientific, coverage, security, dependency or approval threshold was changed."
