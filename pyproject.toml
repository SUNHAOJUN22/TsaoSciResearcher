[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsao-science"
version = "1.0.0a1"
description = "Unified evidence-governed research, computation and polymer engineering workspace"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "jsonschema>=4.18,<5", "psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7", "pytest-cov>=6,<8"]

[project.scripts]
tsao-science = "tsao_science.cli:main"

[tool.setuptools.packages.find]
include = ["tsao_science*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 110
target-version = "py311"
