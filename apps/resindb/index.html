
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0ea5e9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)">
    <title>ResinDB Pro — 合成树脂数据管理与材料分析工作台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%276%27 fill=%27%236366f1%27/%3E%3Cellipse cx=%2732%27 cy=%2732%27 rx=%2725%27 ry=%278%27 fill=%27none%27 stroke=%27%236366f1%27 stroke-width=%273%27/%3E%3Cellipse cx=%2732%27 cy=%2732%27 rx=%2725%27 ry=%278%27 fill=%27none%27 stroke=%27%233b82f6%27 stroke-width=%273%27 transform=%27rotate(60 32 32)%27/%3E%3Cellipse cx=%2732%27 cy=%2732%27 rx=%2725%27 ry=%278%27 fill=%27none%27 stroke=%27%238b5cf6%27 stroke-width=%273%27 transform=%27rotate(120 32 32)%27/%3E%3C/svg%3E" />

    <script>
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('ResizeObserver loop')) {
          e.stopImmediatePropagation();
        }
      });
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('resindb-theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
</head>
  <body class="bg-[#f8fafc] text-slate-900 dark:bg-[#020617] dark:text-slate-100 selection:bg-primary-500/30 selection:text-primary-200 overflow-hidden">
    <div id="root">
      <div role="status" aria-live="polite" style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;padding:2rem">
        <div style="max-width:34rem;text-align:center">
          <strong style="display:block;font-size:1.125rem">ResinDB Pro</strong>
          <span style="display:block;margin-top:.5rem;color:#64748b">Loading external resin data and scientific modules… / 正在加载外部树脂数据与科学分析模块…</span>
        </div>
      </div>
    </div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
