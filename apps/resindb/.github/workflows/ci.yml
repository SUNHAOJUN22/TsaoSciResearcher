name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Exact-tree validation, browser evidence and reports
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install CJK fonts for deterministic visual evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC'
          fc-list :lang=zh | grep -q .

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci
      - name: Validate installed dependency graph
        run: npm ls --all
      - name: Receipt contract regressions
        run: node --test scripts/tests/validation-receipt-contract.node.mjs

      - name: Documentation and deterministic scientific visuals
        run: npm run validate:docs
      - name: Repository-wide UTF-8, NFC and mojibake integrity
        run: node scripts/validate-repository-unicode.mjs --write
      - name: Production source hygiene
        run: npm run validate:source
      - name: Governed external data
        run: npm run validate:data
      - name: Compute functions and display-chain governance
        run: npm run validate:compute
      - name: Scientific UI and figure semantics
        run: npm run validate:scientific-ui
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Deterministic K-Means backend benchmark smoke
        run: npm run benchmark:kmeans:smoke
      - name: Complete regression tests
        run: npm test
      - name: Isolated unit tests
        run: npm run test:unit
      - name: Isolated scientific and worker tests
        run: npm run test:science
      - name: Whole-production-source coverage
        run: npm run test:coverage
      - name: Production build and external-data proof
        run: npm run build
      - name: HTTP production smoke
        run: npm run smoke
      - name: Chromium interactive UI smoke
        run: npm run test:ui

      - name: Production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm audit --omit=dev --audit-level=high --json | tee artifacts/npm-audit-prod.json
          jq '.metadata.vulnerabilities' artifacts/npm-audit-prod.json

      - name: Complete dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high --json | tee artifacts/npm-audit-all.json
          jq '.metadata.vulnerabilities' artifacts/npm-audit-all.json

      - name: Record dependency freshness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          code=0
          if npm outdated --json > artifacts/npm-outdated.json; then
            code=0
          else
            code=$?
          fi
          if [ ! -s artifacts/npm-outdated.json ]; then printf '{}\n' > artifacts/npm-outdated.json; fi
          printf '%s\n' "$code" > artifacts/npm-outdated-exit-code.txt
          jq . artifacts/npm-outdated.json

      - name: Prove main is the sole remote branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin | tee artifacts/branch-proof.txt
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateBranchProof } from './scripts/validation-receipt-contract.mjs';
          if (!validateBranchProof(readFileSync('artifacts/branch-proof.txt', 'utf8'), process.env.GITHUB_SHA)) {
            throw new Error('Remote main proof does not match the exact tested commit');
          }
          NODE

      - name: Verify tracked-source fixed point
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Bundle deterministic exact tracked tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git ls-files -z \
            | LC_ALL=C sort -z \
            | tar --null --verbatim-files-from --files-from=- \
                --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
                --numeric-owner --mode='u+rwX,go+rX,go-w' \
                -czf artifacts/exact-source-tree.tar.gz
          sha256sum artifacts/exact-source-tree.tar.gz | tee artifacts/exact-source-tree.sha256
          test "$(stat -c%s artifacts/exact-source-tree.tar.gz)" -gt 100000

      - name: Write exact-tree context and passed core gates
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { REQUIRED_CORE_GATES } from './scripts/validation-receipt-contract.mjs';
          const tests = JSON.parse(fs.readFileSync('artifacts/test-results.json', 'utf8'));
          const gates = [...REQUIRED_CORE_GATES];
          if (process.env.GITHUB_REF === 'refs/heads/main') {
            gates.push('single-main-branch');
          }
          const context = {
            schemaVersion: 3,
            repository: process.env.GITHUB_REPOSITORY,
            sha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            testFiles: tests.testResults.length,
            testCount: tests.numTotalTests,
            generatedAt: new Date().toISOString(),
          };
          fs.writeFileSync('artifacts/ci-context.json', `${JSON.stringify(context, null, 2)}\n`);
          fs.writeFileSync('artifacts/ci-gates.json', `${JSON.stringify({
            schemaVersion: 1,
            status: 'PASS',
            gates,
          }, null, 2)}\n`);
          NODE

      - name: Generate exact-tree validation receipt
        run: npm run report:receipt
      - name: Generate HTML and Markdown validation reports
        run: npm run report:validation
      - name: Generate PDF image report
        run: npm run report:pdf

      - name: Render PDF for visual acceptance
        shell: bash
        run: |
          set -euo pipefail
          pdf='artifacts/ResinDB-Pro-3.2.0-Final-Validation-Report.pdf'
          test -s "$pdf"
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdfinfo "$pdf"
          pdftoppm -png -r 120 "$pdf" artifacts/pdf-render >/dev/null
          mapfile -t pages < <(find artifacts -maxdepth 1 -name 'pdf-render-*.png' -print | sort -V)
          test "${#pages[@]}" -ge 2
          test "$(stat -c%s "${pages[0]}")" -gt 10000

      - name: Upload complete validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resindb-pro-3.2.0-evidence-${{ github.sha }}
          path: |
            coverage/
            artifacts/
            reports/UNICODE_INTEGRITY_REPORT.json
            FINAL_CODE_AUDIT.md
            FINAL_RELEASE_REPORT.md
          if-no-files-found: warn
          retention-days: 30
