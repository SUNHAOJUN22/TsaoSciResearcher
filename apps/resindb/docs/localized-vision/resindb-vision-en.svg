<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ResinDB Pro English material data and scientific visualization vision</title><desc id="desc">English conceptual design from data contracts and robust statistics through polymer physics and compute Workers to verifiable scientific figures.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06121f"/><stop offset="0.55" stop-color="#10233f"/><stop offset="1" stop-color="#1f2554"/></linearGradient><radialGradient id="halo" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#dbeafe" stroke-opacity=".055"/></pattern><style>text{font-family:Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei','PingFang SC','WenQuanYi Micro Hei','Segoe UI',Arial,sans-serif}.eyebrow{font-size:17px;letter-spacing:3.5px;font-weight:800;fill:#67e8f9}.title{font-size:50px;font-weight:850;fill:#f8fafc}.subtitle{font-size:21px;fill:#cbd5e1}.vision{font-size:18px;font-weight:700;fill:#dbeafe}.card-title{font-size:23px;font-weight:800;fill:#f8fafc}.card-sub{font-size:15px;fill:#9fb1c8}.body{font-size:15px;fill:#d5deea}.micro{font-size:12px;fill:#8ea2ba}.step{font-size:15px;font-weight:900;fill:#07111f}.formula{font-family:'STIX Two Math','Cambria Math','Noto Sans Math','Noto Sans SC',serif;font-size:22px;fill:#e0f2fe}.formula-small{font-family:'STIX Two Math','Cambria Math','Noto Sans Math','Noto Sans SC',serif;font-size:17px;fill:#f0f9ff}.disclaimer{font-size:12px;font-weight:850;letter-spacing:1.1px;fill:#111827}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><ellipse cx="800" cy="188" rx="610" ry="190" fill="url(#halo)"/>
<g transform="translate(78 54)"><text class="eyebrow">RESINDB PRO · MATERIAL DATA AND SCIENTIFIC DECISION WORKSTATION</text><text class="title" y="63">From Resin Data to Material Decisions and Scientific Visualization</text><text class="subtitle" y="105">Data contracts · robust statistics · polymer physics · Worker computation · verifiable figures</text></g>
<g transform="translate(1030 68)"><rect width="490" height="104" rx="24" fill="#0a1829" stroke="#334155"/><text x="24" y="36" class="vision">VISION</text><text x="24" y="70" class="formula-small">Organize grades, experimental properties, models, figures and evidence into an explainable R&amp;D workflow</text><text x="24" y="92" class="micro">Association is not causation; a proxy is not a measurement; a template is not force-field validation.</text></g>
<g transform="translate(78 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#22d3ee"/><text x="42" y="48" text-anchor="middle" class="step">1</text>
  <text x="24" y="93" class="card-title">Data contract</text>
  <text x="24" y="124" class="card-sub">Schema · Unit · Provenance</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">x=(v,u,T,standard,source)</text>
  <text x="125" y="207" text-anchor="middle" class="micro">a property is not a bare number</text>
  <circle cx="34" cy="274" r="6" fill="#22d3ee"/><text x="51" y="280" class="body">version &amp; manifest</text>
  <circle cx="34" cy="316" r="6" fill="#22d3ee"/><text x="51" y="322" class="body">source/evidence class</text>
  <circle cx="34" cy="358" r="6" fill="#22d3ee"/><text x="51" y="364" class="body">strict finite scalar</text>
</g><g transform="translate(370 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#818cf8" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#818cf8"/><text x="42" y="48" text-anchor="middle" class="step">2</text>
  <text x="24" y="93" class="card-title">Robust statistics</text>
  <text x="24" y="124" class="card-sub">Correlation · KDE · Outlier</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">rₛ=corr(rank x,rank y)</text>
  <text x="125" y="207" text-anchor="middle" class="micro">association remains non-causal</text>
  <circle cx="34" cy="274" r="6" fill="#818cf8"/><text x="51" y="280" class="body">Pearson/Spearman</text>
  <circle cx="34" cy="316" r="6" fill="#818cf8"/><text x="51" y="322" class="body">quantiles and KDE</text>
  <circle cx="34" cy="358" r="6" fill="#818cf8"/><text x="51" y="364" class="body">Mahalanobis review</text>
</g><g transform="translate(662 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#c084fc" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#c084fc"/><text x="42" y="48" text-anchor="middle" class="step">3</text>
  <text x="24" y="93" class="card-title">Polymer physics</text>
  <text x="24" y="124" class="card-sub">Rheology · WLF · Prony</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">η=η(γ̇,T)</text>
  <text x="125" y="207" text-anchor="middle" class="micro">models retain domains</text>
  <circle cx="34" cy="274" r="6" fill="#c084fc"/><text x="51" y="280" class="body">rheology and shift</text>
  <circle cx="34" cy="316" r="6" fill="#c084fc"/><text x="51" y="322" class="body">relaxation/viscoelasticity</text>
  <circle cx="34" cy="358" r="6" fill="#c084fc"/><text x="51" y="364" class="body">LAMMPS input templates</text>
</g><g transform="translate(954 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#34d399" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#34d399"/><text x="42" y="48" text-anchor="middle" class="step">4</text>
  <text x="24" y="93" class="card-title">Compute Workers</text>
  <text x="24" y="124" class="card-sub">Deterministic Compute</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">H=SHA256(request∥backend∥result)</text>
  <text x="125" y="207" text-anchor="middle" class="micro">backend/fallback evidence</text>
  <circle cx="34" cy="274" r="6" fill="#34d399"/><text x="51" y="280" class="body">PCA/GP/K-Means</text>
  <circle cx="34" cy="316" r="6" fill="#34d399"/><text x="51" y="322" class="body">Weibull/Sobol/MOO</text>
  <circle cx="34" cy="358" r="6" fill="#34d399"/><text x="51" y="364" class="body">WASM/Worker evidence</text>
</g><g transform="translate(1246 250)">
  <rect width="250" height="390" rx="26" fill="#0d2034" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="42" cy="42" r="23" fill="#fbbf24"/><text x="42" y="48" text-anchor="middle" class="step">5</text>
  <text x="24" y="93" class="card-title">Figures &amp; acceptance</text>
  <text x="24" y="124" class="card-sub">ECharts · Chromium · CI</text>
  <rect x="20" y="151" width="210" height="76" rx="15" fill="#081522" stroke="#334155"/>
  <text x="125" y="184" text-anchor="middle" class="formula-small">ready=finished∧pixels&gt;0</text>
  <text x="125" y="207" text-anchor="middle" class="micro">blank figures are rejected</text>
  <circle cx="34" cy="274" r="6" fill="#fbbf24"/><text x="51" y="280" class="body">font readiness</text>
  <circle cx="34" cy="316" r="6" fill="#fbbf24"/><text x="51" y="322" class="body">non-blank Canvas</text>
  <circle cx="34" cy="358" r="6" fill="#fbbf24"/><text x="51" y="364" class="body">PNG and exact-tree</text>
</g><path d="M330 445h28" stroke="#94a3b8" stroke-width="4"/><path d="M358 445l-12-8v16z" fill="#94a3b8"/><path d="M622 445h28" stroke="#94a3b8" stroke-width="4"/><path d="M650 445l-12-8v16z" fill="#94a3b8"/><path d="M914 445h28" stroke="#94a3b8" stroke-width="4"/><path d="M942 445l-12-8v16z" fill="#94a3b8"/><path d="M1206 445h28" stroke="#94a3b8" stroke-width="4"/><path d="M1234 445l-12-8v16z" fill="#94a3b8"/>
<g transform="translate(78 686)"><rect width="1444" height="128" rx="25" fill="#091827" stroke="#334155"/><text x="24" y="34" class="vision">CORE MATERIAL-COMPUTATION CONTRACTS</text><text x="24" y="68" class="formula">Dᴍ(x)=√[(x−μ)ᵀΣ⁻¹(x−μ)]   ·   η(γ̇)=η∞+(η₀−η∞)[1+(λγ̇)ᵃ]⁽ⁿ⁻¹⁾ᐟᵃ</text><text x="24" y="100" class="formula">Σy≈JΣθJᵀ+Σsample+Σmodel+Σtransfer   ·   PASS=finite∧visible∧labeled∧traceable</text></g>
