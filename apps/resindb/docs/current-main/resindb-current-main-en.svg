<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ResinDB Pro current-main acceptance architecture</title><desc id="desc">From traceable resin data, finite numerics and compute-capability probes to verifiable scientific visualization. ResinDB Pro is a local-first scientific data and analysis workbench, not a certified LIMS/ERP, commercial force field, industrial grade-release system or automatic scientific approval engine.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".48" stop-color="#083344"/><stop offset="1" stop-color="#064e3b"/></linearGradient><linearGradient id="card"><stop offset="0" stop-color="#0e3b57"/><stop offset="1" stop-color="#075244"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC","Noto Sans",Arial,sans-serif;fill:#ecfeff}.title{font-size:54px;font-weight:800}.subtitle{font-size:24px;fill:#a5f3fc}.stage{font-size:24px;font-weight:750}.detail{font-size:17px;fill:#ccfbf1}.index{font-size:58px;font-weight:800;fill:#0e7490}.formula{font-family:"STIX Two Math","Cambria Math","Noto Sans Math","Noto Sans CJK SC",sans-serif;font-size:18px;fill:#d1fae5}.micro{font-size:13px;letter-spacing:1.7px;fill:#67e8f9}.boundary{font-size:18px;fill:#dbeafe}.badge{font-size:16px;fill:#99f6e4}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1390" cy="92" r="125" fill="#06b6d4" opacity=".15"/><circle cx="210" cy="790" r="170" fill="#10b981" opacity=".12"/><text x="48" y="88" class="title">ResinDB Pro</text><text x="48" y="132" class="subtitle">From traceable resin data, finite numerics and compute-capability probes to verifiable scientific visualization</text><text x="48" y="184" class="badge">AI-ASSISTED CONCEPTUAL DESIGN · NOT SCIENTIFIC DATA · LOCALES VERIFIED SEPARATELY</text><path d="M 319 336 H 348" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/><path d="M 629 336 H 658" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/><path d="M 939 336 H 968" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1249 336 H 1278" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/><g><rect x="44" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/><text x="66" y="280" class="stage">Data contract</text><text x="66" y="324" class="detail">Schema, source, status and units</text><text x="66" y="394" class="index">01</text></g><g><rect x="354" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/><text x="376" y="280" class="stage">Numerical core</text><text x="376" y="324" class="detail">Finiteness, scaling and similarity</text><text x="376" y="394" class="index">02</text></g><g><rect x="664" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/><text x="686" y="280" class="stage">Compute dispatch</text><text x="686" y="324" class="detail">Workers, WASM, GPU and fallback</text><text x="686" y="394" class="index">03</text></g><g><rect x="974" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/><text x="996" y="280" class="stage">Scientific figures</text><text x="996" y="324" class="detail">Labels, finished events and nonblank canvas</text><text x="996" y="394" class="index">04</text></g><g><rect x="1284" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/><text x="1306" y="280" class="stage">Export and audit</text><text x="1306" y="324" class="detail">Language, hashes, receipts and boundaries</text><text x="1306" y="394" class="index">05</text></g><g><rect x="44" y="522" width="465" height="128" rx="22" fill="#071b2e" stroke="#34d399" stroke-width="2"/><text x="66" y="575" class="formula">C_figure = C_finite ∧ C_labeled ∧ C_finished ∧ C_nonblank</text><text x="66" y="619" class="micro">FIGURE AND NUMERICAL CONTRACT 01</text></g><g><rect x="549" y="522" width="465" height="128" rx="22" fill="#071b2e" stroke="#34d399" stroke-width="2"/><text x="571" y="575" class="formula">d_M(x, μ) = √((x − μ)ᵀ Σ⁻¹ (x − μ))</text><text x="571" y="619" class="micro">FIGURE AND NUMERICAL CONTRACT 02</text></g><g><rect x="1054" y="522" width="465" height="128" rx="22" fill="#071b2e" stroke="#34d399" stroke-width="2"/><text x="1076" y="575" class="formula">u_c² = u_data² + u_model² + u_scale²</text><text x="1076" y="619" class="micro">FIGURE AND NUMERICAL CONTRACT 03</text></g><rect x="44" y="710" width="1512" height="104" rx="24" fill="#061a24" stroke="#334155"/><text x="76" y="756" class="micro">QUALIFICATION BOUNDARY</text><text x="76" y="790" class="boundary">ResinDB Pro is a local-first scientific data and analysis workbench, not a certified LIMS/ERP, commercial force field, industrial grade-release system or automatic scientific approval engine.</text><text x="48" y="866" class="micro">CURRENT MAIN · STRICT UTF-8 · NONBLANK FIGURES · COMPUTE CAPABILITY PROBE · BILINGUAL EVIDENCE</text></svg>
