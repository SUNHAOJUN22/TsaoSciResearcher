<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ResinDB Pro bilingual scientific visual integrity architecture</title>
  <desc id="desc">AI-assisted conceptual illustration showing governed resin data, Unicode-safe Chinese and English language routing, typed scientific workers, resilient chart rendering, and exact-tree validation evidence. This is not scientific data.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#111a35"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9fb7d7" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#67e8f9"/>
    </marker>
    <style>
      text{font-family:Inter,"Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei","PingFang SC","WenQuanYi Micro Hei","Segoe UI",sans-serif}
      .eyebrow{font-size:18px;letter-spacing:4px;font-weight:700;fill:#67e8f9}
      .title{font-size:46px;font-weight:760;fill:#f8fafc}
      .subtitle{font-size:20px;fill:#a9bdd7}
      .panel-title{font-size:22px;font-weight:720;fill:#f8fafc}
      .panel-subtitle{font-size:15px;fill:#93a9c5}
      .label{font-size:15px;font-weight:650;fill:#dbeafe}
      .small{font-size:13px;fill:#9fb3cc}
      .formula{font-family:"STIX Two Math","Cambria Math","Noto Sans Math","Noto Sans SC",serif;font-size:18px;fill:#e0f2fe}
      .badge{font-size:12px;font-weight:700;letter-spacing:1px;fill:#07111f}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1420" cy="130" r="250" fill="#2563eb" opacity="0.08"/>
  <circle cx="180" cy="780" r="260" fill="#7c3aed" opacity="0.07"/>

  <g transform="translate(80 68)">
    <text class="eyebrow">RESINDB PRO · GOVERNED SCIENTIFIC WORKSTATION</text>
    <text class="title" y="58">双语科研可视化完整性链路</text>
    <text class="subtitle" y="96">Bilingual scientific visualization integrity — data, language, mathematics, rendering and evidence in one auditable path</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="205" width="290" height="440" rx="28" fill="#0d2035" stroke="#1e4e70" stroke-width="2"/>
    <rect x="405" y="205" width="290" height="440" rx="28" fill="#151d3b" stroke="#4b3b82" stroke-width="2"/>
    <rect x="730" y="205" width="290" height="440" rx="28" fill="#0d2a2c" stroke="#1f6655" stroke-width="2"/>
    <rect x="1055" y="205" width="465" height="440" rx="28" fill="#182132" stroke="#635326" stroke-width="2"/>
  </g>

  <g transform="translate(108 232)">
    <rect width="116" height="28" rx="14" fill="url(#cyan)"/>
    <text class="badge" x="58" y="19" text-anchor="middle">DATA LAYER</text>
    <text class="panel-title" y="68">治理数据与语义合同</text>
    <text class="panel-subtitle" y="94">Governed data + provenance</text>

    <g transform="translate(0 130)">
      <rect width="234" height="72" rx="16" fill="#102b45" stroke="#24547a"/>
      <circle cx="28" cy="26" r="10" fill="#22d3ee"/>
      <path d="M18 42h20M15 50h26" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
      <text class="label" x="54" y="28">JSON Schema</text>
      <text class="small" x="54" y="50">value · unit · standard · source</text>
    </g>
    <g transform="translate(0 220)">
      <rect width="234" height="72" rx="16" fill="#102b45" stroke="#24547a"/>
      <path d="M20 18h32v36H20zM28 26h16M28 34h16M28 42h11" fill="none" stroke="#7dd3fc" stroke-width="2"/>
      <text class="label" x="64" y="28">Manifest + SHA-256</text>
      <text class="small" x="64" y="50">exact bytes · version envelope</text>
    </g>
    <g transform="translate(0 310)">
      <rect width="234" height="72" rx="16" fill="#102b45" stroke="#24547a"/>
      <path d="M20 38c18-24 28 24 46 0s28 24 46 0" fill="none" stroke="#67e8f9" stroke-width="3"/>
      <text class="label" x="124" y="28">材料属性不是裸数字</text>
      <text class="small" x="124" y="50">A property is not a bare scalar</text>
    </g>
  </g>

  <g transform="translate(433 232)">
    <rect width="136" height="28" rx="14" fill="url(#violet)"/>
    <text class="badge" x="68" y="19" text-anchor="middle">LANGUAGE GATE</text>
    <text class="panel-title" y="68">Unicode 安全语言路由</text>
    <text class="panel-subtitle" y="94">Unicode-safe zh/en runtime</text>

    <g transform="translate(0 126)">
      <rect width="234" height="82" rx="18" fill="#211d49" stroke="#5b4aa0"/>
      <text x="20" y="30" font-size="24" font-weight="760" fill="#ddd6fe">中文</text>
      <text x="108" y="30" font-size="24" font-weight="760" fill="#c4b5fd">English</text>
      <text class="small" x="20" y="58">zh-CN ⇄ en · persisted · typed</text>
    </g>
    <g transform="translate(0 228)">
      <rect width="234" height="64" rx="16" fill="#211d49" stroke="#5b4aa0"/>
      <text class="formula" x="18" y="28">s' = NFC(s)</text>
      <text class="small" x="18" y="50">reject U+FFFD · mojibake · controls</text>
    </g>
    <g transform="translate(0 312)">
      <rect width="234" height="70" rx="16" fill="#211d49" stroke="#5b4aa0"/>
      <path d="M22 18l18 18-18 18M51 18l-18 18 18 18" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
      <text class="label" x="74" y="28">明确回退</text>
      <text class="small" x="74" y="50">No raw key or broken glyph leakage</text>
    </g>
  </g>

  <g transform="translate(758 232)">
    <rect width="132" height="28" rx="14" fill="url(#emerald)"/>
    <text class="badge" x="66" y="19" text-anchor="middle">MATH WORKERS</text>
    <text class="panel-title" y="68">类型化科研计算内核</text>
    <text class="panel-subtitle" y="94">Typed Worker / WASM kernels</text>

    <g transform="translate(0 126)">
      <rect width="234" height="72" rx="16" fill="#103736" stroke="#257064"/>
      <text class="formula" x="18" y="29">D²=(x−μ)ᵀS⁻¹(x−μ)</text>
      <text class="small" x="18" y="52">finite inputs · regularized covariance</text>
    </g>
    <g transform="translate(0 216)">
      <rect width="234" height="72" rx="16" fill="#103736" stroke="#257064"/>
      <text class="formula" x="18" y="29">EI=(μ−f*)Φ(z)+σφ(z)</text>
      <text class="small" x="18" y="52">seeded GP candidates · explicit uncertainty</text>
    </g>
    <g transform="translate(0 306)">
      <rect width="234" height="76" rx="16" fill="#103736" stroke="#257064"/>
      <text class="formula" x="18" y="29">min Σᵢ‖xᵢ−μcᵢ‖²</text>
      <text class="small" x="18" y="52">TypeScript ⇄ calibrated WASM · f64</text>
    </g>
  </g>

  <g transform="translate(1083 232)">
    <rect width="150" height="28" rx="14" fill="url(#amber)"/>
    <text class="badge" x="75" y="19" text-anchor="middle">VISUAL + EVIDENCE</text>
    <text class="panel-title" y="68">韧性绘图与验收证据</text>
    <text class="panel-subtitle" y="94">Resilient ScientificEChart + exact-tree receipt</text>

    <g transform="translate(0 124)">
      <rect width="410" height="176" rx="20" fill="#222b3d" stroke="#806a2e"/>
      <path d="M42 136V30M42 136h322" stroke="#8191aa" stroke-width="2"/>
      <path d="M64 119C118 88 144 110 192 72s93 8 151-42" fill="none" stroke="#22d3ee" stroke-width="5" filter="url(#glow)"/>
      <circle cx="64" cy="119" r="6" fill="#a78bfa"/>
      <circle cx="192" cy="72" r="6" fill="#34d399"/>
      <circle cx="343" cy="30" r="6" fill="#fbbf24"/>
      <text class="small" x="54" y="25">CJK-safe labels · ResizeObserver fallback · theme/locale sync</text>
      <text class="small" x="262" y="158">Scientific figure</text>
    </g>
    <g transform="translate(0 322)">
      <rect width="196" height="68" rx="16" fill="#2a2d3a" stroke="#76622c"/>
      <path d="M18 18h34v34H18zM25 28l8 8 14-16" fill="none" stroke="#fbbf24" stroke-width="3"/>
      <text class="label" x="66" y="28">Chromium 真实截图</text>
      <text class="small" x="66" y="50">runtime UI evidence</text>
    </g>
    <g transform="translate(214 322)">
      <rect width="196" height="68" rx="16" fill="#2a2d3a" stroke="#76622c"/>
      <path d="M20 20h32M20 32h32M20 44h22" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <text class="label" x="66" y="28">机器验收回执</text>
      <text class="small" x="66" y="50">tests · coverage · hashes</text>
    </g>
  </g>

  <g fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.92">
    <path d="M370 425H397"/>
    <path d="M695 425H722"/>
    <path d="M1020 425H1047"/>
  </g>

  <g transform="translate(80 700)">
    <rect width="1440" height="116" rx="24" fill="#0c1728" stroke="#263a55"/>
    <text x="32" y="38" font-size="17" font-weight="700" fill="#f8fafc">统一验收不变量 / Unified acceptance invariant</text>
    <text class="formula" x="32" y="72">PASS = UTF-8 ∧ locale parity ∧ finite numerics ∧ visible chart ∧ exact source identity</text>
    <text class="small" x="32" y="98">A software PASS proves the governed implementation and evidence chain; it does not certify a material grade, experiment, force field, regulation or industrial release.</text>
  </g>

  <g transform="translate(80 850)">
    <rect width="565" height="26" rx="13" fill="#f8fafc" opacity="0.92"/>
    <text x="282" y="18" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1.1" fill="#111827">AI-ASSISTED CONCEPTUAL ILLUSTRATION · NOT SCIENTIFIC DATA</text>
    <text x="1440" y="18" text-anchor="end" font-size="13" fill="#7f96b3">ResinDB Pro · Version 3.2.0</text>
  </g>
</svg>
