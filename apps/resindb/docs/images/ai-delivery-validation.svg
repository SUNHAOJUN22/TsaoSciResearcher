    <rect width="270" height="490" rx="25" fill="#101d32" stroke="#818cf8" stroke-width="2"/>
    <rect x="20" y="20" width="64" height="30" rx="15" fill="#818cf8"/><text class="badge" x="52" y="41" text-anchor="middle">STEP 2</text>
    <text class="h" x="22" y="92">STATIC</text><text class="b" x="22" y="121">静态质量</text>
    <circle cx="135" cy="194" r="52" fill="none" stroke="#818cf8" stroke-width="5"/>
    <path d="M105 195l20 20 43-52" fill="none" stroke="#818cf8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="32" cy="295" r="6" fill="#818cf8"/><text class="b" x="50" y="300">ESLint</text><circle cx="32" cy="341" r="6" fill="#818cf8"/><text class="b" x="50" y="346">TypeScript</text><circle cx="32" cy="387" r="6" fill="#818cf8"/><text class="b" x="50" y="392">source hygiene</text><circle cx="32" cy="433" r="6" fill="#818cf8"/><text class="b" x="50" y="438">scientific UI audit</text></g><path d="M655 435h20" stroke="#94a3b8" stroke-width="4"/><path d="M675 435l-12-8v16z" fill="#94a3b8"/><g transform="translate(680 190)" filter="url(#shadow)">
    <rect width="270" height="490" rx="25" fill="#101d32" stroke="#c084fc" stroke-width="2"/>
    <rect x="20" y="20" width="64" height="30" rx="15" fill="#c084fc"/><text class="badge" x="52" y="41" text-anchor="middle">STEP 3</text>
    <text class="h" x="22" y="92">TEST</text><text class="b" x="22" y="121">数理与回归</text>
    <circle cx="135" cy="194" r="52" fill="none" stroke="#c084fc" stroke-width="5"/>
    <path d="M105 195l20 20 43-52" fill="none" stroke="#c084fc" stroke-width="7" stroke-linecap="round"/>
    <circle cx="32" cy="295" r="6" fill="#c084fc"/><text class="b" x="50" y="300">unit + science</text><circle cx="32" cy="341" r="6" fill="#c084fc"/><text class="b" x="50" y="346">Worker isolation</text><circle cx="32" cy="387" r="6" fill="#c084fc"/><text class="b" x="50" y="392">whole-source coverage</text><circle cx="32" cy="433" r="6" fill="#c084fc"/><text class="b" x="50" y="438">deterministic benchmark</text></g><path d="M955 435h20" stroke="#94a3b8" stroke-width="4"/><path d="M975 435l-12-8v16z" fill="#94a3b8"/><g transform="translate(980 190)" filter="url(#shadow)">
    <rect width="270" height="490" rx="25" fill="#101d32" stroke="#34d399" stroke-width="2"/>
    <rect x="20" y="20" width="64" height="30" rx="15" fill="#34d399"/><text class="badge" x="52" y="41" text-anchor="middle">STEP 4</text>
    <text class="h" x="22" y="92">RUNTIME</text><text class="b" x="22" y="121">真实界面</text>
