    <path d="M105 195l20 20 43-52" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
    <circle cx="32" cy="295" r="6" fill="#34d399"/><text class="b" x="50" y="300">production build</text><circle cx="32" cy="341" r="6" fill="#34d399"/><text class="b" x="50" y="346">HTTP smoke</text><circle cx="32" cy="387" r="6" fill="#34d399"/><text class="b" x="50" y="392">Chromium interaction</text><circle cx="32" cy="433" r="6" fill="#34d399"/><text class="b" x="50" y="438">zh/en theme evidence</text></g><path d="M1255 435h20" stroke="#94a3b8" stroke-width="4"/><path d="M1275 435l-12-8v16z" fill="#94a3b8"/><g transform="translate(1280 190)" filter="url(#shadow)">
    <rect width="270" height="490" rx="25" fill="#101d32" stroke="#fbbf24" stroke-width="2"/>
    <rect x="20" y="20" width="64" height="30" rx="15" fill="#fbbf24"/><text class="badge" x="52" y="41" text-anchor="middle">STEP 5</text>
    <text class="h" x="22" y="92">DELIVER</text><text class="b" x="22" y="121">交付证据</text>
    <circle cx="135" cy="194" r="52" fill="none" stroke="#fbbf24" stroke-width="5"/>
    <path d="M105 195l20 20 43-52" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
    <circle cx="32" cy="295" r="6" fill="#fbbf24"/><text class="b" x="50" y="300">dependency audit</text><circle cx="32" cy="341" r="6" fill="#fbbf24"/><text class="b" x="50" y="346">exact-tree archive</text><circle cx="32" cy="387" r="6" fill="#fbbf24"/><text class="b" x="50" y="392">HTML/PDF receipt</text><circle cx="32" cy="433" r="6" fill="#fbbf24"/><text class="b" x="50" y="438">hash + authority</text></g><g transform="translate(80 716)"><rect width="1470" height="92" rx="22" fill="#0b1728" stroke="#334155"/>
<text class="h" x="28" y="36">验收方程 / Acceptance equation</text>
<text class="math" x="28" y="68">PASS = docs ∧ i18n ∧ finite numerics ∧ tests ∧ coverage ∧ build ∧ Chromium ∧ audit ∧ exact-tree</text></g><g transform="translate(80 842)">
<rect width="570" height="28" rx="14" fill="#f8fafc" opacity=".94"/>
<text x="285" y="19" text-anchor="middle" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei','PingFang SC','WenQuanYi Micro Hei','Segoe UI',sans-serif" font-size="12" font-weight="800" letter-spacing="1" fill="#111827">AI-ASSISTED CONCEPTUAL ILLUSTRATION · NOT SCIENTIFIC DATA</text>
<text x="1440" y="20" text-anchor="end" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei','PingFang SC','WenQuanYi Micro Hei','Segoe UI',sans-serif" font-size="13" fill="#93a4bb">ResinDB Pro · Delivery validation architecture</text>
</g></svg>
