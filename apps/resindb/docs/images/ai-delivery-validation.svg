<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ResinDB Pro delivery strategy and validation evidence</title>
<desc id="desc">AI-assisted conceptual diagram of code quality gates, runtime proof, security, reproducibility and delivery evidence. Not test output.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06121f"/><stop offset="1" stop-color="#172554"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".38"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#cbd5e1" stroke-opacity=".06"/></pattern>
  <style>
    text{font-family:Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei','PingFang SC','WenQuanYi Micro Hei','Segoe UI',sans-serif}
    .eyebrow{font-size:17px;letter-spacing:3px;font-weight:700;fill:#67e8f9}
    .title{font-size:48px;font-weight:800;fill:#f8fafc}
    .sub{font-size:20px;fill:#bacbe0}
    .h{font-size:23px;font-weight:750;fill:#f8fafc}
    .b{font-size:16px;fill:#cbd5e1}
    .s{font-size:13px;fill:#94a3b8}
    .math{font-family:'STIX Two Math','Cambria Math','Noto Sans Math','Noto Sans SC',serif;font-size:20px;fill:#e0f2fe}
    .badge{font-size:12px;font-weight:800;letter-spacing:1px;fill:#07111f}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<g transform="translate(80 62)"><text class="eyebrow">EXACT-TREE DELIVERY STRATEGY</text><text class="title" y="58">交付策略、浏览器证据与验收闭环</text><text class="sub" y="96">Code quality · runtime proof · reproducibility · machine-readable acceptance</text></g><g transform="translate(80 190)" filter="url(#shadow)">
    <rect width="270" height="490" rx="25" fill="#101d32" stroke="#22d3ee" stroke-width="2"/>
    <rect x="20" y="20" width="64" height="30" rx="15" fill="#22d3ee"/><text class="badge" x="52" y="41" text-anchor="middle">STEP 1</text>
    <text class="h" x="22" y="92">SOURCE</text><text class="b" x="22" y="121">受控源码</text>
