    <circle cx="38" cy="205" r="7" fill="#f59e0b"/><text class="b" x="58" y="210">observable vs fit</text><circle cx="38" cy="267" r="7" fill="#f59e0b"/><text class="b" x="58" y="272">proxy vs measurement</text><circle cx="38" cy="329" r="7" fill="#f59e0b"/><text class="b" x="58" y="334">accessible SVG/Canvas</text><circle cx="38" cy="391" r="7" fill="#f59e0b"/><text class="b" x="58" y="396">exact-tree evidence</text><path d="M38 430V330M38 430H292" stroke="#64748b" stroke-width="2"/>
    <path d="M50 406 C90 380 115 414 154 365 S220 392 280 338" fill="none" stroke="#f59e0b" stroke-width="4" filter="url(#glow)"/>
    <circle cx="50" cy="406" r="5" fill="#f8fafc"/><circle cx="154" cy="365" r="5" fill="#f8fafc"/><circle cx="280" cy="338" r="5" fill="#f8fafc"/>
    </g><g transform="translate(90 726)"><rect width="1420" height="82" rx="22" fill="#0b1728" stroke="#334155"/>
<text class="h" x="28" y="34">决策不变量 / Decision invariant</text>
