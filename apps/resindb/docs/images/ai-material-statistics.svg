    <path d="M50 406 C90 380 115 414 154 365 S220 392 280 338" fill="none" stroke="#8b5cf6" stroke-width="4" filter="url(#glow)"/>
    <circle cx="50" cy="406" r="5" fill="#f8fafc"/><circle cx="154" cy="365" r="5" fill="#f8fafc"/><circle cx="280" cy="338" r="5" fill="#f8fafc"/>
    </g><g transform="translate(820 190)" filter="url(#shadow)">
