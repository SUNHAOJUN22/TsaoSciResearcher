      <line x1="24" y1="160" x2="306" y2="160" stroke="#64748b" stroke-opacity=".35"/>
    <circle cx="38" cy="205" r="7" fill="#10b981"/><text class="b" x="58" y="210">sampling uncertainty</text><circle cx="38" cy="267" r="7" fill="#10b981"/><text class="b" x="58" y="272">model-form boundary</text><circle cx="38" cy="329" r="7" fill="#10b981"/><text class="b" x="58" y="334">confidence ≠ causality</text><circle cx="38" cy="391" r="7" fill="#10b981"/><text class="b" x="58" y="396">domain checks</text><path d="M38 430V330M38 430H292" stroke="#64748b" stroke-width="2"/>
    <path d="M50 406 C90 380 115 414 154 365 S220 392 280 338" fill="none" stroke="#10b981" stroke-width="4" filter="url(#glow)"/>
