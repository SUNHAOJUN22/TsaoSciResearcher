    </g><g transform="translate(1185 190)" filter="url(#shadow)">
      <rect width="330" height="500" rx="26" fill="#0d2034" stroke="#f59e0b" stroke-width="2"/>
      <rect x="22" y="22" width="142" height="28" rx="14" fill="#f59e0b"/><text class="badge" x="93" y="41" text-anchor="middle">SCIENTIFIC VISUAL</text>
      <text class="h" x="24" y="91">科研可视化</text><text class="math" x="24" y="135">PASS=finite∧visible∧labeled</text>
