    </g><g transform="translate(455 190)" filter="url(#shadow)">
      <rect width="330" height="500" rx="26" fill="#0d2034" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="22" y="22" width="142" height="28" rx="14" fill="#8b5cf6"/><text class="badge" x="93" y="41" text-anchor="middle">ROBUST STATISTICS</text>
