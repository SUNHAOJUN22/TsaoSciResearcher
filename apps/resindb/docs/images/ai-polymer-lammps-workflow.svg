<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ResinDB Pro polymer physics and LAMMPS workflow</title>
<desc id="desc">AI-assisted conceptual diagram of polymer repeat-unit curation, topology generation, force-field boundary, LAMMPS execution contract and validation. Not simulation output.</desc>
<defs>
