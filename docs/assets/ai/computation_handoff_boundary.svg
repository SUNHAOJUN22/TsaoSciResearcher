rial,sans-serif" font-size="15" fill="#9eb3c8">HPC · laboratory instruments</text><text x="974" y="327" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">databases and retrieval tools</text><path d="M450,310 C485.0,310 485.0,310 520,310" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><text x="485.0" y="302.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9eb3c8">authorize</text><path d="M880,310 C915.0,310 915.0,310 950,310" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><text x="915.0" y="302.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9eb3c8">execute</text><rect x="300" y="530" width="360" height="150" rx="20" fill="#132b46" stroke="#55e6a5" stroke-opacity=".55" filter="url(#shadow)"/><rect x="300" y="530" width="360" height="8" rx="4" fill="#55e6a5"/><text x="324" y="572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Execution Receipt</text><text x="324" y="604" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">timestamps · outputs · hashes</text><text x="324" y="628" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">status · logs · limitations</text><rect x="740" y="530" width="360" height="150" rx="20" fill="#132b46" stroke="#ff6f91" stroke-opacity=".55" filter="url(#shadow)"/><rect x="740" y="530" width="360" height="8" rx="4" fill="#ff6f91"/><text x="764" y="572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Truth Boundary</text><text x="764" y="604" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">a planned handoff is not execution</text><text x="764" y="628" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">claims require returned receipts</text><path d="M1130,415 C1015.