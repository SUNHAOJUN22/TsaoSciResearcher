<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Decision Observable Uncertainty Budget</title>
  <desc id="desc">Conceptual diagram of parameter, numerical, sampling, model-form and scale-transfer uncertainties propagating to a decision observable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f4f7a"/><stop offset="1" stop-color="#4f7ca6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b2239" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#315e86"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="90" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#163a5b">Decision-Observable Uncertainty Budget</text>
  <text x="80" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#536b82">Every uncertainty source must reach the quantity used for acceptance</text>
  <rect x="170" y="195" width="1260" height="120" rx="28" fill="#ffffff" stroke="#c7d7e7" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="250" text-anchor="middle" font-family="Cambria Math,STIX Two Math,serif" font-size="33" fill="#183f61">Σ_y ≈ J Σ_θ Jᵀ + Σ_num + Σ_sample + Σ_model + Σ_transfer</text>
  <text x="800" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#536b82">Conceptual propagation requirement · numerical covariance analysis remains external</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="75" y="420" width="245" height="120" rx="24" fill="#ffffff" stroke="#7ca0bf" stroke-width="3"/><text x="197" y="468" font-size="24" font-weight="700" fill="#214d73">Parameters</text><text x="197" y="505" font-size="19" fill="#536b82">Σθ</text>
    <rect x="375" y="420" width="245" height="120" rx="24" fill="#ffffff" stroke="#7ca0bf" stroke-width="3"/><text x="497" y="468" font-size="24" font-weight="700" fill="#214d73">Numerics</text><text x="497" y="505" font-size="19" fill="#536b82">discretisation · convergence</text>
    <rect x="675" y="420" width="245" height="120" rx="24" fill="#ffffff" stroke="#7ca0bf" stroke-width="3"/><text x="797" y="468" font-size="24" font-weight="700" fill="#214d73">Sampling</text><text x="797" y="505" font-size="19" fill="#536b82">ensemble · replication</text>
    <rect x="975" y="420" width="245" height="120" rx="24" fill="#ffffff" stroke="#7ca0bf" stroke-width="3"/><text x="1097" y="468" font-size="24" font-weight="700" fill="#214d73">Model Form</text><text x="1097" y="505" font-size="19" fill="#536b82">closure · assumptions</text>
    <rect x="1275" y="420" width="245" height="120" rx="24" fill="#ffffff" stroke="#7ca0bf" stroke-width="3"/><text x="1397" y="468" font-size="24" font-weight="700" fill="#214d73">Scale Transfer</text><text x="1397" y="505" font-size="19" fill="#536b82">mapping · extrapolation</text>
  </g>
  <g stroke="#315e86" stroke-width="4" marker-end="url(#arrow)"><line x1="197" y1="550" x2="620" y2="685"/><line x1="497" y1="550" x2="700" y2="685"/><line x1="797" y1="550" x2="800" y2="685"/><line x1="1097" y1="550" x2="900" y2="685"/><line x1="1397" y1="550" x2="980" y2="685"/></g>
  <rect x="565" y="685" width="470" height="105" rx="28" fill="url(#accent)" filter="url(#shadow)"/>
  <text x="800" y="730" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#ffffff">Decision Observable y</text><text x="800" y="767" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#e8f3fc">threshold · confidence · acceptance consequence</text>
  <text x="80" y="858" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#61758a">AI-generated conceptual illustration for documentation only · 非实验或仿真结果</text>
</svg>
