<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">Capability implementation levels</title><desc id="desc">Shows native, computation-delegated and human-review capability counts.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3dd9ff"/></marker></defs><rect width="1400" height="820" fill="#07111f" rx="28"/><rect x="36" y="28" width="1328" height="100" rx="22" fill="#10263d" stroke="#284966"/><rect x="36" y="28" width="10" height="100" rx="5" fill="#3dd9ff"/><text x="76" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#eef7ff">Capability Implementation Levels</text><text x="76" y="104" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#a7bed3">341 capability contracts are discoverable; execution responsibility is explicit</text><text x="80" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Native research</text><rect x="350" y="190" width="850" height="58" rx="18" fill="#0d2034" stroke="#284966"/><rect x="350" y="190" width="740.0" height="58" rx="18" fill="#55e6a5" opacity=".8"/><text x="1225" y="228" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#eef7ff">148</text><text x="350" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#a7bed3">deterministic core or repository validators</text><text x="80" y="392" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Computation delegated</text><rect x="350" y="360" width="850" height="58" rx="18" fill="#0d2034" stroke="#284966"/><rect x="350" y="360" width="850.0" height="58" rx="18" fill="#aa7cff" opacity=".8"/><text x="1225" y="398" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#eef7ff">170</text><text x="350" y="448" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#a7bed3">real external solver, database, model or instrument</text><text x="80" y="562" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Human review</text><rect x="350" y="530" width="850" height="58" rx="18" fill="#0d2034" stroke="#284966"/><rect x="350" y="530" width="115.0" height="58" rx="18" fill="#ffb86b" opacity=".8"/><text x="1225" y="568" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#eef7ff">23</text><text x="350" y="618" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#a7bed3">qualified approval required before acceptance</text><rect x="400" y="690" width="600" height="70" rx="18" fill="#10263d" stroke="#ff6f91" stroke-opacity=".7"/><rect x="400" y="690" width="600" height="7" rx="3" fill="#ff6f91"/><text x="422" y="728" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#eef7ff">Interpretation</text><text x="422" y="758" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">A named capability is metadata + routing + gates; it is not proof of execution.</text><text x="1360" y="792" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#6f8aa5">TsaoSciResearcher v0.7.0 · documentation diagram</text></svg>
