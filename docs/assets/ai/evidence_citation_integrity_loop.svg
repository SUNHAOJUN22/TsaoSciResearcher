<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">Evidence and citation integrity loop</title><desc id="desc">Shows traceability from sources to evidence, claims, citations, conflicts and decisions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3dd9ff"/></marker></defs><rect width="1400" height="820" fill="#07111f" rx="28"/><rect x="36" y="28" width="1328" height="100" rx="22" fill="#10263d" stroke="#284966"/><rect x="36" y="28" width="10" height="100" rx="5" fill="#3dd9ff"/><text x="76" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#eef7ff">Evidence → Claim → Citation → Decision Integrity Loop</text><text x="76" y="104" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#a7bed3">Every important conclusion must remain traceable to a source location, data artifact, observation, or verified computation receipt</text><rect x="130" y="260" width="250" height="150" rx="18" fill="#10263d" stroke="#3dd9ff" stroke-opacity=".7"/><rect x="130" y="260" width="250" height="7" rx="3" fill="#3dd9ff"/><text x="152" y="298" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#eef7ff">Source locator</text><text x="152" y="328" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">paper · dataset · instrument</text><rect x="430" y="180" width="250" height="150" rx="18" fill="#10263d" stroke="#5d8cff" stroke-opacity=".7"/><rect x="430" y="180" width="250" height="7" rx="3" fill="#5d8cff"/><text x="452" y="218" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#eef7ff">Evidence record</text><text x="452" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">method · conditions · values</text><rect x="760" y="180" width="250" height="150" rx="18" fill="#10263d" stroke="#aa7cff" stroke-opacity=".7"/><rect x="760" y="180" width="250" height="7" rx="3" fill="#aa7cff"/><text x="782" y="218" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#eef7ff">Claim</text><text x="782" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">scope · direction · strength</text><rect x="1060" y="260" width="250" height="150" rx="18" fill="#10263d" stroke="#ffb86b" stroke-opacity=".7"/><rect x="1060" y="260" width="250" height="7" rx="3" fill="#ffb86b"/><text x="1082" y="298" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#eef7ff">Citation audit</text><text x="1082" y="328" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">existence · position · support</text><rect x="760" y="500" width="250" height="150" rx="18" fill="#10263d" stroke="#55e6a5" stroke-opacity=".7"/><rect x="760" y="500" width="250" height="7" rx="3" fill="#55e6a5"/><text x="782" y="538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#eef7ff">Decision</text><text x="782" y="568" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">accept · revise · reject</text><rect x="430" y="500" width="250" height="150" rx="18" fill="#10263d" stroke="#ff6f91" stroke-opacity=".7"/><rect x="430" y="500" width="250" height="7" rx="3" fill="#ff6f91"/><text x="452" y="538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#eef7ff">Conflict ledger</text><text x="452" y="568" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#a7bed3">contradiction · applicability</text><path d="M380,330 L430,255" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><text x="405.0" y="282.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#a7bed3">extract</text><path d="M680,255 L760,255" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><text x="720.0" y="245.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#a7bed3">support edge</text><path d="M1010,255 L1060,330" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><text x="1035.0" y="282.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#a7bed3">verify</text><path d="M1185,410 L885,500" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><text x="1035.0" y="445.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#a7bed3">gate</text><path d="M760,575 L680,575" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><text x="720.0" y="565.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#a7bed3">record</text><path d="M430,575 L255,410" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)"/><text x="342.5" y="482.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#a7bed3">re-check</text><text x="1360" y="792" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#6f8aa5">TsaoSciResearcher v0.6.0 · documentation diagram</text></svg>