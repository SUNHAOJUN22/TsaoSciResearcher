<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Scientific Figure Edit Guard</title><desc id="desc">A figure-edit contract locks scientific content, permits only declared presentation changes, and requires a visual diff and approval record.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071629"/><stop offset="1" stop-color="#123a59"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38d9ff"/><stop offset="1" stop-color="#9b7cff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66ddff"/></marker></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="70" y="72" font-size="36" font-weight="700" fill="#f4fbff">Scientific Figure Edit Guard</text>
<text x="70" y="108" font-size="18" fill="#b7cada">Fix the requested defect without silently redrawing the experiment.</text>
<rect x="70" y="170" width="260" height="150" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="94" y="210" font-size="21" font-weight="700" fill="#f4fbff">Original figure</text><text x="94" y="240" font-size="15" fill="#b7cada">pixels / vectors / data</text><text x="94" y="264" font-size="15" fill="#b7cada">hash and dimensions</text><rect x="400" y="170" width="260" height="150" rx="18" fill="#102d49" stroke="#3dd9ff" stroke-width="2"/><text x="424" y="210" font-size="21" font-weight="700" fill="#f4fbff">Edit contract</text><text x="424" y="240" font-size="15" fill="#b7cada">allowed regions</text><text x="424" y="264" font-size="15" fill="#b7cada">locked content</text><text x="424" y="288" font-size="15" fill="#b7cada">target resolution</text><rect x="730" y="170" width="260" height="150" rx="18" fill="#102d49" stroke="#9b7cff" stroke-width="2"/><text x="754" y="210" font-size="21" font-weight="700" fill="#f4fbff">Controlled edit</text><text x="754" y="240" font-size="15" fill="#b7cada">labels · defects · layout</text><text x="754" y="264" font-size="15" fill="#b7cada">no silent data changes</text><rect x="1060" y="170" width="270" height="150" rx="18" fill="#102d49" stroke="#ffbe65" stroke-width="2"/><text x="1084" y="210" font-size="21" font-weight="700" fill="#f4fbff">Visual diff &amp; QA</text><text x="1084" y="240" font-size="15" fill="#b7cada">overlay / geometry checks</text><text x="1084" y="264" font-size="15" fill="#b7cada">legibility and export</text><path d="M330 245 L390 245" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M660 245 L720 245" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M990 245 L1050 245" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="160" y="430" width="310" height="135" rx="18" fill="#102d49" stroke="#ff7fa0" stroke-width="2"/><text x="184" y="470" font-size="21" font-weight="700" fill="#f4fbff">Locked scientific content</text><text x="184" y="500" font-size="15" fill="#b7cada">curves · scale bars · data points</text><text x="184" y="524" font-size="15" fill="#b7cada">panel identity · relative geometry</text><rect x="545" y="430" width="310" height="135" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="569" y="470" font-size="21" font-weight="700" fill="#f4fbff">Permitted presentation edits</text><text x="569" y="500" font-size="15" fill="#b7cada">translation · line repair · spacing</text><text x="569" y="524" font-size="15" fill="#b7cada">font clarity · crop contract</text><rect x="930" y="430" width="310" height="135" rx="18" fill="#102d49" stroke="#3dd9ff" stroke-width="2"/><text x="954" y="470" font-size="21" font-weight="700" fill="#f4fbff">Approval record</text><text x="954" y="500" font-size="15" fill="#b7cada">before/after hashes</text><text x="954" y="524" font-size="15" fill="#b7cada">changed regions and reviewer</text>
<rect x="70" y="682" width="1260" height="44" rx="14" fill="#0b2035" stroke="url(#accent)"/>
<text x="100" y="711" font-size="16" fill="#d7e8f5">Presentation enhancement is not data reconstruction · every changed region must be declared</text>
</g></svg>
