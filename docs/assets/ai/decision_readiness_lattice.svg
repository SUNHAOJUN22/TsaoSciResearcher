<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Conservative Decision Readiness Lattice</title>
  <desc id="desc">Conceptual diagram showing how quantity, applicability, evidence, identifiability and multiscale bridge gates aggregate conservatively into block, review or pass.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f4f7a"/><stop offset="1" stop-color="#4f7ca6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b2239" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="90" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#163a5b">Conservative Decision-Readiness Lattice</text>
  <text x="80" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#536b82">The weakest mandatory scientific contract controls the aggregate state</text>
  <rect x="130" y="205" width="1340" height="130" rx="28" fill="#ffffff" stroke="#c7d7e7" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="260" text-anchor="middle" font-family="Cambria Math,STIX Two Math,serif" font-size="36" fill="#183f61">G = min(g_quantity, g_applicability, g_evidence, g_identifiability, g_bridge)</text>
  <text x="800" y="308" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#536b82">No average score can hide a blocking scientific defect</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="105" y="410" width="250" height="120" rx="24" fill="#ffffff" stroke="#7ca0bf" stroke-width="3"/><text x="230" y="458" font-size="24" font-weight="700" fill="#214d73">Quantity</text><text x="230" y="494" font-size="19" fill="#536b82">units · dimensions</text>
    <rect x="390" y="410" width="250" height="120" rx="24" fill="#ffffff" stroke="#7ca0bf" stroke-width="3"/><text x="515" y="458" font-size="24" font-weight="700" fill="#214d73">Applicability</text><text x="515" y="494" font-size="19" fill="#536b82">domain · extrapolation</text>
    <rect x="675" y="410" width="250" height="120" rx="24" fill="#ffffff" stroke="#7ca0bf" stroke-width="3"/><text x="800" y="458" font-size="24" font-weight="700" fill="#214d73">Evidence</text><text x="800" y="494" font-size="19" fill="#536b82">support · challenge</text>
    <rect x="960" y="410" width="250" height="120" rx="24" fill="#ffffff" stroke="#7ca0bf" stroke-width="3"/><text x="1085" y="458" font-size="24" font-weight="700" fill="#214d73">Identifiability</text><text x="1085" y="494" font-size="19" fill="#536b82">mechanisms · parameters</text>
    <rect x="1245" y="410" width="250" height="120" rx="24" fill="#ffffff" stroke="#7ca0bf" stroke-width="3"/><text x="1370" y="458" font-size="24" font-weight="700" fill="#214d73">Scale Bridge</text><text x="1370" y="494" font-size="19" fill="#536b82">mapping · validation</text>
  </g>
  <g stroke="#315e86" stroke-width="4"><line x1="230" y1="540" x2="600" y2="650"/><line x1="515" y1="540" x2="690" y2="650"/><line x1="800" y1="540" x2="800" y2="650"/><line x1="1085" y1="540" x2="910" y2="650"/><line x1="1370" y1="540" x2="1000" y2="650"/></g>
  <rect x="500" y="650" width="600" height="110" rx="28" fill="url(#accent)" filter="url(#shadow)"/>
  <text x="800" y="695" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">BLOCK &lt; REVIEW-REQUIRED &lt; PASS</text>
  <text x="800" y="735" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#e8f3fc">PASS = ready for qualified human review, not automatic approval</text>
  <text x="80" y="858" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#61758a">AI-generated conceptual illustration for documentation only · 非实验或仿真结果</text>
</svg>
