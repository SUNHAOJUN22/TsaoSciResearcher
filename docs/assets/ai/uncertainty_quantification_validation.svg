<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Uncertainty Quantification &amp; Model Validation</title><desc id="desc">Parameter, numerical, sampling, boundary, model-form, and scale-transfer uncertainty are propagated and tested against independent evidence.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071629"/><stop offset="1" stop-color="#123a59"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38d9ff"/><stop offset="1" stop-color="#9b7cff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66ddff"/></marker></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="70" y="72" font-size="36" font-weight="700" fill="#f4fbff">Uncertainty Quantification &amp; Model Validation</text>
<text x="70" y="108" font-size="18" fill="#b7cada">A model is useful only when uncertainty reaches the decision—not when one curve looks convincing.</text>
<rect x="70" y="160" width="260" height="390" rx="18" fill="#102d49" stroke="#ffbe65" stroke-width="2"/><text x="94" y="200" font-size="21" font-weight="700" fill="#f4fbff">Uncertainty sources</text><text x="94" y="230" font-size="15" fill="#b7cada">parameters</text><text x="94" y="254" font-size="15" fill="#b7cada">numerics</text><text x="94" y="278" font-size="15" fill="#b7cada">sampling</text><text x="94" y="302" font-size="15" fill="#b7cada">boundary conditions</text><text x="94" y="326" font-size="15" fill="#b7cada">model form</text><text x="94" y="350" font-size="15" fill="#b7cada">scale transfer</text><rect x="470" y="205" width="460" height="170" rx="18" fill="#102d49" stroke="#9b7cff" stroke-width="2"/><text x="494" y="245" font-size="21" font-weight="700" fill="#f4fbff">Prediction distribution</text><text x="494" y="275" font-size="15" fill="#b7cada">not a single best-fit curve</text><text x="494" y="299" font-size="15" fill="#b7cada">propagate covariance to the observable</text><text x="494" y="323" font-size="15" fill="#b7cada">report calibration and extrapolation domains</text><rect x="1070" y="160" width="260" height="390" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="1094" y="200" font-size="21" font-weight="700" fill="#f4fbff">Validation evidence</text><text x="1094" y="230" font-size="15" fill="#b7cada">units and limits</text><text x="1094" y="254" font-size="15" fill="#b7cada">mesh / basis / time-step</text><text x="1094" y="278" font-size="15" fill="#b7cada">replicates and ESS</text><text x="1094" y="302" font-size="15" fill="#b7cada">hold-out experiments</text><text x="1094" y="326" font-size="15" fill="#b7cada">competing mechanisms</text><text x="1094" y="350" font-size="15" fill="#b7cada">closure tests</text><path d="M330 355 L460 290" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M930 290 L1060 355" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="470" y="450" width="460" height="120" rx="18" fill="#102d49" stroke="#3dd9ff" stroke-width="2"/><text x="494" y="490" font-size="21" font-weight="700" fill="#f4fbff">Decision test</text><text x="494" y="520" font-size="15" fill="#b7cada">probability of crossing the decision threshold</text><text x="494" y="544" font-size="15" fill="#b7cada">sensitivity, identifiability and model discrepancy</text><path d="M700 375 L700 440" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="682" width="1260" height="44" rx="14" fill="#0b2035" stroke="url(#accent)"/>
<text x="100" y="711" font-size="16" fill="#d7e8f5">Convergence ≠ validity · agreement with one dataset ≠ mechanism proof · extrapolation must be labelled</text>
</g></svg>
