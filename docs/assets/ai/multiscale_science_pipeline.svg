<text x="76" y="110" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#9eb3c8">Connect experiments, computation and engineering without skipping evidence boundaries.</text>
<rect x="65" y="245" width="220" height="200" rx="20" fill="#132b46" stroke="#3dd9ff" stroke-opacity=".55" filter="url(#shadow)"/><rect x="65" y="245" width="220" height="8" rx="4" fill="#3dd9ff"/><text x="89" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Question &amp; Hypothesis</text><text x="89" y="319" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">bounded scientific question</text><text x="89" y="343" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">falsifiable alternatives</text><rect x="330" y="245" width="220" height="200" rx="20" fill="#132b46" stroke="#55e6a5" stroke-opacity=".55" filter="url(#shadow)"/><rect x="330" y="245" width="220" height="8" rx="4" fill="#55e6a5"/><text x="354" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Experiment &amp; Data</text><text x="354" y="319" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">measurement boundary</text><text x="354" y="343" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">calibration and uncertainty</text><rect x="595" y="245" width="220" height="200" rx="20" fill="#132b46" stroke="#ffb86b" stroke-opacity=".55" filter="url(#shadow)"/><rect x="595" y="245" width="220" height="8" rx="4" fill="#ffb86b"/><text x="619" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Computation</text><text x="619" y="319" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">DFT / MD / FEM / CFD</text><text x="619" y="343" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">receipts and convergence</text><rect x="860" y="245" width="220" height="200" rx="20" fill="#132b46" stroke="#aa7cff" stroke-opacity=".55" filter="url(#shadow)"/><rect x="860" y="245" width="220" height="8" rx="4" fill="#aa7cff"/><text x="884" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Scale Bridging</text><text x="884" y="319" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">mechanism and mediator</text><text x="884" y="343" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">conservation constraints</text><rect x="1125" y="245" width="220" height="200" rx="20" fill="#132b46" stroke="#ff6f91" stroke-opacity=".55" filter="url(#shadow)"/><rect x="1125" y="245" width="220" height="8" rx="4" fill="#ff6f91"/><text x="1149" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Engineering Decision</text><text x="1149" y="319" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">applicability domain</text><text x="1149" y="343" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">risk and validation plan</text><path d="M285,345 C307.5,345 307.5,345 330,345" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><path d="M550,345 C572.5,345 572.5,345 595,345" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><path d="M815,345 C837.5,345 837.5,345 860,345" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><path d="M1080,345 C1102.5,345 1102.5,345 1125,345" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><rect x="260" y="540" width="360" height="145" rx="20" fill="#132b46" stroke="#5d8cff" stroke-opacity=".55" filter="url(#shadow)"/><rect x="260" y="540" width="360" height="8" rx="4" fill="#5d8cff"/><text x="284" y="582" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Statistical Physics Backbone</text><text x="284" y="614" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">distributions · ensembles · fluctuations</text><text x="284" y="638" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">non-equilibrium and uncertainty constraints</text><rect x="780" y="540" width="360" height="145" rx="20" fill="#132b46" stroke="#55e6a5" stroke-opacity=".55" filter="url(#shadow)"/><rect x="780" y="540" width="360" height="8" rx="4" fill="#55e6a5"/><text x="804" y="582" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Industrial Translation</text><text x="804" y="614" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">material / energy balances · scale-up</text><text x="804" y="638" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">process windows · verification milestones</text><path d="M620,612 C700.0,612 700.0,612 780,612" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><text x="700.0" y="604.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9eb3c8">bridge</text>
<text x="1360" y="790" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#6f8aa5">TsaoSciResearcher · evidence-first scientific AI</text>
