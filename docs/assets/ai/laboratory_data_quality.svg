<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Laboratory &amp; Data Quality Chain</title><desc id="desc">Sample provenance, calibration, measurement conditions, raw data, quality control, uncertainty, and acceptance remain traceable.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071629"/><stop offset="1" stop-color="#123a59"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38d9ff"/><stop offset="1" stop-color="#9b7cff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66ddff"/></marker></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="70" y="72" font-size="36" font-weight="700" fill="#f4fbff">Laboratory &amp; Data Quality Chain</text>
<text x="70" y="108" font-size="18" fill="#b7cada">A result cannot outrun its sample identity, calibration status or measurement boundary.</text>
<rect x="55" y="175" width="220" height="150" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="79" y="215" font-size="21" font-weight="700" fill="#f4fbff">Sample provenance</text><text x="79" y="245" font-size="15" fill="#b7cada">identity · batch · history</text><text x="79" y="269" font-size="15" fill="#b7cada">chain of custody</text><rect x="330" y="175" width="220" height="150" rx="18" fill="#102d49" stroke="#3dd9ff" stroke-width="2"/><text x="354" y="215" font-size="21" font-weight="700" fill="#f4fbff">Calibration</text><text x="354" y="245" font-size="15" fill="#b7cada">reference standard</text><text x="354" y="269" font-size="15" fill="#b7cada">traceability · uncertainty</text><rect x="605" y="175" width="220" height="150" rx="18" fill="#102d49" stroke="#9b7cff" stroke-width="2"/><text x="629" y="215" font-size="21" font-weight="700" fill="#f4fbff">Measurement</text><text x="629" y="245" font-size="15" fill="#b7cada">conditions · instrument</text><text x="629" y="269" font-size="15" fill="#b7cada">raw signal retained</text><rect x="880" y="175" width="220" height="150" rx="18" fill="#102d49" stroke="#ffbe65" stroke-width="2"/><text x="904" y="215" font-size="21" font-weight="700" fill="#f4fbff">QC &amp; statistics</text><text x="904" y="245" font-size="15" fill="#b7cada">blanks · controls · replicates</text><text x="904" y="269" font-size="15" fill="#b7cada">outlier rule declared</text><rect x="1155" y="175" width="190" height="150" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="1179" y="215" font-size="21" font-weight="700" fill="#f4fbff">Evidence</text><text x="1179" y="245" font-size="15" fill="#b7cada">qualified result</text><text x="1179" y="269" font-size="15" fill="#b7cada">boundary recorded</text><path d="M275 250 L320 250" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M550 250 L595 250" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M825 250 L870 250" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1100 250 L1145 250" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="160" y="430" width="300" height="125" rx="18" fill="#102d49" stroke="#ff7fa0" stroke-width="2"/><text x="184" y="470" font-size="21" font-weight="700" fill="#f4fbff">Stop conditions</text><text x="184" y="500" font-size="15" fill="#b7cada">failed calibration · drift · contamination</text><text x="184" y="524" font-size="15" fill="#b7cada">missing metadata · unsafe operation</text><rect x="550" y="430" width="300" height="125" rx="18" fill="#102d49" stroke="#3dd9ff" stroke-width="2"/><text x="574" y="470" font-size="21" font-weight="700" fill="#f4fbff">Data-quality outputs</text><text x="574" y="500" font-size="15" fill="#b7cada">uncertainty budget · exclusions</text><text x="574" y="524" font-size="15" fill="#b7cada">raw/processed linkage · audit trail</text><rect x="940" y="430" width="300" height="125" rx="18" fill="#102d49" stroke="#9b7cff" stroke-width="2"/><text x="964" y="470" font-size="21" font-weight="700" fill="#f4fbff">Acceptance gate</text><text x="964" y="500" font-size="15" fill="#b7cada">fit for declared purpose</text><text x="964" y="524" font-size="15" fill="#b7cada">qualified human approval where required</text><path d="M460 492 L540 492" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M850 492 L930 492" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="682" width="1260" height="44" rx="14" fill="#0b2035" stroke="url(#accent)"/>
<text x="100" y="711" font-size="16" fill="#d7e8f5">Raw data is immutable evidence · processing is reproducible · exclusions are declared before interpretation</text>
</g></svg>
