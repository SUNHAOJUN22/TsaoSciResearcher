<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Scientific Problem → Method Decision Tree</title><desc id="desc">A decision tree selects quantum, statistical, mesoscale, continuum, mechanics, or process methods from observables and governing physics.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071629"/><stop offset="1" stop-color="#123a59"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38d9ff"/><stop offset="1" stop-color="#9b7cff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66ddff"/></marker></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="70" y="72" font-size="36" font-weight="700" fill="#f4fbff">Scientific Problem → Method Decision Tree</text>
<text x="70" y="108" font-size="18" fill="#b7cada">Start from the decision observable; choose a physical frame before choosing software.</text>
<rect x="520" y="145" width="360" height="90" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="544" y="185" font-size="21" font-weight="700" fill="#f4fbff">Scientific question</text><text x="544" y="215" font-size="15" fill="#b7cada">observable · tolerance · decision</text><path d="M700 235 L700 285" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="50" y="300" width="220" height="160" rx="18" fill="#102d49" stroke="#9b7cff" stroke-width="2"/><text x="74" y="340" font-size="21" font-weight="700" fill="#f4fbff">Quantum frame</text><text x="74" y="370" font-size="15" fill="#b7cada">electrons · states · bonding</text><text x="74" y="394" font-size="15" fill="#b7cada">DFT · TDDFT · GW/BSE</text><path d="M700 285 L160 300" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="320" y="300" width="220" height="160" rx="18" fill="#102d49" stroke="#ffbe65" stroke-width="2"/><text x="344" y="340" font-size="21" font-weight="700" fill="#f4fbff">Statistical frame</text><text x="344" y="370" font-size="15" fill="#b7cada">ensembles · fluctuations</text><text x="344" y="394" font-size="15" fill="#b7cada">MD · MC · free energy</text><path d="M700 285 L430 300" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="590" y="300" width="220" height="160" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="614" y="340" font-size="21" font-weight="700" fill="#f4fbff">Mesoscale frame</text><text x="614" y="370" font-size="15" fill="#b7cada">fields · domains · topology</text><text x="614" y="394" font-size="15" fill="#b7cada">SCFT · phase field · CGMD</text><path d="M700 285 L700 300" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="860" y="300" width="220" height="160" rx="18" fill="#102d49" stroke="#3dd9ff" stroke-width="2"/><text x="884" y="340" font-size="21" font-weight="700" fill="#f4fbff">Continuum frame</text><text x="884" y="370" font-size="15" fill="#b7cada">balances · constitutive laws</text><text x="884" y="394" font-size="15" fill="#b7cada">reduced model · CFD</text><path d="M700 285 L970 300" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1130" y="300" width="220" height="160" rx="18" fill="#102d49" stroke="#ff7fa0" stroke-width="2"/><text x="1154" y="340" font-size="21" font-weight="700" fill="#f4fbff">Mechanics/process</text><text x="1154" y="370" font-size="15" fill="#b7cada">stress · populations · control</text><text x="1154" y="394" font-size="15" fill="#b7cada">FEM · PBE · flowsheet</text><path d="M700 285 L1240 300" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="300" y="520" width="330" height="105" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="324" y="560" font-size="21" font-weight="700" fill="#f4fbff">Minimum sufficient model</text><text x="324" y="590" font-size="15" fill="#b7cada">cheapest falsifiable representation</text><text x="324" y="614" font-size="15" fill="#b7cada">explicit assumptions and limits</text><rect x="770" y="520" width="330" height="105" rx="18" fill="#102d49" stroke="#ffbe65" stroke-width="2"/><text x="794" y="560" font-size="21" font-weight="700" fill="#f4fbff">Evidence-driven escalation</text><text x="794" y="590" font-size="15" fill="#b7cada">add physics only after failed validation</text><text x="794" y="614" font-size="15" fill="#b7cada">propagate uncertainty across bridges</text><path d="M630 572 L760 572" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="682" width="1260" height="44" rx="14" fill="#0b2035" stroke="url(#accent)"/>
<text x="100" y="711" font-size="16" fill="#d7e8f5">Advisory only · every branch requires convergence, falsification, UQ and an external execution receipt</text>
</g></svg>
