<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Scientific Writing Evidence Chain</title><desc id="desc">Sources are converted into bounded evidence records, claims, citations, manuscript sentences, and an independent audit trail.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071629"/><stop offset="1" stop-color="#123a59"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38d9ff"/><stop offset="1" stop-color="#9b7cff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66ddff"/></marker></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="70" y="72" font-size="36" font-weight="700" fill="#f4fbff">Scientific Writing Evidence Chain</text>
<text x="70" y="108" font-size="18" fill="#b7cada">Readable prose and auditable evidence are separate deliverables that must remain linked.</text>
<rect x="60" y="180" width="220" height="150" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="84" y="220" font-size="21" font-weight="700" fill="#f4fbff">Source</text><text x="84" y="250" font-size="15" fill="#b7cada">paper · dataset · figure</text><text x="84" y="274" font-size="15" fill="#b7cada">stable identifier</text><rect x="335" y="180" width="220" height="150" rx="18" fill="#102d49" stroke="#3dd9ff" stroke-width="2"/><text x="359" y="220" font-size="21" font-weight="700" fill="#f4fbff">Evidence ledger</text><text x="359" y="250" font-size="15" fill="#b7cada">exact passage / panel</text><text x="359" y="274" font-size="15" fill="#b7cada">conditions · values</text><rect x="610" y="180" width="220" height="150" rx="18" fill="#102d49" stroke="#9b7cff" stroke-width="2"/><text x="634" y="220" font-size="21" font-weight="700" fill="#f4fbff">Claim sentence</text><text x="634" y="250" font-size="15" fill="#b7cada">scope · modality</text><text x="634" y="274" font-size="15" fill="#b7cada">support edge</text><rect x="885" y="180" width="220" height="150" rx="18" fill="#102d49" stroke="#ffbe65" stroke-width="2"/><text x="909" y="220" font-size="21" font-weight="700" fill="#f4fbff">Citation placement</text><text x="909" y="250" font-size="15" fill="#b7cada">at the supported clause</text><text x="909" y="274" font-size="15" fill="#b7cada">no citation laundering</text><rect x="1160" y="180" width="180" height="150" rx="18" fill="#102d49" stroke="#55e6a5" stroke-width="2"/><text x="1184" y="220" font-size="21" font-weight="700" fill="#f4fbff">Manuscript</text><text x="1184" y="250" font-size="15" fill="#b7cada">readable prose</text><text x="1184" y="274" font-size="15" fill="#b7cada">audit link retained</text><path d="M280 255 L325 255" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M555 255 L600 255" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M830 255 L875 255" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1105 255 L1150 255" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="170" y="440" width="310" height="120" rx="18" fill="#102d49" stroke="#3dd9ff" stroke-width="2"/><text x="194" y="480" font-size="21" font-weight="700" fill="#f4fbff">Scientific writing layer</text><text x="194" y="510" font-size="15" fill="#b7cada">argument, structure and terminology</text><text x="194" y="534" font-size="15" fill="#b7cada">does not alter evidence strength</text><rect x="545" y="440" width="310" height="120" rx="18" fill="#102d49" stroke="#9b7cff" stroke-width="2"/><text x="569" y="480" font-size="21" font-weight="700" fill="#f4fbff">Audit layer</text><text x="569" y="510" font-size="15" fill="#b7cada">source → evidence → claim → sentence</text><text x="569" y="534" font-size="15" fill="#b7cada">conflict and uncertainty record</text><rect x="920" y="440" width="310" height="120" rx="18" fill="#102d49" stroke="#ffbe65" stroke-width="2"/><text x="944" y="480" font-size="21" font-weight="700" fill="#f4fbff">Release gate</text><text x="944" y="510" font-size="15" fill="#b7cada">all claims supported</text><text x="944" y="534" font-size="15" fill="#b7cada">references and numbering consistent</text><path d="M480 500 L535 500" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M855 500 L910 500" stroke="#66ddff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="682" width="1260" height="44" rx="14" fill="#0b2035" stroke="url(#accent)"/>
<text x="100" y="711" font-size="16" fill="#d7e8f5">No invented citation · no unsupported strengthening · no hidden conflict between manuscript and evidence ledger</text>
</g></svg>
