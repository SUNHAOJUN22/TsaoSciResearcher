<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
<title>Scientific Passport Contract Matrix</title>
<desc>Conceptual matrix connecting model, bridge, evidence, claim and decision-readiness contracts.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#132b4b"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker>
</defs>
<rect width="1200" height="700" rx="28" fill="url(#bg)"/>
<rect x="36" y="32" width="1128" height="636" rx="24" fill="none" stroke="#27496d" stroke-width="2"/>
<text x="70" y="92" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">Scientific Passport Contract Matrix</text>
<rect x="70" y="112" width="220" height="6" rx="3" fill="url(#accent)"/>

<g font-family="Arial, sans-serif" filter="url(#shadow)">
  <rect x="70" y="165" width="230" height="150" rx="18" fill="#102a43" stroke="#38bdf8"/>
  <text x="95" y="205" fill="#7dd3fc" font-size="23" font-weight="700">Model Contract</text>
  <text x="95" y="242" fill="#dbeafe" font-size="17">States · laws · assumptions</text>
  <text x="95" y="272" fill="#dbeafe" font-size="17">Domain · failure conditions</text>
  <rect x="345" y="165" width="230" height="150" rx="18" fill="#102a43" stroke="#60a5fa"/>
  <text x="370" y="205" fill="#93c5fd" font-size="23" font-weight="700">Bridge Contract</text>
  <text x="370" y="242" fill="#dbeafe" font-size="17">Scale interfaces</text>
  <text x="370" y="272" fill="#dbeafe" font-size="17">Measurable bridge variables</text>
  <rect x="620" y="165" width="230" height="150" rx="18" fill="#102a43" stroke="#a78bfa"/>
  <text x="645" y="205" fill="#c4b5fd" font-size="23" font-weight="700">Evidence Contract</text>
  <text x="645" y="242" fill="#ede9fe" font-size="17">Item-level inventory</text>
  <text x="645" y="272" fill="#ede9fe" font-size="17">Declared E0–E4 maturity</text>
  <rect x="895" y="165" width="230" height="150" rx="18" fill="#102a43" stroke="#f0abfc"/>
  <text x="920" y="205" fill="#f5d0fe" font-size="23" font-weight="700">Claim Contract</text>
  <text x="920" y="242" fill="#fae8ff" font-size="17">Description → causality</text>
  <text x="920" y="272" fill="#fae8ff" font-size="17">Admissible language</text>
</g>
<path d="M185 340 V430 H600" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M460 340 V400 H600" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M735 340 V400 H600" fill="none" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M1010 340 V430 H600" fill="none" stroke="#f0abfc" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="390" y="430" width="420" height="125" rx="22" fill="#0f3a54" stroke="url(#accent)" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="476" text-anchor="middle" fill="#f8fafc" font-size="28" font-family="Arial, sans-serif" font-weight="700">Decision Readiness</text>
<text x="600" y="514" text-anchor="middle" fill="#bae6fd" font-size="19" font-family="Arial, sans-serif">blocked · review-required · ready-for-human-review</text>

<text x="70" y="645" fill="#94a3b8" font-size="16" font-family="Arial, sans-serif">AI-generated conceptual illustration · not experimental or solver output</text>
</svg>
