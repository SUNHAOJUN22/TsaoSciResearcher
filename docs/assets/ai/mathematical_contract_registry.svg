<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Versioned Mathematical Contract Registry</title>
  <desc id="desc">Conceptual diagram of the TsaoSciResearcher math CLI and API exposing stable equations, symbols, decision use and implementation boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f4f7a"/><stop offset="1" stop-color="#4f7ca6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b2239" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#315e86"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="90" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#163a5b">Versioned Mathematical Contract Registry</text>
  <text x="80" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#536b82">README equations become machine-readable, testable scientific-control contracts</text>
  <g filter="url(#shadow)"><rect x="90" y="210" width="330" height="470" rx="28" fill="#ffffff" stroke="#c7d7e7" stroke-width="2"/><rect x="635" y="210" width="330" height="470" rx="28" fill="#ffffff" stroke="#c7d7e7" stroke-width="2"/><rect x="1180" y="210" width="330" height="470" rx="28" fill="#ffffff" stroke="#c7d7e7" stroke-width="2"/></g>
  <text x="255" y="270" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#214d73">Inputs</text>
  <text x="130" y="330" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#2f4f6c">• contract_id</text><text x="130" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#2f4f6c">• language</text><text x="130" y="430" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#2f4f6c">• CLI / Python API</text>
  <rect x="130" y="500" width="250" height="100" rx="16" fill="#edf5fc"/><text x="255" y="540" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="20" fill="#183f61">tsao-researcher</text><text x="255" y="575" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="24" font-weight="700" fill="#183f61">math</text>
  <text x="800" y="270" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#214d73">Contract Registry</text><rect x="680" y="315" width="240" height="72" rx="18" fill="url(#accent)"/><text x="800" y="360" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">schema_version = 1.0</text>
  <text x="680" y="435" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#2f4f6c">Equation + symbols</text><text x="680" y="480" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#2f4f6c">Decision use</text><text x="680" y="525" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#2f4f6c">Implementation relation</text><text x="680" y="570" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#2f4f6c">Bilingual localization</text><text x="680" y="615" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#2f4f6c">Defensive copy</text>
  <text x="1345" y="270" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#214d73">Fixed Boundaries</text><text x="1225" y="345" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" fill="#2f4f6c">advisory_only = true</text><text x="1225" y="400" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" fill="#2f4f6c">solver_executed = false</text><text x="1225" y="455" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" fill="#2f4f6c">automatic_approval = false</text>
  <line x1="1225" y1="505" x2="1465" y2="505" stroke="#c7d7e7" stroke-width="2"/><text x="1225" y="555" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#2f4f6c">No manufactured data</text><text x="1225" y="595" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#2f4f6c">No solver certification</text><text x="1225" y="635" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#2f4f6c">Human acceptance required</text>
  <line x1="430" y1="445" x2="620" y2="445" stroke="#315e86" stroke-width="5" marker-end="url(#arrow)"/><line x1="975" y1="445" x2="1165" y2="445" stroke="#315e86" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="80" y="858" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#61758a">AI-generated conceptual illustration for documentation only · 非实验或仿真结果</text>
