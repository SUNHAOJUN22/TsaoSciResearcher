><circle cx="985" cy="175" r="28" fill="#ffb86b"/><text x="985" y="183" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#07111f">04</text><rect x="885" y="205" width="200" height="185" rx="20" fill="#132b46" stroke="#ffb86b" stroke-opacity=".55" filter="url(#shadow)"/><rect x="885" y="205" width="200" height="8" rx="4" fill="#ffb86b"/><text x="909" y="247" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Static &amp; Security</text><text x="909" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">Ruff · Mypy · Bandit · audit</text><circle cx="1250" cy="175" r="28" fill="#aa7cff"/><text x="1250" y="183" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#07111f">05</text><rect x="1150" y="205" width="200" height="185" rx="20" fill="#132b46" stroke="#aa7cff" stroke-opacity=".55" filter="url(#shadow)"/><rect x="1150" y="205" width="200" height="8" rx="4" fill="#aa7cff"/><text x="1174" y="247" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Release Proof</text><text x="1174" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">mutation · performance · reproducibility</text><path d="M290,300 C322.5,300 322.5,300 355,300" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><path d="M555,300 C587.5,300 587.5,300 620,300" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><path d="M820,300 C852.5,300 852.5,300 885,300" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><path d="M1085,300 C1117.5,300 1117.5,300 1150,300" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/><rect x="250" y="530" width="360" height="150" rx="20" fill="#132b46" stroke="#ff6f91" stroke-opacity=".55" filter="url(#shadow)"/><rect x="250" y="530" width="360" height="8" rx="4" fill="#ff6f91"/><text x="274" y="572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Fail Closed</text><text x="274" y="604" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">non-zero exits · no silent downgrade</text><text x="274" y="628" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">no publication before every gate passes</text><rect x="790" y="530" width="360" height="150" rx="20" fill="#132b46" stroke="#55e6a5" stroke-opacity=".55" filter="url(#shadow)"/><rect x="790" y="530" width="360" height="8" rx="4" fill="#55e6a5"/><text x="814" y="572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">Machine-Readable Evidence</text><text x="814" y="604" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">JUnit · coverage · SBOM · checksums</text><text x="814" y="628" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9eb3c8">attestation · deterministic artifacts</text><path d="M610,605 C700.0,605 700.0,605 790,605" fill="none" stroke="#3dd9ff" stroke-width="3" marker-end="url(#arrow)" opacity=".9"/>
