<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">TsaoSciResearcher 当前主线验收架构</title><desc id="desc">从科学问题、证据分级与量纲合同到可证伪的跨尺度研究路线. 该仓库生成研究策略、合同、证据控制与外部执行回执；automatic_approval=false，不能替代专家、实验或第三方求解器资格。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09090b"/><stop offset=".5" stop-color="#3b1d0b"/><stop offset="1" stop-color="#2e1065"/></linearGradient><linearGradient id="card"><stop offset="0" stop-color="#4a2507"/><stop offset="1" stop-color="#28164d"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC","Noto Sans",Arial,sans-serif;fill:#fff7ed}.title{font-size:54px;font-weight:800}.subtitle{font-size:24px;fill:#fde68a}.stage{font-size:24px;font-weight:750}.detail{font-size:17px;fill:#ffedd5}.index{font-size:58px;font-weight:800;fill:#92400e}.formula{font-family:"STIX Two Math","Cambria Math","Noto Sans Math","Noto Sans CJK SC",sans-serif;font-size:18px;fill:#f3e8ff}.micro{font-size:14px;letter-spacing:2px;fill:#fcd34d}.boundary{font-size:18px;fill:#e9d5ff}.badge{font-size:16px;fill:#fdba74}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1390" cy="92" r="125" fill="#f59e0b" opacity=".14"/><circle cx="210" cy="790" r="170" fill="#a855f7" opacity=".12"/><text x="48" y="88" class="title">TsaoSciResearcher</text><text x="48" y="132" class="subtitle">从科学问题、证据分级与量纲合同到可证伪的跨尺度研究路线</text><text x="48" y="184" class="badge">AI辅助概念设计 · 非科学数据 · 不构成自动科学批准</text><path d="M 319 336 H 348" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrow)"/><path d="M 629 336 H 658" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrow)"/><path d="M 939 336 H 968" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1249 336 H 1278" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrow)"/><g><rect x="44" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/><text x="66" y="280" class="stage">问题结构化</text><text x="66" y="324" class="detail">可观测量、条件与决策</text><text x="66" y="394" class="index">01</text></g><g><rect x="354" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/><text x="376" y="280" class="stage">能力路由</text><text x="376" y="324" class="detail">模型合同与外部执行边界</text><text x="376" y="394" class="index">02</text></g><g><rect x="664" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/><text x="686" y="280" class="stage">证据控制</text><text x="686" y="324" class="detail">来源、冲突与适用域</text><text x="686" y="394" class="index">03</text></g><g><rect x="974" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/><text x="996" y="280" class="stage">尺度桥与 UQ</text><text x="996" y="324" class="detail">可辨识性、传播与校准</text><text x="996" y="394" class="index">04</text></g><g><rect x="1284" y="230" width="270" height="212" rx="28" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/><text x="1306" y="280" class="stage">回执与验收</text><text x="1306" y="324" class="detail">哈希、责任主体与证伪</text><text x="1306" y="394" class="index">05</text></g><g><rect x="44" y="522" width="465" height="128" rx="22" fill="#1b1320" stroke="#c084fc" stroke-width="2"/><text x="66" y="575" class="formula">G = min(g_quantity, g_applicability, g_evidence, g_identifiability, g_bridge)</text><text x="66" y="619" class="micro">决策合同 01</text></g><g><rect x="549" y="522" width="465" height="128" rx="22" fill="#1b1320" stroke="#c084fc" stroke-width="2"/><text x="571" y="575" class="formula">Σ_y = J Σ_x Jᵀ + Σ_model + Σ_scale</text><text x="571" y="619" class="micro">决策合同 02</text></g><g><rect x="1054" y="522" width="465" height="128" rx="22" fill="#1b1320" stroke="#c084fc" stroke-width="2"/><text x="1076" y="575" class="formula">H_receipt = SHA256(contract ∥ input ∥ engine ∥ environment ∥ result)</text><text x="1076" y="619" class="micro">决策合同 03</text></g><rect x="44" y="710" width="1512" height="104" rx="24" fill="#140e18" stroke="#57534e"/><text x="76" y="756" class="micro">资格边界</text><text x="76" y="790" class="boundary">该仓库生成研究策略、合同、证据控制与外部执行回执；automatic_approval=false，不能替代专家、实验或第三方求解器资格。</text><text x="48" y="866" class="micro">CURRENT MAIN · EVIDENCE FIRST · DIMENSIONAL CONTRACTS · AUTOMATIC APPROVAL FALSE</text></svg>
